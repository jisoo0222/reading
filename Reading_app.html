테이블 앞으로 갔다.","술병과 돈을 싼책보가 한꺼번에 눈 속으로 파고든다.","그는 술잔으로 손을 가져갔다."]],[["또 따랐다.","잔을 입으로 옮긴다."],["아무리 먹어도 오늘만은 취할 것 같지가 않다.","취할 때까지 마시고 싶었다.","그리고 실컷 울고 싶었다."],["며칠이 지나도록 바오로한테서는 아무런 소식도 없었다."],["불안한 며칠이었다.","돈은 준비가 되었다는 기별을 했지만 그나마 틀어지는지 누이한테서도 기별이 없다."]],[["일이 잘 안 되는 것이라면 비싼 이자를 물고 있을 수도 없느니라 싶어 오늘 저녁에는 집에를 들러 보리라던 날 고해소에홀연히 나타난 바오로가 실로 놀라운 고해를 했던 것이었다."],["뜻밖에도 그것은 무서운 대죄였다."],["살인이었었다."],["고죄경을 외는 바오로의 음성은 그대로 신음 소리였다."]],[["“내 탓이오, 내 탓이오, 내 큰 탓이로소이다. 그러므로 평생 동정이신 성 마리아와 성 미가엘 대천신과 성 요안 세자와 종도 성 베드루, 성 바오로와 모든 성인 성녀와 신부님께 나를 위하여 오 주 천주께 전구하심을 비옵나이다…”"],["바오로는 고해를 끝마치었다.","그러고는 그대로 울어버리던 것이다."],["‘바오로가…’"]],[["신부는 의외였다.","괄하기도 했고 명동을 휩쓴다고도 들었지만 심지는 고우니라 한 바오로였다."],["“동기는?”"],["“돈이 필요했습니다.”"],["“그래, 얼마나 소득이 있었는가?”"],["“천만환 받기루 했었는데 백만환밖에 못 받았습니다.”"]],[["“무엇? 받다니?”"],["“실은 강도를 한 것은 아닙니다. 어떤 사람의 심부름을 했을 뿐입니다. 그 사람은 기어이 그를 죽일 필요가 있었던 모양입니다. 그러나 자기로서는방법이 없으니까 그 청부를 제게로 가져온 것입니다.","처음 이야기로는 그 사람만 해치우면 돈은 요구하는 대로 주겠노라 했습니다. 그래, 막연하게얼마든지랄 것이 아니라 아주 보수를 정하자고 해서 천만환에 정하구 우선착수금으로서 오십만환만 받구 성사한 날 잔금을 받기로 했습니다."]],[["그러나 불행히 — 아니올시다, 신부님, 다행히도 실패했습니다. 그래, 약속한 자리에 가보니 그자는 오지 않았어요. 그자가 있던 집을 찾아갔더니만 떠나구없다는 것입니다. 그래, 집으로 돌아왔더니 그자가 집에다 오십만환 두고갔더군요.","실패를 했으니까 다 지불할 수 없다는 간단한 쪽지가 돈뭉치 안에 들어 있었습니다.”"],["“그러면 피해자의 이름은?”"]],[["“신부님, 신부님이 저보다 더 잘 알구 계실 겁니다. 신부님의 아우님께서혐의를 받구 계신 바루 그 사건입니다.”"],["이때 고해신부의 입에서 고통을 참을 때 하는 신음 비슷한 소리가 났다.","아니, 그것은 그대로 성직은 그만두고 인간에게서 교양과 지체, 모든 것을떼어버린 때에나 낼 수 있는 그런 동물의 소리였다."],["그러나 고해신부는 곧 자기 위치로 돌아갔다."]],[["“그래서?”"],["“범인으로 잡힌 사람이 신부님의 아우님이시라는 것을 안 것은 신문을 보구서였습니다. 그렇지만 않았더라면 전 이렇게까지 괴로워하지는 않았을 것 같습니다.”"],["“그것은 고해자의 잘못 생각이오. 고명한다는 것은 죄의 사함을 받는 데 있소. 누구를 위해서 자신의 죄의 사함을 받는 것이 아니라 자기가 지은 죄에 대한 사함을 받는 것이오. 어쨌든 고해할 생각을 한 것은 잘한 일이오."]],[["그러나 고해를 했다 해서 다 죄의 사함이 받아지는 것은 아니오. 교우의 할 일은 이제부터요. 지금까지의 고해 사실은 실상은 통회에 지나지 않소. 정말 고해는 먼저 신부에게 할 것이오.","동시에 법에 나아가 자수하는 데서 비로소 고해가 성립되오. 이 순서가 바뀌었던 것이오. 그러나 지금도 늦지는않소. 그러니 이 길로 바루 집으로 갈 것 없이 경찰서에 가서 자수를 하시오.","그것만이 천주의 계시를 좇는 길이오. 자, 조금도 지체치 말고 주저도말고 기꺼운 마음으로 자수를 하시오. 이것만이 죄를 기워 갚는 길이오. 영혼의 구원을 받는 길이오. 자, 이 길로 가시오."]],[["가서 자수를 하시오. 자수를 한 순간 내게 고명한 죄는 깨끗이 사함을 받게 될 것이오. 자, 가시오, 조금도 지체없이…”"],["“가겠습니다, 신부님…”"],["“고마운 생각이오. 훌륭한, 족히 영혼의 영원한 구원을 받을 훌륭한 생각이오. 꼭 가야 하오. 혼자 가기가 무엇하다면 내가 같이 가드려도 좋소.” “아니올시다. 당당히 제 발로 저 혼자 걸어가서 자수하겠습니다.”"]],[["신부는 준절히 훈화를 하고 보속을 주고는 주께 감사한 마음으로 손을 들어 사죄경을 염할 때 바오로도 진심으로 가슴을 치며, “내 탓이오, 내 탓이오 —” 를 염하고 있었다."],["고해가 끝나자 바오로는,"],["“신부님, 하나 부탁이 있습니다.”"],["“무엇이든지.”"]],[["“제가 만일 — 아니올시다. 제가 자수한 뒤 제 가족을 좀 돌보아주셨으면합니다. 마귀가 씌웠습니다. 지금까지 성당에 뭣하러 다녔는지 모르겠습니다. 신부님, 믿습니다.”"],["“그건 염려 마오. 성당에서 돌보리다. 그러니 안심하고 가시오. 이 길로 바루 가시오, 그러지 않으면 또 결심이 풀어지는 법이니까.”"],["“한 시간만 여유를 주십시오, 신부님. 집에 가서 어린것들 자는 얼굴이라도 한 번 더 보구 가겠습니다.”"]],[["“아니오…”"],["고해신부의 말은 엄숙했다."],["“이 길로 가시오, 이 길로. 집에 들르면 또 구원받을 길을 놓치오. 자수한 후면 내가 아이들과 부인까지 모시고 자주 찾아주리다.”"],["“알았습니다, 신부님… 그대루 가겠습니다. 저두 어린것들 자는 얼굴을 본다면 결심이 풀릴 것 같습니다. 저두 자신이 없습니다. 자식이란 똠방 다섯 살 먹은 머슴애 그것 하나뿐이니까요."]],[["죄인의 자식이지만 영리하게 생긴놈입니다. 귀엽기 짝이 없지요.”"],["바오로는 눈물을 씻고 있었다.","보기 추할 만큼 얼굴이 일그러진다."],["“정말 귀엽게 생긴 자식입니다, 신부님…”"],["“그러니까 바루 가시오.”"],["“감사합니다, 신부님. 인제 저도 마음이 아주 가벼워졌습니다.”"]],[["신부는 바오로를 문께까지 바래다주며 그의 어깨에 손을 얹었다."],["“바오로, 고맙소.”"],["“감사합니다, 신부님…”"],["굳은 악수를 하고 둘은 헤어졌다."],["역시 바오로는 귀여운 놈이니라 했다.","‘귀여운 놈야 귀여운…’ 아우를구했다는 기쁨보다도 몇 배나 큰 기쁨이었다."]],[["성직생활 십 년에 이렇게 기쁜 일은 처음이었다.","신부는 돈뭉치를 보아도 마음이 괴롭지 않았다."],["‘내일 아침 일찍 이 돈을 바오로의 아내에게 전하리라…’"],["신부 자신 무거운 죄의 사함을 받은 것 같았다.","즐거웠다."],["6"]],[["이튿날 새벽 미사에 신부는 오직 바오로만을 위해서 기구를 올렸다.","진실로 기뻤다.","이 우주에서 가장 큰 죄악의 뿌리를 송두리째 뽑아낸 것 같은 기쁨이었다."],["인간 사회에서 온갖 악을 물리치고 가장 위대한 선을 창조한 것 같은 환희였었다.","신부는 자신이 갑자기 커진 것 같은 감을 느끼는 것이었다.","천주의안배에 포근히 싸여 있는 것 같다.","성총의 도움도 자기 혼자만이 독차지한성도 싶어진다.","아우가 살아온다는 사실이 이 한 가지 선 앞에서는 이렇게도 미력한 것인가."]],[["스스로 놀라지기도 했다."],["‘동기가 순전한 돈이었고 다행히도 피해자가 생명을 건졌고 더 다행한 일은 불구자도 되지 않았고 거기다 자수를 했고 보니 죄도 좀 가벼워지겠지.’"],["바오로의 고해신부는 이런 타산도 해보는 것이었다."],["무엇보다도 유리한 것운 바오로가 자수를 한 일이었다."]],[["그것도 그냥 자수가 아니라 범인이 잡힌 것이었다.","고통에 못이겨서 자백을 했다 해도 범죄는 성립이 되는 것이다.","엄연히 자백을 했고 당국도 이미 끝난 사건으로 처리해버린 때에 진범인이 자수를 한 것이다."],["이 얼마나 장한 노릇이냐 했다."],["‘변호사도 내가 대리라…’"],["고해신부는 이런 결심도 했다."]],[["새벽 미사를 올린 뒤로 고해신부는 집으로 가져가리라던 돈을 보자기에 쌌다.","그 길로 바오로의 집을 찾았다.","바오로의 집에는 두 번이나 가본 적이 있던 집이다.","남산동 호화로운 집들이 즐비한 비탈에 자그마한 판잣집이 있었다.","판잣집이었지만 일각 대문일망정 그래도 대문이 달려 있다."],["“이성태 (바오로).”"],["바오로는 교명까지를 문패에 쓰던 그런 신자이기도 했던 것이다."]],[["‘역시 좋은 놈야. 어쩌다 길을 잘못 들어서 그랬지…’"],["신부는 문패를 한참이나 바라다보고 있었다.","자부와 같은 애정이 샘솟듯하는 것을 신부는 깨달았다."],["“바오로…”"],["신부는 나직히 불렀다."],["신부는 그제서야 ‘바오로가 정말 자수를 했을까’ 하는 생각을 해보는 것이었다."]],[["정말 자수를 했는지 확인을 해보지 않고 쭐레쭐레 온 자기의 행실이 갑자기 쑥스러워졌지만 곧 그런 자신을 꾸짖었다."],["‘왜 나는 성직자로서 남을 의심하나? 더욱이 교우를.’"],["“바오로…”"],["“누구세요?”"],["그제서야 소리가 났다."]],[["아직도 잠이 덜 깬 음성이다.","여성이었다."],["“밖에 누가 왔어요?”"],["문이 빼꼼히 열린다."],["“나 박 신부입니다.”"],["“아, 신부님…”"],["질색을 하는 소리다."]],[["역시 자리 속에 있었던 모양이다.","한참 만에야 바오로의 아내가 나왔다.","곱살맞게 생긴 예쁘장한 얼굴이었다.","빗장을 빼주고는,"],["“바오론 간밤 신부님한테 다녀오마구 하구 나가선 그 길루 통 안 들어왔답니다. 신부님한테 안 갔던가요?”"],["“왔었어.”"],["“그럼 어딜 갔을까. 어디 가 또 취해 쓰러진 게로군요. 몇 시나 돼서 신부님한테서 나왔던가요? 웬만만 하면 어린것이 성찮은 걸 보구 갔으니까 들어올 겐데요.”"]],[["“몹시 귀여워한다지?”"],["“밉살맞아요, 너무 애 갖구 그러니까요. 저 같은 건 열 죽어두 괜찮구 저놈만 살면 된다는 거야요. 호호호. 참, 나 좀 보게나. 좀 들어가세요, 신부님. 누추하지만.”"],["“아냐, 가야지.”"],["“그래도 잠깐만 들어가셔서 담배라두 한 대 피우고 가셔야지… 그런데 무슨 일로 이렇게 일찌감치 오셨습니까?”"]],[["“과자 사갖구 왔지.”"],["“아이 참, 신부님두. 좀 들어가세요.”"],["“아냐, 나 곧 가겠어. 이것 맡아 잘 뒀다가 긴하게 쓰도록 하라구.”"],["“뭔데요, 신부님?”"],["“바오로가 전에 내게 맡겼던 돈이야. 바오로를 주면 또 술먹어치울 테니까 안나한테루 직접 가져왔어. 바오로가 어쩌면 좀 먼델 갈지 모르니까 잘챙겨둬요.”"]],[["“옳지. 그래, 요새 툭하면 일본으루나 가볼까, 이북으루 가볼까 그랬군요.”"],["“이북은 아냐. 내 또 올 게니 뭐 어려운 일이 있건 내게 찾아오라구,응?”"],["‘역시 훌륭한 놈이야…’"],["신부는 비탈길을 내려오면서 사뭇 콧노래라도 부르고 싶은 기분이었다."]],[["‘훌륭하구말구, 훌륭해!’"],["신부는 다시 성당으로 돌아갔다.","바오로를 위해서 또 한번 기구를 드리지않고는 견딜 수 없는 심정이던 것이다."],["자기 방으로 돌아온 것은 열시나 되어서였다."],["이쯤 되면 호외가 돔직도 한 시간이다."]],[["그러나 열시 반이 지나도록 그런 기색도 안 보인다.","시적시적 거리에 나가 보았으나 통 그런 눈치도 안 보인다."],["‘그렇지. 자수했다고 어떤 것이 진범인지 판단도 내리지 않고 발표부터야할라구. 오늘 석간쯤엔 나겠지…’"],["이렇게 생각하고 종일 성경만 읽었다."],["그러나 석간 신문에도 자수 이야기는 한마디도 없고 박찬재의 재판이 불원간에 있으리라는 내용의 기사가 이단으로 났을 뿐이었다."]],[["그렇게 떠들어대던 사건도 벌써 잊기 시작하는 모양이다.","궁금해서 신문사 친구한테도 알아 보았으나 별다른 사실은 없다는 것이다."],["“그럼 사건에 관한 무슨 소식이라도 듣거든 연락을 좀 해주게나.”"],["이렇게 부탁을 하고 언제 분관에서 전화 연락이 오는가 거기에만 신경을 쓰고 있으나 그날도 그대로 지나가버린다."]],[["‘오늘 밤에나 가려나?’"],["이런 생각도 했으나 이튿날 오전까지도 아무런 소식이 없다.","대체 어찌된셈인가."],["오후에는 어떻게 된 속인가 싶어 바오로의 집을 또 찾았다.","안나는 도리어반색을 하며 바오로를 못 봤느냐는 것이다."],["‘짜고 하는 노릇인가?’"]],[["그런 의심도 들지 않는 바 아니나 그는 금세 그런 자신을 꾸짖었다.","남을의심하는 것도 죄인 것이다."],["“바오롤 안 주시구 돈을 절 갖다주셔서 신부님이 친정아버지처럼 생각돼요. 정말 잘 불려서 살림 밑천을 해야겠어요. 바오로보구두 얼마동안 말씀말아주세요.”"],["“그러지.”"]],[["신부는 이렇게 대답하고, 바오로가 오거든 급히 상의할 일이 있으니 어쨌든 곧 내려오도록 일러놓고 자기 방으로 돌아왔다.","방에 돌아오니 누이가다녀갔었다.","차라리 죽어버렸으면 좋겠다고 편지를 써놓고 갔다.","아무데라도 좋으니 취직을 시켜주면 싶었다는 말을 썼다가는 박박 지워버렸다.","무능한 그보다도 찬 신부 오빠에 대한 반감이 썼다가 흐린 붓끝에서도 느껴지는것이었다.","사실 부모한테는 찬 아들이었고 형제간에는 무심한 형이요 오라비였다.","그러나 어찌할 수 없는 일이었다."]],[["그는 천주의 아들일 뿐이었던 것이다.","이것이 교규였다."],["‘신과 인간은 이렇게 격리되어야만 하는가?’"],["신부는 처음으로 이런 생각도 해본다."],["그러나 그는 이내 그런 생각을 떨쳐버렸다.","신과 인간과를 한 입으로 말하는 것도 그의 관습상 허락되지가 않던 것이다."]],[["이튿날도 이튿날도 바오로는 나타나지 않았다.","신문사에서는 아무런 소식도 없다.","안나라도 한번 옴직한데 안나한테서조차 이렇다는 말 한마디가 없는 것이다.","바오로도 안나도 성당에까지 얼굴을 보여주지 않던 것이다.","신부는 초조했다.","그는 몽유병자처럼 휘적 자기 방을 나왔다.","성당에 들러 주 앞에 엎드리어 바오로를 위하여 오랜 기구를 올리는 것이었다.","주 앞에 나가니 모든 감정이 순간에 정화가 된다.","배신자에 대한 감정도 없었다.","오직마귀한테 붙들려서 한 발짝도 헤어나지 못하는 불행한 바오로가 천주의 안 배로 성총의 도움을 받고 참고해를 하여 죄 사함을 받게 되기를 기구할 따름이었다."]],[["아우를 구해야 하겠다는 생각이 이 기구를 올리는 동안 자기 마음 그 어느 구석에서도 단 한 가닥이 없음을 깨닫는 기쁨이란 컸었다."],["‘바오로, 돌아오라, 천주의 품안으로…’"],["또 하루가 갔다.","신부는 더 참고 견디기가 어려웠다.","방을 나왔다.","벌써 어둡기 시작하고 있었다.","그의 발길은 자기도 모르게 남산 쪽으로 옮겨지는것이다.","바오로는 역시 집에도 돌아와 있지 않았다."]],[["그 대신 편지 한 장이왔다는 것이다.","신부는 그 편지를 받아 읽었다."],["‘꼭 찾아야 할 사람이 있어 시골 좀 간다. 그자만 찾는다면 곧 들어가마—’"],["이런 내용의 간단한 편지였다.","우편국 소인은 상인천이었다."],["‘교사자를 찾아 함께 자수하자는 계획일까?’"]],[["그러나 그것은 무모한 짓이라 했다.","죄인은 자기의 죄만을 처리하면 그만 인 것이다.","그보다도 그에게 그런 죄를 교사한 인간은 반드시 신자가 아닐 것이요, 그 어떤 중요한 — 어쩌면 정치적인 목적이 있을 것이고 보니 그렇게 만만히 자수를 할 것도 아니리라 했다."],["“어딜 갔을까요, 신부님?”"],["“글쎄.”"]],[["“찾아야 한다는 사람이 누군지도 모르시나요?”"],["“글쎄… 잘 모르겠는데…”"],["“뭔 얘긴진 모르겠어두 얼마 전부터, ‘나두 이제 맘을 바로잡아가지구어디 점방이나 하나 차리구 앉아야겠다. 그리구 난 밖으로 돌면서 물건 사들이구 당신은 집에서 팔구 그래서 우리 저놈이 대통령이 되게 잘 공부시켜야 한다구 —’ 그런 소릴 하더군요.","‘지금까지 사귄 놈들 그런 인간쓰레기하군 낼부턴 어디서 봤느냐다…’ 얼마나 고마웠던지 너무 좋아서 울구말았었답니다.”"]],[["“좋은 놈야.”"],["신부는 혼잣말을 하고 있었다."],["“바오론 구원받을 사람이지. 오겠지, 안심해. 오건 내게 곧 기별을 해주오. 나두 또 오지.”"],["“아니 신부님, 오지 마세요. 제가 연락해 올리겠습니다.”"],["“안난 지난 주일 성당에두 통 안 나왔지? 성당엔 나와야지.”"]],[["“저것이 앓아서 그랬습니다.”"],["“웬만하건 나와요.”"],["내리막길이라 그런지 올라올 때보다도 다리가 허청댄다.","신부는 곧장 자기 방으로 돌아왔다.","역시 아무한테서도 연락 와 있는 것이 없다."],["앞으로 사흘 후면 한씨 살해 미수범의 첫 공판이 있으리라는 신문 보도가나던 날 저녁이었다."]],[["“아직까지도 범인의 배후 관계가 전혀 밝혀지고 있지 못하나 여러 가지를종합해볼 때 범인의 범행은 단독적 범행이 아니라 공범이 있다는 점과 이 범행 동기도 단순한 발작적 또는 감정상 대립이기보다는 그 어떤 정치적인복선이 있다고 보여지고 있으니만큼 이번 공판을 계기로 범인도 그 어떤 중대한 발언을 하지 않을까 하여 많은 관심을 집중시키고 있다.","재판부 고위층에서도 이 점에 대하여 구태여 부정을 하지 않고 있다. 아직 피스톨의 출처조차 밝혀지지 않고 있는 이 사건을 이렇게 공판을 서두르는 데도 그런의도가 있지 않을까 하는 관측도 있다.…”"]],[["이 기사를 읽은 형은 처음으로 암담해졌다."],["바오로는 자수를 단념한 것이 분명했다.","그렇지 않고서는 이렇게 행방을 감출 리가 만무다."],["‘이북으로 밀항을 했나?’"],["이런 의심도 간다.","바오로가 북한 괴뢰의 간첩과도 접선이 되어 있는지도모른다는 생각까지 드는 것이다.","편지의 소인이 부산이나 군산 등지의 남쪽항구였다면 혹 일본으로 밀항을 했다는 생각도 해볼 수 있었던 것이다."]],[["그것이 인천이었다.","그러지 않아도 서해안을 타고 간첩들은 자기 집 드나들듯하고 있다는 신문 보도가 몇 번이나 국민들을 불안에 몰아넣은 직후이기도 하다."],["‘설마… 설마 바오로가…’"],["그러나 이것은 오직 그만의 희망적인 생각이었다.","바오로는 신부를 조롱이나 하듯 꼬리를 감추고 만 것이었다.","그는 신부 주변 어느 곳에서 지금 신부를 비웃고 있을지도 모르던 것이다."]],[["또 하루가 헛되이 지나갔다."],["이튿날 피정신공을 지도하고 이어 강론에 들어갔다.","그날의 강론 제목은고해성사에 관한 이야기였다.","그는 이틀 전 어떤 무명의 여성 교우로부터이 고명에 관한 질의를 받고 있던 것이다.","자기는 일 신도로서 신부님을 가장 존경하고 또 숭배하고 있다는 수인사를 정중히 하고는, 자기는 남편이 알지 못하는 한 비밀을 가지고 있다.","물론 일시적인 과오로서 저질러진 죄요, 지금은 깨끗이 청산을 하기도 했지만 양심상 괴로워서 견딜 수가 없다."]],[["첫째 남편과 천주님께 면목이 없으나 고해할 용기는 얻지 못하고 지금까지끌어오고 있다.","이 사실을 남편에게 고백해야 하느냐 신부님께만 고해해도좋으냐를 결정짓지 못하고 있다."],["불행히도 나의 그 상대되는 의사는 남편과도 친한 터요, 신부님은 또 저의남편과도 같은 교니만큼 잘 아는 터다.","고명받은 사실은 절대로 누설하지않는다고 하지만 그것이 불안해서 매일 벼르면서도 고해소에 나갈 용기를 못 내고 있다."]],[["그러니 강론을 통해서 한 번 자세히 설명해주면 좋겠다 —"],["상당히 달필인 이 문의에 대해서이야기하지 않으면 안 되었던 것이다.","필시 관면혼배나 겨우 받은 교우인 성싶다.","마침 좋은 강론 제목이기도 했다.","그 부인을 위해서보다도 그는 자기 자신에게 고명의 존엄성을 다시 한번 일깨워줄 필요가 있었던 것이다."],["“오늘은 교우 여러분과 함께 신성 불가침의 고해 비밀에 관해서 말씀드리고자 합니다.”"]],[["신부는 이렇게 강론에 들어갔다."],["“한 말로 말해서 고해신부는 고해를 받은 사실을 이야기할 입을 갖지 못한 사람입니다. 이렇게 말씀한다면 그런 인간이 어디 있으며 다른 말은 다 하면서 고해받은 사실만 이야기 못하는 입이 세상에 어디 있느냐 ─ 이렇게반문하실 분도 있을 줄 압니다만 그것은 신부라는 성직의 근본을 모르는 데서나 일어날 수 있는 의문입니다.","신부란 직책을 가진 사람은 천주님이 정 하시고 예수님이 가르치신 바 이외의 그 어떤 언행도 하지 않도록 습성을길러온 사람입니다. 우리 성직자가 인간이 타고난 모든 욕심을 억제하고 일 생 이것을 실천할 수 있는 것은 그 사람 자체의 노력보다도 이 천주님의 뜻 속에서 살고 있기 때문입니다."]],[["쉽게 말해서 어려서부터 왼손만 쓰기 시작한 사람이 삼십 년간 그대로 실천했다면 나중에는 왼손밖에 쓰지 못합니다. 그래서 왼손잡이도 있는 것입니다. 마찬가지입니다. 우리는 어려서부터 천주의 안배하심에 의하여 성총의 도움을 받자와 그 거룩하신 뜻 속에서만 살아 온 것입니다.","다시 말씀하면 고해신부는 고명을 듣는 순간에 한 가지 법이 아니라 세 가지의 엄숙한 법에 지배되는 습성을 길러오고 있는 것입니다. 그 하나는 예수께서는 성사를 세우실 때 이 고명의 신비성과 불가침과 존엄성을 말씀하시어 이의 위반이 곧 대죄임을 밝히셨고, 둘째로는 자연법이 이 고명의 신성과 존엄을 보호하고, 셋째로는 여러분이 다 아시는 우리교의 불가침의 법규입니다."]],[["이것을 좀더 단적으로 말씀드리면 올해가 일천구백오십육년입니다. 천주께서 정하신 바 있는 이 고해성사법이 실시된 이래 일천구백 년이 지난 오늘까지에는 실로 수많은 고해신부가 또 수많은 교우들로부터 고해를 받아왔던 것입니다.","그러나 오늘날까지 동서고금을 통하여 단 한 사람도 고명받은 사실을 누설한 고해신부가 없었다는 이 한 가지만 가지고도 우리는 고해의 존엄성을 이해할 수 있으리라 믿습니다.”"]],[["신부는 이야기하는 동안에 자기 자신의 마음도 차분히 가라앉는 것을 깨달았다.","좋은 음악을 듣는 그런 마음의 평화요, 그런 즐거움이었다."],["“이런 사실을 좀더 우리가 인상깊게 하기 위해서 나는 가장 열성적이던수도자이다가 열교자가 된 저 유명한 마르틴 루터 이야기를 —”"],["하다가 신부는 깜짝 놀랐다.","성당 맨 뒤 구석에서 뜻밖에도 바오로의 얼굴을 발견했던 것이다."]],[["그러나 그는 곧 말을 이었다."],["“그렇게 열성 수도자이던 루터는 한번 교회에 반기를 들기가 무섭게 교회에 대하여 무서운 악담과 모함을 하고 다니었던 것입니다. 심지어는 고해성사까지도 마귀가 생각해낸 것이라고 욕설을 퍼부었습니다.","그 루터가 어느술좌석에서입니다. 루터가 술에 곤죽이 돼서 교회 욕과 천주 욕, 고해 욕 —이렇게 함부로 퍼붓는 것을 보고 술친구들은 재미가 나서 ‘여보게, 루터. 자네가 전에 들은 고명 중에서 재미있던 것 하나 들려주게나."]],[["대개 어떤 것을 고명하러 오던가?’ 이렇게 물었던 것입니다. 그러나 그렇게 교회에 대한 반감이 컸고 그렇게까지 취한 루터도 그 말에는 사자처럼 노하여 친구를 술병으로 후려갈겼던 것입니다.","이런 사실을 들자면 한이 없습니다. 보헤미아의 왕후 베제슬라오 왕후의 고해신부였던 성 요안 네뽈지에노도 그랬습니다. 왕이 왕후를 질투해서 성 요안에게 왕후가 고해한 사실을 고백하라 강요했습니다.","고해신부는 물론 이것을 완강히 거절했습니다. 왕이 대노하여고해신부를 가죽부대에 넣고 돌을 달아매어 모르다바 바다 속에다 던졌지만, 요행히도 돌이 떨어져서 시체가 떠올라 장례를 지냈던 것입니다."]],[["그로부터 사백 년이나 지난 천칠백이십구년에 성 요안은 성인품에 오르게 되어 다시 이장을 했습니다만 고해 사실을 끝내 말하지 않았던 성인의 혀만은 썩지 않고 산 사람의 혀처럼 그대로 있었던 것입니다.","이 몇 가지 사실만 보아도 고해성사가 얼마나 존엄한 것인가를 알 수 있고, 이천 년이 되도록 단한 사람의 누설자가 없는 원리도 알아지리라고 생각합니다…”"],["신부는 여기에서 강론을 끝맺고 단에서 내려왔다."]],[["강론중에도 물론 그의 시선은 대부분 바오로에게 가서 있었다.","바오로는 고개를 푹 숙이고 듣고 있던 것이다."],["한두 번 둘이 시선이 마주친 적이 있었다.","그때마다 바오로가 먼저 시선을피했었다."],["‘날 찾으려나?’"],["신부는 단을 내려오면서도 바오로만 주시하고 있다."]],[["그러나 바오로는 그대로 밖으로 나가는 것이 아닌가."],["어쨌든 바오로를 만나야 했다.","그렇다고 신도들 앞에서 쫓아갈 수도 없었지만 뚫고 나갈 수도 없다.","하는 수 없이 한 교우를 붙들고,"],["“이 바오로 날 좀 만나고 가라고 일러주시오.”"],["이렇게 부탁을 하고는 문 쪽만 바라본다."]],[["부르러 갔던 사람조차 나타나지를 않는다."],["신부는 강단 앞에 그대로 서 있었다.","교우들이 거의 다 흩어졌을 무렵 해서야 부르러 갔던 청년만이 되돌아왔다.","쫓아가니까 마침 지나가는 택시를타고 가더라는 것이다."],["“내가 보잔 말은 전해졌나?”"],["“네, 들었을 겝니다.”"]],[["“됐어, 그럼. 저녁에라두 내게 오겠지.”"],["이렇게 태연히 말을 했지만 실상 그렇게 마음이 평탄한 것은 아니었다.","바오로는 다시 돌아오지 않느니라 했다.","돌아올 사람이라면 택시까지 타고 달아날 리가 만무다."],["“배신자…”"],["신부의 입에서 비로소 이런 소리가 나갔다."]],[["7"],["「 나는 고백한다 」 가 첫 개봉을 한다는 날은 공교롭게도 아우의 첫 공판이 있는 날이었다.","특수한 경우 이외에는 일반 극장에 발을 들여놓지 않는 것이 성직자한테는 일종의 계명처럼 되어 있었다.","그런 것이 습관이 되어 영화 광고 같은 것은 챙겨본 일도 없던 박 신부의 눈에 어느 날 신문을 펴들자마자 신부의 사진이 눈 속으로 쑥 들어왔었다."]],[["“미친 사람들. 어디 인물이 없어서 하필이면 고요히 수도하는 성직자를끌어내더람. 악취미야. 악취미도 이만저만한 악취미가 아니지…”"],["일종의 불쾌감까지 났었다."],["그날은 그러고 잊었었다."],["그뒤 며칠이 지나서다.","내일의 강론 준비를 하고 있으려니까 가톨릭 문학회 회원의 한 사람인 젊은 시인이 지나가는 길에 들렀다 하며 찾아왔었다."]],[["여러 가지 이야기가 화제에 올랐다.","문학, 국회, 신문, 여러 가지 이야기가나오다가,"],["“참 신부님, 「 나는 고백한다 」 란 영화를 곧 할 텐데 한번 보십시오.” 하고 권하던 것이다."],["“유 군이나 보시오. 나는 별루 흥미가 없어…”"],["“전 봤습니다. 벌써 그저께 시사횔 했어요. 그래 가봤는데 참 좋아요. 참고가 되실겝니다. 신부님께두.”"]],[["“유 군… 날 아직도 그런 정도로밖에 평갈 않는가? 영화를 보고 배워야할 —”"],["“아니, 그런 의미는 아닙니다만, 신부를 참 잘 그렸어요.”"],["“그래, 그렇게두 좋다면 한번 보아두지.”"],["그러고 말았었다.","아우의 사건이 터지기 며칠 전 일이었다.","그런 일에 등한한 그는 그 영화는 이미 끝난 것으로만 알고 있었더니 그때 본 광고는 예고였던 모양이었다."]],[["그러자 이 사건이 터졌었고 그런 후로는 신문도 사회면먼저 폈다가 덮고 하는 생활이 계속되었다.","그가 「 나는 고백한다 」 라는 영화에 관심을 갖기 시작한 것도 바오로의 고명을 받고서였다.","날마다 광고를보아야 언제 한다는 이야기는 없었다.","그러다가 날짜가 발표되고 보니 공교롭게도 아우의 첫 공판이 있으리라는 바로 그날이었다."],["영화의 내용 이야기가 약간 신문에도 소개된 것이 호기심을 끌어주던 것이다."]],[["마치 자기가 당하고 있는 사건이 영화화된 것처럼 일종의 흥분까지 느껴진다."],["아침도 궐하고 시간 전에 재판소에 뛰어가보니 어디서도 모른다는 것이다.","한 시간 턱이나 기다리다가서야 공판이 무기 연기되었다는 사실을 알고 아침 겸 점심 겸, 어쩌면 저녁 겸도 될지도 모르는 식사를 하고 영화관으로갔던 것이다.","눈에 뜨이는 복장이어서 불만했지만 신부 영화라는 점에서 사람들도 관대하게 보아주는 것 같았다."]],[["불란서 신부도 한 사람 와 있어준 것이 어찌나 고마운지 몰랐다."],["영화를 보는 동안 너무 긴장되었던 탓인지 방에 돌아오니 피로가 왈칵 온다.","조갈이 드는 것 같아서 물병을 집으러 가려니 진이 눈에 띈다.","아직도삼분의 일은 넘게 남아 있다.","손이 그쪽으로 가다가는 움칫해졌다.","바오로가 사건 이후에 사온 술을 마셔야 하는가 했다."],["‘그러니까 마셔야지.’"]],[["쓴웃음이 입가에 돈다.","술도 오늘은 썼다."],["‘이래서는 안 된다.’"],["느닷없이 이런 생각이 붕 떠올랐다.","그러면서도 무엇이 어떻게 안 된다는 것인지 집어낼 수는 없다.","그저 모든 것이 그럴 것만 같다.","바오로의 술은먹어서도 안 되고, 안 먹어서도 안 되고, 이러고 있어서도 안 되지만 그렇다고 움직여서는 더 안 될 것만 같다.","사실 그렇기도 했다."]],[["이대로 방에서궁상만 떨고 있을 수야 있느냐?","내가 이러고 있는 이 시간에도 아우의, 피를 나눈 오직 하나뿐인 아우의 생명은 시시각각으로 위축되고 있는 것이다.","한 선이 악 앞에서 유린을 당하고 있는 이 순간에 이러고 있어 좋으냐 했다.","이러고 있는 동안에 한 선은 악 밑에서 여지없이 짓밟히고 할퀴우고 찢기고, 그래서 영원히 소멸해가는 반면 악은 허세를 부리며 살쪄가고 있는 것이다.","형은 벌떡 일어났다.","소리를 내어 잔을 테이블에 놓았다.","잘깍 소리와 함께 신통하게도 반이 짝 갈라진다."]],[["그러나 금세 또 마음속에 부르짖던 것이다."],["‘아니다. 아니다. 천 번 만 번 아니다. 나는 가만히 있어야 한다. 이대로이 방안에 있어야 한다. 한 발짝이라도 방 밖으로 나가서는 안 된다. 대체 어디를 가겠다는 것이냐? 바오로한테?","아니다. 갈 필요가 없다. 고명을 강요하는 것은 신부의 직책이 아니다. 그러면 경찰? 경찰과 나와 무슨 관련이 있느냐.’"]],[["그는 또 주저앉고 말았다, 털퍽 —"],["이튿날도 바오로는 나타날 줄을 몰랐다.","물론 성당에도 안 나왔다.","모처럼안나가 나와 있었다.","안나는 딱 잡아뗀다.","도리어,"],["“좀 찾아주세요, 신부님!”"],["이렇게 되달라붙던 것이다."]],[["‘짠 것이 아닌가? 자꾸 하는 수작이?’"],["이렇게도 의심이 간다."],["그러고 보니 모두가 바오로 부부가 짜고서 하는 노릇 같기도 하다.","지금까지에도 수없이 한 이야기를 편지로까지 강론 시간에 해달란 것도 바오로의수단이 아닌가 싶어도 진다."],["‘제가 듣기 위해서가 아니라 나한테 말을 시키기 위해서?’"]],[["‘편지란 것도 안나의 필적이 아닐까?’"],["한번 의심이 나기 시작하더니 끝이 없다."],["그동안 딴청을 부리던 안나의 태도에도 하기는 수상한 구절이 도시 없지도않다.","그만한 큰돈을 받고도 거기에 대해서는 그후 말 한마디 없다.","성당에 나오지 않는 것도 수상하다면 수상치 않을 것도 없다."]],[["‘그렇다!’ 하고 신부는 부르짖었다."],["‘그러니 어떻다는 게냐?’"],["그 말에는 아무런 대답도 나가지 않았다."],["그는 또 잔으로 손을 가져갔다."],["이튿날 아침 조간을 펴들었던 형은 자기도 모르게 외마디소리를 쳤다."]],[["“간첩의 대거물 조원호 체포” 라는 큼직한 글자 밑에 역시 특호나 되는 성 싶은 활자로,"],["“한씨 살해 미수 사건의 주범 박의 배후 인물?”"],["“뭐?”"],["형은 아연했다."],["“날로 격증해가는 간첩의 활동을 봉쇄하고자 지난 십일부터 극비밀리에본격적인 간첩 색출에 정진한 결과 대소 네 건의 간첩단을 검거하게 되었거니와 특히 이번 체포된 간첩 중에는 북한 괴뢰의 검사를 지낸 최대 거물인조원호가 끼여 있어…”"]],[["그러나 무엇보다도 놀란 것은 조원호는 남한 십대 재벌에 든다고까지 일컫는 실업가로 물산회사, 운수회사, 원양사업 등 각 기업체를 갖고 있을뿐더러 그 재산은 삼십억에 달하고 오백 명의 직원을 포용한 대사업가라는 것이다.","그는 각 은행에서도 막대한 돈을 끌어내다 쓰고 있고 경제교란으로 남한을 궁지에 빠뜨리는 동시에 각종 기밀을 전파로 북한에 보내어 신문 광고, 기타의 암호로 국회, 정부, 민심 동향 등을 수시로 타전하고 있었음이밝혀졌다고도 했다."]],[["압수된 기재로는 무전기 두 대, 기관단총 두 정, 실탄 팔백여 발, 사진기한 대, 수류탄 여덟 개, 권총 소제 미제 각 한 정씩, 미화 이천 불."],["우선 주범만은 잡았지만 배후 관계가 드러나지 않아서 재판 진행도 보류중이던 한씨 살해 미수범인 박찬재가 조원호의 직계였다는 윤곽만은 이미 포착한 듯하다는 것이니 문제는 정말 커지고 말았다."]],[["이의 방증으로서 조원호는 정부, 정계, 재벌 등 거물급과 상당히 접근해왔다는 점과 특히 한씨가 저격을 받던 날 밤에도 조원호는 한씨집에 초대되어약간 일찍이 돌아갔다는 사실도 드러난 데 있다는 것이다."],["이쯤 되면 바오로가 간첩이었거나 간첩과 연락이 있거나 한 것만은 더 의심할 여지가 없다."],["형은 억울한 아우를 구하는 데 일루의 희망이 비쳤느니라 했다."]],[["“살인자 바오로.”"],["“교리의 배신자, 이단자, 모고해자.”"],["그뿐이 아니었다.","거기에 그는 또 무서운 ‘간첩’ 이었던 것이다."],["“간첩, 살인범.”"],["이것만으로도 바오로는 구원받을 수 없느니라 한 형이었다.","그는 자기가 적어도 선을 주장하고 악을 증오하는 인류에 공통된 일반법의 준수자라 했고, 모고해로 영성체를 한 교리의 배신자를 교법으로써 처리해야 할 권한자라 했으며, 인간 최고의 대죄인 살인행위를 인간 사회에서 근절시킬 의무와직책과 양식을 가진 자라 했다."]],[["아니, 또 그는 국민의 한 사람으로서 국가의 안녕 질서를 파괴하는 일체의 비합법적 행위에 대하여 감연히 싸워야 할 국민의 한 사람이니라 했다.","이것은 미요, 선이요, 진이다.","격한 나머지 그는 이 진과 선과 미를 수호하기 위한 그 어떤 행위도 천주님의 안배시니라착각까지 하고 있었다."],["“이것이 가톨릭의 정신이 아니고 무엇이랴? 나는… 나는 이것을 밝혀야한다.”"]],[["그는 이렇게 부르짖고 있다."],["“너는 천주 십계와 가톨릭 법규에 반역할 셈이냐?”"],["천장 — 분명히 천장에서 이런 소리가 들려온다."],["그러나 그는 그 소리에도 항거했다."],["“그렇습니다.”"]],[["“천주께서 고해의 불가침법을 정하신 지 천구백오십육 년이 되는 오늘날까지 단 한 사람의 배신자도 내지 않은 이 거룩한 법규를 깨뜨릴 생각이냐?”"],["이 무서운 질책에도 그는 굽히지 않았다."],["“그렇습니다. 천구백오십육 년간에 단 한 사람의 배신자도 못 났으니까한국에서 한 사람쯤 나도 좋지 않겠습니까?”"]],[["“요셉!”"],["형은 소스라치게 놀랐다.","그는 앉았던 의자에서 벌떡 일어나며 동쪽 벽 앞으로 가서 무릎을 꿇고 복죄를 했다.","그 소리는 분명히 이쪽에서 났던 것이다.","벽에 걸린 십자가에 못박히신 예수의 입에서 나온 음성임에 틀림이 없던 것이다."],["“주여… 성총을 베푸소서.”"],["신부는 십자가 앞에 나아가 무릎을 세웠다."]],[["“전능하신 천주여, 주 우리를 오늘까지 있게 하신지라, 비오니 권능으로우리를 구하사 오늘날에 일체 죄에 떨어지지 말게 하시고 또한 생각과 말과 행위를 인도하사 주의 명을 정성으로 받들게 하시되 우리 주 그리스도를…","위하여 하소서… 천지대구 오 주 천주여, 오늘날 우리의 마음과 몸과 생각과 말과 행동을 바르고 거룩케 하시며 어거하고 다스리사 네 법령과 계명을좇아 지키게 하사 우리로 하여금…”"]],[["신부는 죄의식에 사로잡혀 있었다.","이대로만 간다면 무슨 대죄를 범할지도모르느니라 했다."],["그는 또 바오로를 위하여도 십자를 그었다."],["“… 예수 참 목자 동무 잃은 양을 찾아 얻어 어깨에 메고 우리로 돌아오심을 찬미하나이다. 구하오니 예수는 이 바오로를 불쌍히 여기사 친절히 통회 개과함을 주시고 그 착한 행실로 은혜로이 사하심을 입어 천주을 즐겁게하고 성 교회를 위로하게 하소서…”"]],[["바오로를 위하여 이렇게 기구를 올리는 동안에 신부는 차차 마음의 안정이얻어지는 것이었다.","바오로의 이름은 벌써 증오의 대상은 아니었다.","죄를 짓고도 고해를 못하는 바오로와 함께 고민하고 슬퍼해줄 수 있는 심경이 되던 것이다.","죄에 대한 중압에 못견디어 자수를 하러 갔다가도 그도 역시 인간이기 때문에 용기를 내지 못하고 되돌아서 오는 바오로의 모습이 눈앞에떠오른다.","죄를 짓고도 고해를 못하는, 자수를 못하는 한 인간의 괴로움이란 형벌보다도 더 무서운 고통일 것이었다."]],[["형벌보다도 더 무서운 고통 —육체적 고통보다도 마음의 고통이 얼마나 더 가혹한 형벌이랴."],["‘바오로는 악인은 아니다. 그는 내게 고해를 하지 않았느냐. 그가 자수를 못하는 것은 그만큼 마음의 고통이 주는 형벌을 받기 위해서다. 육체적 고통보다도 마음의 고통이 그의 마음을 정화시켜주고 안정시켜줄 것이다…’","그러면서도 그는 역시 안타까웠다."]],[["자칫하면 배신자에 대한 증오감에 휘감기게 되는 자신을 어찌할 수가 없었다."],["8신과 인간.인간과 신.선과 악.악과 선.신과 악."],["개정 한 시간 전부터 형은 맨 앞자리를 잡고 앉아 이런 단어들을 이리저리붙여도 보고 떼어도 보고 있었다.","이렇게 붙여보나 저렇게 붙여보나 꼭 그 말이 그 말만 같았다.","악과 선은 상극이니라 해온 형이었다."]],[["그러나 몇 번되풀이해보는 동안에 선과 악에 대한 관념이 아리송해진다.","신과 인간과의관념도 그랬고, 악과 선을 맞붙여보아도 나중에는 두 개의 단어가 갖는 어감부터가 비슷비슷해지던 것이다."],["지금 확실히 이 불행한 형은 이 여러 개의 단어에 대한 관념에 혼란을 일으키고 있는 것이었다.","‘선과 악이 근본적으로 다를 것이 무엇이냐’ 했다.","‘훌륭한 선이 악으로 된 일도 얼마든지 있었고, 무서운 악이 위대한 선으로서 통한 예도 얼마든지 들 수 있다 했다. 역사에는 말할 것도 없지만 현실에도 얼마든지 있지 않으냐."]],[["우선 내 아우만 해도 그렇지 않으냐?","아우는 확실히 인간이 규정한 선의권내에 드는 사람이라 했다.","무신자라 해서 전부가 악인으로 간주될 수는 없지 않으냐."],["적어도 아우는 악인은 아니었다.","또 악한 일을 한 적도 없다.","한씨를 죽인 것은 절대로 아우가 아니다.","그것은 이내 판명될 것이다."],["그러나 세상은 그를 악인으로 부르고 있고 법은 또 선량한 한 인간에게 죄인의 낙인을 찍으려고 방대한 예산을 세워서 이런 건물을 마련하고 있는 것이다."]],[["방청객만 해도 그렇다.","이들 중에서 내 아우를 — 천주 앞에 맹세하여 죄인도 악인도 아닌 내 아우를 선인이라고 보아줄 사람이 과연 하나인들 있겠는가.","아니, 내 아우가 선인이기를 바라는 사람조차 단 한 사람 없을 것이다.","그렇게 되기를 바라서 온 사람은 하나도 없이 모두가 극형을 받는 내 아우의 처참한 얼굴 표정을 봄으로써 느끼는 악마적인 쾌감 때문에 이렇게들 모여든 것이 아니고 무엇이냐.’"]],[["‘너희들이야말로 악의 제조자요 악을 즐기는 향락자다.’"],["형의 감정은 점점 격해갔다.","그의 시선은 악을 가장 미워하는 체하면서 기실 내심으로 모든 인간이 악인이기를 바라고 악인이 없으면 제조라도 해서 악을 즐기자는 방청객의 하나하나를 훑고 있었다.","무서운 증오였다.","무서운반발이었고 항거였다.","반역적인 심정이었었다."],["‘죽일 놈들.’"]],[["‘더러운 놈들.’"],["범인이 신부의 아우라는 것을 알고 있는 방청객들은 신부복만을 보고도 모두들 수군대었다."],["“저 신부가 형이래.”"],["이런 소리도 들렸고,"],["“제 동생 하나 잘 인도 못하는 게 무슨 신부 노릇을 하더람.”"]],[["들으라고 일부러 이렇게 큰소리로 하는 여자 음성도 들린다."],["그러나 형은 의젓했다."],["‘잘못 인도한 것이 뭐냐, 인도 못한 것은 너희와 같은 종류의 인간들이다.’"],["내 아우는 죄인이 아니라는 사실이 형을 도저하게 만들어주고 있었다."]],[["형은 조금도 거리낌없이 소리나는 쪽으로 고개를 쓱 돌릴 수도 있던 것이다."],["‘그렇다. 내가 뭣때문에 기가 죽으랴.’"],["이윽고 재판관들이 정내에 들어왔다.","어마어마한 복장이었다."],["‘무죄한 사람을 죄인을 만드는 데는 저런 옷을 입는 모양인가.’"]],[["형은 이런 구경이 처음이었던지라 이렇게 생각했다."],["재판관들이 착석을 하자 무죄한 죄인인 아우가 끌려나왔다.","언도 공판에서십 년이라는 형을 받은 관계도 있겠지만 요전 볼 때보다는 처참하게 야위었다.","십 년 구형에 검사가 상고를 한 것이다.","십 년은 적다는 것이었다."],["“죄 짓지 않은 사람한테 십 년도 과하지 십 년도 적다는 조목은 형법 제 몇 조에 있던고…”"]],[["형은 옆사람도 듣게 말을 했다."],["한참 변론이 벌어졌다.","변호사는 극력 무죄를 주장하고 있었다.","그러나 모두가 추상론이었다.","또 그럴 수밖에는, 없기도 했다.","형한테 변호를 시킨다면 단 한 마디로 족했던 것이다."],["“박 신부한테 고해한 바오로를 불러 오시오.”"],["그러나 변호사는 이 말을 않던 것이다."]],[["알 리가 없었다.","이 세상에서 이 사실을 아는 사람은 오직 바오로 자신과 박 신부뿐이었던 것이다.","본인이자수하거나, 고해신부가 고해 사실을 누설하거나 하지 않고서는 이 문제는해결될 수 없는 것이었다."],["그 당자인 바오로는 그후 행방을 싹 감추고 만 것이다."],["고해신부는 법정에까지 나타났지만 그는 불행히도 고해를 듣는 귀는 가졌어도 그 사실을 옮길 줄 아는 입을 갖고 있지 못했었다."]],[["검사의 논고가 시작되었다."],["이미 알고 있었던 죄과에 놀랄 만한 새 범죄 사실이 첨가되어 있었다."],["“피고는 북한 괴뢰의 최대 거물 간첩 조원호와 정을 같이하고 간첩 조의직접 지시를 받아…”"],["이렇게 되어 있는 것이다.","아우는 가만 있었다.","그것이 무슨 의미인지 해득을 못하는 사람 같아 보인다."]],[["형만이 발을 동동 굴렀다.","그러나 아무런소용도 없었다.","그는 입이 없었으니까 ―"],["긴 논고가 끝나고 피고에게 할말이 없느냐고 묻는다."],["“없습니다.”"],["아우는 이 한마디만 했다가 다시,"],["“해야 소용없으니까요.”"]],[["법정은 잠시 휴게로 들어갔다.","재판관들의 형 심의를 위해서였다.","삼십분이란 시간이 이렇게도 긴 것이었던가.","형은 아우의 얼굴을 자꾸 훔쳐보고또 보고 했다.","집에서는 웬일인지 누이까지 오지 않았었다.","와서 찔찔 우느니보다는 잘되었느니라 싶기도 했다.","다시 방청객은 쑤얼댄다.","재판관들이입정을 하던 것이다."],["이때였다.","형은 자기의 눈을 의심했다.","들어오는 재판장의 낯빛에서 형의경중을 알아보자던 형의 눈 속으로 낯익은 얼굴 하나가 버쩍 달려들던 것이다."]],[["찾던 얼굴이었다.","나타나기를 바라던 얼굴이었다."],["“바오로!”"],["법정인 줄도 잊고 형은 고함을 쳤다."],["형은 또 한번 놀라지 않을 수 없었다.","바오로는 뜻밖에도 이렇게 대답한것이었다."],["“염려 마세요.”"]],[["그것도 웃으면서였던 것이다."],["“바오론 역시 좋은 놈야.”"],["형은 또 한번 입안에서 뇌었다."],["“좋은 놈이구말구. 나보다 난 놈야.”"],["재판관들의 착석이 끝나자 개정이 선언되었다.","마귀의 소리 같던 것이 숫제 음악이었다."]],[["얼마나 통쾌한 일이냐 했다.","얼마나 즐거운 일이냐.","그리고 또 얼마나 선이 뻗어가는 세상이고."],["“피고 박찬재에 대한 죄과를…”"],["음악은 계속되었다.","전 죄과에 대하여 최후의 단안을 내리고 있다.","형은이때나저때나 하고 바오로의 입만 쳐다보고 있다."],["“심판원 전원이 이에 찬성하였으므로 ―”"]],[["바오로는 그래도 입을 봉한 채였다.","형은 벌떡 일어났다.","그때, 바로 그찰나에 재판장의 입에서 언도 선언이 끝났었다."],["“사형!”"],["재판장의 사형 소리를 듣더니 바오로는 출구 쪽으로 휭 나가고 있었다.","형 신부는 자기도 모르게 층계를 내려오는 재판장 앞에 딱 다가섰던 것이다.","그리고 고함을 쳤다."]],[["“진범은 저놈입니다.”"],["그러나 그때는 벌써 바오로는 보이지 않았다."],["“나는 압니다. 나는 압니다. 저놈, 저놈, 배신자 저놈!”"],["“박 신부, 뭔가? 그게 다 뭔 소리야?”"],["어깨를 잡아흔드는데 보니 재판장이 아니다."]],[["재판소도 아니다.","난로 앞 의자에 앉은 채였다.","박 신부는 벌떡 일어났다.","눈을 비비고 보아도 재판장이 아니다.","법정도 아니었다."],["주교님이시다."],["“이 사람, 앉아서 무슨 잠꼬대가 그리 심한가. 심신이 약한 탓야. 좋은소식 가져왔소. 진범이 자수를 했소그려.”"],["“네? 자수했습니까, 바오로가?”"]],[["박 신부는 어떤 것이 꿈인지 잠시 분간이 안 갔다."],["“그래두 했군요.”"],["“했어.”"],["“역시 귀여운 놈이군.”"],["“인제 박 신부도 한 걱정 놨군. 나, 가네.”"]],[["하고 나가는 주교님의 발 앞에 꿇어앉으며,"],["“주교님! 고해 받아주십시오. 저는 고해신부로서 고해 받은 사실을 누설한 대죄를 범했습니다…”"],["〈「 자유문학 」 24 호, 1959 년 3 월 〉"]]],"9":[[["메밀꽃 필 무렵"],["여름 장이란 애시당초에 글러서, 해는 아직 중천에 있건만 장판은 벌써 쓸쓸하고 더운 햇발이 벌여놓은 전 휘장 밑으로 등줄기를 훅훅 볶는다.","마을 사람들은 거의 돌아간 뒤요, 팔리지 못한 나무꾼패가 길거리에 궁깃거리고들 있으나, 석유병이나 받고 고깃마리나 사면 족할 이 축들을 바라고 언제까지든지 버티고 있을 법은 없다.","칩칩스럽게 날아드는 파리떼도 장난꾼 각다귀들도 귀찮다."]],[["얽음뱅이요 왼손잡이인 드팀전의 허생원은 기어이 동업의 조선달을 나꾸어보았다."],["\"그만 거둘까?\""],["\"잘 생각했네.","봉평장에서 한 번이나 흐뭇하게 사본 일이 있었을까?","내일 대화장에서나 한몫 벌어야겠네. \""],["\"오늘 밤은 밤을 새서 걸어야 될걸.\""]],[["\"달이 뜨렷다.\""],["절렁절렁 소리를 내며 조선달이 그날 산 돈을 따지는 것을 보고 허생원은 말뚝에서 넓은 휘장을 걷고 벌여놓았던 물건을 거두기 시작하였다.","무명 필과 주단 바리가 두 고리짝에 꼭 찼다.","멍석 위에는 천조각이 어수선하게 남았다."],["다른 축들도 벌써 거의 전들을 걷고 있었다.","약바르게 떠나는 패도 있었다.","어물장수도, 땜장이도, 엿장수도, 생강장수도, 꼴들이 보이지 않았다."]],[["내일은 진부와 대화에 장이 선다.","축들은 그 어느쪽으로든지 밤을 새며 육칠십리 밤길을 타박거리지 않으면 안 된다.","장판은 잔치 뒤마당같이 어수선하게 벌어지고, 술집에서는 싸움이 터져 있었다.","주정꾼 욕지거리에 섞여 계집의 앙칼진 목소리가 찢어졌다.","장날 저녁은 정해놓고 계집의 고함 소리로 시작되는 것이다."],["\"생원, 시침을 떼두 다 아네.……","충줏집 말야.\""]],[["계집 목소리로 문득 생각난 듯이 조선달은 비죽이 웃는다."],["\"화중지병이지.","연소패들을 적수로 하구야 대거리가 돼야 말이지.\""],["\"그렇지두 않을걸.","축들이 사족을 못쓰는 것두 사실은 사실이나, 아무리 그렇다군 해두 왜 그 동이 말일세.","감쪽같이 충줏집을 후린 눈치거든.\""],["\"무어, 그 애숭이가?"]],[["물건 가지구 낚았나부지.","착실한 녀석인 줄 알았더니.\""],["\"그 길만은 알 수 있나.……궁리 말구 가보세나그려.","내 한 턱 씀세.\""],["그다지 마음이 당기지 않는 것을 쫓아갔다.","허생원은 계집과는 연분이 멀었다.","얽음뱅이 상판을 쳐들고 대어설 숫기도 없었으나, 계집 편에서 정을 보낸 적도 없었고, 쓸쓸하고 뒤틀린 반생이었다.","충줏집을 생각만 하여도 철없이 얼굴이 붉어지고 발 밑이 떨리고 그 자리에 소스라쳐버린다."]],[["충줏집 문을 들어서 술좌석에서 짜장 동이를 만났을 때에는 어찌된 서슬엔지 발끈 화가 나버렸다.","상 위에 붉은 얼굴을 쳐들고 제법 계집과 농탕치는 것을 보고서야 견딜 수 없었던 것이다.","녀석이 제법 난질꾼인데, 꼴사납다.","머리에 피도 안 마른 녀석이 낮부터 술 처먹고 계집과 농탕이야.","장돌뱅이 망신만 시키고 돌아다니누나.","그 꼴에 우리들과 한몫 보자는 셈이지.","동이 앞에 막아서면서부터 책망이었다.","걱정두 팔자요 하는 듯이 빤히 쳐다보는 상기된 눈망울에 부딪힐 때, 얼결김에 따귀를 하나 갈겨 주지 않고는 배길 수 없었다."]],[["동이도 화를 쓰고 팩하고 일어서기는 하였으나, 허생원은 조금도 동색하는 법 없이 마음먹은대로는 다 지껄였다--어디서 주워먹은 선머슴인지는 모르겠으나 네게도 아비 어미 있겠지?","그 사나운 꼴 보면 맘 좋겠다.","장사란 탐탁하게 해야 되지, 계집이 다 무어야.","나가거라, 냉큼 꼴 치워."],["그러나 한마디도 대거리하지 않고 하염없이 나가는 꼴을 보려니, 도리어 측은히 여겨졌다.","아직두 서름서름한 사인데 너무 과하지 않았을까 하고 마음이 섬뾵해졌다."]],[["주제도 넘지, 같은 술손님이면서도 아무리 젊다고 자식 낳게 된 것을 붙들고 치고 닦아셀 것은 무어야 원.","충줏집은 입술을 쭝긋하고 술 붓는 솜씨도 거칠었으나, 젊은 애들한테는 그것이 약이 된다고 하고 그 자리는 조선달이 얼버무려 넘겼다."],["너 녀석한테 반했지?","애숭이를 빨면 죄된다.","한참 법석을 친 후이다.","담도 생긴데다가 웬일인지 흠뻑 취해보고 싶은 생각도 있어서 허생원은 주는 술잔이면 거의 다 들이켰다."]],[["거나해짐을 따라 계집 생각보다도 동이의 뒷일이 한결같이 궁금해졌다.","내 꼴에 계집을 가로채서는 어떡헐 작정이었누 하고, 어리석은 꼬락서니를 모질게 책망하는 마음도 한편에 있었다.","그렇기 때문에 얼마나 지난 뒤인지 동이가 헐레벌떡거리며 황급히 부르러 왔을 때에는, 마시던 잔을 그자리에 던지고 정신없이 허덕이며 충줏집을 뛰어나간 것이었다."],["\"생원 당나귀가 바를 끊구 야단이에요.\""]],[["\"각다귀들 장난이지 필연코.\""],["짐승도 짐승이려니와 동이의 마음씨가 가슴을 울렸다.","뒤를 따라 장판을 달음질하려니 거슴츠레한 눈이 뜨거워질 것 같다."],["\"부락스런 녀석들이라 어쩌는 수 있어야죠..\""],["\"나귀를 몹시 구는 녀석들은 그냥 두지는 않을걸.\""]],[["반평생을 같이 지내온 짐승이었다.","같은 주막에서 잠자고 같은 달빛에 젖으면서 장에서 장으로 걸어다니는 동안에 이십년의 세월이 사람과 짐승을 함께 늙게 하였다.","까스러진 목뒤 털은 주인의 머리털과도 같이 바스러지고, 개진개진 젖은 눈은 주인의 눈과 같이 눈꼽을 흘렸다.","몽당비처럼 짧게 슬리운 꼬리는 파리를 쫓으려고 기껏 휘저어 보아야 벌써 다리까지는 닿지 않았다.","닳아 없어진 굽을 몇번이나 도려내고 새 철을 신겼는지 모른다.","굽은 벌써 더 자라나기는 틀렸고 닳아버린 철 사이로는 피가 빼짓이 흘렀다."]],[["냄새만 맡고도 주인을 분간하였다.","호소하는 목소리로 야단스럽게 울며 반겨한다."],["어린아이를 달래듯이 목덜미를 어루만져 주니 나귀는 코를 벌름거리고 입을 투르르거렸다.","콧물이 튀었다.","허생원은 짐승 때문에 속도 무던히는 썩였다.","아이들의 장난이 심한 눈치여서, 땀밴 몸뚱어리가 부들부들 떨리고 좀체 흥분이 식지 않는 모양이었다.","굴레가 벗어지고 안장도 떨어졌다.","요 몹쓸 자식들, 하고 허생원은 호령을 하였으나, 패들은 벌써 줄행랑을 논 뒤요 몇 남지 않은 아이들이 호령에 놀래 비슬비슬 멀어졌다."]],[["\"우리들 장난이 아니우.","암놈을 보고 저 혼자 발광이지.\""],["코흘리개 한녀석이 멀리서 소리를 쳤다."],["\"고녀석 말투가……\""],["\"김첨지 당나귀가 가버리니까 온통 흙을 차고 거품을 흘리면서 미친 소같이 날뛰는걸.","꼴이 우"]],[["스워 우리는 보고만 있었다우.","배를 좀 보지.\""],["아이는 앙돌아진 투로 소리를 치며 깔깔 웃었다.","허생원은 모르는 결에 낯이 뜨거워졌다.","뭇 시선을 막으려고 그는 짐승의 배 앞을 가리워 서지 않으면 안 되었다."],["\"늙은 주제에 암샘을 내는 셈야.","저놈의 짐승이.\""],["아이의 웃음소리에 허생원은 주춤하면서 기어이 견딜 수 없어 채찍을 들더니 아이를 쫓았다."]],[["\"쫓으려거든 쫓아보지.","왼손잡이가 사람을 때려.\""],["줄달음에 달아나는 각다귀에는 당하는 재주가 없었다.","왼손잡이는 아이 하나도 후릴 수 없다.","그만 채찍을 던졌다.","술기도 돌아 몸이 유난스럽게 화끈거렸다."],["\"그만 떠나세.","녀석들과 어울리다가는 한이 없어.","장판의 각다귀들이란 어른보다도 더 무서운 것들인걸.\""]],[["조선달과 동이는 각각 제 나귀에 안장을 얹고 짐을 싣기 시작하였다.","해가 꽤 많이 기울어진 모양이었다."],["드팀전 장돌이을 시작한 지 이십년이나 되어도 허생원은 봉평장을 빼논 적은 드물었다.","충주 제천 등의 이웃 군에도 가고, 멀리 영남 지방도 헤매기는 하였으나 강릉쯤에 물건 하러 가는 외에는 처음부터 끝까지 군내를 돌아다녔다.","닷새만큼씩의 장날에는 달보다도 확실하게 면에서 면으로 건너간다.","고향이 청주라고 자랑삼아 말하였으나 고향에 돌보러 간 일도 있는 것 같지는 않았다.장에서 장으로 가는 길의 아름다운 강산이 그대로 그에게는 그리운 고향이었다.반날 동안이나 뚜벅뚜벅 걷고 장터 있는 마을에 거의 가까왔을 때, 거친 나귀가 한바탕 우렁차게 울면--더구나 그것이 저녁녘이어서 등불들이 어둠 속에 깜박거릴 무렵이면 늘 당하는 것이건만 허생원은 변치 않고 언제든지 가슴이 뛰놀았다."]],[["젊은시절에는 알뜰하게 벌어 돈푼이나 모아본 적도 있기는 있었으나, 읍내에 백중이 열린 해 호탕스럽게 놀고 투전을 하고 하여 사흘 동안에 다 털어버렸다.","나귀까지 팔게 된 판이었으나 애끓는 정분에 그것만은 이를 물고 단념하였다.","결국 도로아미타불로 장돌이를 다시 시작할 수밖에 없었다.","짐승을 데리고 읍내를 도망해 나왔을 때에는 너를 팔지 않기 다행이었다고 길가에서 울면서 짐승의 등을 어루만졌던 것이었다.","빚을 지기 시작하니 재산을 모을 염은 당초에 틀리고 간신히 입에 풀칠을 하러 장에서 장으로 돌아다니게 되었다."]],[["호탕스럽게 놀았다고는 하여도 계집 하나 후려보지는 못하였다.","계집이란 쌀쌀하고 매정한 것이었다.","평생 인연이 없는 것이라고 신세가 서글퍼졌다.","일신에 가까운 것이라고는 언제나 변함없는 한 필의 당나귀였다."],["그렇다고는 하여도 꼭 한번의 첫일을 잊을 수는 없었다.","뒤에도 처음에도 없는 단 한번의 괴이한 인연!","봉평에 다니기 시작한 젊은 시절의 일이었으나 그것을 생각할 적만은 그도 산 보람을 느꼈다."]],[["\"달밤이었으나 어떻게 해서 그렇게 됐는지 지금 생각해두 도무지 알 수 없어.\""],["허생원은 오늘밤도 또 그 이야기를 끄집어내려는 것이다.","조선달은 친구가 된 이래 귀에 못이 박히도록 들어 왔다.","그렇다고 싫증을 낼 수도 없었으나 허생원은 시치미를 떼고 되풀이할대로는 되풀이하고야 말았다."],["\"달밤에는 그런 이야기가 격에 맞거든,\""]],[["조선달 편을 바라는 보았으나 물론 미안해서가 아니라 달빛에 감동하여서였다.","이지러는 졌으나 보름을 갓 지난 달은 부드러운 빛을 흐뭇이 흘리고 있다.","대화까지는 팔십리의 밤길, 고개를 둘이나 넘고 개울을 하나 건너고 벌판과 산길을 걸어야 된다.","길은 지금 긴 산허리에 걸려 있다.","밤중을 지난 무렵인지 죽은듯이 고요한 속에서 짐승 같은 달의 숨소리가 손에 잡힐 듯이 들리며, 콩포기와 옥수수 잎새가 한층 달에 푸르게 젖었다.","산허리는 온통 메밀밭이어서 피기 시작한 꽃이 소금을 뿌린 듯이 흐뭇한 달빛에 숨이 막힐 지경이다."]],[["붉은 대궁이 향기같이 애잔하고 나귀들의 걸음도 시원하다.","길이 좁은 까닭에 세 사람은 나귀를 타고 외줄로 늘어섰다.","방울소리가 시원스럽게 딸랑딸랑 메밀밭게로 흘러간다.","앞장 선 허생원의 이야기소리는 꽁무니에 선 동이에게는 확적히는 안 들렸으나, 그는 그대로 개운한 제멋에 적적하지는 않았다."],["\"장선 꼭 이런 날 밤이었네.","객줏집 토방이란 무더워서 잠이 들어야지.","밤중은 돼서 혼자 일어나 개울가에 목욕하러 나갔지."]],[["봉평은 지금이나 그제나 마찬가지지, 보이는 곳마다 메밀밭이어서 개울가가 어디없이 하얀 꽃이야.","돌밭에 벗어도 좋을 것을, 달이 너무나 밝은 까닭에 옷을 벗으러 물방앗간으로 들어가지 않았나.","이상한 일도 많지.","거기서 난데없는 성서방네 처녀와 마주쳤단 말이네.","봉평서야 제일가는 일색이었지---팔자에 있었나부지.\""],["아무렴, 하고 응답하면서 말머리를 아끼는 듯이 한참이나 담배를 빨 뿐이었다.","구수한 자줏빛 연기가 밤기운 속에 흘러서는 녹았다."]],[["\"날 기다린 것은 아니었으나 그렇다고 달리 기다리는 놈팽이가 있는 것두 아니었네.","처녀는 울"],["고 있단 말야.","짐작은 대고 있으나 성서방네는 한창 어려워서 들고날 판인 때였지.","한집안 일이니 딸에겐들 걱정이 없을 리 있겠나?","좋은 데만 있으면 시집도 보내련만 시집은 죽어도 싫다지……그러나 처녀란 울 때같이 정을 끄는 때가 있을까!","처음에는 놀라기도 한 눈치였으나 걱정 있을 때는 누그러지기도 쉬운 듯해서 이럭저럭 이야기가 되었네……생각하면 무섭고도 기막힌 밤이었어.\""]],[["\"제천인지로 줄행랑을 놓은 건 그 다음 날이렷지.\""],["\"다음 장도막에는 벌써 온 집안이 사라진 뒤였네.","장판은 소문에 발끈 뒤집혀 오죽해야 술집에 팔려가기가 상수라고 처녀의 뒷공론이 자자들 하단 말이야.","제천 장판을 몇 번이나 뒤졌겠나.","허나 처녀의 꼴은 꿩궈먹은 자리야.","첫날밤이 마지막 밤이었지.","그 때부터 봉평이 마음에 든 것이 반평생을 두고 다니게 되었네.","반평생인들 잊을 수 있겠나.\""]],[["\"수 좋았지.","그렇게 신통한 일이란 쉽지 않어.","항용 못난것 얻어 새끼 낳고 걱정 늘고, 생각만 해두 진저리가 나지……그러나 늙으막바지까지 장돌뱅이로 지내기도 힘드는 노릇 아닌가.","난 가을까지만 하구 이 생계와두 하직하려네.","대화쯤에 조그만 전방이나 하나 벌이구 식구들을 부르겠어.","사시장천 뚜벅뚜벅 걷기란 여간이래야지.\""],["\"옛 처녀나 만나면 같이나 살까……난 거꾸러질 때까지 이 길 걷고 저 달 볼 테야.\""]],[["산길을 벗어나니 큰 길로 틔어졌다.","꽁무니의 동이도 앞으로 나서 나귀들은 가로 늘어섰다."],["\"총각두 젊겠다, 지금이 한창시절이렷다.","충줏집에서는 그만 실수를 해서 그 꼴이 되었으나 설게 생각 말게.\""],["\"처 천만에요.","되려 부끄러워요.","계집이란 지금 웬 제격인가요.","자나 깨나 어머니 생각뿐인데요.\""]],[["허생원의 이야기로 실심해 한 끝이라 동이의 어조는 한풀 수그러진 것이었다."],["\"아비 어미란 말에 가슴이 터지는 것도 같았으나 제겐 아버지가 없어요.","피붙이라고는 어머니"],["하나뿐인걸요.\""],["\"돌아가셨나?\""],["\"당초부터 없어요.\""]],[["\"그런 법이 세상에……\""],["생원과 선달이 야단스럽게 껄껄들 웃으니 동이는 정색하고 우길 수밖에는 없었다."],["\"부끄러워서 말하지 않으려 했으나 정말예요.","제천 촌에서 달도 차지 않은 아이를 낳고 어머니"],["는 집을 쫓겨났죠.","우스운 이야기나, 그러기 때문에 지금까지 아버지 얼굴도 본 적 없고 있는 고장도 모르고 지내 와요.\""]],[["고개가 앞에 놓인 까닭에 세 사람은 나귀를 내렸다.","둔덕은 험하고 입을 벌리기도 대근하여 이야기는 한동안 끊겼다.","나귀는 건듯하면 미끄러졌다.","허생원은 숨이 차 몇 번이고 다리를 쉬지 않으면 안 되었다.","고개를 넘을 때마다 나이가 알렸다.","동이 같은 젊은축이 끝이없이 부러웠다.","땀이 등을 한바탕 쭉 씻어내렸다."],["고개 너머는 바로 개울이었다.","장마에 흘겨버린 널다리가 아직도 걸리지 않은 채로 있는 까닭에 벗고 건너야 되었다."]],[["고의를 벗어 띠로 등에 얽어매고 반 벌거숭이의 우스꽝스런 꼴로 물 속에 뛰어들었다.","금방 땀을 흘린 뒤였으나 밤 물은 뼈를 찔렀다."],["\"그래 대체 기르긴 누가 기르구?\""],["\"어머니는 하는 수 없이 의부를 얻어가서 술장사를 시작했죠.","술이 고주래서 의부라고 전 망나"],["니예요."]],[["철 들어서부터 맞기 시작한 것이 하룬들 편한 날 있었을까?","어머니는 말리다가 채이고 맞고 칼부림을 당하고 하니 집 꼴이 무어겠소.","열여덟 살 때 집을 뛰쳐나서부터 이짓이죠.\""],["\"총각 낫세론 동이 무던하다고 생각했더니 듣고 보니 딱한 신세로군.\""],["물은 깊어 허리까지 찼다.","속 물살도 어지간히 센데다가 발에 채이는 돌멩이도 미끄러워 금시에 훌칠 듯하였다."]],[["나귀와 조선달은 재빨리 거의 건넜으나 동이는 허생원을 붙드느라고 두 사람은 훨씬 떨어졌다."],["\"모친의 친정은 원래부터 제천이었던가?\""],["\"웬걸요.","시원스리 말은 안해주나 봉평이라는 것만은 들었죠.\""],["\"봉평?","그래 그 아비 성은 무엇이구?\""]],[["\"알 수 있나요.","도무지 듣지를 못했으니까.\""],["\"그 그렇겠지.\" 하고 중얼거리며 흐려지는 눈을 까물까물하다가 허생원은 경망하게도 발을 빗디뎠다.","앞으로 꼬꾸라지기가 바쁘게 몸째 풍덩 빠져버렸다.","허위적거릴수록 몸을 걷잡을 수 없어 동이가 소리를 치며 가까이 왔을 때에는 벌써 퍽으나 흘렀었다.","옷째 쫄딱 젖으니 물에 젖은 개보다도 참혹한 꼴이었다.","동이는 물속에서 어른을 해깝게 업을 수 있었다."]],[["젖었다고는 하여도 여윈 몸이라 장정 등에는 오히려 가벼웠다."],["\"이렇게까지 해서 안됐네.","내 오늘은 정신이 빠진 모양이야.\""],["\"염려하실 것 없어요.\""],["\"그래 모친은 아비를 찾지는 않는 눈치지?\""],["\"늘 한 번 만나고 싶다고는 하는데요.\""]],[["\"지금 어디 계신가?\""],["\"의부와도 갈라져서 제천에 있죠.","가을에는 봉평에 모셔오려고 생각 중인데요.","이를 물고 벌면 이럭저럭 살아갈 수 있겠죠.\""],["\"아무렴, 기특한 생각이야.","가을이랬다?\""],["동이의 탐탁한 등어리가 뼈에 사무쳐 따뜻하다.","물을 다 건넜을 때에는 도리어 서글픈 생각에 좀 더 업혔으면도 하였다."]],[["\"진종일 실수만 하니 웬일이요?","생원.\""],["조선달은 바라보며 기어코 웃음이 터졌다."],["\"나귀야, 나귀 생각 하다 실족을 했어.","말 안했던가?","저 꼴에 제법 새끼를 얻었단 말이지.","읍내 강릉집 피마에게 말일세.","귀를 쫑긋 세우고 달랑달랑 뛰는 것이 나귀새끼같이 귀여운 것이 있을까?","그것 보러 나는 일부러 읍내를 도는 때가 있다네.\""]],[["\"사람을 물에 빠치울 젠 딴은 대단한 나귀새끼군!\""],["허생원은 젖은 옷을 웬만큼 짜서 입었다.","이가 덜덜 갈리고 가슴이 떨리며 몹시도 추웠으나 마음은 알 수 없이 둥실둥실 가벼웠다."],["\"주막까지 부지런히들 가세나.","뜰에 불을 피우고 훗훗이 쉬어.","나귀에겐 더운 물울 끓여주고, 내일 대화장 보고는 제천이다.\""]],[["\"생원도 제천으로……?\""],["\"오래간만에 가보고 싶어.","동행하려나, 동이?\""],["나귀가 걷기 시작하였을 때 동이의 채찍은 왼손에 있었다.","오랫동안 아둑신이같이 눈이 어둡던 허생원도 요번만은 동이의 왼손잡이가 눈에 띄지 않을 수 없었다."],["걸음도 해깝고 방울소리가 밤 벌판에 한층 청청하게 울렸다."]],[["달이 어지간히 기울어졌다."]]],"10":[[["운수 좋은날"],["현진건"],["새침하게 흐린 품이 눈이 올 듯하더니 눈은 아니 오고 얼다가 만 비가 추적추적 내리는 날이었다."],["이날이야말로 동소문 안에서 인력거꾼 노릇을 하는 김첨지에게는 오래간만에도 닥친 운수 좋은 날이었다.","문안에 (거기도 문밖은 아니지만) 들어간답시는 앞집 마마님을 전찻길까지 모셔다 드린 것을 비롯으로 행여나 손님이있을까 하고 정류장에서 어정어정하며 내리는 사람 하나하나에게 거의 비는 듯한 눈결을 보내고 있다가 마침내 교원인 듯한 양복쟁이를 동광학교(東光學校) 까지 태워다 주기로 되었다."]],[["첫 번에 삼십전, 둘째 번에 오십전 - 아침 댓바람에 그리 흉치 않은 일이었다.","그야말로 재수가 옴붙어서 근 열흘 동안 돈 구경도 못한 김첨지는 십 전짜리 백동화 서 푼, 또는 다섯 푼이 찰깍 하고 손바닥에 떨어질 제 거의 눈물을 흘릴 만큼 기뻤었다.","더구나 이날 이때에 이 팔십 전이라는 돈이 그에게 얼마나 유용한지 몰랐다.","컬컬한 목에 모주 한 잔도 적실 수 있거니와그보다도 앓는 아내에게 설렁탕 한 그릇도 사다 줄 수 있음이다."]],[["그의 아내가 기침으로 쿨룩거리기는 벌써 달포가 넘었다.","조밥도 굶기를먹다시피 하는 형편이니 물론 약 한 첩 써본 일이 없다.","구태여 쓰려면 못 쓸 바도 아니로되 그는 병이란 놈에게 약을 주어 보내면 재미를 붙여서 자꾸 온다는 자기의 신조(信條)에 어디까지 충실하였다.","따라서 의사에게 보 인 적이 없으니 무슨 병인지는 알 수 없으되 반듯이 누워 가지고 일어나기는 새로 모로도 못 눕는 걸 보면 중증은 중증인 듯.","병이 이대도록 심해지기는 열흘전에 조밥을 먹고 체한 때문이다."]],[["그때도 김첨지가 오래간만에 돈을 얻어서 좁쌀 한 되와 십 전짜리 나무 한 단을 사다 주었더니 김첨지의 말에 의지하면 그 오라질 년이 천방지축으로 냄비에 대고 끓였다.","마음은급하고 불길은 달지 않아 채 익지도 않은 것을 그 오라질년이 숟가락은 고만두고 손으로 움켜서 두 뺨에 주먹덩이 같은 혹이 불거지도록 누가 빼앗을듯이 처박질하더니만 그날 저녁부터 가슴이 땡긴다, 배가 켕긴다고 눈을 흡뜨고 지랄병을 하였다.","그때 김첨지는 열화와 같이 성을 내며,"]],[["“에이, 오라질년, 조랑복은 할 수가 없어, 못 먹어 병, 먹어서 병! 어쩌란 말이야! 왜 눈을 바루 뜨지 못해!”"],["하고 앓는 이의 뺨을 한 번 후려갈겼다.","흡뜬 눈은 조금 바루어졌건만 이슬이 맺히었다.","김첨지의 눈시울도 뜨끈뜨끈하였다."],["이 환자가 그러고도 먹는 데는 물리지 않았다.","사흘 전부터 설렁탕 국물이마시고 싶다고 남편을 졸랐다."]],[["“이런 오라질 년! 조밥도 못 먹는 년이 설렁탕은. 또 처먹고 지랄병을 하게.”"],["라고, 야단을 쳐보았건만, 못 사주는 마음이 시원치는 않았다."],["인제 설렁탕을 사줄 수도 있다.","앓는 어미 곁에서 배고파 보채는 개똥이(세살먹이) 에게 죽을 사줄 수도 있다 - 팔십 전을 손에 쥔 김 첨지의 마음은 푼푼하였다."]],[["그러나 그의 행운은 그걸로 그치지 않았다.","땀과 빗물이 섞여 흐르는 목덜미를 기름주머니가 다된 왜목 수건으로 닦으며, 그 학교 문을 돌아 나올 때였다.","뒤에서 “인력거!” 하고 부르는 소리가 난다.","자기를 불러 멈춘 사람이 그 학교 학생인 줄 김첨지는 한번 보고 짐작할 수 있었다.","그 학생은다짜고짜로,"],["“남대문 정거장까지 얼마요.”"]],[["라고 물었다.","아마도 그 학교 기숙사에 있는 이로 동기방학을 이용하여 귀향하려 함이리라.","오늘 가기로 작정은 하였건만 비는 오고, 짐은 있고 해서 어찌할 줄 모르다가 마침 김첨지를 보고 뛰어나왔음이리라.","그렇지 않으면 왜 구두를 채 신지 못해서 질질 끌고, 비록 고구라 양복일망정 노박이로 비를 맞으며 김첨지를 뒤쫓아 나왔으랴."],["“남대문 정거장까지 말씀입니까.”"]],[["하고 김첨지는 잠깐 주저하였다.","그는 이 우중에 우장도 없이 그 먼 곳을철벅거리고 가기가 싫었음일까?","처음 것 둘째 것으로 고만 만족하였음일까?","아니다 결코 아니다.","이상하게도 꼬리를 맞물고 덤비는 이 행운 앞에 조금 겁이 났음이다.","그리고 집을 나올 제 아내의 부탁이 마음이 켕기었다 - 앞집 마마님한테서 부르러 왔을 제 병인은 뼈만 남은 얼굴에 유일의 샘물 같은 유달리 크고 움푹한 눈에 애걸하는 빛을 띄우며,"]],[["“오늘은 나가지 말아요. 제발 덕분에 집에 붙어 있어요. 내가 이렇게 아픈데…….”"],["라고, 모기 소리같이 중얼거리고 숨을 걸그렁걸그렁하였다.","그때에 김첨지는 대수롭지 않은듯이,"],["“아따, 젠장맞을 년, 별 빌어먹을 소리를 다 하네. 맞붙들고 앉았으면 누가 먹여 살릴 줄 알아.”"]],[["하고 훌쩍 뛰어나오려니까 환자는 붙잡을 듯이 팔을 내저으며,"],["“나가지 말라도 그래, 그러면 일찍이 들어와요.”"],["하고, 목메인 소리가 뒤를 따랐다."],["정거장까지 가잔 말을 들은 순간에 경련적으로 떠는 손 유달리 큼직한 눈 울 듯한 아내의 얼굴이 김첨지의 눈앞에 어른어른하였다."]],[["“그래 남대문 정거장까지 얼마란 말이요?”"],["하고 학생은 초조한 듯이 인력거꾼의 얼굴을 바라보며 혼자말같이,"],["“인천 차가 열한 점에 있고 그 다음에는 새로 두 점이든가.”"],["라고 중얼거린다."],["“일 원 오십 전만 줍시요.”"]],[["이 말이 저도 모를 사이에 불쑥 김첨지의 입에서 떨어졌다.","제 입으로 부르고도 스스로 그 엄청난 돈 액수에 놀랐다.","한꺼번에 이런 금액을 불러라도 본 지가 그 얼마 만인가!","그러자 그 돈벌 용기가 병자에 대한 염려를 사르고 말았다.","설마 오늘 내로 어떠랴 싶었다.","무슨 일이 있더라도 제일 제 이의 행운을 곱친 것보다고 오히려 갑절이 많은 이 행운을 놓칠 수 없다 하였다."],["“일 원 오십 전은 너무 과한데.”"]],[["이런 말을 하며 학생은 고개를 기웃하였다."],["“아니올시다. 잇수로 치면 여기서 거기가 시오 리가 넘는답니다. 또 이런진날은 좀 더 주셔야지요.”"],["하고 빙글빙글 웃는 차부의 얼굴에는 숨길 수 없는 기쁨이 넘쳐흘렀다."],["“그러면 달라는 대로 줄 터이니 빨리 가요.”"]],[["관대한 어린 손님은 이런 말을 남기고 총총히 옷도 입고 짐도 챙기러 갈 데로 갔다."],["그 학생을 태우고 나선 김첨지의 다리는 이상하게 거뿐하였다.","달음질을한다느니보다 거의 나는 듯하였다.","바퀴도 어떻게 속히 도는지 구른다느니보다 마치 얼음을 지쳐 나가는 스케이트 모양으로 미끄러져 가는 듯하였다.","언 땅에 비가 내려 미끄럽기도 하였지만."]],[["이윽고 끄는 이의 다리는 무거워졌다.","자기 집 가까이 다다른 까닭이다.","새삼스러운 염려가 그의 가슴을 눌렀다.","“오늘은 나가지 말아요, 내가 이렇게 아픈데” 이런 말이 잉잉 그의 귀에 울렸다.","그리고 병자의 움쑥 들어간 눈이 원망하는 듯이 자기를 노리는 듯하였다.","그러자 엉엉 하고 우는 개똥이의 곡성을 들은 듯싶다.","딸국딸국 하고 숨 모으는 소리도 나는 듯싶다.","“왜 이리우, 기차 놓치겠구먼.”"]],[["하고 탄 이의 초조한 부르짖음이 간신히 그의 귀에 들어왔다.","언뜻 깨달으니 김첨지는 인력거를 쥔 채 길 한복판에 엉거주춤 멈춰 있지 않은가."],["“예, 예.”"],["하고, 김첨지는 또다시 달음질하였다.","집이 차차 멀어 갈수록 김첨지의 걸음에는 다시금 신이 나기 시작하였다.","다리를 재게 놀려야만 쉴새없이 자기의 머리에 떠오르는 모든 근심과 걱정을 잊을 듯이."]],[["정거장까지 끌어다 주고 그 깜짝 놀란 일 원 오십 전을 정말 제 손에 쥠에제 말마따나 십리나 되는 길을 비를 맞아 가며 질퍽거리고 온 생각은 아니하고 거저나 얻은 듯이 고마웠다.","졸부나 된 듯이 기뻤다.","제 자식뻘밖에안 되는 어린 손님에게 몇 번 허리를 굽히며,"],["“안녕히 다녀옵시요.”"],["라고 깍듯이 재우쳤다."]],[["그러나 빈 인력거를 털털거리며 이 우중에 돌아갈 일이 꿈밖이었다.","노동으로 하여 흐른 땀이 식어지자 굶주린 창자에서, 물 흐르는 옷에서 어슬어슬 한기가 솟아나기 비롯하매 일 원 오십 전이란 돈이 얼마나 괜찮고 괴로운 것인 줄 절절히 느끼었다.","정거장을 떠나는 그의 발길은 힘 하나 없었다.","온몸이 옹송그려지며 당장 그 자리에 엎어져 못 일어날 것 같았다."],["“젠장맞을 것, 이 비를 맞으며 빈 인력거를 털털거리고 돌아를 간담. 이런 빌어먹을 제 할미를 붙을 비가 왜 남의 상판을 딱딱 때려!”"]],[["그는 몹시 화증을 내며 누구에게 반항이나 하는 듯이 게걸거렸다.","그럴 즈음에 그의 머리엔 또 새로운 광명이 비쳤나니 그것은 ‘이러구 갈 게 아니라 이 근처를 빙빙 돌며 차 오기를 기다리면 또 손님을 태우게 될는지도 몰라’ 란 생각이었다.","오늘 운수가 괴상하게도 좋으니까 그런 요행이 또 한번 없으리라고 누가 보증하랴.","꼬리를 굴리는 행운이 꼭 자기를 기다리고 있다고 내기를 해도 좋을 만한 믿음을 얻게 되었다.","그렇다고 정거장 인력거꾼의 등쌀이 무서우니 정거장 앞에 섰을 수는 없었다."]],[["그래 그는 이전에도 여러 번 해본 일이라 바로 정거장 앞 전차 정류장에서 조금 떨어지게 사람 다니는 길과 전찻길 틈에 인력거를 세워 놓고 자기는 그 근처를 빙빙 돌며 형세를 관망하기로 하였다.","얼마 만에 기차는 왔고 수십 명이나 되는 손이 정류장으로 쏟아져 나왔다.","그 중에서 손님을 물색하는 김첨지의 눈엔 양머리에 뒤축 높은 구두를 신고 망토까지 두른 기생 퇴물인 듯 난봉 여학생인 듯한 여편네의 모양이 띄었다.","그는 슬근슬근 그 여자의 곁으로 다가들었다."]],[["“아씨, 인력거 아니 타시랍시요.”"],["그 여학생인지 만지가 한참은 매우 때깔을 빼며 입술을 꼭 다문 채 김첨지를 거들떠보지도 않았다.","김첨지는 구걸하는 거지나 무엇같이 연해연방 그의 기색을 살피며,"],["“아씨, 정거장 애들보담 아주 싸게 모셔다 드리겠습니다. 댁이 어디신가요.”"]],[["하고 추근추근하게도 그 여자의 들고 있는 일본식 버들고리짝에 제 손을 대었다."],["“왜 이래, 남 귀치않게.”"],["소리를 벽력같이 지르고는 돌아선다.","김첨지는 어랍시요 하고 물러섰다.","전차는 왔다.","김첨지는 원망스럽게 전차 타는 이를 노리고 있었다.","그러나 그의 예감(豫感)은 틀리지 않았다.","전차가 빡빡하게 사람을 싣고 움직이기시작하였을 제 타고 남은 손 하나가 있었다."]],[["굉장하게 큰 가방을 들고 있는 걸 보면 아마 붐비는 차 안에 짐이 크다 하여 차장에게 밀려 내려온 눈치였다.","김첨지는 대어섰다."],["“인력거를 타시랍시요.”"],["한동안 값으로 승강이를 하다가 육십 전에 인사동까지 태워다 주기로 하였다.","인력거가 무거워지매 그의 몸은 이상하게도 가벼워졌고 그리고 또 인력거가 가벼워지니 몸은 다시금 무거워졌건만 이번에는 마음조차 초조해 온다."]],[["집의 광경이 자꾸 눈앞에 어른거리어 인제 요행을 바랄 여유도 없었다.","나무 등걸이나 무엇 같고 제 것 같지도 않은 다리를 연해 꾸짖으며 질팡갈팡 뛰는 수밖에 없었다.","저놈의 인력거꾼이 저렇게 술이 취해 가지고 이 진 땅에 어찌 가노, 라고 길 가는 사람이 걱정을 하리만큼 그의 걸음은 황급하였다.","흐리고 비 오는 하늘은 어둠침침하게 벌써 황혼에 가까운 듯하다.","창경원 앞까지 다다라서야 그는 턱에 닿은 숨을 돌리고 걸음도 늦추잡았다.","한 걸음 두 걸음 집이 가까워 갈수록 그의 마음조차 괴상하게 누그러웠다."]],[["그런데 이 누그러움은 안심에서 오는 게 아니요 자기를 덮친 무서운 불행을빈틈없이 알게 될 때가 박두한 것을 두리는 마음에서 오는 것이다.","그는 불행에 다닥치기 전 시간을 얼마쯤이라도 늘이려고 버르적거렸다.","기적(奇蹟)에 가까운 벌이를 하였다는 기쁨을 할 수 있으면 오래 지니고 싶었다.","그는두리번두리번 사면을 살피었다.","그 모양은 마치 자기 집 ― 곧 불행을 향하고 달아가는 제 다리를 제 힘으로는 도저히 어찌할 수 없으니 누구든지 나를 좀 잡아 다고, 구해 다고 하는 듯하였다."]],[["그럴 즈음에 마침 길가 선술집에서 그의 친구 치삼이가 나온다.","그의 우글우글 살찐 얼굴에 주홍이 덧는 듯, 온 턱과 뺨을 시커멓게 구레나룻이 덮였거늘 노르탱탱한 얼굴이 바짝 말라서 여기저기 고랑이 패고 수염도 있대야턱밑에만 마치 솔잎 송이를 거꾸로 붙여 놓은 듯한 김첨지의 풍채하고는 기이한 대상을 짓고 있었다."],["“여보게 김첨지, 자네 문안 들어갔다 오는 모양일세그려. 돈 많이 벌었을테니 한잔 빨리게.”"]],[["뚱뚱보는 말라깽이를 보던 맡에 부르짖었다.","그 목소리는 몸집과 딴판으로연하고 싹싹하였다.","김첨지는 이 친구를 만난 게 어떻게 반가운지 몰랐다.","자기를 살려 준 은인이나 무엇같이 고맙기도 하였다."],["“자네는 벌써 한잔한 모양일세그려. 자네도 오늘 재미가 좋아 보이.”"],["하고 김첨지는 얼굴을 펴서 웃었다."]],[["“아따, 재미 안 좋다고 술 못 먹을 낸가. 그런데 여보게, 자네 왼몸이 어째 물독에 빠진 새앙쥐 같은가. 어서 이리 들어와 말리게.”"],["선술집은 훈훈하고 뜨뜻하였다.","추어탕을 끓이는 솥뚜껑을 열 적마다 뭉게뭉게 떠오르는 흰김 석쇠에서 뻐지짓뻐지짓 구워지는 너비아니구이며 제육이며 간이며 콩팥이며 북어며 빈대떡……","이 너저분하게 늘어놓인 안주 탁자에 김첨지는 갑자기 속이 쓰려서 견딜 수 없었다."]],[["마음대로 할 양이면 거기 있는 모든 먹음먹이를 모조리 깡그리 집어삼켜도 시원치 않았다 하되 배고픈 이는 위선 분량 많은 빈대떡 두 개를 쪼이기도 하고 추어탕을 한 그릇 청하였다.","주린 창자는 음식맛을 보더니 더욱더욱 비어지며 자꾸자꾸 들이라 들이라 하였다.","순식간에 두부와 미꾸리 든 국 한 그릇을 그냥 물같이들이켜고 말았다.","셋째 그릇을 받아 들었을 제 데우던 막걸리 곱배기 두 잔이 더웠다.","치삼이와 같이 마시자 원원이 비었던 속이라 찌르를 하고 창자에 퍼지며 얼굴이 화끈하였다."]],[["눌러 곱배기 한 잔을 또 마셨다."],["김첨지의 눈은 벌써 개개 풀리기 시작하였다.","석쇠에 얹힌 떡 두 개를 숭덩숭덩 썰어서 볼을 불룩거리며 또 곱배기 두 잔을 부어라 하였다."],["치삼은 의아한 듯이 김첨지를 보며,"],["“여보게 또 붓다니, 벌써 우리가 넉 잔씩 먹었네, 돈이 사십 전일세.” 라고 주의시켰다."]],[["“아따 이놈아, 사십 전이 그리 끔찍하냐. 오늘 내가 돈을 막 벌었어. 참 오늘 운수가 좋았느니.”"],["“그래 얼마를 벌었단 말인가.”"],["“삼십 원을 벌었어, 삼십 원을! 이런 젠장맞을 술을 왜 안 부어…… 괜찮다 괜찮다, 막 먹어도 상관이 없어. 오늘 돈 산더미같이 벌었는데.”"]],[["“어, 이 사람 취했군, 그만두세.”"],["“이놈아, 그걸 먹고 취할 내냐, 어서 더 먹어.”"],["하고는 치삼의 귀를 잡아 치며 취한 이는 부르짖었다.","그리고 술을 붓는 열 다섯 살 됨직한 중대가리에게로 달려들며,"],["“이놈, 오라질 놈, 왜 술을 붓지 않어.”"]],[["라고 야단을 쳤다.","중대가리는 희희 웃고 치삼을 보며 문의하는 듯이 눈짓을 하였다.","주정꾼이 이 눈치를 알아보고 화를 버럭 내며,"],["“에미를 붙을 이 오라질 놈들 같으니, 이놈 내가 돈이 없을 줄 알고.” 하자마자 허리춤을 훔칫훔칫하더니 일 원짜리 한 장을 꺼내어 중대가리 앞에 펄쩍 집어던졌다.","그 사품에 몇 푼 은전이 잘그랑 하며 떨어진다."]],[["“여보게 돈 떨어졌네, 왜 돈을 막 끼얹나.”"],["이런 말을 하며 일변 돈을 줍는다.","김첨지는 취한 중에도 돈의 거처를 살피는 듯이 눈을 크게 떠서 땅을 내려다보다가 불시에 제 하는 짓이 너무 더럽다는 듯이 고개를 소스라치자 더욱 성을 내며,"],["“봐라 봐! 이 더러운 놈들아, 내가 돈이 없나, 다리뼉다구를 꺾어 놓을 놈들 같으니.”"]],[["하고 치삼의 주워 주는 돈을 받아,"],["“이 원수엣돈! 이 육시를 할 돈!”"],["하면서 풀매질을 친다.","벽에 맞아 떨어진 돈은 다시 술 끓이는 양푼에 떨어지며 정당한 매를 맞는다는 듯이 쨍 하고 울었다."],["곱배기 두 잔은 또 부어질 겨를도 없이 말려 가고 말았다.","김첨지는 입술과 수염에 붙은 술을 빨아들이고 나서 매우 만족한 듯이 그 솔잎 송이 수염을 쓰다듬으며,"]],[["“또 부어, 또 부어.”"],["라고 외쳤다."],["또 한 잔 먹고 나서 김첨지는 치삼의 어깨를 치며 문득 껄껄 웃는다.","그 웃음 소리가 어떻게 컸던지 술집에 있는 이의 눈은 모두 김첨지에게로 몰리었다.","웃는 이는 더욱 웃으며,"],["“여보게 치삼이, 내 우스운 이야기 하나 할까. 오늘 손을 태고 정거장에가지 않았겠나.”"]],[["“그래서.”"],["“갔다가 그저 오기가 안됐데그려. 그래 전차 정류장에서 어름어름하며 손님 하나를 태울 궁리를 하지 않았나. 거기 마침 마마님이신지 여학생이신지(요새야 어디 논다니와 아가씨를 구별할 수가 있던가) 망토를 잡수시고 비를 맞고 서 있겠지.","슬근슬근 가까이 가서 인력거 타시랍시요 하고 손가방을 받으랴니까 내 손을 탁 뿌리치고 홱 돌아서더니만 ‘왜 남을 이렇게 귀찮게 굴어!’ 그 소리야말로 꾀꼬리 소리지, 허허!”"]],[["김첨지는 교묘하게도 정말 꾀꼬리 같은 소리를 내었다.","모든 사람은 일시에 웃었다."],["“빌어먹을 깍쟁이 같은 년, 누가 저를 어쩌나, ‘왜 남을 귀찮게 굴어!’ 어이구 소리가 처신도 없지, 허허.”"],["웃음 소리들은 높아졌다.","그러나 그 웃음 소리들이 사라도 지기 전에 김첨지는 훌쩍훌쩍 울기 시작하였다."]],[["치삼은 어이없이 주정뱅이를 바라보며,"],["“금방 웃고 지랄을 하더니 우는 건 또 무슨 일인가.”"],["김첨지는 연해 코를 들이마시며,"],["“우리 마누라가 죽었다네.”"],["“뭐, 마누라가 죽다니, 언제?”"]],[["“이놈아 언제는, 오늘이지.”"],["“엣기 미친놈, 거짓말 말아.”"],["“거짓말은 왜, 참말로 죽었어, 참말로…… 마누라 시체를 집에 뻐들쳐 놓고 내가 술을 먹다니, 내가 죽일 놈이야, 죽일 놈이야.”"],["하고 김첨지는 엉엉 소리를 내어 운다."]],[["치삼은 흥이 조금 깨어지는 얼굴로,"],["“원 이 사람이, 참말을 하나 거짓말을 하나. 그러면 집으로 가세, 가.” 하고 우는 이의 팔을 잡아당기었다."],["치삼의 끄는 손을 뿌리치더니 김첨지는 눈물이 글썽글썽한 눈으로 싱그레웃는다."],["“죽기는 누가 죽어.”"]],[["하고 득의가 양양."],["“죽기는 왜 죽어, 생때같이 살아만 있단다. 그 오라질 년이 밥을 죽이지. 인제 나한테 속았다.”"],["하고 어린애 모양으로 손뼉을 치며 웃는다."],["“이 사람이 정말 미쳤단 말인가. 나도 아주먼네가 앓는단 말은 들었는데.”"]],[["하고 치삼이도 어느 불안을 느끼는 듯이 김첨지에게 또 돌아가라고 권하였다."],["“안 죽었어, 안 죽었대도 그래.”"],["김첨지는 화증을 내며 확신 있게 소리를 질렀으되 그 소리엔 안 죽은 것을믿으려고 애쓰는 가락이 있었다.","기어이 일 원 어치를 채워서 곱배기 한 잔씩 더 먹고 나왔다.","궂은비는 의연히 추적추적 내린다."]],[["김첨지는 취중에도 설렁탕을 사가지고 집에 다다랐다.","집이라 해도 물론셋집이요 또 집 전체를 세든 게 아니라 안과 뚝 떨어진 행랑방 한 간을 빌려 든 것인데 물을 길어 대고 한 달에 일 원씩 내는 터이다.","만일 김첨지가주기를 띠지 않았던들 한 발을 대문에 들여놓았을 제 그곳을 지배하는 무시무시한 정적(靜寂) ― 폭풍우가 지나간 뒤의 바다 같은 정적이 다리가 떨렸으리라.","쿨룩거리는 기침 소리도 들을 수 없다.","그르렁거리는 숨소리조차들을 수 없다.","다만 이 무덤 같은 침묵을 깨뜨리는 ― 깨뜨린다느니보다 한층 더 침묵을 깊게 하고 불길하게 하는 빡빡 하는 그윽한 소리, 어린애의젖 빠는 소리가 날 뿐이다."]],[["만일 청각(聽覺)이 예민한 이 같으면 그 빡빡 소리는 빨 따름이요, 꿀떡꿀떡 하고 젖 넘어가는 소리가 없으니 빈 젖을 빤다는 것도 짐작할는지 모르리라."],["혹은 김첨지도 이 불길한 침묵을 짐작했는지도 모른다.","그렇지 않으면 대문에 들어서자마자 전에 없이,"],["“이 난장맞을 년, 남편이 들어오는데 나와 보지도 않아, 이 오라질 년.” 이라고 고함을 친 게 수상하다."]],[["이 고함이야말로 제 몸을 엄습해 오는 무시무시한 증을 쫓아 버리려는 허장성세인 까닭이다."],["하여간 김첨지는 방문을 왈칵 열었다.","구역을 나게 하는 추기 ― 떨어진삿자리 밑에서 나온 먼지내 빨지 않은 기저귀에서 나는 똥내와 오줌내 가지각색 때가 켜켜이 앉은 옷내 병인의 땀 썩은 내가 섞인 추기가 무딘 김첨지의 코를 찔렀다."],["방 안에 들어서며 설렁탕을 한구석에 놓을 사이도 없이 주정꾼은 목청을있는 대로 다 내어 호통을 쳤다."]],[["“이런 오라질 년, 주야장천 누워만 있으면 제일이야. 남편이 와도 일어나지를 못해.”"],["라는 소리와 함께 발길로 누운 이의 다리를 몹시 찼다.","그러나 발길에 채이는 건 사람의 살이 아니고 나무등걸과 같은 느낌이 있었다.","이때에 빽빽 소리가 응아 소리로 변하였다.","개똥이가 물었던 젖을 빼어 놓고 운다.","운대도온 얼굴을 찡그려 붙여서 운다는 표정을 할 뿐이다.","응아 소리도 입에서 나는 게 아니고 마치 뱃속에서 나는 듯하였다."]],[["울다가 울다가 목도 잠겼고 또 울 기운조차 시진한 것 같다."],["발로 차도 그 보람이 없는 걸 보자 남편은 아내의 머리맡으로 달려들어 그야말로 까치집 같은 환자의 머리를 꺼들어 흔들며,"],["“이년아, 말을 해, 말을! 입이 붙었어, 이 오라질 년!”"],["“……”"]],[["“으응, 이것 봐, 아무 말이 없네.”"],["“……”"],["“이년아, 죽었단 말이냐, 왜 말이 없어.”"],["“……”"],["“으응, 또 대답이 없네. 정말 죽었나 버이.”"]],[["이러다가 누운 이의 흰 창을 덮은 위로 치뜬 눈을 알아보자마자,"],["“이 눈깔! 이 눈깔! 왜 나를 바라보지 못하고 천장만 보느냐, 응.”"],["하는 말 끝엔 목이 메였다.","그러자 산 사람의 눈에서 떨어진 닭의 똥 같은 눈물이 죽은 이의 뻣뻣한 얼굴을 어룽어룽 적시었다.","문득 김첨지는 미친 듯이 제 얼굴을 죽은 이의 얼굴에 한데 비비대며 중얼거렸다."]],[["“설렁탕을 사다 놓았는데 왜 먹지를 못하니, 왜 먹지를 못하니…… 괴상하게도 오늘은! 운수가, 좋더니만…….”"]]]};

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 독서 프로필 생성</title>
<style>
:root{--bg:#F1E4CC;--card:#F8F0E0;--ink:#2E2530;--sub:#6B5E6B;--pri:#7A637A;--onpri:#F8F0E0;--sec:#788165;--line:#D9C9AA;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241D26;--card:#302833;--ink:#F1E4CC;--sub:#B9AAB4;--pri:#A58CA5;--onpri:#241D26;--sec:#9AA384;--line:#4A3F4D}}
:root[data-theme="dark"]{--bg:#241D26;--card:#302833;--ink:#F1E4CC;--sub:#B9AAB4;--pri:#A58CA5;--onpri:#241D26;--sec:#9AA384;--line:#4A3F4D}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:Pretendard,"Pretendard Variable","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.55;display:flex;justify-content:center;min-height:100vh}
.app{width:100%;max-width:430px;padding:28px 24px 32px;display:flex;flex-direction:column;min-height:100vh}
.bar{display:flex;gap:6px;margin-bottom:36px}
.bar i{flex:1;height:4px;background:var(--line);border-radius:2px;transition:background .25s}
.bar i.on{background:var(--pri)}
h1{font-size:26px;line-height:1.35;font-weight:700;letter-spacing:-.02em}
.hint{color:var(--sub);font-size:14px;margin-top:8px}
.opts{margin-top:28px;display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--sec);outline-offset:2px}
.opt .mk{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);flex:none;position:relative}
.opt[aria-pressed="true"]{border-color:var(--pri);background:var(--card)}
.opt[aria-pressed="true"] .mk{border-color:var(--pri);background:var(--pri)}
.opt[aria-pressed="true"] .mk::after{content:"";position:absolute;left:6px;top:2.5px;width:5px;height:10px;border:solid var(--onpri);border-width:0 2px 2px 0;transform:rotate(45deg)}
.opt small{display:block;color:var(--sub);font-size:13px}
.foot{margin-top:auto;padding-top:28px;display:flex;gap:10px}
.btn{font:inherit;font-size:16px;font-weight:600;border-radius:14px;padding:16px;cursor:pointer;border:1.5px solid var(--pri);background:var(--pri);color:var(--onpri);flex:1}
.btn.ghost{background:transparent;color:var(--pri);flex:0 0 96px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.center{margin:auto 0;text-align:center}
.ring{width:56px;height:56px;margin:0 auto 24px;border:4px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ring{animation:none;border-top-color:var(--line);border-right-color:var(--pri)}}
.prof{background:var(--pri);color:var(--onpri);border-radius:20px;padding:28px 24px;margin-top:24px}
.prof p{font-size:14px;opacity:.85}
.prof h2{font-size:28px;line-height:1.3;margin:10px 0 6px;letter-spacing:-.02em}
.sec{margin-top:26px}
.sec h3{font-size:14px;color:var(--sub);font-weight:600;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--sec);color:var(--sec);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600}
.prof .chips{margin-top:16px}.prof .chip{border-color:var(--onpri);color:var(--onpri)}
.ax{margin-top:18px;background:var(--card);border-radius:16px;padding:18px}
.ax .lb{display:flex;justify-content:space-between;font-size:13px;color:var(--sub)}
.ax .lb b{color:var(--pri)}
.trk{position:relative;height:6px;background:var(--line);border-radius:3px;margin:12px 9px 16px}
.trk::before{content:"";position:absolute;left:50%;top:-3px;width:2px;height:12px;background:var(--sub);opacity:.4}
.trk i{position:absolute;top:-6px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--pri);border:3px solid var(--card)}
.ax h4{font-size:16px;margin-bottom:4px}
.ax p{font-size:14px;color:var(--sub)}
.hm{padding:0 0 96px}
.hd{display:flex;align-items:center;gap:2px;padding:14px 12px 4px 16px}
.nick{font-size:19px;font-weight:700;margin-right:auto}
.ib{background:none;border:0;color:var(--ink);width:40px;height:40px;display:grid;place-items:center;cursor:pointer;border-radius:50%}
.ib:focus-visible,.tab button:focus-visible,.hb:focus-visible{outline:3px solid var(--sec)}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.blk{padding:0 20px;margin-top:22px}
.box{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px}
.tr{display:flex;justify-content:space-between;align-items:center;color:var(--sub)}
.tr b,.sh h3{font-size:16px;color:var(--ink)}
.tr .ic{width:18px;height:18px}
.days{display:flex;justify-content:space-between;margin:14px 2px 10px}
.dy{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--sub);position:relative}
.dy.dn{background:var(--pri);border-color:var(--pri);color:var(--onpri)}
.dy.td{border-color:var(--pri);color:var(--pri)}
.dy.td::after{content:"";position:absolute;bottom:-11px;left:50%;margin-left:-5px;border:5px solid transparent;border-top:0;border-bottom:6px solid var(--pri)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .box{display:flex;flex-direction:column;gap:10px;min-width:0}
.img{flex:1;min-height:80px;border-radius:12px;background:var(--sec)}
.mini{display:flex;gap:10px;align-items:center}
.mc{width:40px;height:54px;border-radius:6px;background:var(--pri);flex:none}
.mt{font-size:14px;font-weight:600;line-height:1.35}
.pg{height:6px;border-radius:3px;background:var(--line)}
.pg i{display:block;height:100%;width:12%;background:var(--sec);border-radius:3px}
.pn{font-size:12px;color:var(--sub)}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;color:var(--sub)}
.sh .ic{width:18px;height:18px}
.hs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:0 20px 4px;scrollbar-width:none}
.hs>*{scroll-snap-align:start;flex:none}
.bk{width:152px}
.cv{aspect-ratio:3/4;border-radius:10px;position:relative}
.cv::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:2px;background:rgba(248,240,224,.35)}
.hb{position:absolute;right:8px;bottom:8px;width:34px;height:34px;border-radius:50%;border:0;background:var(--card);color:var(--pri);display:grid;place-items:center;cursor:pointer}
.hb .ic{width:18px}.hb[aria-pressed="true"] .ic{fill:var(--pri)}
.bk .t{font-size:14px;font-weight:600;margin-top:8px}
.bk .a{font-size:12px;color:var(--sub)}
.rdr{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--sub)}
.av{display:flex}.av i{width:22px;height:22px;border-radius:50%;border:2px solid var(--bg);margin-left:-7px}.av i:first-child{margin-left:0}
.mate{width:108px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center}
.mate .p{width:52px;height:52px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;color:#F8F0E0;font-weight:700;font-size:18px}
.mate b{font-size:14px;display:block}.mate small{font-size:11px;color:var(--sub);display:block;margin-top:4px}.mate em{font-style:normal;font-weight:700;color:var(--sec);font-size:14px}
.tab{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--card);border-top:1.5px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.tab button{white-space:nowrap;background:none;border:0;font:inherit;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px;cursor:pointer;border-radius:12px}
.tab button[aria-current="page"]{color:var(--pri);font-weight:700}
.rd{padding:0 0 150px;min-height:100vh;background:var(--bg);color:var(--ink);--fs:18px}
.rd.night{--bg:#241D26;--card:#302833;--ink:#F1E4CC;--sub:#B9AAB4;--pri:#A58CA5;--onpri:#241D26;--sec:#9AA384;--line:#4A3F4D}
.rh{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:4px;padding:10px 8px;background:var(--bg);border-bottom:1.5px solid var(--line)}
.rh h2{flex:1;font-size:16px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stk{display:flex;background:none;border:0;cursor:pointer;padding:4px}
.stk i{width:26px;height:26px;border-radius:50%;border:2px solid var(--bg);margin-left:-8px;display:grid;place-items:center;font-size:11px;font-style:normal;color:#F8F0E0;font-weight:700}
.stk i:first-child{margin-left:0}.stk i.add{background:var(--card);color:var(--pri);border:1.5px dashed var(--pri)}
.stk .ic{width:14px;height:14px}
.mn{position:absolute;right:10px;top:58px;z-index:6;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:6px;display:none;gap:2px}
.mn.on{display:flex}
.mn button{background:none;border:0;font:inherit;font-size:12px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 12px;cursor:pointer}
#hn{display:none;position:sticky;top:64px;z-index:4;margin:8px auto 0;width:max-content;max-width:90%;background:var(--pri);color:var(--onpri);font-size:13px;padding:6px 14px;border-radius:999px}
#hn.on{display:block}
.txt{padding:24px 48px 0 24px;font-size:var(--fs);line-height:1.9}
.pp{position:relative;margin-bottom:1.3em}
.pd{position:absolute;right:-30px;top:4px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-style:normal;color:#F8F0E0;font-weight:700}
.s.cm{background:rgba(122,99,122,.22);border-radius:3px}
.s.ud{text-decoration:underline;text-decoration-color:var(--pri);text-decoration-thickness:2px;text-underline-offset:4px}
.nm{font-weight:700;cursor:pointer;user-select:none;-webkit-touch-callout:none}
.ct{font:inherit;font-size:11px;background:var(--card);color:var(--pri);border:1.5px solid var(--pri);border-radius:8px;padding:0 6px;margin-left:4px;cursor:pointer;line-height:1.6;vertical-align:middle}
.ct.me{color:var(--sec);border-color:var(--sec)}
.sk{width:16px;height:16px;color:var(--sec);vertical-align:-3px}
.fx{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:430px;bottom:calc(92px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:flex-end;padding:0 16px;pointer-events:none;z-index:3}
.fx>*{pointer-events:auto}
.col{display:flex;flex-direction:column;gap:12px;align-items:center}
.fb{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--pri);background:var(--card);color:var(--pri);display:grid;place-items:center;cursor:pointer}
.fb.on{background:var(--pri);color:var(--onpri)}
.tl{display:none;flex-direction:column;gap:10px;align-items:flex-end;margin-bottom:12px}
.tl.on{display:flex}
.tb{display:flex;align-items:center;gap:8px;background:none;border:0;font:inherit;font-size:12px;color:var(--ink);cursor:pointer}
.tb .fb{width:42px;height:42px}
.zen .rh,.zen .prg,.zen .hide,.zen #hn{display:none}.zen .zb{opacity:.45}
.prg{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--bg);border-top:1.5px solid var(--line);padding:22px 20px calc(12px + env(safe-area-inset-bottom,0px));z-index:3}
.pr{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--sub)}
.tk{position:relative;flex:1;height:6px;border-radius:3px;background:var(--line)}
.tk i{position:absolute;left:0;top:0;bottom:0;background:var(--sec);border-radius:3px}
.rb{position:absolute;top:-17px;width:16px;height:16px;margin-left:-8px;border:0;padding:0;background:none;cursor:pointer}
.rb::before{content:"";position:absolute;left:3px;top:0;width:10px;height:14px;background:var(--pri);clip-path:polygon(0 0,100% 0,100% 100%,50% 70%,0 100%)}
.pc{text-align:center;font-size:12px;color:var(--sub);margin-top:6px}
#ov{position:fixed;inset:0;display:none;z-index:8}#ov.on{display:block}
#sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;background:var(--card);border:1.5px solid var(--line);border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));z-index:9;display:none;color:var(--ink)}
#sheet.on{display:block}
#sheet .cl{margin-top:12px;width:100%;flex:none}
.sg{margin-bottom:16px}.sg b{display:block;font-size:14px;margin-bottom:8px}.sg div{display:flex;gap:8px}
.sg button{flex:1;font:inherit;font-size:14px;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:none;color:var(--ink);cursor:pointer}
.sg button[aria-pressed="true"]{border-color:var(--pri);background:var(--pri);color:var(--onpri)}
.sm{font-size:15px;line-height:1.6;margin-bottom:8px}
.who{display:flex;align-items:center;gap:10px;font-weight:700;margin-bottom:8px}
.who i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#F8F0E0;font-style:normal;font-size:13px}
#sheet input,#sheet textarea{width:100%;font:inherit;font-size:16px;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.hrt{background:none;border:0;color:var(--pri);cursor:pointer;padding:4px}.hrt[aria-pressed="true"] .ic{fill:var(--pri)}

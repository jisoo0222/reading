<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 독서 프로필 생성</title>
<style>
:root{--bg:#F1E4CC;--card:#F8F0E0;--ink:#2E2530;--sub:#6B5E6B;--pri:#7A637A;--onpri:#F8F0E0;--sec:#788165;--line:#D9C9AA;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241D26;--card:#302833;--ink:#F1E4CC;--sub:#B9AAB4;--pri:#A58CA5;--onpri:#241D26;--sec:#9AA384;--line:#4A3F4D}}
:root[data-theme="dark"]{--bg:#241D26;--card:#302833;--ink:#F1E4CC;--sub:#B9AAB4;--pri:#A58CA5;--onpri:#241D26;--sec:#9AA384;--line:#4A3F4D}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:Pretendard,"Pretendard Variable","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.55;display:flex;justify-content:center;min-height:100vh}
.app{width:100%;max-width:430px;padding:28px 24px 32px;display:flex;flex-direction:column;min-height:100vh}
.bar{display:flex;gap:6px;margin-bottom:36px}
.bar i{flex:1;height:4px;background:var(--line);border-radius:2px;transition:background .25s}
.bar i.on{background:var(--pri)}
h1{font-size:26px;line-height:1.35;font-weight:700;letter-spacing:-.02em}
.hint{color:var(--sub);font-size:14px;margin-top:8px}
.opts{margin-top:28px;display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--sec);outline-offset:2px}
.opt .mk{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);flex:none;position:relative}
.opt[aria-pressed="true"]{border-color:var(--pri);background:var(--card)}
.opt[aria-pressed="true"] .mk{border-color:var(--pri);background:var(--pri)}
.opt[aria-pressed="true"] .mk::after{content:"";position:absolute;left:6px;top:2.5px;width:5px;height:10px;border:solid var(--onpri);border-width:0 2px 2px 0;transform:rotate(45deg)}
.opt small{display:block;color:var(--sub);font-size:13px}
.foot{margin-top:auto;padding-top:28px;display:flex;gap:10px}
.btn{font:inherit;font-size:16px;font-weight:600;border-radius:14px;padding:16px;cursor:pointer;border:1.5px solid var(--pri);background:var(--pri);color:var(--onpri);flex:1}
.btn.ghost{background:transparent;color:var(--pri);flex:0 0 96px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.center{margin:auto 0;text-align:center}
.ring{width:56px;height:56px;margin:0 auto 24px;border:4px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ring{animation:none;border-top-color:var(--line);border-right-color:var(--pri)}}
.prof{background:var(--pri);color:var(--onpri);border-radius:20px;padding:28px 24px;margin-top:24px}
.prof p{font-size:14px;opacity:.85}
.prof h2{font-size:28px;line-height:1.3;margin:10px 0 6px;letter-spacing:-.02em}
.sec{margin-top:26px}
.sec h3{font-size:14px;color:var(--sub);font-weight:600;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--sec);color:var(--sec);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600}
.prof .chips{margin-top:16px}.prof .chip{border-color:var(--onpri);color:var(--onpri)}
.ax{margin-top:18px;background:var(--card);border-radius:16px;padding:18px}
.ax .lb{display:flex;justify-content:space-between;font-size:13px;color:var(--sub)}
.ax .lb b{color:var(--pri)}
.trk{position:relative;height:6px;background:var(--line);border-radius:3px;margin:12px 9px 16px}
.trk::before{content:"";position:absolute;left:50%;top:-3px;width:2px;height:12px;background:var(--sub);opacity:.4}
.trk i{position:absolute;top:-6px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--pri);border:3px solid var(--card)}
.ax h4{font-size:16px;margin-bottom:4px}
.ax p{font-size:14px;color:var(--sub)}
.hm{padding:0 0 96px}
.hd{display:flex;align-items:center;gap:2px;padding:14px 12px 4px 16px}
.nick{font-size:19px;font-weight:700;margin-right:auto}
.ib{background:none;border:0;color:var(--ink);width:40px;height:40px;display:grid;place-items:center;cursor:pointer;border-radius:50%}
.ib:focus-visible,.tab button:focus-visible,.hb:focus-visible{outline:3px solid var(--sec)}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.blk{padding:0 20px;margin-top:22px}
.box{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px}
.tr{display:flex;justify-content:space-between;align-items:center;color:var(--sub)}
.tr b,.sh h3{font-size:16px;color:var(--ink)}
.tr .ic{width:18px;height:18px}
.days{display:flex;justify-content:space-between;margin:14px 2px 10px}
.dy{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--sub);position:relative}
.dy.dn{background:var(--pri);border-color:var(--pri);color:var(--onpri)}
.dy.td{border-color:var(--pri);color:var(--pri)}
.dy.td::after{content:"";position:absolute;bottom:-11px;left:50%;margin-left:-5px;border:5px solid transparent;border-top:0;border-bottom:6px solid var(--pri)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .box{display:flex;flex-direction:column;gap:10px;min-width:0}
.img{flex:1;min-height:80px;border-radius:12px;background:var(--sec)}
.mini{display:flex;gap:10px;align-items:center}
.mc{width:40px;height:54px;border-radius:6px;background:var(--pri);flex:none}
.mt{font-size:14px;font-weight:600;line-height:1.35}
.pg{height:6px;border-radius:3px;background:var(--line)}
.pg i{display:block;height:100%;width:12%;background:var(--sec);border-radius:3px}
.pn{font-size:12px;color:var(--sub)}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;color:var(--sub)}
.sh .ic{width:18px;height:18px}
.hs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:0 20px 4px;scrollbar-width:none}
.hs>*{scroll-snap-align:start;flex:none}
.bk{width:152px}
.cv{aspect-ratio:3/4;border-radius:10px;position:relative}
.cv::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:2px;background:rgba(248,240,224,.35)}
.hb{position:absolute;right:8px;bottom:8px;width:34px;height:34px;border-radius:50%;border:0;background:var(--card);color:var(--pri);display:grid;place-items:center;cursor:pointer}
.hb .ic{width:18px}.hb[aria-pressed="true"] .ic{fill:var(--pri)}
.bk .t{font-size:14px;font-weight:600;margin-top:8px}
.bk .a{font-size:12px;color:var(--sub)}
.rdr{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--sub)}
.av{display:flex}.av i{width:22px;height:22px;border-radius:50%;border:2px solid var(--bg);margin-left:-7px}.av i:first-child{margin-left:0}
.mate{width:108px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center}
.mate .p{width:52px;height:52px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;color:#F8F0E0;font-weight:700;font-size:18px}
.mate b{font-size:14px;display:block}.mate small{font-size:11px;color:var(--sub);display:block;margin-top:4px}.mate em{font-style:normal;font-weight:700;color:var(--sec);font-size:14px}
.tab{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--card);border-top:1.5px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.tab button{white-space:nowrap;background:none;border:0;font:inherit;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px;cursor:pointer;border-radius:12px}
.tab button[aria-current="page"]{color:var(--pri);font-weight:700}
.rd{padding:0 0 150px;min-height:100vh;background:var(--bg);color:var(--ink);--fs:18px}
.rd.night{--bg:#241D26;--card:#302833;--ink:#F1E4CC;--sub:#B9AAB4;--pri:#A58CA5;--onpri:#241D26;--sec:#9AA384;--line:#4A3F4D}
.rh{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:4px;padding:10px 8px;background:var(--bg);border-bottom:1.5px solid var(--line)}
.rh h2{flex:1;font-size:16px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stk{display:flex;background:none;border:0;cursor:pointer;padding:4px}
.stk i{width:26px;height:26px;border-radius:50%;border:2px solid var(--bg);margin-left:-8px;display:grid;place-items:center;font-size:11px;font-style:normal;color:#F8F0E0;font-weight:700}
.stk i:first-child{margin-left:0}.stk i.add{background:var(--card);color:var(--pri);border:1.5px dashed var(--pri)}
.stk .ic{width:14px;height:14px}
.mn{position:absolute;right:10px;top:58px;z-index:6;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:6px;display:none;gap:2px}
.mn.on{display:flex}
.mn button{background:none;border:0;font:inherit;font-size:12px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 12px;cursor:pointer}
#hn{display:none;position:sticky;top:64px;z-index:4;margin:8px auto 0;width:max-content;max-width:90%;background:var(--pri);color:var(--onpri);font-size:13px;padding:6px 14px;border-radius:999px}
#hn.on{display:block}
.txt{padding:24px 48px 0 24px;font-size:var(--fs);line-height:1.9}
.pp{position:relative;margin-bottom:1.3em}
.pd{position:absolute;right:-30px;top:4px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-style:normal;color:#F8F0E0;font-weight:700}
.s.cm{background:rgba(122,99,122,.22);border-radius:3px}
.s.ud{text-decoration:underline;text-decoration-color:var(--pri);text-decoration-thickness:2px;text-underline-offset:4px}
.nm{font-weight:700;cursor:pointer;user-select:none;-webkit-touch-callout:none}
#np{position:absolute;z-index:12;width:220px;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 6px 18px rgba(36,29,38,.18);display:none}
#np.on{display:block}
.mm{position:absolute;z-index:3;cursor:pointer}.mm>i{position:absolute;inset:0}.mm>p{position:relative;margin:0;padding:10px 12px;height:100%;overflow:hidden;font-family:Pretendard,"Pretendard Variable","Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:13px;line-height:1.5;color:#2E2530;white-space:pre-wrap;word-break:break-all}
.mm.ed{outline:1.5px dashed var(--pri);outline-offset:3px;touch-action:none;cursor:move;z-index:5}.mm .rz{position:absolute;right:-9px;bottom:-9px;width:18px;height:18px;border-radius:50%;background:var(--pri);border:2px solid var(--card);cursor:nwse-resize}
.mm .mdn{position:absolute;left:50%;top:-34px;transform:translateX(-50%);background:var(--pri);color:var(--onpri);border:0;border-radius:999px;font:inherit;font-size:12px;padding:4px 12px;cursor:pointer}
.mpk{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}.mpk button{width:48px;height:48px;display:grid;place-items:center;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;cursor:pointer;padding:0}.mpk button[aria-pressed="true"]{border-color:var(--pri);border-width:2px}.mpk i{display:block;width:70%;aspect-ratio:1}
.mpv{position:relative;height:96px;margin-bottom:12px}.mpv .mm{inset:0 18%;cursor:default}
#dlg textarea{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px;resize:none}
.mop{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--sub)}.mop input{flex:1;accent-color:var(--pri)}.mop span{width:38px;text-align:right}#np .who{margin-bottom:4px}#np p{margin:0;font-size:13px;line-height:1.55;color:var(--sub)}
.ct{font:inherit;font-size:11px;background:var(--card);color:var(--pri);border:1.5px solid var(--pri);border-radius:8px;padding:0 6px;margin-left:4px;cursor:pointer;line-height:1.6;vertical-align:middle}
.ct.me{color:var(--sec);border-color:var(--sec)}
.sk{width:16px;height:16px;color:var(--sec);vertical-align:-3px}
.fx{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:430px;bottom:calc(92px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:flex-end;padding:0 16px;pointer-events:none;z-index:3}
.fx>*{pointer-events:auto}
.col{display:flex;flex-direction:column;gap:12px;align-items:center}
.fb{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--pri);background:var(--card);color:var(--pri);display:grid;place-items:center;cursor:pointer}
.fb.on{background:var(--pri);color:var(--onpri)}
.tl{display:none;flex-direction:column;gap:10px;align-items:flex-end;margin-bottom:12px}
.tl.on{display:flex}
.tb{display:flex;align-items:center;gap:8px;background:none;border:0;font:inherit;font-size:12px;color:var(--ink);cursor:pointer}
.tb .fb{width:42px;height:42px}
.zen .rh,.zen .prg,.zen .hide,.zen #hn{display:none}.zen .zb{opacity:.45}
.prg{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--bg);border-top:1.5px solid var(--line);padding:22px 20px calc(12px + env(safe-area-inset-bottom,0px));z-index:3}
.pr{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--sub)}
.tk{position:relative;flex:1;height:6px;border-radius:3px;background:var(--line)}
.tk i{position:absolute;left:0;top:0;bottom:0;background:var(--sec);border-radius:3px}
.rb{position:absolute;top:-17px;width:16px;height:16px;margin-left:-8px;border:0;padding:0;background:none;cursor:pointer}
.rb::before{content:"";position:absolute;left:3px;top:0;width:10px;height:14px;background:var(--pri);clip-path:polygon(0 0,100% 0,100% 100%,50% 70%,0 100%)}
.pc{text-align:center;font-size:12px;color:var(--sub);margin-top:6px}
#ov{position:fixed;inset:0;display:none;z-index:8}#ov.on{display:block}
#sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;background:var(--card);border:1.5px solid var(--line);border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));z-index:9;display:none;color:var(--ink)}
#sheet.on{display:block}
#sheet .cl{margin-top:12px;width:100%;flex:none}
.sg{margin-bottom:16px}.sg b{display:block;font-size:14px;margin-bottom:8px}.sg div{display:flex;gap:8px}
.sg button{flex:1;font:inherit;font-size:14px;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:none;color:var(--ink);cursor:pointer}
.sg button[aria-pressed="true"]{border-color:var(--pri);background:var(--pri);color:var(--onpri)}
.sm{font-size:15px;line-height:1.6;margin-bottom:8px}
.who{display:flex;align-items:center;gap:10px;font-weight:700;margin-bottom:8px}
.who i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#F8F0E0;font-style:normal;font-size:13px}
#sheet input,#sheet textarea{width:100%;font:inherit;font-size:16px;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.hrt{background:none;border:0;color:var(--pri);cursor:pointer;padding:4px}.hrt[aria-pressed="true"] .ic{fill:var(--pri)}

:root{padding:0}
body{align-items:center;min-height:100dvh}
.app{width:100%;max-width:390px;height:min(100dvh,844px);min-height:0;padding:0;position:relative;overflow:hidden;display:block;background:var(--bg);color:var(--ink)}
@media(min-width:431px){.app{border:1.5px solid var(--line);border-radius:28px}}
.sc{position:absolute;inset:0;overflow-y:auto;display:flex;flex-direction:column;padding:28px 24px 32px}
.sc.hm{padding:0 0 96px;display:block}
.sc.rdc{padding:0;overflow:hidden}
.tab,.prg,.fx,#sheet{position:absolute;left:0;right:0;transform:none;max-width:none;width:auto}

#hn{position:absolute;top:68px;left:50%;transform:translateX(-50%);margin:0}
.rh{position:relative;flex:none}
.bkw{flex:1;position:relative;perspective:1400px;margin-bottom:98px}
.zen .bkw{margin-bottom:0}

.leaf{transform-origin:left center;z-index:2}
.leaf.flip{box-shadow:10px 0 24px rgba(0,0,0,.25)}
.fol{position:absolute;bottom:20px;left:0;right:0;text-align:center;font-size:13px;color:var(--sub)}
.crn{position:absolute;top:0;right:24px;width:14px;height:26px;background:var(--pri);clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%)}
.zen .pgl{inset:14px 10px;background:var(--card);border:1.5px solid var(--line);border-radius:6px;text-align:justify;padding:32px 26px 56px}
.zen .ct{display:none}.zen .s.cm{background:none}
.zen .nm{color:inherit!important;font-weight:400}
.tk{margin-bottom:30px}
.th{position:absolute;top:-3px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--pri);border:2px solid var(--bg)}
.md{position:absolute;top:14px;width:20px;height:20px;margin-left:-10px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-style:normal;color:#F8F0E0;font-weight:700;border:2px solid var(--bg)}

html,body{height:100%;overflow:hidden}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}

.box{padding:12px}
.days{margin:10px 2px 6px}.dy{width:34px;height:34px}

.sh{margin-bottom:10px}
.hs{margin:0 calc(var(--px)*-1);padding:0 var(--px) 2px}

.dl{background:none;border:0;color:var(--sub);font:inherit;font-size:13px;cursor:pointer}

var BD={"4":[[["백치(白痴) 아다다"],["질그릇이 땅에 부딪치는 소리가 났다고 들렸는데, 마당에는 아무도 없다."],["부엌에 쥐가 들었나?","샛문을 열어 보려니까,"],["“아 아 아이 아아 아야!”"],["하는 소리가 뒤란 곁으로 들려온다.","샛문을 열려던 박씨는 뒷문을 밀었다."]],[["장독대 밑.","비스듬한 켠 아래, 아다다가 입을 헤벌리고 납작하니 엎뎌져두 다리만을 힘없이 버지럭거리고 있다.","그리고 머리 편으로 한발쯤 나가선깨어진 동이 조각이 질서 없이 너저분하게 된장 속에 묻혀 있다."],["“아이구테나! 무슨 소린가 했더니 이년이 동애를 또 잡았구나! 이년아! 너더러 된장 푸래든 푸래?”"],["어머니는 딸이 어딘가 다쳤는지 일어나지도 못하고 아파하는 데 가는 동정심보다 깨어진 동이만이 아깝게 눈에 보였던 것이다."]],[["“어 어마! 아다아다 아다 아다아다…….”"],["모닥불을 뒤집어쓰는 듯한 끔찍한 어머니의 음성을 또다시 듣게 되는 아다다는 겁에 질려 얼굴에 시퍼런 물이 들며 넘어진 연유를 말하여 용서를빌려는 기색이나 말이 되지를 않아 안타까워한다."],["아다다는 벙어리였던 것이다.","말을 하렬 때에는 한다는 것이 아다다 소리 만이 연거푸 나왔다.","어찌어찌 가다가 말이 한 마디씩 제법 되어 나오는 적도 있었으나 그것은 쉬운 말에 그치고 만다."]],[["그래서, 이것을 조롱 삼아 확실이라는 뚜렷한 이름이 있음에도 불구하고, 누구나 그를 부르는 이름은 아다다였다.","그리하여 이것이 자연히 이름으로굳어져, 그 부모네까지도 그렇게 부르게 되었거니와, 그 자신조차도 “아다다!” 하고 부르면 마땅히 들을 이름인 듯이 대답을 했다."],["“이년까타나 끌이 세누나! 시켠엘 못 가갔으문 오늘은 어드메든디 나가서 뒈디고 말아라, 이년아! 이년아!”"]],[["어머니는 눈알을 가로세워 날카롭게도 흰자위만으로 흘기며 성큼 문턱을넘어선다."],["아다다는 어머니의 손길이 또 자기의 끌채를 감아쥘 것을 연상하고 몸을 겨우 뒤재비꼬아 일어서서 절룩절룩 굴뚝 모퉁이로 피해 가며 어쩔 줄을 모르고 일변 고개를 좌우로 둘러살피며 아연하게도,"],["“아다 어 어마! 아다 어마! 아다다다다다!”"]],[["하고 부르짖는다.","다시는 일을 아니 저지르겠다는 듯이, 그리고 한번만용서를 하여 달라는 듯싶게."],["그러나, 사정 모르는 체 기어코 쫓아간 어머니는,"],["“이년! 어서 뒈데라. 뒈디기 싫건 시집으루 당당 가가라. 못 가간……?”"],["그리고 주먹을 귀 뒤에 넌지시 얼메고 마주선다."]],[["순간, 주먹이 떨어지면?","하는 두려운 생각에 오싹하고 끼치는 소름이 튀해논 닭같이 전신에 돋아나는 두드러기를 느끼는 찰나, ‘턱’ 하고 마침내 떨어지는 주먹은 어느새 끌채를 감아쥐고 갈짓자로 흔들어댄다."],["“아다 어어 어마! 아 아고 어 어마!”"],["아다다는 떨며 빌며 손을 몬다."]],[["그러나 소용이 없다.","한 번 손을 댄 어머니는 그저 죽어 싸다는 듯이 자꾸만 흔들어 댄다.","하니, 그렇지 않아도 가꾸지 못한 텁수룩한 머리는 물결처럼 흔들리며 구름같이 피어나선 얼크러진다."],["그래도, 아다다는 그저 빌 뿐이요, 조금도 반항하려고는 않는다.","이런 일은 거의 날마다 지내보는 것이기 때문에 한대야 그것은 도리어 매까지 사는 것이 됨을 아는 것이다.","집의 일이 아무리 꼬여 돌아가더라도 나 모르는 체 손 싸매고 들어앉았으면 오히려 이런 봉변은 아니 당할 것이, 가만히 앉았지는 못했다."]],[["선천적으로 타고난 천치에 가까운 그의 성격은 무엇엔지 힘에 부치는 노력이 있어야 만족을 얻는 듯했다.","시키건, 안 시키건, 헐하나, 힘차나, 가리는 법이 없이 하여야 될 일로 눈에 띄기만 하면 몸을 아끼는 일이 없이하는 것이 그였다.","그래서 집안의 모든 고된 일은 실로 아다다가 혼자서 치워놓게 된다."],["그러나 어머니는 그것이 반갑지 않았다.","둔한 지혜로 차부 없이 뼈가 부러지도록 몸을 돌보지 않고, 일종 모험에 가까운 짓을 하게 되므로,"]],[["그 반면에 따르는 실수가 되려 일을 저질러 놓게 되어 그릇 같은 것을 깨쳐먹는일은 거의 날마다 있다 하여도 옳을 정도로 있었다."],["그래도, 아다다의 힘을 빌지 않고는 집안 일을 못 치겠다면 모르지만, 그는 참례를 하지 않아도 행랑에서 차근차근히 다 해줄 일을 쓸데없이 가로맡아선 일을 저질러 놓고 마는 데 그 어머니는 속이 상했다."]],[["본시 시집을 보내기 전에도 그 버릇은 지금이나 다름이 없어, 벙어리인데다 행동까지 그러하였으므로 내용 아는 인근에서는 그를 얻어 가려는 사람이 없었다.","그리하여, 열아홉 고개를 넘기도록 처묻어 두고 속을 태우다못해 깃부로 논 한 섬지기를 처넣어 똥 치듯 치워버렸던 것이 그만 오 년이머다 다시 쫓겨와 시집에는 아예 갈 생각도 아니하고 하루 같은 심화를 올렸다.","그래서, 어머니는 역겨운 마음에 아다다가 실수를 할 때마다 주릿대를 내리고 참례를 마라건만 그는 참는다는 것이 그 당시뿐이요, 남이 일을하는 것을 보면 속이 쏘는 듯이 슬그니 나와서 곁을 슬슬 돌다가는 손을 대고 만다."]],[["바로 사흘 전엔가도 무명을 할 때 활짝 달은 솥뚜껑을 차부 없이 맨손으로 열다가 뜨거움을 참지 못해 되는대로 집어엎는 바람에 그만 자배기를 깨쳐서 욕과 매를 한모태 겪고 났었건만 어제 저녁 행랑 색시더러 오늘은 묵은 된장을 옮겨 담아야 되겠다고 이르는 말을 어느 겨를에 들었던지 아다다는 아침밥이 끝나자 어느새 나가서 혼자 된장을 퍼 나르다가 그만 또 실수를 한 것이었다."],["“못 가간? 시집이! 못 가간? 이년! 못 가갔음 죽어라!”"]],[["붙잡았던 머리를 힘차게 휙 두르며 밀치는 바람에 손에 감겼던 머리카락이 끊어지는지 빠지는지 무뚝 묻어나며 아다다는 비칠비칠 서너걸음 물러난다."],["순간, 어찔해진 아다다는 넘어지지 않으려고 애써 버지럭거리며 삐치는다리에 겨우 진정을 얻어세우자,"],["“아다 어마! 아다 어마! 아다 아다!”"]],[["하고, 다시 달려들 듯이 눈을 흘기고 섰는 어머니를 향하여 눈물 글썽한눈을 끔벅 한 번 감아 보이고, 그리고 북쪽을 손가락질하여, 어머니의 말대로 시집으로 가든지 그렇지 않으면 죽어라도 버리겠다는 뜻으로 고개를 주억이며 겁에 질려 어쩔 줄을 모르고 허청허청 대문 밖으로 몸을 이끌어냈다."],["나오기는 나왔으나, 갈 곳이 없는 아다다는 마당귀를 돌아서선 발길을 더내놓지 못하고 우뚝 섰다."]],[["시집으로 간다고는 하였으나, 아무리 생각해도 남편의 매는 어머니의 그것보다 무섭다.","그러면 다시 집으로 들어가나?","이번에는 외상 없는 매가 떨어질 것 같다.","어디로 가야 하나?","갈 곳 없는 갈 곳을 짜보니 눈물이 주는위로밖에 쓸데없는 오 년 전 그 시집이 참을 수 없이 그립다."],["- 추울세라, 더울세라, 힘이 들까, 고단할까.","알뜰살뜰히 어루만져 주던시부모, 밤이면 품속에 꼭 껴안아 피로를 풀어 주던 남편."]],[["아, 얼마나 시집에서는 자기를 위하여 정성을 다하던 것인고?"],["참으로 아다다가 처음 시집을 가서의 오 년 동안은 온 집안의 사랑을 한몸에 받아왔던 것이 사실이다."],["벙어리라는 조건이 귀에 들어맞는 것은 아니었으나, 돈으로 아내를 사지 아니하고는 얻어볼 수 없는 처지에서 스물여덟 살에 아직 장가를 못 들고 있는 신세로 목구멍조차 치기 어려운 형세이었으므로 아내를 얻게 되기의여유를 기다리기까지에는 너무도 막연한 앞날이었다."]],[["벙어리이나 일생을 먹여줄 것까지 가지고 온다는 데 귀가 번쩍 띄어 그 자리를 앗길까 두렵게 혼사를 지었던 것이니, 그로 의해서 먹고 살게 되는 시집에서는 아다다를 아니 위할 수가 없었던 것이다.","그러한 가운데 또한 아다다는 못하는 일이 없이 일 잘하고, 고분고분 말 잘 듣고, 조금도 말썽을 부리는 일이 없었다.","그래서 생활고가 주는 역겨움이 쓸데없이 서로 눈독을 짓게 하여 불쾌한 말 만으로 큰소리가 끊일 새 없이 오고 가던 가족은 일시에 봄비를 맞는 동산같이 화락의 웃음에 꽃이 피었다."]],[["원래, 바른 사람이 못 되는 아다다에게는 실수가 없는 것이 아니었으나, 그로 의해서 밥을 먹게 되는 시집에서는 조금도 역겹게 안 여겼고, 되레 위로를 하고 허물을 감추기에 서로 힘을 썼다."],["여기에 아다다가 비로소 인생의 행복을 느끼며 시집가기 전 지난날 어머니 아버지가 쓸데없는 자식이라는 구실 밑에, 아니, 되레 가문을 더럽히는앙화(殃禍) 자식이라고 사람으로서의 푼수에도 넣어 주지 않고 박대하던 일을 생각하고는 어머니 아버지를 원망하는 나머지 명절목이나 제향 때이면시집에서는 그렇게도 가 보라는 친정이었건만 이를 악물고 가지 않고 행복속에 묻혀 살던 지나간 그날이 아니 그리울 수가 없을 게다."]],[["그러나, 그날은 안타깝게도 다시 못 올 영원한 꿈속에 흘러가고 말았다."],["해를 거듭하며 생활의 밑바닥에 깔아 놓았던 한 섬지기라는 거름이 차츰그들을 여유한 생활로 이끌어, 몇 백 원이란 돈이 눈앞에 굴게 되니 까닭없이 남편 되는 사람은 벙어리로서의 아내가 미워졌다."],["조그만 실수가 있어도 눈을 흘겼다.","그리고 매를 내렸다.","이 사실을 아는 아버지는 그것은 들어오는 복을 차 버리는 짓이라고 타이르나, 듣지 않았다."]],[["그리하여, 부자간에 충돌이 때때로 일어났다.","이럴 때마다 아버지에게는 감히 하고 싶은 행동을 못 하는 아들은 그 분을 아내에게로 돌려 풀기가일쑤였다."],["“이년 보기 싫다! 네 집으루 가거라.”"],["그리고, 다음에 따르는 것은 매였다.","그러나, 아다다는 참아가며 아내로서의, 그리고 며느리로서의 임무를 다했다."]],[["이것이 시부모로 하여금 더욱 아다다를 귀엽게 만드는 것이어서, 아버지에게서는 움직일 수 없는 며느리인 것을 깨닫게 된 아들은 가정적으로 불만을 느끼게 되어 한 해의 농사를 지은 추수를 온통 팔아가지고 집을 떠나 마음의 위안을 찾아 주색에 돈을 다 탕진하고 물거품같이 밀려 돌다가 동무들과 짝지어 안동현(安東縣)으로 건너갔다."],["그리하여, 이 투기적인 도시에 무젖어 노동의 힘으로 본전을 얻어선 ‘양화’ 와 ‘은떼루’ 에 투기하여 황금을 꿈꾸어 오던 것이 기적적으로 맞아나기 시작하여 이태 만에는 2 만 원에 가까운 돈을 손에 쥐고 완전한 아내로서의 알뜰한 사랑에 주렸던 그는 돈에 따르는 무수한 여자 가운데서 마음대로흡족히 골라가지고 집으로 돌아왔다."]],[["그리고는, 새로운 살림을 꿈꾸는 일변 새로이 가옥을 건축함과 동시에 아다다를 학대함이 전에 비할 정도가 아니었다.","이에는, 그 아버지도 명민하고 인자한 남부끄럽지 않는 뻐젓한 새 며느리에게 마음이 쏠리는 나머지 이미 생활은 걱정이 없이 되었으니 아다다의 깃부로서가 아니라도 유족한 앞날의 생활을 내다볼 때 아들로서의 아다다에게 대하는 태도는 소모도 마음에 거슬리는 것이 없었다.","그리하여, 시부모의 눈에서까지 벗어나게 된 아다다는 호소할 곳조차 없는 사정에 눈감은 남편의 매를 견디다 못해 집으로쫓겨오게 되었던 것이니, 생각만 하여도 옛 매 자리가 아픈 그 시집은 죽으면 죽었지 다시는 찾아갈 생각이 없었던 것이다."]],[["그래서, 집에 있게 되니 그것보다는 좀 헐할망정, 어머니의 매도 결코 견디기에 족한 것이 아니다.","그리고, 그것은 날마다 더 심해만 왔다.","오늘도조금만 반항이 있었던들, 어김없이 매는 떨어지고 말았을 것이다."],["그러나, 어디로 가나?","아무리 생각을 해 보아야 그저 이 세상에서는 수롱이네 집밖에 또 찾아갈 곳은 없었다."],["수롱은 부모 동생조차 없는 삼십이 넘은 총각으로, 누구보다도 자기를 사랑하여 준다고 믿는 단 한 사람이었다."]],[["그리하여 쫓기어날 때마다 그를 찾아가선 마음의 위안을 얻어 오던 것이다."],["아다다는 문득 발걸음을 떼어 아지랑이 얼른거리는 마을 끝 산턱아래 떨어져 박힌 한 채의 오막살이를 향하여 마당귀를 꺾어돌았다."],["수롱은 벌써 일 년 전부터 아다다를 꾀어 왔다.","시집에서까지 쫓겨난 벙어리였으나, 김초시의 딸이라, 스스로도 낮추 보여지는 자신으로서는 거연히 염을 내지 못하고 뜻 있는 마음을 속으로 꾸여 가며 눈치를 보여 오던 것이, 눈치에서보다는 베풀어진 동정이 마침내, 아다다의 마음을 사게 된 것이었다."]],[["아이들은 아다다를 보기만 하면 따라다니며 놀렸다.","아니, 어른들까지도“아다다, 아다다” 하고, 골을 올려서 분하나, 말을 못 하고 이상한 시늉을 하며 두덜거리는 것을 봄으로 행복을 느끼는 듯이 손뼉을 치며 웃었다."],["그래서, 아다다는 사람을 싫어하였다.","집에 있으면 어머니의 욕과 매, 밖에 나오면 뭇 사람들의 놀림, 그러나 수롱이만은 자기를 사랑하는 것이었다.","아이들이 따라다닐 때에도 남 아니 말려 주는 것을 그는 말려 주고, 그리고, 애에 터질 듯한 심정을 풀어 주는 것이었다."]],[["그리하여, 아다다는 마음이 불편할 때마다 수롱을 생각해 오던 것이, 얼마 전부터는 찾아다니게까지 되어 동네의 눈치에도 어느덧 오른지 오랬다."],["그러나, 아다다의 집에서도 그 아버지만이 지체를 가지기 위하여 깔맵게아다다의 행동을 경계하는 듯하고, 그 어머니는 도리어 수롱이와 배가 맞아서 자기 눈앞에 보이지 아니하고, 어디로든지 달아났으면 하는 눈치를 알게 된 수롱이는 지금에 와서는 어느 정도까지 내어놓다시피 그를 사귀어 온다."]],[["아다다는 제 집이나처럼 서슴지도 않고 달리어오자마자 수롱이네 집 문을벌컥 열었다."],["“아, 아다다!”"],["수롱은 의외에 벌떡 일어섰다."],["“너 또 울었구나!”"],["울었다는 것이 창피하긴 하였으나, 숨길 차비가 아니다."]],[["호소할 길 없는가슴속에 꽉 찬 설움은 수롱이의 따뜻한 위무가 어떻게도 그리웠는지 모른다."],["방안에 들어서기가 바쁘게 쫓겨난 이유를 언제나같이 낱낱이 고했다."],["“그러기 이젠 아야, 다시는 집으루 가디 말구 나하구 둘이서 살아 응?”"],["그리고, 수롱은 의미 있는 웃음을 벙긋벙긋 웃으며 아다다의 등을 척척뚜드려 달랬다."]],[["오늘은 어떻게 해서든지 자기의 것으로 영원히 만들어 보고 싶은 욕망에 불탔던 것이다."],["그러나, 아다다는,"],["“아다 무 무서! 아바 무 무서! 아다 아다다다!”"],["하고, 그렇게 한다면 큰일난다는 듯이 눈을 둥그렇게 뜬다.","집에서 학대를 받고 있는니보다는 수롱의 사랑 밑에서 살았으면 오죽이나 행복되랴!"]],[["다시 집으로는 아니 들어가리라는 생각이 없었던 바도 아니었으나, 정작 이런 말을 듣고 보니, 무엇엔지 차마 허하지 못할 것이 있는 것 같고 그렇지 않은지라 눈을 부릅뜨고 수롱이한테 다니지 말라는 아버지의 말이 연상될 때 어떻게도 그 말은 엄한 것이었다."],["“우리 둘이 달아났음 그만이디 무섭긴 뭐이 무서워.”"],["“…….”"]],[["아다다는 대답이 없다."],["딴은 그렇기도 한 것이다.","당장 쫓기어난 몸이 갈 곳이 어딘고?","다시 생각을 더듬어볼 때 어머니의 매는 아버지의 그 눈총보다도 몇 배나 더한 두려움으로 견딜 수 없이 아픈 것이다.","먼저 한 말이 금시 후회스러웠다."],["“안 그래? 무서울 게 뭐야. 이젠 아야 가지 말구 나하구 있어 응?”"]],[["“응, 아다 이이 있어, 아다 아다.”"],["하고, 아다다는 다시 있자는 말이 나오기를 기다렸던 듯이, 그리고 살길은"],["찾기었다는 듯이, 한숨과 같이 빙긋 웃으며 있겠다는 뜻을 명백히 보이기 위하여 고개를 주억이며 삿바닥을 손으로 톡톡 뚜드려 보인다."],["“그렇지 그래, 정 있으야 되 응?”"]],[["“응, 이서 이서 아다 아다!”"],["“정말이야?”"],["“으, 응 저 정 아다 아다.”"],["단단히 강문을 받고 난 수롱이는 은근히 솟아나는 미소를 금할 길이 없었다."],["벙어리인 아다다가 흡족할 이치는 없었지만, 돈으로 사지 아니하고는 아내라는 것을 얻어 볼 수 없는 처지였다."]],[["그저 생기는 아내는 벙어리였어도족했다.","그저 일이나 도와주고 아이들, 딸이나 낳아 주었으면 자기는 게서 더 바랄 것이 없었다.","아내를 얻으려고 십여 년 동안을 불피풍우 품을 팔아궤 속에 꽁꽁 묶어둔 일백오십 원이란 돈이 지금에 와서는, 아내 하나를 얻기에 그리 부족할 것은 아니나, 장가를 들지 아니하고 아다다를 꼬여 온 이유도, 아다다를 꾐으로 돈을 남겨서, 그 돈으로 가정의 마루를 얹자는 데서였던 것이다.","이제 계획이 은근히 성공에 가까워 옴에 자기도 남과 같이 가정을 이루어 보누나하니 바라지도 못하였던 인생의 행복이 자기에게도 이제찾아오는 것 같았다."]],[["“우리 아다다.”"],["수롱이는 아다다의 등에 손을 얹으며 빙그레 웃었다."],["“아다 다다.”"],["아다다도 만족한 듯이 히쭉 입이 벌어졌다."],["그날 밤을 수롱의 품안에서 자고 난 아다다는 이미 수롱의 아내 되기에수줍음조차 잊었다."]],[["아니, 집에서 자기를 받들어 들인다 하더라도 수롱을떨어져서는 살 수 없으리만큼 마음은 굳어졌다.","수롱이가 주는 사랑은 이 세상에서는 더 찾을 수 없는 행복이리라 느끼었던 것이다."],["그러나 영원한 행복을 위하연 이 자리에 그대로 박혀서는 누릴 수 없을 것이 다음에 남은 근심이었다.","수롱이와 같이 삶에는, 첫째 아버지가 허하지 않을 것이요, 동네 사람도 부끄럽지 않은 노릇이 아니다.","이것은 수롱이도 짐짓 근심이었다."]],[["밤이 깊도록 의논을 하여 보았으나 동네를 피하여 낯모르는 곳으로 감쪽같이 달아나는 수밖에는 다른 묘책이 없었다."],["예식 없는 가약을 그들은 서로 맹세하고 그날 새벽으로 그 마을을 떠나신미도라는 섬으로 흘러가서 그곳에 안주를 정하였다.","그러나 생소한 곳이므로 직업을 찾을 길이 없었다.","고기를 잡아먹고 사는 섬이라, 뱃놀음을 하는 것이 제 길이었으나, 이것은 아다다가 한사코 말렸다.","몇 해 전에 자기 네 동네에서도 농토를 잃은 몇몇 사람이 이 섬으로 들어와 첫 배를 타다가그만 풍랑에 몰살을 당하고 만 일이 있던 것을 잊지 못하는 때문이었다."]],[["그렇지 않은지라, 수롱이조차도 배에는 마음이 없었다.","섬으로 왔다고는하지만 땅을 파서 먹는 것이 조마구 빨 때부터 길러 온 습관이요, 손 익은일이었기 때문에 그저 그 노릇만이 그리웠다."],["그리하여, 있는 돈으로 어떻게, 밭날갈이나 사서 조 같은 것이나 심어가지고 겨울의 불목이와 양식을 대게 하고 짬짬이 조개나 굴, 낙지, 이런 것들을 캐어서 그날그날을 살아갔으면 그것이 더할 수 없는 행복일 것만 같았다."]],[["그러지 않아도 삼십 반생에 자기의 소유라고는 손바닥만한 것조차 없어, 어떻게도 몽매에 그리던 땅이었는지 모른다.","완전한 아내를 사지 아니하고 아다다를 꼬여 온 것도 이 소유욕에서였다.","아내가 얻어진 이제, 비록 많지는 않은 땅이나마 가져 보고 싶은 마음도 간절하였거니와, 또는 그만한 소유를 가지는 것이 자기에게 향한 아다다의 마음을 더욱 굳게 하는 데도 보다 더한 수단일 것 같았기 때문이다."]],[["그런 데다, 본시 뱃놀음판인 섬인데, 작년에 놀구지가 잘되었다 하여 금 년에 와서 더욱 시세를 잃은 땅은 비록 때가 기경시라 하더라도 용이히 살수까지 있는 형편이었으므로, 그렇게 하리라 일단 마음을 정하니, 자기도 땅을 마침내 가져 보누나 하는 생각에 더할 수 없는 행복을 느끼며 아다다에게도 이 계획을 말하였다."],["“우리 밭을 한 뙈기 사자. 그래두. 농살 허야 사람 사는 것 같디. 내가던답을 살라구 묶어둔 돈이 있거던.”"]],[["하고 수롱이는 봐라 하는 듯이 실겅 위에 얹힌 석유통 궤 속에서 지전 뭉치를 뒤져내더니, 손끝에다 침을 발라 가며 펄딱펄딱 뒤어보인다."],["그러나, 그 돈을 본 아다다는 어쩐지 갑자기 화기가 줄어든다."],["수롱이는 이상했다.","기꺼워할 줄 알았던 아다다가 도리어 화기를 잃은 것이다.","돈이 있다니 많은 줄 알았다가 기대에 틀림으로써인가?"]],[["“이거 봐! 그래뵈두, 1 천 5 백 낭(一百五十圓) 이야. 지금 시세에 이천 평은 한참 놀다가두 떡 먹두룩 살 건데.”"],["그래도 아다다는 아무 대답이 없다.","무엇 때문엔지 수심의 빛까지 역연히얼굴에 떠오른다."],["“아니 밭이 이천 평이문 조를 심는다 하구, 잘만 가꿔 봐, 조가 열섬에조짚이 백여 목 날 터이야. 그래, 이걸 개지구 겨울 한동안이야 못 살아? 그렇거구 둘이 맞붙어 몇 해반 벌어 봐?"]],[["그적엔 논이 또 나오는 거야. 이건괜히 생…….”"],["아다다는 말없이 머리를 흔든다."],["“아니, 내레 이게, 거즈뿌레기야? 아 열 섬이 못 나?”"],["아다다는 그래도 머리를 흔든다."],["“아니, 고롬 밭은 싫단 말인가?”"]],[["비로소 아다다는 그렇다는 듯이 머리를 주억거린다."],["아다다는 돈이 있다 해도 실로 그렇게 많은 돈이 있는 줄은 몰랐다.","그래서, 그 많은 돈으로 밭을 산다는 소리에 지금까지 꿈꾸어 오던 모든 행복이여지없이도 일시에 깨어지는 것만 같았던 것이다.","돈으로 위해서 그렇게 행복일 수 있던 자기의 신세는 남편 (전남편) 의 마음을 악하게 만듦으로, 그리고, 시부모의 눈까지 가리는 것이 되어, 필야엔 쫓겨나지 아니치 못하게 되던 일을 생각하면, 돈 소리만 들어도 마음은 좋지 않던 것인데, 이제 한푼 없는 알몸인 줄 알았던 수롱이에게도 그렇게 많은 돈이 있어 그것으로 밭을산다고 기꺼워하는 것을 볼 때,"]],[["그 돈의 밑천은 장래 자기에게 행복을 갖다주기보다는 몽둥이를 벼리는 데 지나지 못하는 것 같았고, 밭에다 조를 심는다는 것은 불행의 씨를 심는다는 것만 같았기 때문이다."],["아다다는 그저 섬으로 왔거니 조개나, 굴 같은 것을 캐어서 그날그날을살아가야 할 것만이 수롱의 사랑을 받는 데 더할 수 없는 살림인줄만 안다.","그래서, 이러한 살림이 얼마나 즐거우랴!","혼자 속으로 축복을 하며 수롱을 위하여 일층 벌기에 힘을 써야 할 것을 생각해 오던 것이다."]],[["“고롬 논을 사재나? 밭이 싫으문?”"],["수롱은 아다다의 의견이 알고 싶어 이렇게 또 물었다."],["그러나, 아다다는 그냥 고개만 주억여 버린다.","논을 산대도 그것은 똑같은 불행을 사는 데 있을 것이다.","돈이 있는 이상 어느 것이든지간 사기는반드시 사고야 말 남편의 심사이었음에 머리를 흔들어댔자 소용이 없을 것이었다.","그리하야, 그 근본 불행인 돈을 어찌할 수 없는 이상엔 잠시라도남편의 마음을 거슬림으로 불쾌하게 할 필요는 없다고 아는 때문이었다."]],[["“흥! 논이 도흔 줄은 너두 아누나! 그러나, 어려운 놈에게 밭이 논보다나았디 나아.”"],["하고, 수롱이는 기어코 밭을 사기로 그 달음에 거간을 내세웠다.그날 밤."],["아다다는 자리에 누웠으나 잠이 오지 않았다."],["남편은 아무런 근심도 없는 듯이 세상 모르고 씩씩 아침부터 자내건만 아다다는 그저 그 돈 생각을 하면 장차 닥쳐올 불길한 예감에 잠을 이룰 수가 없었다."]],[["이불을 붙안고 밤새도록 쥐어틀며 아무리 생각을 해야 그 돈을 그대로 두고는 수롱의 사랑 밑에서 영원한 행복을 누릴 수 있으리라고는 믿기지 않았다."],["짧은 봄밤은 어느덧 새어, 새벽을 알리는 닭의 울음 소리가 사방에서 처량히 들려온다."],["밤이 벌써 새누나 하니, 아다다의 마음은 더욱 조급하게 탔다.","이 밤으로 그 돈에 대한 처리를 하지 못하는 한, 내일은 기어이 거간이 밭을 흥정하여가지고 올 것이다."]],[["그러면 그 밭에서 나는 곡식은 해마다 돈을 불려 줄 것이다.","그때면 남편은 늘어가는 돈에 따라 차차 눈은 어둡게 되어 점점 정은멀어만 가게 될 것이다.","그 다음에는?","그 다음에는 더 생각하기조차 무서웠다."],["닭의 울음 소리에 따라 날은 자꾸만 밝아온다.","바라보니 어느덧 창은 희끄스름하게 비친다.","아다다는 더 누워 있을 수가 없었다.","옆에 누운 남편을지그시 팔로 밀어 보았다.","그러나 움찍하지도 않는다."]],[["그래도 못 믿기는 무엇이 있는 듯이 남편의 코에다 가까이 귀를 가져다대고 숨소리를 엿들었다.","씨근씨근 아직도 잠은 분명히 깨지 않고 있다.","아다다는 슬그머니 이불 속을 새어나왔다.","그리고 실겅 위에 석유통을 휩쓸어 그 속에다 손을 넣었다.","그리하여 마침내 지전 뭉치를 더듬어서 손에 쥐고는 조심조심 발자국 소리를 죽여 가며 살그머니 문을 열고 부엌으로 내려갔다."],["그리고는, 일찍이 아침을 지어 먹고 나무새기를 뽑으러 간다고 바구니를 끼고 바닷가로 나섰다."]],[["아무도 보지 못하게 깊은 물속에다 그 돈을 던져 버리자는 것이다."],["솟아오르는 아침 햇발을 받아 붉게 물들며 잔뜩 밀린 조수는 거품을 부걱부걱 토하며 바람결조차 철썩철썩 해안을 부딪친다."],["아다다는 바구니를 내려놓고 허리춤 속에서 지전 뭉치를 쥐어들었다.","그리고는 몇 겹이나 쌌는지 알 수 없는 헝겊 조각을 둘둘 풀었다.","헤집으니 1 원짜리, 5 원짜리, 10 원짜리 무수한 관 쓴 영감들이 나를 박대해서는 아니 된다는 듯이 모두들 마주 바라본다."]],[["그러나, 아다다는 너 같은 것을 버리는 데는 아무런 미련도 없다는 듯이 넘노는 물결 위에다 휙 내어뿌렸다.","세찬바닷바람에 채인 지전은 바람결 좇아 공중으로 올라가 팔랑팔랑 허공에서재주를 넘어가며 산산이 헤어져, 멀리, 그리고, 가깝게 하나씩 하나씩 물 위에 떨어져서는 넘노는 물결 좇아 잠겼다 떴다 소꾸막질을 한다."],["어서 물속으로 가라앉든지.","그러니 않으면 흘러 내려가든지 했으면 하고 아다다는 멀거니 서서 기다리나 너저분하게 물 위를 덮은 지전 조각들은 차마 주인의 품을 떠나기가 싫은 듯이 잠겨 버렸는가 하면, 다시 기웃거리며솟아올라서는 물 위를 빙글빙글 돈다."]],[["하더니, 썰물이 잡히자부터야 할 수 없는 듯이 슬금슬금 밑이 떨어져 흐르기 시작한다."],["아다다는 상쾌하기 그지없었다.","밀려 내려가는 무수한 그 지전 조각들은, 자기의 온갖 불행을 모두 거두어가지고 다시 돌아올 길이 없는 끝없는 한바다로 내려갈 것을 생각할 때 아다다는 춤이라도 출 듯이 기꺼웠다."],["그러나, 그 돈이 완전히 눈앞에 보이지 않게 흘러 내려가기까지에는 아직도 몇 분 동안을 요하여야 할 것인데, 뒤에서 허덕거리는 발자국 소리가 들리기에 돌아다보니 뜻밖에도 수롱이가 헐떡이며 달려오는 것이 아닌가."]],[["“야! 야! 아다다야! 너 돈 돈 안 건새핸? 돈 돈 말이야 돈……?”"],["청천의 벽력 같은 소리였다."],["아다다는 어쩔 줄을 모르고 남편이 이까지 이르기 전에 어서어서 물결은 휩쓸려 돈을 모두 거둬가지고 흘러 버렸으면 하나, 물결은 안타깝게도 그닐그닐 한가히 돈을 이끌고 흐를 뿐, 아다다는 그 돈이 어서 자기의 눈앞에서자취를 감추어 버리는 것을 보기 위하여 그닐거리고 있는 돈 위에 쏘아박은눈을 떼지 못하고 쩔쩔매는 사이, 마침내 달려오게 된 수롱의 눈에도 필경그 돈은 띄고야 말았다."]],[["뜻밖에도 바다 가운데 무수하게 지전 조각이 널려서 앞서거니, 뒤서거니, 둥둥 떠내려가는 것을 본 수롱이는 아다다에게 그 연유를 물을 겨를도 없이미친듯이 옷을 훨훨 벗고 첨버덩 물속으로 뛰어들었다."],["그러나 헤엄을 칠 줄 모르는 수롱이는 돈이 엉키어 도는 한복판으로 들어갈 수가 없었다.","겨우 가슴패기까지 잠기는 깊이에서 더 들어가지 못하고 흘러 내려가는 돈 더미를 안타깝게도 바라보며 허우적허우적 달려갔다."]],[["차츰 물결은 휩쓸려 떠내려가는 속력은 빨라진다.","돈들은 수롱이더러 어디 달려와 보라는 듯이 휙휙 소꾸막질을 하며 흐른다.","그러나, 물결이 세어질수록 더욱 걸음발은 자유로 놀릴 수가 없게 된다.","더퍽더퍽 물과 싸움이나 하듯 엎어졌다가는 이러서고 일어섰다가는 다시 엎어지며 달려가나 따를 길이 없다.","그대로 덤비다가는 몸조차 물속으로 휩쓸려 들어갈 것 같아, 멀거니 서서 바라보니 벌써 지전 조각들은 가물가물하고 물거품인지 지전인지도 분간할 수 없으리만치 먼 거리에서 흐르고 있다."]],[["그러나, 그것도 한 순간이었다.","눈앞에는 아무것도 보여지는 것이 없다.","휙휙 하고 밀려 내려가는 거품진 물결뿐이다."],["수롱이는, 마지막으로 돈을 잃고 말았다고 아는 정도의 물결 위에 쏘아진눈을 돌릴 길이 없이 정신 빠진 사람처럼 그냥그냥 바라보고 섰더니, 쏜살같이 언덕켠으로 달려오자 아무런 말도 없이, 벌벌 떨고 섰는 아다다의 중동을 사정없이 발길로 제겼다."]],[["“흥앗!”"],["소리가 났다고 아는 순간, 철썩 하고 감탕이 사방으로 튀자 보니 벌써 아다다는 해안의 감탕판에 등을 지고 쓰러져 있다."],["“이 - 이 - 이…….”"],["수롱이는 무슨 말인지를 하려고는 하나, 너무도 기에 차서 말이 되지를 않는 듯 입만 너불거리다가 아다다가 움찍하는 것을 보더니 아직도 살았느냐는 듯이 번개같이 쫓아내려가 다시 한 번 발길로 제겼다."]],[["“푹!”"],["하는 소리와 같이 아다다는 가꿉선 언덕을 떨어져 덜덜덜 굴러서 물속에 잠긴다."],["한참만에 보니 아다다는 복판도 한복판으로 밀려가서 솟구어 오르며 두 팔을 물 밖으로 허우적거린다.","그러나, 그 깊은 파도 속을 어떻게 헤어나랴!","아다다는 그저 물 위를 둘레둘레 굴며 요동을 칠 뿐, 그러나, 그것도한 순간이었다.","어느덧 그 자체는 물속에 사라지고 만다."]],[["주먹을 부르쥔 채 우상같이 서서 굽실거리는 물결만 그저 뚫어져라 쏘아보고 섰는 수롱이는 그 물속에 영원히 잠들려는 아다다를 못 잊어 함인가?","그러지 않으면 흘러버린 그 돈이 차마 아까워서인가?"],["짝을 찾아 도는 갈매기 떼들은 눈물겨운 처참한 인생 비극이 여기에 일어난 줄도 모르고 ‘끼약 끼약’ 하며 흥겨운 춤에 훨훨 날아다니는 깃 치는 소리와 같이 해안의 풍경만 도웁고 있다."]],[["(乙亥 [을해] 4 월)"],["〔 발표지 〕《 조선문단 》 (1935. 5.)"],["〔 수록단행본 〕 * 『 백치 아다다 』 (대조사, 1946)"]]],"5":[[["김유정 <동백꽃>"],["오늘도 또 우리 수탉이 막 쫓기었다.","내가 점심을 먹고 나무를 하러 갈 양으로 나올 때이었다.","산으로 올라서려니까 등뒤에서 푸르득푸드득, 하고 닭의 횃소리가 야단이다.","깜짝 놀라서 고개를 돌려보니 아니나다르랴, 두 놈이 또 얼리었다."],["점순네 수탉(은 대강이가 크고 똑 오소리같이 실팍하게 생긴 놈)이 덩저리 작은 우리 수탉을 함부로 해내는 것이다."]],[["그것도 그냥 해내는 것이 아니라 푸드득 하고 면두를 쪼고 물러섰다가 좀 사이를 두고 또 푸드득 하고 모가지를 쪼았다.","이렇게 멋을 부려 가며 여지없이 닦아 놓는다.","그러면 이 못생긴 것은 쪼일 적마다 주둥이로 땅을 받으며 그 비명이 킥, 킥 할 뿐이다.","물론 미처 아물지도 않은 면두를 또 쪼이어 붉은 선혈은 뚝뚝 떨어진다."],["이걸 가만히 내려다보자니 내 대강이가 터져서 피가 흐르는 것같이 두 눈에서 불이 번쩍 난다."]],[["대뜸 지게 막대기를 메고 달려들어 점순네 닭을 후려칠까 하다가 생각을 고쳐먹고 헛매질로 떼어만 놓았다."],["이번에도 점순이가 쌈을 붙여 놨을 것이다.","바짝바짝 내 기를 올리느라고 그랬음에 틀림없을 것이다."],["고놈의 계집애가 요새로 들어서서 왜 나를 못 먹겠다고 고렇게 아르렁거리는지 모른다."]],[["나흘 전 감자 조각만 하더라도 나는 저에게 조금도 잘못한 것은 없다."],["계집애가 나물을 캐러 가면 갔지 남 울타리 엮는 데 쌩이질을 하는 것은 다 뭐냐.","그것도 발소리를 죽여 가지고 등뒤로 살며시 와서,"],["“얘! 너 혼자만 일하니?”"],["하고 긴치 않은 수작을 하는 것이다."]],[["어제까지도 저와 나는 이야기도 잘 않고 서로 만나도 본 척 만 척하고 이렇게 점잖게 지내던 터이련만 오늘로 갑작스레 대견해졌음은 웬일인가.","황차 망아지만한 계집애가 남 일하는 놈보구."],["“그럼 혼자 하지 떼루 하디?”"],["내가 이렇게 내배앝는 소리를 하니까,"],["“너 일하기 좋니?”"]],[["또는,"],["“한여름이나 되거든 하지 벌써 울타리를 하니?”"],["잔소리를 두루 늘어놓다가 남이 들을까 봐 손으로 입을 틀어막고는 그 속에서 깔깔댄다.","별로 우스울 것도 없는데 날씨가 풀리더니 이놈의 계집애가 미쳤나 하고 의심하였다.","게다가 조금 뒤에는 제 집께를 할금할금 돌아보더니 행주치마의 속으로 꼈던 바른손을 뽑아서 나의 턱밑으로 불쑥 내미는 것이다."]],[["언제 구웠는지 아직도 더운 김이 홱 끼치는 굵은 감자 세 개가 손에 뿌듯이 쥐였다."],["“느 집엔 이거 없지?”"],["하고 생색 있는 큰소리를 하고는 제가 준 것을 남이 알면은 큰일날 테니 여기서 얼른 먹어 버리란다.","그리고 또 하는 소리가,"],["“너 봄감자가 맛있단다.”"]],[["“난 감자 안 먹는다, 너나 먹어라.”"],["나는 고개도 돌리려지 않고 일하던 손으로 그 감자를 도로 어깨너머로 쑥 밀어 버렸다."],["그랬더니 그래도 가는 기색이 없고 뿐만 아니라 쌔근쌔근 하고 심상치 않게 숨소리가 점점 거칠어진다.","이건 또 뭐야, 싶어서 그때서야 비로소 돌아다보니 나는 참으로 놀랐다.","우리가 이 동리에 들어온 것은 근 삼 년째 되어 오지만 여태껏 가무잡잡한 점순이의 얼굴이 이렇게까지 홍당무처럼 새빨개진 법이 없었다."]],[["게다 눈에 독을 올리고 한참 나를 요렇게 쏘아보더니 나중에는 눈물까지 어리는 것이 아니냐.","그리고 바구니를 다시 집어 들더니 이를 꼭 악물고는 엎어질 듯 자빠질 듯 논둑으로 힁허케 달아나는 것이다."],["어쩌다 동리 어른이,"],["“너 얼른 시집가야지?”"],["하고 웃으면,"]],[["“염려 마서유. 갈 때 되면 어련히 갈라구!”"],["이렇게 천연덕스레 받는 점순이었다.","본시 부끄럼을 타는 계집애도 아니려니와 또한 분하다고 눈에 눈물을 보일 얼병이도 아니다.","분하면 차라리 나의 등허리를 바구니로 한번 모질게 후려쌔리고 달아날지언정."],["그런데 고약한 그 꼴을 하고 가더니 그 뒤로는 나를 보면 잡아먹으려고 기를 복복 쓰는 것이다."]],[["설혹 주는 감자를 안 받아 먹은 것이 실례라 하면, 주면 그냥 주었지 ‘느 집엔 이거 없지’는 다 뭐냐.","그러잖아도 저희는 마름이고 우리는 그 손에서 배재를 얻어 땅을 부치므로 일상 굽실거린다.","우리가 이 마을에 처음 들어와 집이 없어서 곤란으로 지낼 제 집터를 빌리고 그 위에 집을 또 짓도록 마련해 준 것도 점순네의 호의였다.","그리고 우리 어머니 아버지도 농사 때 양식이 달리면 점순네한테 가서 부지런히 꾸어다 먹으면서 인품 그런 집은 다시없으리라고 침이 마르도록 칭찬하곤 하는 것이다."]],[["그러면서도 열일곱씩이나 된 것들이 수군수군하고 붙어다니면 동리의 소문이 사납다고 주의를 시켜 준 것도 또 어머니였다.","왜냐하면 내가 점순이하고 일을 저질렀다가는 점순네가 노할 것이고, 그러면 우리는 땅도 떨어지고 집도 내쫓기고 하지 않으면 안 되는 까닭이었다."],["그런데 이놈의 계집애가 까닭 없이 기를 복복 쓰며 나를 말려죽이려고 드는 것이다."]],[["눈물을 흘리고 간 담날 저녁 나절이었다.","나무를 한짐 잔뜩 지고 산을 내려오려니까 어디서 닭이 죽는 소리를 친다.","이거 뉘 집에서 닭을 잡나, 하고 점순네 울 뒤로 돌아오다가 나는 고만 두 눈이 뚱그래졌다.","점순이가 저희 집 봉당에 홀로 걸터앉았는데 이게 치마 앞에다 우리 씨암탉을 꼭 붙들어 놓고는,"],["“이놈의 닭! 죽어라, 죽어라.”"]],[["요렇게 암팡스레 패주는 것이 아닌가.","그것도 대가리나 치면 모른다마는 아주 알도 못 낳으라고 그 볼기짝께를 주먹으로 콕콕 쥐어박는 것이다."],["나는 눈에 쌍심지가 오르고 사지가 부르르 떨렸으나 사방을 한번 휘돌아보고야 그제서 점순이 집에 아무도 없음을 알았다.","잡은 참 지게 막대기를 들어 울타리의 중턱을 후려치며, “이놈의 계집애! 남의 닭 알 못 낳으라구 그러니?”"]],[["하고 소리를 빽 질렀다."],["그러나 점순이는 조금도 놀라는 기색이 없고 그대로 의젓이 앉아서 제 닭 가지고 하듯이 또 죽어라, 죽어라, 하고 패는 것이다.","이걸 보면 내가 산에서 내려올 때를 겨냥해 가지고 미리부터 닭을 잡아 가지고 있다가 너 보란 듯이 내 앞에 줴지르고 있음이 확실하다."],["그러나 나는 그렇다고 남의 집에 뛰어들어가 계집애하고 싸울 수도 없는 노릇이고 형편이 썩 불리함을 알았다."]],[["그래 닭이 맞을 적마다 지게 막대기로 울타리나 후려칠 수밖에 별도리가 없다.","왜냐하면 울타리를 치면 칠수록 울섶이 물러앉으며 뼈대만 남기 때문이다.","하나 아무리 생각하여도 나만 밑지는 노릇이다."],["“야, 이년아! 남의 닭 아주 죽일 터이냐?”"],["내가 도끼눈을 뜨고 다시 꽥 호령을 하니까 그제야 울타리께로 쪼르르 오더니 울 밖에 섰는 나의 머리를 겨누고 닭을 내팽개친다."]],[["“에이, 더럽다! 더럽다!”"],["“더러운 걸 널더러 입때 끼고 있으랬니? 망할 계집애년 같으니!”"],["하고 나도 더럽단 듯이 울타리께를 힝하니 돌아 내리며 약이 오를 대로 다 올랐다.","라고 하는 것은 암탉이 풍기는 서슬에 나의 이마빼기에다 물찌똥을 찍 깔겼는데 그걸 본다면 알집만 터졌을 뿐 아니라 골병은 단단히 든 듯싶다."]],[["그리고 나의 등뒤를 향하여 나에게만 들릴 듯 말 듯한 음성으로,"],["“이 바보 녀석아!”"],["“얘! 너 배냇병신이지?”"],["그만도 좋으련만,"],["“얘! 너 느 아버지가 고자라지?”"]],[["“뭐? 울 아버지가 그래 고자야?”"],["할 양으로 열벙거지가 나서 고개를 홱 돌리어 바라봤더니 그때까지 울타리 위로 나와 있어야 할 점순이의 대가리가 어디 갔는지 보이지를 않는다.","그러다 돌아서서 오자면 아까에 한 욕을 울 밖으로 또 퍼붓는 것이다.","욕을 이토록 먹어 가면서도 대거리 한마디 못 하는 걸 생각하니 돌부리에 채어 발톱 밑이 터지는 것도 모를 만치 분하고 급기야는 두 눈에 눈물까지 불끈 내솟는다."]],[["그러나 점순이의 침해는 이것뿐이 아니다."],["사람들이 없으면 틈틈이 제 집 수탉을 몰고 와서 우리 수탉과 쌈을 붙여 놓는다.","제 집 수탉은 썩 험상궂게 생기고 쌈이라면 홰를 치는 고로 으레 이길 것을 알기 때문이다.","그래서 툭하면 우리 수탉이 면두며 눈깔이 피로 흐드르하게 되도록 해놓는다.","어떤 때에는 우리 수탉이 나오지를 않으니까 요놈의 계집애가 모이를 쥐고 와서 꾀어 내다가 쌈을 붙인다."]],[["이렇게 되면 나도 다른 배차를 차리지 않을 수 없다.","하루는 우리 수탉을 붙들어 가지고 넌지시 장독께로 갔다.","쌈닭에게 고추장을 먹이면 병든 황소가 살모사를 먹고 용을 쓰는 것처럼 기운이 뻗친다 한다.","장독에서 고추장 한 접시를 떠서 닭 주둥아리께로 들이밀고 먹여 보았다.","닭도 고추장에 맛을 들였는지 거스르지 않고 거진 반 접시 턱이나 곧잘 먹는다.","그리고 먹고 금세는 용을 못 쓸 터이므로 얼마쯤 기운이 들도록 홰 속에다 가두어 두었다.밭에 두엄을 두어 짐 져내고 나서 쉴 참에 그 닭을 안고 밖으로 나왔다."]],[["마침 밖에는 아무도 없고 점순이만 저희 울 안에서 헌옷을 뜯는지 혹은 솜을 터는지 웅크리고 앉아서 일을 할 뿐이다."],["나는 점순네 수탉이 노는 밭으로 가서 닭을 내려놓고 가만히 맥을 보았다.","두 닭은 여전히 얼리어 쌈을 하는데 처음에는 아무 보람이 없다.","멋지게 쪼는 바람에 우리 닭은 또 피를 흘리고 그러면서도 날갯죽지만 푸드득푸드득 하고 올라 뛰고 뛰고 할 뿐으로 제법 한번 쪼아 보도 못 한다."]],[["그러나 한번은 어쩐 일인지 용을 쓰고 펄쩍 뛰더니 발톱으로 눈을 하비고 내려오며 면두를 쪼았다.","큰 닭도 여기에는 놀랐는지 뒤로 멈씰하며 물러난다.","이 기회를 타서 작은 우리 수탉이 또 날쌔게 덤벼들어 다시 면두를 쪼니 그제는 감때사나운 그 대강이에서도 피가 흐르지 않을 수 없었다."],["옳다 알았다, 고추장만 먹이면은 되는구나, 하고 나는 속으로 아주 쟁그라워 죽겠다.","그때에는 뜻밖에 내가 닭쌈을 붙여 놓는 데 놀라서 울 밖으로 내다보고 섰던 점순이도 입맛이 쓴지 눈살을 찌푸렸다."]],[["나는 두 손으로 볼기짝을 두드리며 연방,"],["“잘한다! 잘한다!”"],["하고 신이 머리끝까지 뻗치었다."],["그러나 얼마 되지 않아서 나는 넋이 풀리어 기둥같이 묵묵히 서 있게 되었다.","왜냐하면 큰 닭이 한번 쪼인 앙갚음으로 호들갑스레 연거푸 쪼는 서슬에 우리 수탉은 찔끔 못 하고 막 곯는다."]],[["이걸 보고서 이번에는 점순이가 깔깔거리고 되도록 이쪽에서 많이 들으라고 웃는 것이다."],["나는 보다못하여 덤벼들어서 우리 수탉을 붙들어 가지고 도로 집으로 들어왔다.","고추장을 좀더 먹였더라면 좋았을 걸 너무 급하게 쌈을 붙인 것이 퍽 후회가 난다.","장독께로 돌아와서 다시 턱밑에 고추장을 들이댔다.","흥분으로 말미암아 그런지 당최 먹질 않는다."]],[["나는 하릴없이 닭을 반듯이 누이고 그 입에다 궐련 물부리를 물리었다.","그리고 고추장 물을 타서 그 구멍으로 조금씩 들이부었다.","닭은 좀 괴로운지 킥킥 하고 재채기를 하는 모양이나 그러나 당장의 괴로움은 매일같이 피를 흘리는 데 댈 게 아니라 생각하였다."],["그러나 한 두어 종지 가량 고추장 물을 먹이고 나서는 나는 그만 풀이 죽었다.","싱싱하던 닭이 왜 그런지 고개를 살며시 뒤틀고는 손아귀에서 뻐드러지는 것이 아닌가."]],[["아버지가 볼까 봐서 얼른 홰에다 감추어 두었더니 오늘 아침에서야 겨우 정신이 든 모양 같다."],["그랬던 걸 이렇게 오다 보니까 또 쌈을 붙여 놓으니 이 망할 계집애가 필연 우리집에 아무도 없는 틈을 타서 제가 들어와 홰에서 꺼내 가지고 나간 것이 분명하다."],["나는 다시 닭을 잡아다 가두고 염려는 스러우나 그렇다고 산으로 나무를 하러 가지 않을 수도 없는 형편이었다."]],[["소나무 삭정이를 따며 가만히 생각해 보니 암만해도 고년의 목쟁이를 돌려놓고 싶다.","이번에 내려가면 망할년 등줄기를 한번 되게 후려치겠다 하고 싱둥겅둥 나무를 지고는 부리나케 내려왔다."],["거지반 집에 다 내려와서 나는 호드기 소리를 듣고 발이 딱 멈추었다.","산기슭에 널려 있는 굵은 바윗돌 틈에 노란 동백꽃이 소보록하니 깔리었다.","그 틈에 끼어 앉아서 점순이가 청승맞게시리 호드기를 불고 있는 것이다."]],[["그보다도 더 놀란 것은 그 앞에서 또 푸드득푸드득 하고 들리는 닭의 횃소리다.","필연코 요년이 나의 약을 올리느라고 또 닭을 집어 내다가 내가 내려올 길목에다 쌈을 시켜 놓고 저는 그 앞에 앉아서 천연스레 호드기를 불고 있음에 틀림없으리라."],["나는 약이 오를 대로 다 올라서 두 눈에서 불과 함께 눈물이 퍽 쏟아졌다.","나무 지게도 벗어 놀 새 없이 그대로 내동댕이치고는 지게 막대기를 뻗치고 허둥지둥 달려들었다."]],[["가까이 와보니 과연 나의 짐작대로 우리 수탉이 피를 흘리고 거의 빈사 지경에 이르렀다.","닭도 닭이려니와 그러함에도 불구하고 눈 하나 깜짝 없이 고대로 앉아서 호드기만 부는 그 꼴에 더욱 치가 떨린다.","동리에서도 소문이 났거니와 나도 한때는 걱실걱실히 일 잘하고 얼굴 예쁜 계집애인 줄 알았더니 시방 보니까 그 눈깔이 꼭 여우새끼 같다."],["나는 대뜸 달려들어서 나도 모르는 사이에 큰 수탉을 단매로 때려 엎었다."]],[["닭은 푹 엎어진 채 다리 하나 꼼짝 못 하고 그대로 죽어 버렸다.","그리고 나는 멍하니 섰다가 점순이가 매섭게 눈을 홉뜨고 닥치는 바람에 뒤로 벌렁 나자빠졌다."],["“이놈아! 너 왜 남의 닭을 때려죽이니?”"],["“그럼 어때?”"],["하고 일어나다가,"]],[["“뭐 이 자식아! 누 집 닭인데?”"],["하고 복장을 떼미는 바람에 다시 벌렁 자빠졌다.","그리고 나서 가만히 생각하니 분하기도 하고 무안도 스럽고 또 한편 일을 저질렀으니 인젠 땅이 떨어지고 집도 내쫓기고 해야 될는지 모른다."],["나는 비슬비슬 일어나며 소맷자락으로 눈을 가리고는 얼김에 엉 하고 울음을 놓았다.","그러다 점순이가 앞으로 다가와서,"]],[["“그럼, 너 이 담부턴 안 그럴 테냐?”"],["하고 물을 때에야 비로소 살 길을 찾은 듯싶었다.","나는 눈물을 우선 씻고 뭘 안 그러는지 명색도 모르건만,"],["“그래!”"],["하고 무턱대고 대답하였다."],["“요 담부터 또 그래 봐라, 내 자꾸 못살게 굴 테니.”"]],[["“그래 그래, 인젠 안 그럴 테야.”"],["“닭 죽은 건 염려 마라. 내 안 이를 테니.”"],["그리고 뭣에 떠다밀렸는지 나의 어깨를 짚은 채 그대로 퍽 쓰러진다.","그 바람에 나의 몸뚱이도 겹쳐서 쓰러지며 한창 피어 퍼드러진 노란 동백꽃 속으로 폭 파묻혀 버렸다."],["알싸한 그리고 향긋한 그 냄새에 나는 땅이 꺼지는 듯이 온 정신이 고만 아찔하였다."]],[["“너 말 마라?”"],["“그래!”"],["조금 있더니 요 아래서,"],["“점순아! 점순아! 이년이 바느질을 하다 말구 어딜 갔어?”"],["하고 어딜 갔다 온 듯싶은 그 어머니가 역정이 대단히 났다."]],[["점순이가 겁을 잔뜩 집어먹고 꽃 밑을 살금살금 기어서 산 아래로 내려간 다음 나는 바위를 끼고 엉금엉금 기어서 산 위로 치빼지 않을 수 없었다."],["출전:조광7(1936.5)"]]],"6":[[["날개"],["'박제(剝製)가 되어 버린 천재'를 아시오?","나는 유쾌하오.","이런 때 연애까지가 유쾌하오."],["육신이 흐느적흐느적하도록 피로했을 때만 정신이 은화처럼 맑소.","니코틴이 내 횟배 앓는 뱃속으로 스미면 머릿속에 으레 백지가 준비되는 법이오.","그 위에다 나는 위트와 파라독스를 바둑 포석처럼 늘어 놓소.","가공할 상식의 병이오."]],[["나는 또 여인과 생활을 설계하오.","연애기법에마저 서먹서먹해진 지성의 극치를 흘깃 좀 들여다본 일이 있는, 말하자면 일종의 정신분일자(정신이 제멋대로 노는 사람)말이오.","이런 여인의 반----그것은 온갖 것의 반이오.---만을 영수(받아들이는)하는 생활을 설계한다는 말이오.","그런 생활 속에 한 발만 들여놓고 흡사 두 개의 태양처럼 마주 쳐다보면서 낄낄거리는 것이오.","나는 아마 어지간히 인생의 제행(諸行)"]],[["(일체의 행위)이 싱거워서 견딜 수가 없게 끔 되고 그만둔 모양이오.","굿바이."],["굿바이.","그대는 이따금 그대가 제일 싫어하는 음식을 탐식하는 아이로니를 실천해 보는 것도 놓을 것 같소.","위트와 파라독스와……."],["그대 자신을 위조하는 것도 할 만한 일이오.","그대의 작품은 한번도 본 일이 없는 기성품에 의하여 차라리 경편(輕便)하고(가뜬하여 쓰기에 손쉽고 편하고) 고매하리다."]],[["19세기는 될 수 있거든 봉쇄하여 버리오.","도스토예프스키 정신이란 자칫하면 낭비일 것 같소.","위고를 불란서의 빵 한 조각이라고는 누가 그랬는지 지언(至言)(지당한 말)인 듯싶소. 그러나"],["인생 혹은 그 모형에 있어서 '디테일' 때문에 속는다거나 해서야 되겠소?"],["화를 보지 마오.","부디 그대께 고하는 것이니……"]],[["\"테이프가 끊어지면 피가 나오.","상채기도 머지 않아 완치될 줄 믿소.","굿바이.\"","감정은 어떤 '포"],["우즈'.","(그 '포우즈'의 원소만을 지적하는 것이 아닌지 나도 모르겠소.)","그 포우즈가 부동자세에까지 고도화할 때 감정은 딱 공급을 정지합네다."],["나는 내 비범한 발육을 회고하여 세상을 보는 안목을 규정하였소."]],[["여왕봉과 미망인---세상의 하고 많은 여인이 본질적으로 이미 미망인이 아닌 이가 있으리까?","아니, 여인의 전부가 그 일상에 있어서 개개'미망인'이라는 내 논리가 뜻밖에도 여성에 대한 모험이 되오?","굿바이."],["그 33번지라는 것이 구조가 흡사 유곽이라는 느낌이 없지 않다."],["한 번지에 18가구가 죽 어깨를 맞대고 늘어서서 창호가 똑같고 아궁이 모양이 똑같다."]],[["게다가 각 가구에 사는 사람들이 송이송이 꽃과 같이 젊다."],["해가 들지 않는다.","해가 드는 것을 그들이 모른 체하는 까닭이다.","턱살밑에다 철줄을 매고 얼룩 진 이부자리를 널어 말린다는 핑계로 미닫이에 해가 드는 것을 막아 버린다.","침침한 방안에서 낮잠들을 잔다.","그들은 밤에는 잠을 자지 않나?","알 수 없다.","나는 밤이나 낮이나 잠만 자느라고 그런 것을 알 길이 없다.","33번지 18 가구의 낮은 참 조용하다."]],[["조용한 것은 낮뿐이다.","어둑어둑하면 그들은 이부자리를 걷어들인다.","전등불이 켜진 뒤의 18"],["가구는 낮보다 훨씬 화려하다.","저물도록 미닫이 여닫는 소리가 잦다.","바빠진다.","여러가지 냄새가 나 기 시작한다.","비웃 굽는 내, 탕고도오랑내, 뜨물내,비눗내."],["그러나 이런 것들보다도 그들의 문패가 제일로 고개를 끄덕이게 하는 것이다."]],[["이 18 가구를 대표하는 대문이라는 것이 일각이 져서 외따로 떨어지기는 했으나, 있다.","그러나 그것은 한 번도 닫힌 일이 없는, 한길이나 마찬가지 대문인 것이다.","온갖 장사치들은 하루 가운데 어느 시간에라도 이 대문을 통하여 드나들 수 있는 것이다.","이네들은 문간에서 두부를 사는 것이 아니라, 미닫이를 열고 방에서 두부를 사는 것이다.","이렇게 생긴 33번지 대문에 그들 18 가구의 문패를 몰아다 붙이는 것은 의미가 없다.","그들은 어느 사이엔가 각 미닫이 위 백인당이니 길상당이니 써 붙인 한곁에다 문패를 붙이는 풍속을 가져 버렸다."]],[["내 방 미닫이 위 한곁에 칼표 딱지를 넷에다 낸 것만한 내---아니!","내 아내의 명함이 붙어 있는 것도 이 풍속을 좇은 것이 아닐 수 없다."],["나는 그러나 그들의 아무와도 놀지 않는다.","놀지 않을 뿐만 아니라 인사도 않는다.","나는 내 아내 와 인사하는 외에 누구와도 인사하고 싶지 않았다.","내 아내 외의 다른 사람과 인사를 하거나 놀거나 하는 것은 내 아내 낯을 보아 좋지 않은 일인 것만 같이 생각이 되었기 때문이다."]],[["나는 이만큼 까지 내 아내를 소중히 생각한 것이다.","내가 이렇게까지 내 아내를 소중히 생각한 까닭은 이 33번 지 18 가구 속에서 내 아내가 내 아내의 명함처럼 제일 작고 제일 아름다운 것을 안 까닭이다.","18 가구에 각기 빌어 들은 송이송이 꽃들 가운데서도 내 아내가 특히 아름다운 한 떨기의 꽃으로 이 함석지붕 밑 볕 안드는 지역에서 어디까지든지 찬란하였다.","따라서 그런 한 떨기 꽃을 지키고---아니 그 꽃에 매어달려 사는 나라는 존재가 도무지 형언할 수 없는 거북살스러운 존재가 아닐 수 없었던 것은 물론이다."]],[["나는 어디까지든지 내 방이---집이 아니다.","집은 없다.---마음에 들었다.","방안의 기온은 내 체온 을 위하여 쾌적하였고, 방안의 침침한 정도가 또한 내 안력을 위하여 쾌적하였다.","나는 내 방 이상 의 서늘한 방도 또 따뜻한 방도 희망하지 않았다.","이 이상으로 밝거나 이 이상으로 아늑한 방은 원 하지 않았다.","내 방은 나 하나를 위하여 요만한 정도를 꾸준히 지키는 것 같아 늘 내 방에 감사하였고, 나는 또 이런 방을 위하여 이 세상에 태어난 것만 같아서 즐거웠다."]],[["그러나 이것은 행복이라든가 불행이라든가 하는 것을 계산하는 것은 아니었다.","말하자면 나는 내 가 행복되다고도 생각할 필요가 없었고, 그렇다고 불행하다고도 생각할 필요가 없었다.","그냥 그날 을 그저 까닭없이 펀둥펀둥 게으르고만 있으면 만사는 그만이었던 것이다."],["내 몸과 마음에 옷처럼 잘 맞는 방 속에서 뒹굴면서, 축 쳐져 있는 것은 행복이니 불행이니 하는 그런 세속적인 계산을 떠난, 가장 편리하고 안일한 말하자면 절대적인 상태인 것이다."]],[["나는 이런 상태가 좋았다."],["이 절대적인 내 방은 대문간에서 세어서 똑 일곱째 칸이다.","럭키 세븐의 뜻이 없지 않다.","나는 이 일곱이라는 숫자를 훈장처럼 사랑하였다.","이런 이 방이 가운데 장지로 말미암아 두 칸으로 나뉘어 있었다는 그것이 내 운명의 상징이었던 것을 누가 알랴?","아랫방은 그래도 해가 든다.","아침결에 책보 만한 해가 들었다가 오후에 손수건만 해지면서 나가 버린다.","해가 영영 들지 않는 윗방이 즉 내 방인 것은 말할 것도 없다."]],[["이렇게 볕드는 방이 아내 방이요, 볕 안드는 방이 내 방이요 하고 아내와 나 둘 중에 누가 정했는지 나는 기억하지 못한다."],["그러나 나에게는 불평이 없다."],["아내가 외출만 하면 나는 얼른 아랫방으로 와서 그 동쪽으로 난 들창을 열어 놓고 열어놓으면"],["들이비치는 햇살이 아내의 화장대를 비쳐 가지각색 병들이 아롱이 지면서 찬란하게 빛나고, 이렇게 빛나는 것을 보는 것은 다시없는 내 오락이다."]],[["나는 조그만 돋보기를 꺼내가지고 아내만이 사용하는 지리가미를 꺼내 가지고 그을려 가면서 불장난을 하고 논다.","평행광선을 굴절시켜서 한 촛점에 모아가지고 그 촛점이 따근따근해지다가, 마지막에는 종이를 그을리기 시작하고, 가느다란 연기를 내면서 드디어 구멍을 뚫어 놓는 데까지 이르는, 고 얼마 안되는 동안의 초조한 맛이 죽고 싶을 만 큼 내게는 재미있었다."],["이 장난이 싫증이 나면 나는 또 아내의 손잡이 거울을 가지고 여러가지로 논다."]],[["거울이란 제 얼 굴을 비칠 때만 실용품이다.","그 외의 경우에는 도무지 장난감인 것이다.","이 장난도 곧 싫증이 난다."],["나의 유희심은 육체적인 데서 정신적인 데로 비약한다.","나는 거울을 내던지고 아내의 화장대 앞으로 가까이 가서 나란히 늘어 놓인 그 가지각색의 화장품 병들을 들여다본다.","고것들은 세상의 무엇보다도 매력적이다.","나는 그 중의 하나만을 골라서 가만히 마개를 빼고 병구멍을 내 코에 가져다 대 고 숨 죽이듯이 가벼운 호흡을 하여 본다."]],[["이국적인 센슈얼한 향기가 폐로 스며들면 나는 저절로 스르르 감기는 내 눈을 느낀다.","확실히 아내의 체취의 파편이다."],["나는 도로 병마개를 막고 생각해 본다.","아내의 어느 부분에서 요 냄새가 났던가를……","그러나 그 것은 분명하지 않다. 왜?","아내의 체취는 여기 늘어섰는 가지각색 향기의 합계일 것이니까."],["아내의 방은 늘 화려하였다.","내 방이 벽에 못 한 개 꽂히지 않은 소박한 것인 반대로, 아내 방에 는 천장 밑으로 쫙 돌려 못이 박히고, 못마다 화려한 아내의 치마와 저고리가 걸렸다."]],[["여러가지 무늬가 보기 좋다.","나는 그 여러 조각의 치마에서 늘 아내의 동체와, 그 동체가 될 수 있는 여러가지 포우즈를 연상하고 연상하면서 내 마음은 늘 점잖지 못하다."],["그렇건만 나에게는 옷이 없었다.","아내는 내게 옷을 주지 않았다.","입고 있는 골덴양복 한 벌이 내 자리옷이었고 통상복과 나들이옷을 겸한 것이었다.","그리고 하이넥의 스웨터가 한 조각 사철을 통한 내 내의다.","그것들은 하나같이 다 빛이 검다."]],[["그것은 내 짐작 같아서는 즉 빨래를 될 수 있는 데까지 하지 않아도 보기 싫지 않게 하기 위한 것이 아닌가 한다.","나는 허리와 두 가랑이 세 군데 다---고무밴드가 끼어 있는 부드러운 사루 마다를 입고 그리고 아무 소리없이 잘 놀았다.","어느덧 손수건만해졌던 볕이 나갔는데 아내는 외출에서 돌아오지 않는다.","나는 요만일에도 좀 피 곤하였고 또 아내가 돌아오기 전에 내 방으로 가 있어야 될 것을 생각하고 그만 내 방으로 건너간 다.","내 방은 침침하다.","나는 이불을 뒤집어쓰고 낮잠을 잔다."]],[["한번도 걷은 일이 없는 내 이부자리 는 내 몸뚱이의 일부분처럼 내게는 참 반갑다.","잠은 잘 오는 적도 있다.","그러나 또 전신이 까칫까칫하면서 영 잠이 오지 않는 적도 있다.","그런 때는 아무 제목으로나 제목을 하나 골라서 연구하였다.","나는 내 좀 축축한 이불속에서 참 여러가지 발명도 하였고 논문도 많이 썼다.","시도 많이 지었다.","그러나 그것들은 내가 잠이 드는 것과 동시에 내 방에 담겨서 철철 넘치는 그 흐늑흐늑한 공기 에 다 비누처럼 풀어져서 온데간데 없고, 한잠 자고 깨인 나는 속이 무명헝겊이나 메밀껍질로 띵띵 찬 한 덩어리 베개와도 같은 한 벌 신경이었을 뿐이고 뿐이고 하였다."]],[["그러기에 나는 빈대가 무엇보다도 싫었다.","그러나 내 방에서는 겨울에도 몇 마리의 빈대가 끊이지 않고 나왔다.","내게 근심이 있었다면 오직 이 빈대를 미워하는 근심일 것이다.","나는 빈대에게 물려 서 가려운 자리를 피가 나도록 긁었다.","쓰라리다.","그것은 그윽한 쾌감에 틀림없었다.","나는 혼곤히 잠이 든다."],["나는 그러나 그런 이불 속의 사색 생활에서도 적극적인 것을 궁리하는 법이 없다.","내게는 그럴 필요가 대체 없었다."]],[["만일 내가 그런 좀 적극적인 것을 궁리해내었을 경우에 나는 반드시 내 아내 와 의논하여야 할 것이고, 그러면 반드시 나는 아내에게 꾸지람을 들을 것이고---나는 꾸지람이 무서웠다느니 보다는 성가셨다.","내가 제법 한 사람의 사회인의 자격으로 일을 해 보는 것도 아내에게 사설 듣는 것도 나는 가장 게으른 동물처럼 게으른 것이 좋았다.","될 수만 있으면 이 무의미한 인간 의 탈을 벗어 버리고도 싶었다."]],[["나에게는 인간 사회가 스스러웠다.","생활이 스스러웠다.","모두가 서먹서먹할 뿐이었다."],["아내는 하루에 두 번 세수를 한다."],["나는 하루 한 번도 세수를 하지 않는다."],["나는 밤중 세 시나 네 시쯤 해서 변소에 갔다."]],[["달이 밝은 밤에는 한참씩 마당에 우두커니 섰다가 들어오곤 한다.","그러니까 나는 이 18 가구의 아무와도 얼굴이 마주치는 일이 거의 없다.","그러면서도 나는 이 18 가구의 젊은 여인네 얼굴들을 거반 다 기억하고 있었다.","그들은 하나 같이 내 아내만 못하였다."],["열한 시쯤 해서 하는 아내의 첫번 세수는 좀 간단하다.","그러나 저녁 일곱 시쯤해서 하는 두번째 세수는 손이 많이 간다.","아내는 낮에 보다도 밤에 더 좋고 깨끗한 옷을 입는다."]],[["그리고 낮에도 외출하고 밤에도 외출하였다."],["아내에게 직업이 있었던가?","나는 아내의 직업이 무엇인지 알 수 없다.","만일 아내에게 직업이 없었다면 같이 직업이 없는 나처럼 외출할 필요가 생기지 않을 것인데--- 아내는 외출한다.","외출할 뿐만 아니라 내객이 많다.","아내에게 내객이 많은 날은 나는 온종일 내 방에서 이불을 쓰고 누워 있어야만 된다."]],[["불장난도 못한다.","화장품 냄새도 못 맡는다.","그런 날은 나는 의식적으로 우울해 하였다.","그러면 아내는 나에게 돈을 준다.","오십전짜리 은화다.","나는 그것이 좋았다."],["그러나 그것을 무엇에 써야 옳을지 몰라서 늘 머리맡에 던져 두고 두고 한 것이 어느 결에 모여"],["서 꽤 많아졌다 어느날 이것을 본 아내는 금고처럼 생긴 벙어리를 사다 준다."]],[["나는 한푼씩 한푼씩 그 속에 넣고 열쇠는 아내가 가져갔다.","그후에도 나는 더러 은화를 그 벙어리에 넣은 것을 기억한다.","그리고 나는 게을렀다.","얼마 후 아내의 머리쪽에 보지 못하던 누깔잠이 하나 여드름처럼 돋았던 것은 바로 그 금고형 벙어리의 무게가 가벼워졌다는 증거일까.","그러나 나 는 드디어 머리맡에 놓았던 그 벙어리에 손을 대지 않고 말았다.","내 게으름은 그런 것에 내 주의를 환기시키기도 싫었다."]],[["아내에게 내객이 있는 날은 이불 속으로 암만 깊이 들어가도 비오는 날만큼 잠이 잘 오지 않았 다.","나는 그런 때 나에게 왜 늘 돈이 있나 왜 돈이 많은가를 연구했다.","내객들은 장지 저쪽에 내가 있는 것을 모르나보다.","내 아내와 나도 좀 하기 어려운 농을 아주 서슴지 않고 쉽게 해 던지는 것이다.","그러나 내 아내를 찾은 서너 사람의 내객들은 늘 비교적 점잖았다고 볼 수 있는 것이, 자정이 좀 지나면 으레 돌아들 갔다."]],[["그들 가운데에는 퍽 교양이 얕은 자도 있는 듯싶었는데, 그런 자는 보통 음식을 사다 먹고 논다.","그래서 보충을 하고 대체로 무사하였다.","나는 우선 아내의 직업이 무엇인가를 연구하기에 착수하였으나 좁은 시야와 부족한 지식으로는 이것을 알아내기 힘이 든다.","나는 끝끝내 내 아내의 직업이 무엇인가를 모르고 말려나보다."],["아내는 늘 진솔 버선만 신었다.","아내는 밥도 지었다.","아내가 밥을 짓는 것을 나는 한번도 구경한 일은 없으나 언제든지 끼니때면 내 방으로 내 조석밥을 날라다 주는 것이다."]],[["우리집에는 나와 내 아내 외의 다른 사람은 아무도 없다.","이 밥은 분명 아내가 손수 지었음에 틀림없다."],["그러나 아내는 한 번도 나를 자기 방으로 부른 일은 없다.","나는 늘 웃방에서나 혼자서 밥을 먹고 잠을 잤다."],["밥은 너무 맛이 없었다.","반찬이 너무 엉성하였다.","나는 닭이나 강아지처럼 말없이 주는 모이를 넓적넓적 받아먹기는 했으나 내심 야속하게 생각한 적도 더러 없지 않다."]],[["나는 안색이 여지없이 창백해가면서 말라 들어갔다.","나날이 눈에 보이듯이 기운이 줄어들었다.","영 양 부족으로 하여 몸뚱이 곳곳의 뼈가 불쑥불쑥 내어 밀었다.","하룻밤 사이에도 수십 차를 돌쳐 눕지 않고는 여기저기가 배겨서 나는 배겨낼 수가 없었다."],["그렇기 때문에 나는 내 이불 속에서 아내가 늘 흔히 쓸 수 있는 저 돈의 출처를 탐색해 내는 일 변 장지 틈으로 새어나오는 아랫방의 음성은 무엇일까를 간단히 연구하였다."]],[["나는 잠이 잘 안 왔다."],["깨달았다.","아내가 쓰는 그 돈은 내게는 다만 실없는 사람들로밖에 보이지 않는 까닭 모를 내객들 이 놓고 가는 것이 틀림없으리라는 것을 깨달았다."],["그러나 왜 그들 내객은 돈을 놓고 가나?","왜 내 아내는 그 돈을 받아야 되나?","하는 예의 관념이 내게는 도무지 알 수 없는 것이었다."]],[["그것은 그저 예의에 지나지 않는 것일까?","그렇지 않으면 혹 무슨 댓가일까?","보수일까?","내 아 내가 그들의 눈에는 동정을 받아야만 할 한 가엾은 인물로 보였던가?","이런 것들을 생각하노라면 으레 내 머리는 그냥 혼란하여 버리고 버리고 하였다.","잠들기 전에 획득했다는 결론이 오직 불쾌하다는 것뿐이었으면서도 나는 그런 것을 아내에게 물어 보거나 한 일이 참 한 번도 없다.","그것은 대체 귀찮기도 하려니와 한잠 자고 일어나는 나는 사뭇 딴 사람처럼 이것 도 저것도 다 깨끗이 잊어버리고 그만 두는 까닭이다."]],[["내객들이 돌아가고, 혹 외출에서 돌아오고 하면 아내는 간편한 것으로 옷을 바꾸어 입고 내 방으로 나를 찾아온다.","그리고 이불을 들치고 내 귀에는 영 생동생동한 몇 마디 말로 나를 위로하려든 다.","나는 조소도 고소도 홍소도 아닌 옷음을 얼굴에 띠고 아내의 아름다운 얼굴을 쳐다본다.","아내 는 방그레 웃는다.","그러나 그 얼굴에 떠도는 일말의 애수를 나는 놓치지 않는다."],["아내는 능히 내가 배고파하는 것을 눈치챌 것이다."]],[["그러나 아랫방에서 먹고 남은 음식을 나에게 주려 들지는 않는다.","그것은 어디까지든지 나를 존경하는 마음일 것임에 틀림없다.","나는 배가 고프면서도 적이 마음이 든든한 것을 좋아했다.","아내가 무엇이라고 지껄이고 갔는지 귀에 남아 있을 리 가 없다.","다만 내 머리맡에 아내가 놓고 간 은화가 전등불에 흐릿하게 빛나고 있을 뿐이다."],["고 금고형 벙어리 속에 은화가 얼마만큼이나 모였을까?","나는 그러나 그것을 쳐들어 보지 않았"]],[["다.","그저 아무런 의욕도 기원도 없이 그 단추구멍처럼 생긴 틈바구니로 은화를 떨어뜨려 둘 뿐이었다."],["왜 아내의 내객들이 아내에게 돈을 놓고 가나 하는 것이 풀 수 없는 의문인 것같이, 왜 아내는 나에게 돈을 놓고 가나 하는 것도 역시 나에게는 똑같이 풀 수 없는 의문이었다."],["내 비록 아내가 내게 돈을 놓고 가는 것이 싫지 않았다 하더라도 그것은 다만 고것이 내 손가락 닿는 순간에서부터 고 벙어리 주둥이에서 자취를 감추기까지의 하잘것 없는 짧은 촉각이 좋았달 뿐이 지 그 이상 아무 기쁨도 없다."]],[["어느날 나는 고 벙어리를 변소에 갖다 넣어 버렸다.","그 때 벙어리 속에는 몇 푼이나 되는지 모르겠으나 고 은화들이 꽤 들어 있었다."],["나는 내가 지구 위에 살며 내가 이렇게 살고 있는 지구가 질풍신뢰의 속력으로 광대무변의 공간 을 달리고 있다는 것을 생각했을 때 참 허망하였다.","나는 이렇게 부지런한 지구 위에서는 현기증도 날 것 같고 해서 한시바삐 내려 버리고 싶었다."]],[["이불 속에서 이런 생각을 하고 난 뒤에는 나는 고 은화를 고 벙어리에 넣고 넣고 하는 것조차 귀찮아졌다.","나는 아내가 손수 벙어리를 사용하였으면 하고 생각하였다."],["벙어리도 돈도 사실은 아내에게만 필요한 것이지 내게는 애초부터 의미가 전연 없는 것이었으니까 될 수만 있으면 그 벙어리를 아내는 아내 방으로 가져 갔으면 하고 기다렸다."]],[["그러나 아내는 가져가지 않는다.","나는 내가 아내 방으로 가져다 둘까 하고 생각하여 보았으나 그 즈음에는 아내의 내객이 워낙 많아서 내가 아내 방에 가 볼 기회가 도무지 없었다.","그래서 나는 하 는 수 없이 변소에 갖다 집어 넣어 버리고 만 것이다."],["나는 서글픈 마음으로 아내의 꾸지람을 기다렸다.","그러나 아내는 끝내 아무 말도 하지 않았다.","않았을 뿐 아니라 여전히 돈은 돈대로 머리맡에 놓고 가지 않나!"]],[["내 머리맡에는 어느덧 은화가"],["꽤 많이 모였다."],["내객이 아내에게 돈을 놓고 가는 것이나 아내가 내게 돈을 놓고 가는 것이나 일종의 쾌감---그 외의 다른 아무런 이유도 없는 것이 아닐까 하는 것을 나는 또 이불 속에서 연구하기 시작하였다."],["쾌감이라면 어떤 종류의 쾌감일까를 계속하여 연구하였다."]],[["그러나 그것은 이불 속의 연구로는 알 길이 없었다.","쾌감, 쾌감, 하고 나는 뜻밖에도 이 문제에 대해서만 흥미를 느꼈다."],["아내는 물론 나를 늘 감금하여 두다시피 하여 왔다.","내게 불평이 있을 리 없다.","그런 중에도 나는 그 쾌감이라는 것의 유무를 체험하고 싶었다."],["나는 아내의 밤 외출 틈을 타서 밖으로 나왔다.","나는 거리에서 잊어버리지 않고 가지고 나온 은화를 지폐로 바꾼다."]],[["오 원이나 된다.","그것을 주머니에 넣고 나는 목적지를 잃어버리기 위하여 얼마든지 거리를 쏘다녔다.","오래간만에 보는 거리는 거의 경이에 가까울 만큼 내 신경을 흥분시키지 않고는 마지 않았다.","나는 금시에 피곤하여 버렸다."],["그러나 나는 참았다.","그리고 밤이 이슥하도록 까닭을 잃어버린 채 이 거리 저 거리로 지향없이 헤매었다.","돈은 물론 한 푼도 쓰지 않았다.","돈을 쓸 아무 엄두도 나서지 않았다.","나는 벌써 돈을 쓰는 기능을 완전히 상실한 것 같았다."]],[["나는 과연 피로를 이 이상 견디기가 어려웠다.","나는 가까스로 내 집을 찾았다.","나는 내 방을 가려면 아내 방을 통과하지 않으면 안 될 것을 알고, 아내에게 내객이 있나 없나를 걱정하면서 미닫이 앞에서 좀 거북살스럽게 기침을 한 번 했더니, 이것은 참 또 너무도 암상스럽게 미닫이가 열리면서 아내의 얼굴과 그 등 뒤에 낯설은 남자의 얼굴이 이쪽을 내다보는 것이다.","나는 별안간 내어 쏟아지는 불빛에 눈이 부셔서 좀 머뭇머뭇했다."]],[["나는 아내의 눈초리를 못 본 것은 아니다.","그러나 나는 모른 체하는 수 밖에 없었다."],["왜?","나는 어쨌든 아내의 방을 통과하지 아니하면 안 되니까……."],["나는 이불을 뒤집어썼다.","무엇보다도 다리가 아파서 견딜 수가 없었다."],["이불 속에서는 가슴이 울렁거리면서 암만해도 까무러칠 것만 같았다."]],[["걸을 때는 몰랐더니 숨이 차다.","등에 식은땀이 쭉 내배인다.","나는 외출한 것을 후회하였다.","이런 피로를 잊고 어서 잠이 들었으면 좋았다.","한잠 잘 자고 싶었다."],["얼마동안이나 비스듬히 엎드려 있었더니 차츰차츰 뚝딱 거리는 가슴 동계가 가라앉는다.","그만해 도 우선 살 것 같았다.","나는 몸을 들쳐 반듯이 천장을 향하여 눕고 쭈욱 다리를 뻗었다."]],[["그러나 나는 또 다시 가슴의 동계를 피할 수 없게 되었다.","아랫방에서 아내와 그 남자의 내 귀에 도 들리지 않을 만큼 낮은 목소리로 소곤거리는 기척이 장지 틈으로 전하여 왔던 것이다.","청각을 더 예민하게 하기 위하여 나는 눈을 떴다.","그리고 숨을 죽였다."],["그러나 그 때는 벌써 아내와 남자는 앉았던 자리를 툭툭 털고 일어섰고 일어서면서 옷과 모자"]],[["쓰는 기척이 나는 듯하더니 이어 미닫이가 열리고 구두 뒤축 소리가 나고 그리고 뜰에 내려서는 소리 가 쿵 하고 나면서 뒤를 따르는 아내의 고무신 소리가 두어 발짝 찍찍나고 사뿐사뿐 나나 하는 사 이에 두사람의 발소리가 대문 쪽으로 사라졌다."],["나는 아내의 이런 태도를 본 일이 없다.","아내는 어떤 사람과도 결코 소곤거리는 법이 없다.","나는 웃방에서 이불을 쓰고 누웠는 동안에도 혹 술이 취해서 혀가 잘 돌아가지 않는 내객들의 담화는 더러 놓치는 수가 있어도 아내의 높지도 낮지도 않은 말소리는 일찌기 한마디도 놓쳐 본 일이없다."]],[["더러 내 귀에 거슬리는 소리가 있어도 나는 그것이 태연한 목소리로 내 귀에 들렸다는 이유로 충 분히 안심이 되었다."],["그렇던 아내의 이런 태도는 필시 그 속에 여간하지 않은 사정이 있는 듯 시피 생각이 되고 내 마 음은 좀 서운했으나 그보다도 나는 좀 너무 피로해서 오늘만은 이불 속에서 아무것도 연구하지 않기로 굳게 결심하고 잠을 기다렸다.","낮잠은 좀처럼 오지 않았다.","대문간에 나간 아내도 좀처럼 들어오지 않았다."]],[["그러는 동안에 흐지부지 나는 잠이 들어 버렸다.","꿈이 얼쑹덜쑹 종을 잡을 수 없는 거리의 풍경을 여전히 헤매었다."],["나는 몹시 흔들렸다.","내객을 보내고 들어온 아내가 잠든 나를 잡아 흔드는 것이다.","나는 눈을 번 쩍 뜨고 아내의 얼굴을 쳐다보았다.","아내의 얼굴에는 웃음이 없다.","나는 좀 눈을 비비고 아내의 얼굴을 자세히 보았다.","노기가 눈초리에 떠서 얇은 입술이 바르르 떨린다.","좀처럼 이 노기가 풀리기 는 어려울 것 같았다."]],[["나는 그대로 눈을 감아 버렸다.","벼락이 내리기를 기다린 것이다.","그러나 쌔 근 하는 숨소리가 나면서 부스스 아내의 치맛자락 소리가 나고 장지가 여닫히며 아내는 아내 방으로 돌아갔다."],["나는 다시 몸을 돌쳐 이불을 뒤집어쓰고는 개구리처럼 엎드리고 엎드려서 배가 고픈 가운데도 오 늘 밤의 외출을 또 한 번 후회하였다."],["나는 이불 속에서 아내에게 사죄하였다."]],[["그것은 네 오해라고……","나는 사실 밤이 퍽으나 이슥한 줄만 알았던 것이다.","그것이 네 말마따나 자정 전인지는 정말이지 꿈에도 몰랐다.","나는 너무 피곤하였다.","오래간만에 나는 너무 많이 걸은 것이 잘못이다."],["내 잘못이라면 잘못은 그것 밖에 없다.","외출은 왜 하였더냐고?","나는 그 머리맡에 저절로 모인"],["오 원 돈을 아무에게라도 좋으니 주어 보고 싶었던 것이다."]],[["그 뿐 이다.","그러나 그것도 내 잘못이라면 나는 그렇게 알겠다.","나는 후회하고 있지 않나?","내가 그 오 원 돈을 써 버릴 수가 있었던들 나는 자정 안에 집에 돌아올 수 없었을 것이다.","그러나 거리는 너무 복잡하였고 사람은 너무도 들끓었다.","나는 어느 사람을 붙들고 그 오 원 돈을 내어 주어야할지 갈피를 잡을 수가 없었다.","그러는 동안에 나는 여지없이 피곤해 버리고 말았던 것이다."],["나는 무엇보다도 좀 쉬고 싶었다."]],[["눕고 싶었다.","그래서 나는 하는 수 없이 집으로 돌아온 것이 다.","내 짐작 같아서는 밤이 어지간히 늦은 줄만 알았는데, 그것이 불행히도 자정 전이었다는 것은 참 안된 일이다.","미안한 일이다.","나는 얼마든지 사죄하여도 좋다.","그러나 종시 아내의 오해"],["를 풀 지 못하였다 하면 내가 이렇게까지 사죄하는 보람은 그럼 어디 있나?","한심하였다."]],[["한 시간 동안을 나는 이렇게 초조하게 굴지 않으면 안 되었다.","나는 이불을 홱 젖혀 버리고 일어나서 장지를 열고 아내 방으로 비칠비칠 달려갔던 것이다.","내게는 거의 의식이라는 것이 없었다."],["나는 아내 이불 위에 엎드러지면서 바지 포켓 속에서 그 돈 오 원을 꺼내 아내 손에 쥐어 준 것을 간신히 기억할 뿐이다."],["이튿날 잠이 깨었을 때 나는 내 아내 방 아내 이불 속에 있었다."]],[["이것이 이 33번지에서 살기 시작한 이래 내가 아내 방에서 잔 맨 처음이었다."],["해가 들창에 훨씬 높았는데 아내는 이미 외출하고 벌써 내 곁에 있지는 않다. 아니!","아내는 엊저녁 내가 의식을 잃은 동안에 외출한 것인지도 모른다.","그러나 나는 그런 것을 조사하고 싶지 않았다.","다만 전신이 찌뿌드드한 것이 손가락 하나 꼼짝할 힘조차 없었다.","책보보다 좀 작은 면적의 볕 이 눈이 부시다.","그 속에서 수없이 먼지가 흡사 미생물처럼 난무한다."]],[["코가 콱 막히는 것 같다.","나 는 다시 눈을 감고 이불을 푹 뒤집어쓰고 낮잠을 자기에 착수하였다.","그러나 코를 스치는 아내의 체취는 꽤 도발적이었다.","나는 몸을 여러번 여러번 비비꼬면서 아내의 화장대에 늘어선 고 가지각색 화장품 병들의 마개를 뽑았을 때 풍기는 냄새를 더듬느라고 좀처럼 잠은 들지"],["않는 것을 나는 어찌하는 수도 없었다."]],[["견디다못하여 나는 그만 이불을 걷어차고 벌떡 일어나서 내 방으로 갔다.","내 방에는 다 식어빠진 내 끼니가 가지런히 놓여 있는 것이다.","내 방에는 다 식어 빠진 내 끼니가 가지런히 놓여 있는 것이다.","아내는 내 모이를 여기다 두고 나간 것이다.","나는 우선 배가 고팠다.","한 숟갈을 입에 떠 넣었을 때 그 촉감은 참 너무도 냉회와 같이 써늘하였다.","나는 숟갈을 놓고 내 이불 속으로 들어갔다.","하룻밤을 비었던 내 이부자리는 여전히 반갑게 나를 맞아 준다.","나는 내 이불을 뒤집어쓰고 이 번에는 참 늘어지게 한잠 잤다."]],[["잘----"],["내가 잠을 깬 것은 전등이 켜진 뒤다.","그러나 아내는 아직도 돌아오지 않았나보다."],["아니!","돌아왔다 또 나갔는지 알 수 없다.","그러나 그런 것을 상고하여 무엇하나?","정신이 한결 난다.","나는 밤일을 생각해 보았다.","그 돈 오 원을 아내 손에 쥐어 주고 넘어졌을 때에 느낄 수 있었던 쾌감을 나는 무엇이라고 설명할 수가 없었다.","그러나 내객들이 내 아내에게 돈 놓고 가는 심리며 내 아내가 내게 돈 놓고 가는 심리의 비밀을 나는 알아낸 것 같아서 여간 즐거운 것이 아니다."]],[["나는 속으로 빙그레 웃어 보았다."],["이런 것을 모르고 오늘까지 지내온 내 자신이 어떻게 우스꽝스럽게 보이는지 몰랐다."],["따라서 나는 또 오늘 밤에도 외출하고 싶었다.","그러나 돈이 없다.","나는 또 엊저녁에 그 돈 오 원 을 한꺼번에 아내에게 주어 버린 것을 후회하였다.","또 고 벙어리를 변소에 갖다 쳐넣어 버린 것도 후회하였다.","나는 실없이 실망하면서 습관처럼 그 돈 오 원이 들어 있던 내 바지 포켓에 손을 넣어 한번 휘둘러 보았다."]],[["뜻밖에도 내 손에 쥐어지는 것이 있었다.","이 원 밖에 없다.","그러나 많아야 맛 은 아니다.","얼마간이고 있으면 된다.","나는 그만한 것이 여간 고마운 것이 아니었다."],["나는 기운을 얻었다.","나는 그 단벌 다 떨어진 골덴 양복을 걸치고 배고픈 것도 주제 사나운 것도 다 잊어버리고 활갯짓을 하면서 또 거리로 나섰다.","나서면서 나는 제발 시간이 화살 단듯해서 자정 이 어서 홱 지나 버렸으면 하고 조바심을 태웠다."]],[["아내에게 돈을 주고 아내 방에서 자 보는 것은 어디까지든지 좋았지만 만일 잘못해서 자정 전에 집에 들어갔다가 아내의 눈총을 맞는 것은 그것은 여간 무서운 일이 아니었다."],["나는 저물도록 길가 시계를 들여다보고 들여다보고 하면서 또 지향없이 거리를 방황하였다.","그러나 이날은 좀처럼 피곤하지는 않았다.","다만 시간이 좀 너무 더디게 가는 것만 같아서 안타까웠다."]],[["경성역(京城驛) 시계가 확실히 자정을 지난 것을 본 뒤에 나는 집을 향하였다.","그날은 그 일각"],["대 문에서 아내와 아내의 남자가 이야기하고 섰는 것을 만났다.","나는 모른 체하고 두 사람 곁을 지나 서 내 방으로 들어갔다.","뒤이어 아내도 들어왔다.","와서는 이 밤중에 평생 안 하던 쓰레질을 하는 것이었다.","조금 있다가 아내가 눕는 기척을 엿보자마자 나는 또 장지를 열고 아내 방으로 가서 그 돈 이 원을 아내 손에 덥석 쥐어 주고 그리고---하여간 그 이 원을 오늘 밤에도 쓰지"]],[["않고 도로 가 져 온 것이 참 이상하다는 듯이 아내는 내 얼굴을 몇번이고 엿보고---아내는 드디어 아무 말도 없이"],["나를 자기 방에 재워 주었다.","나는 이 기쁨을 세상의 무엇과도 바꾸고 싶지는 않았다."],["나는 편히 잘 잤다."],["이튿날도 내가 잠이 깨었을 때는 아내는 보이지 않았다."]],[["나는 또 내 방으로 가서 피곤한 몸이 낮잠을 잤다.","내가 아내에게 흔들려 깨었을 때는 역시 불이 들어온 뒤였다.","아내는 자기 방으로 나를 오라는 것이다.","이런 일은 또 처음이다.","아내는 끊임없이 얼굴에 미소를 띠고 내 팔을 이끄는 것이 다.","나는 이런 아내의 태도 이면에 엔간치 않은 음모가 숨어 있지나 않은가 하고 적이 불안을 느끼지 않을 수 없었다."],["나는 아내의 하자는 대로 아내의 방으로 끌려 갔다."]],[["아내 방에는 저녁 밥상이 조촐하게 차려져 있는 것이다.","생각하여 보면 나는 이틀을 굶었다.","나는 지금 배고픈 것까지도 긴가민가 잊어버리고 어름어름하던 차다."],["나는 생각하였다.","이 최후의 만찬을 먹고 나자마자 벼락이 내려도 나는 차라리 후회하지 않을 것 을.","사실 나는 인간 세상이 너무나 심심해서 못 견디겠던 차다.","모든 것이 성가시고 귀찮았으나 그러나 불의의 재난이라는 것은 즐겁다."]],[["나는 마음을 턱 놓고 조용히 아내와 마주 이 해괴한 저녁밥을 먹었다."],["우리 부부는 이야기하는 법이 없었다.","밥을 먹은 뒤에도 나는 말이 없이 부스스 일어나서 내 방 으로 건너가 버렸다.","아내는 나를 붙잡지 않았다.","나는 벽에 기대어 앉아서 담배를 한 대 피워 물 고 그리고 벼락이 떨어질 테거든 어서 떨어져라 하고 기다렸다."],["오 분!"]],[["십 분!"],["그러나 벼락은 내리지 않았다.","긴장이 차츰 풀어지기 시작한다.","나는 어느덧 오늘 밤에도 외출할 것을 생각하고 있었다.","돈이 있었으면 하고 생각하고 있었다."],["그러나 돈은 확실히 없다.","오늘은 외출하여도 나중에 올 무슨 기쁨이 있나?","내 앞이 그저 아뜩"],["하였다.","나는 화가 나서 이불을 뒤집어쓰고 이리 뒹굴 저리 뒹굴 굴렀다."]],[["금 시 먹은 밥이 목으로 자꾸 치밀어 올라온다.","메스꺼웠다."],["하늘에서 얼마라도 좋으니 왜 지폐가 소낙비처럼 퍼붓지 않나?","그것이 그저 한없이 야속하고슬펐다."],["나는 이렇게 밖에 돈을 구하는 아무런 방법도 알지는 못했다.","나는 이불 속에서 좀 울었나 보다.","왜 없느냐면서……"]],[["그랬더니 아내가 또 내 방에를 왔다.","나는 깜짝 놀라 아마 이제서야 벼락이 내리려 나보다 하고 숨을 죽이고 두꺼비 모양으로 엎드려 있었다.","그러나 떨어진 입을 새어나오는 아내의 말소리는 참 부드러웠다.","정다웠다.","아내는 내가 왜 우는지를 안다는 것이다.","돈이 없어서 그러는 게 아니란다."],["나는 실없이 깜짝 놀랐다.","어떻게 사람의 속을 환하게 들여다보는고 해서 나는 한편으로 슬그머니 겁도 안나는 것은 아니었으나 저렇게 말하는 것을 보면 아마 내게 돈을 줄 생각이 있나보다, 만일 그렇다면 오죽이나 좋은 일일까."]],[["나는 이불 속에 뚤뚤 말린 채 고개도 들지 않고 아내의 다음 거동 을 기다리고 있으니까 '옜소'하고 내 머리맡에 내려뜨리는 것은 그 가뿐한 음향으로 보"],["아 지폐에 틀림없었다.","그리고 내 귀에다 대고 오늘을랑 어제보다도 늦게 돌아와도 좋다고 속삭이는 것이다."],["그것은 어렵지 않다.","우선 그 돈이 무엇보다도 고맙고 반가웠다."]],[["어쨌든 나섰다.","나는 좀 야맹증이다.","그래서 될 수 있는 대로 밝은 거리로 돌아다니기로 했다.","그리고는 경성역 일 이등 대합실 한곁 티이루움에를 들렀다.","그것은 내게는 큰 발견이었다.","거기는 우선 아무도 아는 사람이 안 온다.","설사 왔다가도 곧 돌아가니까 좋다.","나는 날마다 여기 와서 시간 을 보내리라 속으로 생각하여 두었다.","제일 여기 시계가 어느 시계보다도 정확하리라는 것이 좋았다.","섣불리 서투른 시계를 보고 그것을 믿고 시간 전에 집에 돌아갔다가 큰 코를 다쳐서는 안된다."]],[["나는 한 복스에 아무것도 없는 것과 마주 앉아서 잘 끓은 커피를 마셨다.","총총한 가운데 여객들 은 그래도 한 잔 커피가 즐거운가보다.","얼른얼른 마시고 무얼 좀 생각하는 것같이 담벼락도 좀 쳐다보고 하다가 곧 나가 버린다.","서글프다.","그러나 내게는 이 서글픈 분위기가 거리의 티이루움들의 그 거추장스러운 분위기보다는 절실하고 마음에 들었다.","이따금 들리는 날카로운 혹은 우렁찬 기적 소리가 모오짜르트보다도 더 가깝다."]],[["나는 메뉴에 적힌 몇가지 안 되는 음식 이름을 치읽고 내리읽고 여러번 읽었다.","그 것들은 아물아물하는 것이 어딘가 내 어렸을 때 동무들 이름과 비슷한 데가 있었다."],["거기서 얼마나 내가 오래 앉았는지 정신이 오락가락하는 중에 객이 슬며시 뜸해지면서 이 구석 저 구석 걷어치우기 시작하는 것을 보면 아마 닫는 시간이 된 모양이다.","열 한 시가 좀 지났구나, 여기도 결코 내 안주의 곳은 아니구나, 어디 가서 자정을 넘길까?"]],[["두루 걱정을 하면서 나는 밖으로 나섰다.","비가 온다."],["빗발이 제법 굵은 것이 우비도 우산도 없는 나를 고생을 시킬 작정이다.","그렇다고 이런 괴이한 풍모를 차리고 이 홀에서 어물어물하는 수도 없고 에이 비를 맞으면 맞았지 하고 그냥 나서 버렸다."],["대단히 선선해서 견딜 수가 없다.","골덴 옷이 젖기 시작하더니 나중에는 속속들이 스며들면서 추근거린다."]],[["비를 맞아 가면서라도 견딜 수 있는 데까지 거리를 돌아다녀서 시간을 보내려 하였으나, 인제는 선선해서 이 이상은 더 견딜 수가 없다.","오한이 자꾸 일어나면서 이가 딱딱 맞부딪는다.","나는 걸음을 늦추면서 생각하였다.","오늘 같은 궂은 날도 아내에게 내객이 있을라구?","없겠지, 하는 생각이 드는 것이다."],["집으로 가야겠다.","아내에게 불행히 내객이 있거든 내 사정을 하리라.","사정을 하면 이렇게 비가 오는 것을 눈으로 보고 알아 주겠지."]],[["부리나케 와 보니까 그러나 아내에게는 내객이 있었다.","나는 너무 춥고 척척해서 얼떨김에 노크 하는 것을 잊었다.","그래서 나는 보면 아내가 덜 좋아할 것을 그만 보았다."],["나는 감발자국 같은 발자국을 내면서 덤벙덤벙 아내 방을 디디고 내 방으로 가서 쭉 빠진 옷을 활활 벗어 버리고 이불을 뒤썼다.","덜덜덜덜 떨린다.","오한이 점점 더 심해 들어온다.","여전 땅이 꺼져들어가는 것만 같았다.","나는 그만 의식을 잃어버리고 말았다."]],[["이튿날 내가 눈을 떴을 때 아내는 내 머리맡에 앉아서 제법 근심스러운 얼굴이다."],["나는 감기가 들었다.","여전히 으스스 춥고 또 골치가 아프고 입에 군침이 도는 것이 씁쓸하면서 다리 팔이 척 늘어져서 노곤하다.","아내는 내 머리를 쓱 짚어 보더니 약을 먹어야지 한다.","아내 손 이 이마에 선뜻한 것을 보면 신열이 어지간한 모양인데 약을 먹는다면 해열제를 먹어야지 하고 속 생각을 하자니까 아내는 따뜻한 물에 하얀 정제약 네 개를 준다."]],[["이것을 먹고 한잠 푹 자고 나면 괜찮다는 것이다.","나는 널름 받아먹었다.","쌉싸름한 것이 짐작 같아서는 아마 아스피린인가 싶다."],["나는 다시 이불을 쓰고 단번에 그냥 죽은 것처럼 잠이 들어 버렸다."],["나는 콧물을 훌쩍훌쩍 하면서 여러 날을 앓았다.","앓는 동안에 끊이지 않고 그 정제약을 먹었다.","그러는 동안에 감기도 나았다.","그러나 입맛은 여전히 소태처럼 썼다."]],[["나는 차츰 또 외출하고 싶은 생각이 났다.","그러나 아내는 나더러 외출하지 말라고 이르는 것이 다.","이 약을 날마다 먹고 그리고 가만히 누워 있으라는 것이다.","공연히 외출을 하다가 이렇게 감기 가 들어서 저를 고생시키는게 아니란다.","그도 그렇다.","그럼 외출을 하지 않겠다고 맹세하고 그 약을 연복하여 몸을 좀 보해 보리라고 나는 생각하였다."],["나는 날마다 이불을 뒤집어쓰고 밤이나 낮이나 잤다.","유난스럽게 밤이나 낮이나 졸려서 견딜 수 가 없는 것이다."]],[["나는 이렇게 잠이 자꾸만 오는 것은 내가 몸이 훨씬 튼튼해진 증거라고 굳게 믿었다."],["나는 아마 한 달이나 이렇게 지냈나보다.","내 머리와 수염이 좀 너무 자라서 후틋해서 견딜 수가 없어서 내 거울을 좀 보리라고 아내가 외출한 틈을 타서 나는 아내 방으로 가서 아내의 화장대 앞 에 앉아 보았다.","상당하다.","수염과 머리가 참 상당하였다."]],[["오늘은 이발을 좀 하리라고 생각하고 겸사겸사 고 화장품 병들 마개를 뽑고 이것저것 맡아 보았다.","한동안 잊어버렸던 향기 가운데서는 몸이 배배 꼬일 것 같은 체취가 전해 나왔다.","나는 아내의 이름을 속으로만 한 번 불러 보았다.","\"연심이---\"하고……","오래간만에 돋보기 장난도 하였"],["다.","거울 장난도 하였다.","창에 든 볕이 여간 따뜻한 것이 아니었다.","생각하면 오월이 아니냐."]],[["나는 커다랗게 기지개를 한 번 켜 보고 아내 베개를 내려 베고 벌떡 자빠져서는 이렇게도 편안"],["하고 즐거운 세월을 하느님께 흠씬 자랑하여 주고 싶었다.","나는 참 세상의 아무것과도 교섭을 가지지 않는다.","하느님도 아마 나를 칭찬할 수도 처벌할 수도 없는 것 같다."],["그러나 다음 순간 실로 세상에도 이상스러운 것이 눈에 띄었다.","그것은 최면약 아달린갑이었다."]],[["나는 그것을 아내의 화장대 밑에서 발견하고 그것이 흡사 아스피린처럼 생겼다고 느꼈다.","나는 그 것을 열어 보았다.","꼭 네 개가 비었다."],["나는 오늘 아침에 네 개의 아스피린을 먹은 것을 기억하고 있었다.","나는 잤다.","어제도 그제도 그끄제도……나는 졸려서 견딜 수가 없었다.","나는 감기가 다 나았는데도……","아내는 내게 아스피린을 주었다.","내가 잠이 든 동안에 이웃에 불이 난 일이 있다.","그때에도 나는 자느라고 몰랐다."]],[["이렇게 나는 잤다.","나는 아스피린으로 알고 그럼 한 달 동안을 두고 아달린을 먹 어 온 것이다.","이것은 좀 너무 심하다."],["별안간 아뜩하더니 하마터면 나는 까무러칠 뻔하였다.","나는 그 아달린을 주머니에 넣고 집을 나섰다.","그리고 산을 찾아 올라갔다."],["인간 세상의 아무것도 보기가 싫었던 것이다.","걸으면서 나는 아무쪼록 아내에 관계되는 일은 일 체 생각하지 않도록 노력하였다."]],[["길에서 까무러치기 쉬우니까다.","나는 어디라도 양지가 바른 자리를 하나 골라 자리를 잡아 가지고 서서히 아내에 관하여서 연구할 작정이었다.","나는 길가의 돌 장판, 구경도 못한 진개나리꽃, 종달새, 돌멩이도 새끼를 까는 이야기, 이런 것만 생각하였"],["다.","다행히 길 가에서 나는 졸도하지 않았다."],["거기는 벤치가 있었다.","나는 거기 정좌하고 그리고 그 아스피린과 아달린에 관하여 연구하였다."]],[["그러나 머리가 도무지 혼란하여 생각이 체계를 이루지 않는다.","단 오 분이 못가서 나는 그만 귀찮은 생각이 번쩍 들면서 심술이 났다.","나는 주머니에서 가지고 온 아달린을 꺼내 남은 여섯 개를 한꺼번에 질겅질겅 씹어먹어 버렸다.","맛이 익살맞다.","그리고 나서 나는 그 벤치 위에 가로 기다랗게 누웠다.","무슨 생각으로 내가 그 따위 짓을 했나, 알 수가 없다.","그저 그러고 싶었다.","나는 게서 그 냥 깊이 잠이 들었다.","잠결에도 바위 틈으로 흐르는 물소리가 졸졸 하고 언제까지나 귀에 어렴풋이 들려 왔다."]],[["내가 잠을 깨었을 때는 날이 환히 밝은 뒤다.","나는 거기서 일주야를 잔 것이다.","풍경이 그냥 노오랗게 보인다.","그 속에서도 나는 번개처럼 아스피린과 아달린이 생각났다."],["아스피린, 아달린, 아스피린, 아달린, 마르크, 말사스, 마도로스, 아스피린, 아달린……","아내는 한 달 동안 아달린을 아스피린이라고 속이고 내게 먹였다."],["그것은 아내 방에서 이 아달린 갑이 발견된 것으로 미루어 증거가 너무나 확실하다."]],[["무슨 목적으로 아내는 나를 밤이나 낮이나 재웠어야 됐나?","나를 밤이나 낮이나 재워 놓고, 그리고 아내는 내가 자는 동안에 무슨 짓을 했나?","나를 조금씩 조 금씩 죽이려던 것일까?","그러나 또 생각하여 보면 내가 한 달을 두고 먹어 온 것이 아스피린이었는지도 모른다.","아내는 무슨 근심되는 일이 있어서 밤이면 잠이 잘 오지 않아서 정작 아내가 아달린을 사용한 것이나 아닌지?","그렇다면 나는 참 미안하다.","나는 아내에게 이렇게 큰 의혹을 가졌다는 것이 참 안됐다."]],[["나는 그래서 부리나케 거기서 내려왔다.","아랫도리가 홰홰 내어 저이면서 어찔어찔한 것을 나는 겨 우 집을 향하여 걸었다.","여덟 시 가까이였다."],["나는 내 잘못된 생각을 죄다 일러바치고 아내에게 사죄하려는 것이다.","나는 너무 급해서 그만 또 말을 잊어버렸다.","그랬더니 이건 참 큰일났다.","나는 내 눈으로 절대로 보아서 안될 것을 그만 딱 보아 버리고 만 것이다."]],[["나는 얼떨결에 그만 냉큼 미닫이를 닫고 그리고 현기증이 나는 것을 진정시키느라고 잠깐 고개를 숙이고 눈을 감고 기둥을 짚고 섰자니까, 일 초 여유도 없이 홱 미닫이가 다시 열리더니 매무새를 풀어헤친 아내가 불쑥 내밀면서 내 멱살을 잡는 것이다.","나는 그만 어지러워서 게가 나둥그러졌다."],["그랬더니 아내는 넘어진 내위에 덮치면서 내 살을 함부로 물어뜯는 것이다.","아파 죽겠다.","나는 사 실 반항할 의사도 힘도 없어서 그냥 넙적 엎드려 있으면서 어떻게 되나 보고 있자니까, 뒤이어 남자가 나오는 것 같더니 아내를 한아름에 덥석 안아 가지고 방으로 들어가는 것이다."]],[["아내는 아무 말 없이 다소곳이 그렇게 안겨 들어가는 것이 내 눈에 여간 미운 것이 아니다. 밉다."],["아내는 너 밤새워 가면서 도둑질하러 다니느냐, 계집질하러 다니느냐고 발악이다.","이것은 참 너무 억울하다.","나는 어안이 벙벙하여 도무지 입이 떨어지지를 않았다.","너는 그야말로 나를 살해하려 던 것이 아니냐고 소리를 한 번 꽥 질러 보고도 싶었으나, 그런 긴가민가한 소리를 섣불리 입밖에 내었다가는 무슨 화를 볼는지 알 수 없다."]],[["차라리 억울하지만 잠자코 있는 것이 우선 상책인 듯시피 생각이 들길래, 나는 이것은 또 무슨 생각으로 그랬는지 모르지만 툭툭 떨고 일어나서 내 바지 포켓 속에 남은 돈 몇원 몇십전을 가만히 꺼내서는 몰래 미닫이를 열고 살며시 문지방 밑에다 놓고 나서는, 나는 그냥 줄달음박질을 쳐서 나와 버렸다."],["여러번 자동차에 치일 뻔하면서 나는 그래도 경성역으로 찾아갔다.","빈자리와 마주 앉아서 이 쓰디쓴 입맛을 거두기 위하여 무엇으로나 입가심을 하고 싶었다."]],[["커피! 좋다.","그러나 경성역 홀에 한 걸음 들여 놓았을 때 나는 내 주머니에는 돈이 한푼도 없는 것을 그것을 깜박 잊었던 것을 깨달았다.","또 아뜩하였다.","나는 어디선가 그저 맥없이 머뭇머뭇하면 서 어쩔 줄을 모를 뿐이었다.","얼빠진 사람처럼 그저 이리갔다 저리갔다 하면서……."],["나는 어디로 어디로 들입다 쏘다녔는지 하나도 모른다.","다만 몇시간 후에 내가 미쓰꼬시 옥상에 있는 것을 깨달았을 때는 거의 대낮이었다."]],[["나는 거기 아무 데나 주저앉아서 내 자라 온 스물 여섯 해를 회고하여 보았다.","몽롱한 기억 속에서는 이렇다는 아무 제목도 불거져 나오지 않았다."],["나는 또 내 자신에게 물어 보았다.","너는 인생에 무슨 욕심이 있느냐고, 그러나 있다고도 없다고 도 그런 대답은 하기가 싫었다.","나는 거의 나 자신의 존재를 인식하기조차도 어려웠다."],["허리를 굽혀서 나는 그저 금붕어를 들여다보고 있었다."]],[["금붕어는 참 잘들도 생겼다.","작은놈은 작은놈대로 큰놈은 큰놈대로 다 싱싱하니 보기 좋았다.","내려 비치는 오월 햇살에 금붕어들은 그릇 바탕에 그림자를 내려뜨렸다.","지느러미는 하늘하늘 손수건을 흔드는 흉내를 낸다.","나는 이 지느러미 수효를 헤어 보기도 하면서 굽힌 허리를 좀처럼 펴지 않았다.","등이 따뜻하다."],["나는 또 오탁의 거리를 내려다보았다.","거기서는 피곤한 생활이 똑 금붕어 지느러미처럼 흐늑흐늑 허우적거렸다."]],[["눈에 보이지 않는 끈적끈적한 줄에 엉켜서 헤어나지들을 못한다.","나는 피로와 공복 때문에 무너져 들어가는 몸뚱이를 끌고 그 오탁의 거리 속으로 섞여 가지 않는 수도 없다 생각하였다."],["나서서 나는 또 문득 생각하여 보았다.","이 발길이 지금 어디로 향하여 가는 것인가를……","그때 내 눈앞에는 아내의 모가지가 벼락처럼 내려 떨어졌다.","아스피린과 아달린."]],[["우리들은 서로 오해하고 있느니라.","설마 아내가 아스피린 대신에 아달린의 정량을 나에게 먹여 왔을까?","나는 그것을 믿을 수는 없다.","아내가 대체 그럴 까닭이 없을 것이니, 그러면 나는 날밤을 새면서 도둑질을 계집질을 하였나?","정말이지 아니다."],["우리 부부는 숙명적으로 발이 맞지 않는 절름발이인 것이다.","내나 아내나 제 거동에 로직을 붙일 필요는 없다.","변해할 필요도 없다.","사실은 사실대로 오해는 오해대로 그저 끝없이 발을 절뚝거리면 서 세상을 걸어가면 되는 것이다."]],[["그렇지 않을까?"],["그러나 나는 이 발길이 아내에게로 돌아가야 옳은가 이것만은 분간하기가 좀 어려웠다.","가야하 나?","그럼 어디로 가나?"],["이때 뚜우 하고 정오 사이렌이 울었다.","사람들은 모두 네 활개를 펴고 닭처럼 푸드덕거리는 것 같고 온갖 유리와 강철과 대리석과 지폐와 잉크가 부글부글 끓고 수선을 떨고 하는 것 같은 찰"]],[["나!","그야말로 현란을 극한 정오다."],["나는 불현듯 겨드랑이가 가렵다.","아하, 그것은 내 인공의 날개가 돋았던 자국이다.","오늘은 없는 이 날개.","머릿속에서는 희망과 야심이 말소된 페이지가 딕셔너리 넘어가듯 번뜩였다."],["나는 걷던 걸음을 멈추고 그리고 일어나 한 번 이렇게 외쳐 보고 싶었다."]],[["날개야 다시 돋아라."],["날자. 날자.","한 번만 더 날자꾸나."],["한 번만 더 날아 보자꾸나.","<1936>"]]],"7":[[["洪景來傳 [홍경래전]"],["一 [일].","歸鄕 [귀향]"],["순조 십일년 구월(純祖 十一年 九月)의 일이다."],["홍경내(洪景來)는 아무런 예고도 없이 돌연 자기 고향인 평안도 용강군 다미면 세동 화장곡(平安道 龍岡郡 多美面 細洞 花庄谷)에 나타났다.","늙은 어머니를 버리고, 처자를 버리고, 산 속의 절에 가서 공부하겠고 뚝 떠나가고서는, 십년 이상이나 종무소식이든 그가, 제법 서늘해진 가을바람을 안고표연히 나타났다."]],[["“그래, 그렇게 오래 ㅅ 동안 자네는 도대체 어디를 가 있었나?”"],["“산 속에 들어가서, 몇 해가 걸리든지 성공할 때까지 공부를 게속하겠다고 하드니 이 때까지 산 속에 있었나?”"],["“아마 공부가 어지간이 다 된 게지. 십년이나 했으면 문장 다 됐지 못되겠나?”"],["─ 이렇게 옛 친구들은 물어 보았으나, 경내는 그렇다고도 하지 않고, 그렇지 않다고도 하지 않고, 그저 우물우물해버렷다."]],[["그리고서는"],["“어데 사람의 하는 일이 그렇게 쉬운가? 공부만 하더라도 그렇지, 파고들어가면 도모지 한이 있어야지. 그러나 사내로 태여나서 기황 한번 발을 디려놓은 이상에야 끝장을 보고서 말어야지.","그대로야 도중에서 물러슬 수 있나? 그래서 이번에 다시 결심을 굳게 하여 가지고, 앞으로 십년이 걸리든이십년이 걸리든 공부를 계속해 나가서, 철저히 한번 그 끝장을 보아볼 작정일세”"]],[["하고, 굳은 결심을 표명하였다."],["“아니, 그러면 또 공부하러 떠나겠다는 말인가?”"],["옛 친구들은 깜짝 놀라서 이처럼 반문하였으나, 그는 서슴치 않고 대답하였다."],["“수삼일 내로 곧 떠나야 되겠네. 사실은 가족들을 다리러 왔네. 어머니도 너머 고생이시겠고, 처자들도 떼어놔 둘 수만도 없어서, 이번에는 아주 이사를 해버릴가 하네.”"]],[["“흠, 이사를? ─ 그 동안에 어데 가서 자리를 잘 잡아서 매우 자미를 보는 모양일세 그려.”"],["“무어, 별 자미 있겠나만, 어떻게 해서 집안 식구들은 꾸려나갈 수 있게되였네.”"],["“암만 그렇다 할지라도, 그렇게 수삼일 내로야 떠날 수 있겠나? 인제 몇일 안 있으면 신곡을 먹게 되겠는데, 추수나 해 가지고 이사를 하여도 해야지, 일련 내내 피땀을 흘려서 농사를 지어 가지고, 그냥 어떻게 떠난단 말인가?"]],[["하기사 가물에 다 타서 소출인들 변변할가마는 ─.”"],["사실, 그 해 신미년(辛未年)의 가물은 퍽 심하였으며, 예년 같으면 베가 누 ― 렇게 익어, 들이 환 ― 할 터인데, 올해는 베가 처음부터 몇 치 자라지 못하였고, 돼지 꼬랑이만한 이삭이 가물에 타서 배배 꼬여 있었다.","작년에도 가물로 소출이 적었으나 올해는 작년보다도 훨신 심하여, 농민들은 가을이 되어도 들에 나가서 논밭을 돌아볼 아모런 자미도 없었다."]],[["“자네 이사 간다는 데는 농형이 어떤가? 풍년이겠지 ─.”"],["“풍년? 천만에 ─. 풍년 든 곳은 조선 팔도를 다 돌아단겨 봐도 아마 없을 것일세. 풍년 든 곳을 찾아가는 것이 아니라, 이제부터는 농사하고 인연을 딱 끊어보자는 것일세, 농사를 안 지면 풍년도 흉년도 없지 안나.”"],["“농사를 안 짓고 어떻게 산단 말인가? 평안감사라도 한 자리 땄단 말인가?”"]],[["“평안감사? 우리 평안도 개 ㅅ 똥 불상놈들한테 그런 것을 누가 시켜준다나? 시켜주지 않으니까 이렇게 이사를 하겠다는 것이지.”"],["“안 시켜주는데 어떻게 이사를 하여?”"],["“안 시켜주니까 이사를 하겠다는 거여. 왜 우수워? 허허허.”"],["경내는 같은 소리를 되푸리하며, 자못 유쾌한 듯이 거리낌없이 우서 버렸다."]],[["그의 친구들은, 그가 십년 전에 집을 떠나가기 전에도, 하는 것이 매우 달러서 자기들과는 서로 딱 들어맞지 않었으나, 지금 와서는 완전히 떨어저서 아주 딴세상 사람이라는 것을 느꼈다.","그리고 사람이란 집을 떠나서 오래 돌아댕기면 저렇게 되는것인가 ─ 막연히 판단하였다."],["경내는 이사를 떠나는 전날, 제법 큰 잔치를 베풀었다.","술도 빚고, 떡도하고, 농사짓는 데 쓰는 소까지 잡었다.","동리 사람들은 물론 많이 뫃어들었고, 굶는 집이 많은 판이라, 근동에서 물려온 청하지 않은 객손도 적지 않었다."]],[["그러나 이 여러 손중에서 경내가 유달리 관심을 갖고, 또 대접도 특별나게한 것은, 유학권(柳學權)이라 하는 그의 외숙이다.","유학권은 거기서 육십리나 떨어진 중화군(中和郡)에 사는 것을 사람을 시키어 일부러 불러온 것인데, 경내는 어려서 그에게 글을 배웠든 것이다."],["“그래, 그 동안 공부는 많이 진보되었느냐?”"],["유학권은 술을 몇 잔 마시고서 넌즛이 경내에게 이렇게 무렀다."]],[["“글세요. 많이는 못되었읍니다만, 어지간이는 되었읍니다.”"],["“그려? 허허허. 네 공부는 어릴 때부터 좀 다른 공부었으니까 ─.”"],["“무어 다를 것도 없읍니다. 다 그 공부가 그 공부지요.”"],["“그 공부가 그 공부라니? 그럴 수가 있나?”"]],[["“아니, 그 공부가 그 공붑니다.”"],["“글세, 그럴 수가 있나? 그래, 추풍역수장사권(秋風易水壯士拳)으로 백일함양천자두(白日咸陽天子頭)를 ― 하는 공부가 어째 보통 공부란 말이냐?” “네, 그 공부도 보통 공부와 결국은 같습니다.”"],["경내는 여전히 고집을 세웠다."],["여기서 문제되는 시는, 경내가 열두살 때에 ‘송형가(送荊軻)’ 라는 제목으로 글을 지었을 때, 경내가 지은 시다."]],[["경내가 이 글을 짓고서 참말로 천자의 대가리를 때릴 듯이 주먹을 불군 쥐어 둘러메는 것을 보고서, 선생인유학권은 이 아이가 장내 큰일 저즐를 짓을 짐작하고, 그만 겁이 덜컥 나서 집으로 돌려보내 버렸든 것이다.","그 이후에는 경내는 제 집에서 대개 자습으로 경사(經史) 일반을 공부하고, 과거를 보러 평양에도 가고 서울에도 갔었으나, 한 번도 급제하지 못하고, 이십세가 되었을 때 아버지가 죽고 세상 일이 도모지 맘에 맞지 않어, 산 속에 들어가서 공부하겠다고 핑게하고 집을 떠나, 이래 십여년 동안 한 번도 고향에 돌아오지 않었든 것이다."]],[["이 십년 동안에 경내는 그저 막연히 한문 책권이나 들추고 있든 것이 아니라, 자세한 것은 알 수 없으나 반다시 천자의 대가리를 때릴 공부를 하였을 것이라고 ― 유학권은 믿어 의심하지 않었다."],["“그러면 그것은 그렇다고 치자. 그러나 암만해도 너는 보통 사람 같지는 않다. 네가 여덜쌀 때에 지은 거좌해압산(踞坐海鴨山) 하야, 세족요포강(洗足腰浦江)을 ― 하는 시를, 나는 지금도 잊지 않고 있는데, 암만 생각해 봐도 보통 시가 아니어.”"]],[["“그것을 무어 그렇게까지 생각하실 것이 있읍니까? 또 그렇게 친다 할지라도, 천자의 대가리를 때리랴면 다 그만한 때를 맛나야지, 그저야 됩니까? 용이 하날에 올려가려면 비와 구름을 맛나야 하는 것처럼 ─.”"],["“그야 물론 그렇지. 용이 하날에 올려가려면 비와 구름을 만나야지. 네가 난 데가 용강이니까, 용이 될른지 뱀이 될른지. 되어보아야 알겠지요. 되다못되면 이심이라도 되겠지요. 용강 이시미는 자고로 유명하니까 ─.”"]],[["“이시미? 허허허, 박첨지에 나오는 이시미 말이지. 그도 그려. 허허허.” 술이 얼근이 취한 유학권은 우숨으로 돌리며, 또 술을 한 잔 쭉 드리켰다.","퍽이나 소심한 이 글방 선생님이 이처럼 대담하게 문답을 하고 웃고 하는 것은, 아마 술의 조화인 것 같다.","그러나 소심할 글방 선생님이, 이 근방에서는 경내가 앞으로 어떠한 일을 하리라는 것을 아는 단 한 사람이었다."],["이튿날 아침 일즉이 경내는 어머니와 처자를 거느리고, 북쪽을 향하야 먼― 길을 떠났다."]],[["이 때까지 살든 집과, 얼마 되지 않으나 미구에 신곡을 먹게 된 전지를, 사촌과 육촌들에게 나누어주고, 모든 걸 다 깨끗하게 청산하여버리고 총총하게 떠났다."],["“별사람 다 있구먼.”"],["“다시는 고향에 돌아오지 않을 작정인 모양이로구먼.”"],["“어릴 때부터 호탕하여 엉뚱한 짓만 하드니, 서른두 살이나 먹은 오늘에와서도 여전하구먼 그래.”"]],[["동리 사람들은 이렇게 수군거리었다."],["내가 고개 우에 서서 다시 한 번 화장곡 동리를 돌아다보았을 때에, 양지바른 산비탈에서 나무하는 머슴아이의 노랫소리가 들려왔다."],["또 왔다네 또 왔다네"],["김경서(金景瑞)가또 왔다네."]],[["디려치자디려치자."],["평양성(平壤城)을디려치자."],["“저 노래가 무슨 의민지 아시겠읍니까?”"],["경내는 다리를 쉬고있는 어머니한테 무렀다."],["“모르겠다 무슨 소린지 ─. 예전에는 못 듣든 노랜데, 요새 새로 떠돌아댕기는 노랜가부더라.”"]],[["“우리 평안도 김경서가 또 새로 나타났다는 노랩니다. 김경서 말여요.” “임진왜난(壬辰倭亂)에 큰 공을 세웠다는 장수 말이지?”"],["“네, 그런 장수가 또 나타났다는 말여요. 우리 평안도에 ─.”"],["“그렇게 되면 오작이나 좋겠니. 해매다 심해저가고 나뻐만가는 세상을, 그런 장수가 나서 빨리 바로 잡아주어야지. 그대로야 어데 살어갈 수가 있니?”"]],[["“어머니는 제의 일흠이 무었인지 아시지요?"],["“웬 일흠은 새삼스럽게 ─.“"],["“경내의 경은 김경서의 경짜고, 내짜는 올내짭니다. 그러니 김경서가 또왔다는 것은, 저를 두고 하는 말입니다.”"],["“호호호. 너는 이제 농담도 곳잘하는구나. 호호호.”"]],[["“허허허.”"],["경내도 어머니의 우숨 소리에 마추어 그대로 웃어버렸다."],["二 [이].","多福洞 [다복동]"],["경내가 식구를 거느리고 이사한 곳은 다복동(多福洞)이라는 곳이다.","다복동은 가산(嘉山)과 박천(博川) 양군 사이에 있는 동리의 일흠인데, 그리 크고 널지는 못하나, 상당한 요지(要地) 다."]],[["동리 좌우에는 그리 험하지는 않으나 나무가 잔득 들어슨 산이 삑 둘러있고, 산 넘어 한옆으로는 서울서 의주(義州)로 통하는 큰 길이 있고, 앞으로는 대령강(大寧江)이라는 강이 흘러있어, 수륙(水陸)의 편리가 매우 좋다.","뿐만이 아니라, 여차즉하면 강과좌우의 산에 의지하야 진을 치고 딱 버틸 수도 있고, 산 숲 속에는 몰래 믈어백이어 무슨 비밀의 일을 꿈이기에도 똑 들어맞었다."],["아니, 경내가 여기로 옴겨왔을 때에는 이미 심상치 않은 무시무시한 기분이 전동리를 휩쓸고 있었다."]],[["대장 ㅅ 간이 여기저기 있는데, 불을 벌겋게 피워서 쇠를 닭워 칼 만드느라고 야단이고, 곡식과 필목을 실은 솟바리가 길에 연하다 싶어 연락부절이다.","그리고 산 숲 속에서는 여기저기서 몸이 큼직큼직한 장정들이 서로 편을 짜 가지고 칼싸흠을 하며, 떼를 지어서 와르를 몰려갔다 몰려왔다 하고, 각금 산이 찌르를 울리는 고함소리가 들려왔다."],["“어데 무슨 난리라도 이러났다니?”"]],[["늙은 어머니가 근심스러운 빛으로 이렇게 물었을 때, 경내는 서슴지 않고 대답하였다."],["“난리가 일어난 것이 아니라, 이제부터 일으키려고 저렇게 야단들입니다.”"],["“난리를 일으키다니? 되놈들이라도 쳐들어와야지 난리가 일어나지, 무슨 놈의 난리가 ─.”"],["“용강 이시미가 용이 될려고, 비와 구름을 만들어 내는 것입니다.”"]],[["“웬 또 비와 구름은?”"],["“난리가 제게는 비나 구름과 마찬가지랍니다.”"],["“그게 무슨 소리냐?”"],["“그렇게 한거번에 모르셔도 좋습니다. 여기 게시면서 차차 두고 보십시요. 머지 않아서 난리는 일어나고야 말 테니까요. 이번의 이사도 난리가 날 테니까 한 것이 아닙니까?”"]],[["“여기서 난리가 난다면 용강이 좋치, 일부러 난리가 나는 데로 올 것이무었 있니? 나는 무슨 속인지 도모지 알 수 없다.”"],["“아즉 모르셔도 괜찮습니다. 일은 저 혼자 할 테니까, 어머니는 그저 꾹 앉어만 계셔요.”"],["그 날부터 어머니는 며누리와 손자를 거느리고, 아들 말대로 꾹 앉어만 있었다.","경내는 아침에 나가서 왼종일 어데서 무엇을 하는지 자최를 감추어버리고, 밤에도 돌아오지 않는 때가 많었다."]],[["사실, 사태는 이미 급박하야저서, 경내는 몹시 바빴다.","십년 동안을 두고궁리하여, 일시도 잊지 않고 계획하여 나려오든 일이, 이제 그 최후의 단게가 하루하루 다가오는 것이다."],["어려서부터 천자의 대가리를 때릴 것을 이상으로 하였든 경내라, 녹녹한시골 선비로 꼬브러질 이가 없다.","그러나 그가 사회에 대하여, 나라에 대하여 뚜렷이 불평을 품게 된 것은, 이십 전후에 과거를 치루어 실패한 때부터다."]],[["과거란 원래 경향을 통하여 숨은 인재를 찾어내어 등용하자는 것이 목적인데, 이조 말엽에 이르런 아주 물러저서, 문벌 높고, 권세 있는 몇몇 대신들의 자제들이, 뒷꽁무니로 얼렁얼렁하여 장원급제를 독점해버려서, 그 이외의 사람들은 어떻게 붙이볼 도리가 없었다.","문벌이 높고, 권세가 있는 집 자식들은, 젖내가 몰칵몰칵 나는 못나고 변변치 못한 것들도, 제 집에 앉어서 사람을 시켜 씨만 바치면 진사니, 대과니, 할림이니 ― 말대로 골러잡고, 시골서 올려온 뒤에 아무 연줄도 없는 자는, 아모리 글이 놀납고, 글씨를 잘 쓰고, 정론이 당당하여도, 급제할 도리가 전혀 없었다."]],[["공연히 헷봇다리만 걸러메고 헷 노자만 써서 왔다갓다 해본대야, 출세할 기회를 잡을 수는 없었다.","더구나 평안도 사람은 천대가 막심하여 도모지 기회를 주지 않었다.","이태조(李太祖)가 서북 사람은 외이불용(畏而不用) 이라고 해서, 되도록 주요한 자리에는 쓰지 않도록 했는데, 이것이 이조 역대의 임군들에게충실하게 전해나려와서, 나종에는 아주 으레히 그런 것으로 정해지다싶이되었다.","그리하여 서북사람이면 제가 아모리 출중한 인물이라도, 문관이면지평(持平) 이상에 오르지 못하고, 무관이면 첨사(僉使) 이상에 오르지 못하였다."]],[["평안도 놈!","서한(西漢)!","― 서북 사람들은 이렇게 불리어 나려왔다."],["그러므로 경내가 과거에 실패한 것은, 아주 처음부터 확정된, 거의 숙명적인 일이었다.","만약 경내가 제의 운명에 순종한다면, 과거는 몇번 시험해보다가 걷어치우고, 시골서 콧물 흘리는 아이들에게 천자 ㅅ 권이나 가르처주는― 글방 선생님이 되어 늙어 꼬부러저야 하겠는데, 그렇게 되기에는 경내는 너무나 대담하고 야심만만하였다.","아니, 야심이라기에는 너무나 순진한 정의감이었다."]],[["나라에서 하는 일일지라도 그것이 옳지 못한 일이라면, 도저히 그대로 용서할 수 없다.","경내의 의협에 불타는 젊은 피가 그것을 용서하지못하엿든 것이다."],["이래 십여년을 두고, 경내는 오로지 이 일에 종사하여 왔다.","어떻게 하면궁중에 우물우물한 썩은 선비들을 내몰고, 서북 사람도 똑 같이 등용하야나라를 바로잡을 수 있을가?","─ 이것이 그의 유일한 목적이었다."]],[["그러면 그 수단방법은?","─ 그는 타협의 길은 처음부터 생각해보지 않었다.","문벌이 높고 권세가 당당한 대신들한테 몰래 뇌물을 바치어, 서북 사람도 똑같이 등용하여 주십시요 ― 하고 진정하는 일 같은 것은 생각만 하여도게욱질이 날 지경이다.","그러기에는 그의 정의감은 너무나 날카럽고 철저하였다.","평안도를 중심으로 하여, 일대 반란을 일으키어, 당당히 서울까지 처 들어가서, 나라를 새로 세워보자는 것이, 이것이 그가 생각하고 또 생각하여 얻은, 최후의 결론이었다."]],[["천자의 대가리를 주먹으로 때리자든, 그의 어릴 때부터의 이상이 구체화한 것이다."],["그러나 이처럼 나라를 뒤집어엎는 큰 일을 게획하려면, 먼저 각처로 돌아댕기며 많은 둥지를 획득하여야 한다.","꾀가 많은 모사(謀士)도 필요하고, 기운이 센 역사(力士)도 필요하다.","재물을 많이 가진 부호(富豪)도 필요하고, 명망이 높은 명사(名士)도 필요하다.","그리고 각 골의 좌수(座首) 니, 이 방(吏房) 이니 하는 관속들과도, 긴밀한 열낙을 취하지 않으면 안된다."]],[["원이 라는 것은 겉으로는 제가 젠체하지만, 결국은 이러한 관속들 손에 놀고있기때문이다."],["과거 십년간의 경내의 노력은, 실로 이러한 동지의 획목에 있었든 것이다.","三 [삼].","同志 들 [동지]"],["경내의 동지로서 먼저 우군측(禹君則)을 들지 않을 수 없다."],["우군측은 경내가 제일 먼저 사괴인 동지다."]],[["그는, 태천(泰川)에서 내가 내다 하고 뽑내는 우가네 집의 첩의 소생으로, 어려서부터 총명하여 사서삼경은 물론이고 천문지리에 이르기까지 무불통지하였는데, 서류(庶流) 인 고로 처음부터 과거를 볼 자격이 없고, 집 안에 드나 집 밖에 나나 경멸과 확대가 자심하여, 억울한 자기의 심정을 하소할 곳 조차 없었다.","그리하여 그는 집을 버리고 각처로 떠돌아다니며, 지사(地師)로 자처하였다.","간훅 부잣집모잇자리나 정해주고 돈푼이나 받으면, 바로 주막으로 달려가서 인사불성이되도록 술을 들이키어 평소의 불평불만을 술로 마비시켜 버렸다."]],[["경내는 경신(庚申) 년간에 가산군 청용사(嘉山郡 淸龍寺)에서 군측을 만났다.","그 때 경내는 스물한 살이고 군측은 스물일곱 살이었다.","둘은 초면인사를 하고서 두세마디 말을 건네는 동안에 바로 의기가 상통하여, 평소에 품었든 불평불만이 제절로 쏘다저 나왔다.","그 해 경신년에는 유월에 정조(正祖)가 죽고 순조(純祖)가 새로 들어슨 때라, 둘의 이야기는 자연 이것이 중심이 되었다."],["“이번에 돌아가신 임군께서는 정사도 잘 보시고 문필에도 대단히 능하시어서 참말로 성군(聖君) 이시었다고들 하지 않소?”"]],[["“읍에서는 선비들이 모이어, 채일을 치고 서울을 향하여 젯상을 차려놓고, 절을 하고 곡을 하고 야단들이었다고 합니다.”"],["“내가 연전에 과거 보러 서울 갔을 때에도 병환이 위중하시었었는데, 그때 서울 양반들 평판으로도, 이러한 성군은 개국 이래에 아마 다시는 없었으리라고들 합니다.”"],["“그렇게들 떠바치고 야단들을 치는 것을 보면 분명 성군은 성군이겠는데, 그러나 우리 평안도 놈들한테야 성군이고 성군 아니고가 어데있겠오?”"]],[["“우리 평안도 놈들에는 그저 그 놈이 그 놈이지요. 성군보다 더한 것이나슨대도, 우리 평안도 놈들에게는 공중에 떠있는 구름이지, 무슨 소용이 있겠오? 우리가 어데 가서 벼슬 하나 얻어 해보겠오?”"],["“그야 그렇지요.”"],["“어데 벼슬을 못할 뿐이요. 서울 양반이 평안감사니 무엇이니 하고 뽑내고 나려와서는, 죄가 있건 없건 공연히 생트집을 잡어 가지고, 평안도 놈의 재산은 하나 남기지 않고 닥닥 고무래질을 해가니, 이거 어데 건데어내는수가 있소?”"]],[["“그러니까 서울 양반이면 누구나 한 번은 평안감사를 해보고 싶어하는 게지요.”"],["“그러니, 내 생각 같어서는 성군이 나지 말고 차라리 지지리 못난 임군이나서 나라가 한 번 휫닥 뒤집어저 버리는 것만 같지 못할 것 같소.”"],["“쉬, 말슴이 너무 지나치오. 관청 놈들이 드르면 큰일 날 소리를 하오 그려.”"]],[["“아니, 그러니까 우리끼리 이야기요. 우리 평안도 사람들 위해서는, 나라가 한 번 뒤집어저야만 할 것이요.”"],["“그야 그렇겠지만. 우리 그 이야기는 이제 그만 해둡시다.”"],["하고, 군측은 말을 딴 데로 돌리었다.","그리고 이 때는 이 이상 아무런 진전도 없었다."],["그 이듬해 신유(辛酉) 년에 청용사에서 둘이 다시 만났는데, 이 때에 둘의 이야기는 훨신 구체화하였다."]],[["그리고 경내는 지난 일년 동안 강게(江界), 연여(延閭) 등의 압녹강 상류 지방을 돌아댕기다가 정시수(鄭始守)라는 만주 마적단의 두목을 만나 은근히 열락해 놓은 것까지 이야기 하였다.","그리고 군측에게 모사(謀士) 로서 출마해주기를 간청하였다."],["“사내대장부가 세상에 났다가, 어찌 남의 압제만 받고서 살겠오? 내가 비록 유현덕(劉玄德)은 못될망정, 노형께서는 제갈공명(諸葛孔明)이 되어 대사를 도모해주시요.”"]],[["군측은 그 자리에서 이것을 허락하고, 앞으로 더욱 많은 동지를 획득하여연락할 것을 굳게 약속하였다."],["다음에 중요한 동지로 이히저(李禧著)가 있다."],["이히저는 가산 역속(嘉山驛屬)으로, 도내에서 유명한 부호다.","일즉이 무과(武科)에 급제하고 향안(鄕案) 에도 들었는데 이것은 물논 뒷꽁무니로 돈을멕여서 성공한 것이다.","몸집이 크고, 더구나 배가 쑥 나와서 거름을 거르면뒤룩뒤룩 흔들리었다."]],[["뱃심이 세고 우악스러워서 한번 무슨 말을 내놓으면아무가 머래도 그대로 내밀고 나갔다.","그가 이처럼 부자로 사는 것은 물논대대로 물려나려온 유산도 적지 않었으나, 그것보다도 사신(使臣)의 뒤를 따라 거의 해마다 중국에 출입하는 역관(譯官) 들과 잘 열락해서 중국의 비 단을 싸게 사 가지고 비싸게 팔어서 큰 이를 남기었기 때문이다.","게다가 그의 인아연척간에는 각 골에서 누구누구라고 치는 큰 부자와 큰 장사군이 많아서 그의 세력은 곽산골에서는 따를 사람이 없었다."]],[["경내와 군측은 히저를 자기들 편으로 끓어넣는 데 매우 고심하였다.","원래 위인이 우왁스러운지라, 처음에 잘못 건디리다가는 영영 퉁겨지고 말 것이기 때문에, 처음부터 아주 신중히 일을 시작하였다."],["군측의 부인 정씨(鄭氏)를 점쟁이 모양으로 차려서, 히저의 집에 가서 히저의 부인을 위하여 점을 치게 하였는데, 구 점꽤에 이르기를"],["“십년 이내로 대운이 터질 터인데, 수승(水姓) 가진 사람을 만나면 길"]],[["(吉) 하다.”"],["하였다.","그리고 군측 자신은 아주 이력이 난 지사(地師) 로서 나타나, 히저의 아버지를 위하여 모잇자리를 정하여주고 이르기를, 역시 마찬가지로"],["“당대 발복의 대진데 수승 가진 사람을 만나면 길하다.”"],["하였다.","이처럼 안팎으로 잔득 예비공작을 해놓고, 군측은 자기가 늘 찾어 가서 배우고 있는 묘향산(妙香山)의 이인(異人)을 소개하겠다고 하고, 경내를 안내하여 히저와 면회시켰다."]],[["히저가 보니 키가 작달만한게, 나이는 아즉 새파랗게 젊었고 눈에 열기가 뚝뚝 떨었다.","서로 맞대 앉어서 초면인사를 하는데, 히저는 속으로"],["“이인이니, 무엇이니 하드니, 한주먹거리밖에는 되지 안는구나.”"],["─ 은근히 업수히 여겼다.","경내는 재발이 이 눈치를 채고"],["“초면에 미안하지만, 어데 팔씨름을 한번 해봅시다.”"]],[["하고, 조고마한 팔을 거침없이 쑥 내밀었다.","히저는 하도 같잖아서, 허허허― 너털우슴을 내놓으며"],["“해볼 것은 무엇 있오.”"],["하며, 바로 응해주지를 않었다.","그러자 경내는 닷자곳자로 히저의 바른 팔 목을 꽉 움켜쥐고"],["“자, 뺄 재조 있거든 빼보시요.”"]],[["하는데, 단번에 손목이 끊어지는 것 같고, 심 ㅅ 줄이 팽팽해저서 찌르를 하고 저려 올러왔다.","처음부터 요동해볼 여유가 없고, 또 요동해본댔자 될 것같지를 않었다.","인력으로는 어찌할 수 없는 무슨 초자연적인 힘이 작용하고있는 것 같었다."],["“그렀오. 해볼 것은 무어 있오.”"],["경내는 히저의 말을 도로 갚으며, 손목을 놓았다. 그리고"]],[["“나는 갈 길이 바빠서, 이만 일어나겠오.”"],["하고, 벌덕 일어나서 문을 열고 신을 신고 대문 밖으로 걸어나가는데, 히저와 군측이 전송하러 나왔을 때에는, 이미 어데로 사라졌는지 온데간데 없었다."],["이것이 거의 일순간의 일이다.","더구나 히저로서는 대낮에 무슨 꿈이라도꾼 것 같었다."]],[["“사람은 아니로구먼. 사람은 아니어 ─.”"],["“그러기에 이인이라지, 달래 이인이라오? 어떻소, 팔목은 앞우지 않소?” 히저가 부끄러운 줄도 모르고 팔목은 드려다 보니, 벍엏게 손구락 자욱이들어있다.","마치 어린아이가 어른들한테 손목을 잡힌 셈이다."],["“그 이인의 성명이 무엇인지 아시오? 상면한 사람 이외에는 절대로 알리지 말라고 하기 때문에 노형한테도 알리지 않었는데, 홍경내라고 하오,” “홍경내? ─ 별로 듣지 못하든 일흠인대 ─.”"]],[["“이인의 성명을 그렇게 아무나 아러서 쓰겠오. 넓은 홍짜 홍씨요, 수승 가진 사람을 만나면 길하다고 하지 않었었오? 아마 이 어른을 두고 이른 것 같소.”"],["“그러나 그 분은 오늘 같아서는 길하기는커냥 도리혀 불쾌하신 것 같지앉었오?”"],["“그것은 염여하실 것 없오. 이인의 히노애락(喜怒哀樂)은 속세상 사람들과는 달러서 겉에 나타나는 것 가지고는 알 수 없는 것이오.”"]],[["이 일이 있은 후에 또 일년이 지나서, 돌연 군측의 안내로 경내는 히저의 집에 다시 나타났다.","그리고 이 때에 비로소 자기들의 천하를 도모하는 큰 게획을 말하고, 히저의 가입을 간청하였다.","히저는 그 자리에서 쾌락하고, 또 자기 인아연척간에 비밀리에 열락하여 이들을 위하여 돈을 대게 되었다.","다음에 또 중요한 종지로 김창시(金昌始)가 있다."],["김창시는 여기서는 좀 떨어저있는 곽산(郭山) 사람이다."]],[["일즉이 진사(進士)에 급제하여 곽산 김진사로 통하여, 문장재예(文章才藝)로 그때 평안도에서는 선비를 사이에 제일 명망이 높었다.","말 잘하고, 친구 좋와하고, 술 좋와하고, 하는 짓이 모다 풍성풍성하여서, 꽤 많든 재산을 다 없애고 지금은 도리혀 빚이 적지 않었으나, 그런 것은 근심하는 빛조차 없었다.","평안도의 이태백(李太白) 이로 자임하고, 술만 얼근이 취하면 소동파(蘇東坡)의 적벽부(赤壁賦)를 읊는 것이 제일 상쾌한 일이었다."]],[["어느 해 여름 일이다.","김창시가 서울 갔다가 돌아오는 길에, 황해도 봉산군 동성영(黃海道 鳳山郡 洞仙嶺) 고개를 접어들어 얼마를 올러가니까, 별안간 웬 청의동자(靑衣童子)가 눈 앞에 나타나서 길을 딱 막으며 창시한테공손히 절하고"],["“평안도 곽산 게시는 김진사가 아니십니까?”"],["하고 물었다."]],[["“그래, 내가 곽산 있는 김진산데 ─.”"],["하고, 창시는 웨인 영문을 몰라서 멀끄럼이 그 동자를 쳐다봤다."],["“다름이 아니오라 오늘 우리 선생님께서 말슴하시기를 오시(午時)에 진사님이 여기를 지나실 테니 가서 모시고 오라시어, 여기서 기다리고 있든 것입니다.”"],["창시는 이야기가 너무나 허황하여"]],[["“너의 선생이 누구시냐? 그리고 어데 게시냐?”"],["하고 물으니까, 동자는"],["“그것은 가서 만나시면 자연 아십니다. 그리고 게시는 곳도 제가 인도해드릴 터이니, 저만 딸아와 주십시오.”"],["하고, 대답하였다."],["창시는 원래 호탕하고, 이태백이 모양으로 신선의 도를 좋와하였었음으로, 한번 딸아가 볼 것이 라 ― 하고 선선이 동자의 뒤를 딸아나섰다."]],[["그리고 타고 오든 말은 말부를 시켜서 고개 넘어 주막에 가서 기다리라 하였다."],["차차로 길이 험해지며, 산이 높고 골이 깊어서 인적이 전혀 끊어지고, 곳 곳이 머루와 다래의 덤풀이 척척 엉켜있어서 자칫하면 길을 잃을 지경이었다.","이렇게 한 삼십리는 들어가서, 앞이 턱 티이며 맑은 시냇물이 졸졸 흘러나리는 낭떨어지 우에 남향으로 조고마한 삼칸 초당(三間草堂)이 날신하게 지어있고, 그 뒤로는 몇 길식 되는 큰 바우가 삑둘러 있었다."]],[["창시는 무슩 귀신에나 흘린 것 같아서, 제 자신을 의심하며, 동자의 뒤를 따라 그 초당 앞에 이르니, 동자는 그 앞에 가서 공손히 절하고"],["“진사님을 모시고 왔읍니다.”"],["하고 고하였다.","그러니까 문이 열리며, 삐죽하게 생긴 관을 쓰고 넓은 띄를띄고 누 ― 런 도포를 입은 아즉 새파랗게 젊어 보이는 청년 하나이 나타나, 당황하게 게하로 나려와"]],[["“이러한 벽지에 오시느라고 얼마나 고생하시었읍니까?”"],["하고, 공손히 인사를 하며, 손을 이끄러 실내로 안내하였다.","좌정한 후에동자가 가져온 차를 마시며, 신선과 같이 생긴 이 청년은 서서히 이야기를끄냈다."],["“나는 산간에 묻혀서 약이나 캐고, 심심하면 책권이나 읽고 하는 ― 일개우물(迂物)에 지나지 못하는데, 그래도 아즉도 세상과 인연이 아주 끊어지지는 않었나 봅니다. 일전에 작난 삼아서 점을 쳐보니까, 장차 세상이 또 난이 이러나서, 생민이 또 다시 도탄에 빠질 것이 분명하여, 은근히 근심하여 나려오든 중이었읍니다."]],[["그리다가 어제 ㅅ 밤에, 그전에 묘향산(妙香山) 산 속에서 얻어 둔 서산대사(西山大師)의 비결(秘訣)을 끄내어 읽어보니, 거기도 분명히 난이 일어날 것이 적혀 있고, 그것을 구제할 인물은 우리 서토(西土)에서 나겠다고 하였읍니다.","그래서 서토면 어데 사는 누굴가 하고― 이리 궁리 저리 궁리 해보았으나 도모지 알 길이 없고, 그리다가 홀연잠이 들어 잠간 서안에 의자하여 졸었는데, 비몽사몽간에 서산대사께서 나타나시어 ‘그 사람은 아주 가깝게 있다.","내일 오시에 동선영을 지나는, 곽산 김진사가 바로 그 사람이니, 때를 놓지지 말어라’─ 이렇게 현몽하시고, 바로 사라저버리셨읍니다. 그래서 오늘 이처럼 이런 벽지로 모시게 된 것입니다.”"]],[["창시는 이야기가 너무나 허황하나, 임진왜난(壬辰倭亂) 때에 일본이 또 처들어 올 것을 미리 짐작하고, 자기 제자인 사명당(泗溟堂)을 시켜서 왜놈들을 단단이 욕을 보이고 항복을 받어가지고 오게 한 서산대사가 자기를 인정하야, 장차 일어나는 난을 평정하고 생민을 구할 인물이라고 한 데 대해서는 참으로 충심으로 감격하지 않을 수 없었다."],["“어데 저와 같은 시골의 일개 서생이 그러한 대임(大任)을 당할 수 있겠읍니까” 하고, 사양하면서도, 창시는 억개가 으씩해지는 것을 금할 수 없었다."]],[["그리고 더욱 고금동서의 학문과 인물을 논의해보니 무불통지라, 이 젊은 청년이 신선이지 이 세상 사람이 아니라는 것을 확신하게 되었다."],["해가 서산에 기울도록 이야기를 하다가, 다시 후일을 기약하고 헤저 왔는데, 이미 창시의 혼은 빼앗긴 바 되었음으로, 다시 만났을 때에는.","아주 완전히 이 청년에게 맘을 허락하게 되었다.","그리고 이 청년이 경내라는 것은 더 말할 것도 없다."]],[["四 [사]. 장수들"],["반란을 일으키어 나라를 뒤집어 엎으랴면, 모사(謀士) 니, 부호(富豪) 니, 명사(名士) 니 하는 사람도 필요하지만, 즉접 병대를 이끌고 싸흠터로 나가서 지휘하는 장수가 필요하다.","경내도 이러한 장수를 얻느라고 도 각처로돌아댕기며 별별 수단을 다 썼다."],["경내가 제 편으로 끓어넣은 장수 중에 먼저 홍총각(洪總角)을 들지 않흘수 없다."]],[["홍총각은 곽산(郭山) 사람으로, 남의 집 머슴사리를 하고 있었다.","원일흠은 이팔(二八) 이나 삼십이 되도록 장가를 들지 못하여, 홍총각으로 통하였다.","기운이 장사라, 먹기도 남의 세 몫 먹고, 일도 남의 세 몫하고, 자기도 남의 세 몫 잤다.","산에 발매를 가면 우연만한 나무는 손으로 쑥쑥 뽑아버리고, 좀 큰 나무는 도끼질을 하는데, 그 도끼가 보통 도끼는 휘휘 날린다고해서, 대장 ㅅ 간에 가서 특별히 큼직하게 벼려서 보통 장정은 잘 들지도 못할 만한 것을 가지고, 한 번이나 두 번만 찍으면 턱턱 쓸어지고, 아모리 큰나몰지라도 세 번을 버서나지 못하였다."]],[["그리고 이것을 저나르는 데도 보통지개는 약해서 쓰지 못하고, 특별히 굵은 나무로 커다랗게 만들어서 산떼미처럼 추켜실고 담숨에 저날렀다."],["이러한 힘드는 일은 남의 열 배도 하고 스므 배도 하는데, 논에 모를 심는다든가 밭은 맨다든가 하는 ― 손 끝으로 깐직깐직하는 곰상마진 일은 도모지 성미에 맞지 않아서, 이런

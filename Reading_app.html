때가 되면 들어누어서 낮잠만 식식 잤다.","그렇다고 주인이 무어라고 꾸중을 하면 영영 틀어저서 가래를 가지고 가서 논둑을 푹푹 파 재켜 버리든지, 밭 한 가운데다가 커다란 바위를 굴려다 놓음으로 이런 때는 그저 내버려두는 수밖에는 없었다."]],[["홍총각은 제 자신이 본시 힘이 세지만, 또 그와 의형제를 맺고 지내는 패가 사십여 명이나 있어, 이 중에 누구고 한 사람을 잘못 건데렸다가는 사십여 명의 와르를 하고 몰려들므로, 곽산 골에서는 관속들도 달리 취급하였다.","그런데 이 사십여 명의 패는, 모다 남의 집 머습을 사는, 집 없이 떠돌아다니는 자들로만 조직되어서 이렇게 싸흠할 때 뿐 만이 아니고, 그 중에서 누가 알는다든가 죽는다든가 할 때에도, 모다 추렴을 내어 형편 닫는 데까지 서로 도아주었다."]],[["그리고 홍총각은 특별히 기운이 세니까, 아즉 총각이지만 맏형으로 모지고, 그 이외는 나이로 따저서 형제를 정해서 형제간의우애가 극진하였다."],["경내는 곽산 어느 술집에서 홍총각을 만났다.","경내가 들어갔을 때에는 홍총각은 방안에서 벌써 상을 차려다 놓고 주인댁을 옆에 앉히고서 한참 먹는 판이었다."],["“주인댁! 여기도 술 한상 차려주오.”"]],[["하고, 술을 청하였다."],["“네, 잠간만 기다리세요.”"],["주인대은 이렇게 대답은 하면서도, 바로 일어스지 않었다."],["“여기도 빨리 좀 갖다주. 왜 사람이 사람 같지 않은가?”"],["“네 곧 갑니다.”"]],[["그러나 주인댁은 여전히 바로 일어스지 않었다."],["“이거, 술을 안 팔고 말을 파는 거요? 어서 가저오지 못하오?”"],["경내의 언성이 제법 높아졌다.","주인댁이 마지못하여 일어스려 하니까, 홍총각이 꽉 부잡고, 흘끔 경내를 쳐다보며"],["“여기 다 먹을 때까지 기다려오. 못 기다리겠거든 다른 주막에 가보.” 하고서는, 여전히 술을 먹고 있다."]],[["“여기 바로 썩 술 좀 못 가저오?”"],["경내는 홍총각의 소리는 들은 체도 하지 않고 외쳤다."],["“아니, 썩 물러가지 못하겠느냐?”"],["홍총각이 화가 버럭 나서 경내를 노리고 본다.","불과 한주먹거리도 되지 못해보인다."]],[["“주인댁! 술 좀 못 가저오겠오?”"],["경내는 여전히 홍총각의 소리는 들은 체도 하지 않고 외쳤다.","이 말이 채 끝나기 전에, 방에서 비호 같이 뛰어나온 홍총각의 주먹이, 번개 같이 경내의 머리를 후리첬다.","일순간의 일이다."],["그러나 경내는 감쩍같이 싹 피해 스고, 주먹은 경내가 기대고 있든 뒷벽에맞어서, 벽이 와르를 허러젔다."]],[["“누가 술 달랬지 주먹 달랬나? 주먹 맛은 술맛만 못한걸 ─.”"],["경내의 말이 채 끝나기 전에 홍총각의 주먹은 또 번개같이 경내의 머리를 후리첬다.","그러나 이번에도 경내는 감쩍같이 피하고, 뒷벽만 와르르 허러졌다."],["“그 집에는 술은 없고 주먹만 있는가 보군 ─.”"],["경내는 입맛을 찍찍 다시며 마당으로 나려서서 휘저휘적 걸어나갔다."]],[["홍총각은 아주 화가 날대로 나 가지고 그 뒤를 따라나섰는데, 곧 붓잡을 것 같으면서 붓잡히지 않았다.","두 주먹을 발러쥐고 쫒아갔으나 영영 붓잡히지 않었다.","뒷산 등갱이에 이르자"],["“우리 농담은 그만 하고 인사합시다.”"],["하고, 경내는 뒤로 홱 돌아서서 홍총각의 손을 꽉 쥐는데, 손구락이 아스러지는 것처럼 앞었다."]],[["“녜, 녜.”"],["홍총각은 저도 모르게 녜 소리가 연거퍼 나왔다."],["“댁이 유명한 홍총각이지. 나는 홍경내라는 사람이오. 우리 다시 나려가서 술이라도 나누며 이야기합시다.”"],["그리곤 오든 길을 도로 거러서 술집으로 들어갔다.","홍총각도 그 뒤를 따르지 않을 수 없었다."]],[["“내가 키는 적으나 성취하였고, 또 나이도 한두 살 더 먹은 것 같으니 호형하오. 더구나 같은 홍가끼리니까, 아주 잘 되었오. 그리고 기왕 형제가 될 바에야, 동생이 그저 총각이래서야 되겠오.","우리 돌림짜가 내(來) 짜니, 새로 붕내(奉來)라고 일흠을 짓겠는데, 의향이 어떻소?”"],["“형님 의향이 그렇다면야 ─.”"],["이리하여 둘은 의형제가 되었다."]],[["이 때부터 홍총각은 경내의 가장 신임하는 장수가 되고, 또 따라서 의형제 맺인 다른 사십여 명의 동생들도 모다 한거번에 여기에 참녜하게 되었다."],["다음에 중요한 장수로서 이제초(李濟初)를 들지 않을 수 없다."],["이제초는 개천(价川) 사람으로, 어려서 산에 들어가서 상자 노릇을 하였는데, 그 때 장수물을 먹고서부터 힘이 세졌다는 것이다."]],[["장수물이라는 것은, 그 절에서 십리는 더 산 속으로 들어가서 큰 바위 틈에서 한 방울 두 방울 뚝뚝 떨어지는 물인데 처음에는 아무도 모르든 것을, 그 절 중 하나가 이것을 발견하고, 여러 해 두고서 밤중에 남 몰래 받어 먹어서 기운이 아주 장수가 되었다.","그리든 중에, 그 중이 밤마다 어데로 나가는 것이 하도 수상해서, 제초가 몰래 그 뒤를 밟어갔드니, 깊은 산 속으로 들어가서 물을 한박아지 받어먹고서 돌아오는 것이었다.","도대체 저 물이 무슨 물인가 하고, 그 후부터 제초도 몰래 그 물을 훔처먹었다."]],[["그리하여 그 중에 다음가게 힘이 세어젔다.","그러나 이 소문이 퍼저 그 근처 사람들이 다 알게 되어, 모다몰려가서 장수물을 받어 먹었드니, 여러 사람이 알고부터는 물 효과가 없어 져 버렸다고 한다."],["하여간 제초는 이렇게 하여 힘이 세어졌다는 것이다.","그의 힘이 어찌나 세든지 정월에 여러 동리가 편을 갈러서 줄을 다리는데, 제초가 이 편에 가서 다리면 이 편이 이기고, 저 편에 가서 다리면 저 편이 이기고 하였다."]],[["그래서 정월이 되면 서로 제초를 자기 편에 끄러넣으랴고 술대접을 하느라고 야단들이다."],["이러한 줄다리는 이야기가 한참 벌어진 정월 어느날, 경내는 술집에서 제초를 만났다."],["“여장군이 아니십니까?”"],["경내는 술좌석에서 넌즈시 말을 걸었다.","제초는 힘이 세다고, 이 근동에서는 이장군이라고도들 불렀다."]],[["“녜, 이장군인데, 댁은 누구시요?”"],["“성함은 익히 들었읍니다. 저는 조처사(趙處士)라고 합니다. 장군을 뵈이려고 먼 데서 일부러 왔읍니다.”"],["“저를 보려고 말이지요?”"],["“녜, 꼭 좀 뵈옵고 여쭐 말씀이 있어서요 ─.”"]],[["“무슨 말씀이십니까? 해보시요.”"],["“다름이 아니라. 제가 거주하는 다복동(多福洞)이라는 데서 굉장히 큰 줄을 다리게 되는데, 장군의 각별한 후원을 입고저 해서 찾어온 것입니다.” “다복동이라는 데가 있든가요?”"],["“녜, 가산(嘉山)과 박천(博川)과 두 골 사이에 있는데, 근자에 새로 금점을 하게 되어, 그 피로를 겸하여 큰 줄을 다리게 되었읍니다.”"]],[["“그러면 사람이 상당히 많이 꽇이겠구려.”"],["“벌써부터 야단들입니다. 힘꼴이나 쓴다는 이는 죄다 뫃였읍니다. 장군을 제가 모셔오기로 되어서 아주 노자까지 준비해 가지고 왔읍니다. 떠나실 수만 있다면 오늘이라도 곧 떠나주셨으면 합니다.”"],["“그렇소? 그러면 어데 구경 삼어 한번 가볼가요.”"]],[["이리하여 제초를 다복동으로 인도하였다.","경내는 자기의 커다란 게획이 탈로날가 봐서 각금 성명을 바꾸었으며, 변장을 자주 하였슴으로, 자기가 절대로 신임하는 몇몇 사람 이외에는 그 정체가 퍽이나 신비하고 모호하였다.","다복동에서 다리려고 계획하는 줄이야, 하기사 굉장히 큰 줄이다.","나라를 하나 뒤집어서 새로 세우느냐, 못 세우느냐 하는 줄이니, 이보다 더 큰 줄이 어디 있으랴?","개천(价川) 골작이에서 힘이 뻐쳐서 못 견데는 제초로서도한번 나서 봄직한 줄이다."]],[["중요한 장수로서 다음에 김사용(金士用)을 들지 않을 수 없다.","태천(泰川) 사람으로 우군측과 동향이라, 군측의 추천으로 참가하게 되었다.","그 용맹에있어서 홍총각이나 이제초에 지지 않고, 또 그 우에 지략(智略)이 출중하여문무가 겸비한 대장깜이다.","경내가 처음 그를 만나 시험해보고, 홍총각과우군측을 한데 합해놓은 셈이라고, 감탄하여 마지 않었다."],["이 이외에도 당당한 장수를 적지 아니 모았다."]],[["그 방법으로는 먼저 이제초를 끄러넣을 때에도 쓴 방법이지만, 다복동에서 금점을 한다는 소문을 널리퍼쳐서 대량으로 장정을 모집하였다."],["그 때 농촌에서는 삼년을 나려서 가물이 들고, 더구나 그 해 신미년(辛未年) 에는 팔십 먹은 노인도 처음 본다는 큰 가물이라, 처음부터 모라고는 꽂아보도 못한 논들이 많어서, 가을부터 일반 농가에서는 벌서 먹을 것이 없어서, 도조니 빚에 쫄리다 못하여, 야반도주하는 집이 적지 않었다."]],[["이런 때에 다복동에서 금점을 한다는 소문이 들리니, 그들에게는 이보다 더 반가운 소식이 없었다.","너 나 할 것 없이 힘꼴이나 쓴다는 사람은 우 ─ 하고 다복동으로 몰려들었다."],["다복동에서는 홍총각과 이제초가 중심이 되어, 각처에서 모여든 장정들을힘과 제조를 시험하여 장교(將校)와 병졸로 나누고, 미리 예비하여 두었든 집에 각각 배치하여, 삼시를 배불리 멕이고, 매일 맹렬하게 싸홈 연습을 시켰다."]],[["돌 들기, 줄 타넘기, 칼 쓰기 ― 이러한 것이 그 중요한 것이다.","말 잘 타는 사람은 특별히 취급하여 말 달리기에 주력을 두었다."],["이리하여 이 때에 다복동에 모여든 장정의 수효는 천 명을 넘었다."],["五 [오].","薪島會議 [신도회의]"],["경내가 고향에 가서 가족을 다리고 다복동에 돌아온 몇일 후에, 경내는 몰래 각처로 사람을 보내어, 그 때까지 연락하여 두었든 각처의 거두(巨頭) 들을 신도(薪島)로 소집하여 긴급히 비밀회의를 개최하였다."]],[["신도(薪島)는 다복동 바로 앞을 흐르는 대영강(大寧江) 한가운데 있는 섬으로, 경내는 여러 사람의 이목을 피하여 대개 이 섬 속에 거처하였든 것이다."],["이 때에 모여든 거두는 가산(嘉山), 박천(博川), 태천(泰川), 곽산(郭山), 정주(定州), 선천(宣川), 철산(鐵山), 영변(寧邊), 안주(安州)와 같은 가까운 데는 물론이고, 구성(龜城), 용천(龍川), 삭주(朔州), 강게(江界) 같은 먼 데까지 ― 거의 평안도 전세를 통하여, 현재의 왕조에 불평을 품은 유력자는 거의 전부가 포함되어 있어, 예상 이상으로 수가 많었다."]],[["그 곧에서가장 유력한 수교(首校) 니, 수리(首吏) 니, 좌수(座首) 니 하는 사람들도 적지 않었고, 여러 시장을 독점하다시피 하고 있는 큰 장사꾼도 적지 않었다.","이들은 이 때까지, 혹은 즉접 경내를 통하여 혹은 군측이나, 히저나, 창시를 통하여 긴밀히 열락은 하여왔었으나, 여전히 이야기가 좀 막연한 것 같고, 허황한 것도 같어서, 은근히 불안을 느끼었는데, 이처럼 여러 수십 명이 ― 더구나 이러한 유력한 사람들이 일당에 모이고 보니, 이 때까지의 불 안이 일소되고 반다시 성공하리라는 것을 확신하게 되었다."]],[["먼저 하날 앞에 제사지내어 꼭 성사하게 하여달라고 빌고, 다음에 경내 이하 차레차레로 피를 마시어 서로 배반하지 않기를 굳게 맹세하였다."],["그리고 회의로 들어가, 여러 가지 의논이 나왔는데, 결국 위선 긴급한 세 가지 일을 결정하였다."],["첫째로, 오는 임신(壬申) 년 정월에 기병(起兵) 할 것."]],[["둘째로, 그 때까지 군량(軍糧)과 군기(軍器)를 충분히 준비해놓고, 군병(軍兵)을 더 많이 모집하여 훈련시키며, 각처의 내응동지(內應同志) 들 간의연락을 굳게 해 놓을 것."],["셋째로, 비밀을 엄수하여 누설되지 않도록 주의하고, 동지들 사이의 단결을 더욱 굳게 할 것."],["그런데 이 결정에 대하여, 홍총각과 이제초로부터 반대 의견이 나왔다."]],[["이들의 의견으로는 내년 정월에 기병한다면, 앞으로 두 달 이상이 남었는데, 그 때까지 아모리 비밀을 지키려고 애써도 도저히 지킬 수 없을 것이니, 되도록 빨리 그 이전에 기병하자는 것이다.","다복동에는 약 일천 명의 장정을훈련시키고 있는데, 자기 가족들과의 왕내를 금하고는 있지만, 관혼상제(冠婚喪祭)의 대사가 있다고 해서 찾어오는 것을 그대로 거절할 수도 없어, 더러 면회를 시키고 있으며, 개중에는 밤에 몰래 도망하는 자도 있고 해서, 앞으로 너머 질질 끌고 나가면 세상에 널리 소문이 퍼저서, 일도 해보지 못하고, 도리혀 탄압을 당할 염려가 있다는 것이다."]],[["“그야 일즉 서들어서 하는 것이 좋은 줄은 누가 모를가만, 준비가 다 돼야지. 덮어놓고 서들기만 해서야 ─. 그렇지 않소?”"],["홍총각과 제초의 말을 듣고서, 군측은 이렇게 반문하며 좌우를 돌아보았다."],["“그렇지요. 이것이 무슨 시골 농군들이 몇십 명 모여서 편싸흠 하는 것도 아니고 적어도 나라를 뒤집어서 새로 세우자는 일인데, 그렇게 경거맹동(輕擧盲動) 해서야 되나? 준비를 다 해가지고 일어나야지.”"]],[["“암, 그렇구말구. 앞으로 한 두어 달은 시간의 여유가 있어야, 내응할 준비도 하고 연락할 동지들도 더 연락을 하지. 그 동안만 어떻게든지 여기서참어야지요.”"],["이렇게 응하는 소리가 여기 저기서 나왔다."],["“아니, 시골 농군들의 편싸홈은 그렇게 쉬운 줄 아오? 이 쪽에서 준비하면 저 쪽에서도 준비하고, 이 쪽에서 사람을 모으면 저 쪽에서도 사람을 모는데, 이기기가 그렇게 쉽겠오? 저 쪽에서 어리둥절할 때에, 이 쪽에서 먼저 서들어서 디리처야 이기는 게지, 다 같이 준비하고, 다 같이 사람을 모아서 한다면야, 승부가 그리 발리 나겠오?"]],[["그러니 길게 이야기할 것 없이, 다복동의 소문이 퍼지기 전에 기병하도록 하자는 말이오.”"],["홍총각은 좀 흥분해서 언성을 높이며 주장하였다."],["“쇠뿔도 단결에 빼랬다고, 이렇게 여러시 모인 김에 더 자세한 것을 확정하여 가지고, 적어도 올 안으로 안주(安州) 평양(平壤)을 아서서 평안도만이라도 손아귀 속에 넣도록 합시다.”"]],[["제초도 강경히 주장하였다."],["“그거 안될 말이요. 준비가 다 되고, 계획이 다 서야만 일이 되는 법이지, 그렇게 서두르기만 하면 되겠오?”"],["“그런 용기를 폭호빙하(暴虎憑河)의 용기라고 해서 공자(孔子) 님께서도극히 경게하시었소. 한날 혈기(血氣) 만으로 이러한 큰 일이 일우어지겠오?”"]],[["이러한 반대하는 소리가 여전히 지배적이다."],["“공자왈 맹자왈만 찾는 책상물림들과는 도모지 이야기를 하여도 가깝하여못 견데겠네. 그래 그렇게들 준비하지만, 우리 준비가 다 되도록 저 쪽에서는 가만이 있겠다고 누가 약속이라도 햇단 말이오?","이번 우리의 하는 일이 위험한 것은 처음부터 빠안한 일이지, 위험한 것이 무서워서야 어떻게 이런 큰 일을 같이 도모하겠오? 죽을 작정하고 덤벼야 살 길이 나오지, 온전하게안전한 길만 찾다가는 그야말로 큰코 다칠 테니까 ─.”"]],[["홍총각은 조곰도 구피지 않고 반반하였다.","그리고 두 눈을 부르뜨고 좌우를 노리고 보며"],["“위태로운 일이 무섭고 겁이 나는 이는 사양할 것 없이 다들 썩썩 물러가오. 어서 물러가요.”"],["하고, 호령하였다."],["“자 ─, 의논은 그만 합시다.”"]],[["이 때까지 양편 말을 묵묵히 듣고만 있든 경내가, 비로소 입을 열었다.","모두들 고개를 들어 상좌에 앉은 경내를 우러러봤다.","오늘 이 회의를 소집한원 주인이 경내였음을, 모두들 새삼스러히 느꼈다."],["“내년 정월에 기병하자는 것은 이미 결정된 것이고, 각자 돌아가서 그 때까지 충분히 준비하여 일에 상치가 없도록 할 것은 물논인데, 만약 그 이전에 우리들의 일이 탈토나는 경우에는 그대로 앉어서 기다릴 수 없는 일이니까, 그 때는 여기서 적당히 새로 시일을 정하여 통지할 것이니까, 그런 때에도 바로 내응할 수 있도록 만단의 준비를 가추어 달라는 것입니다."]],[["이렇게 되면 양편에서 길게 언쟁할 것이 없지 않소? 의논은 이만 하고 술이 준비된 모양이니, 이제부터는 목을 좀 취기기로 합시다.”"],["경내는 이처럼 최후의 결논을 나리고, 술상을 가져오라고 손짓을 하였다.","양편에서는 모다 말이 없었으나, 대개 찬성하는 표정이였다.","홍총각과 제초편에서는, 결국은 머지 않어 일이 탈로나서 바로 기병하지 않으면 안되리라고 - 생각하고, 군측을 위시한 대부분은, 결국은 처음 결정한대로 내년 정월에 기병할 것이니까, 우리의 주장이 그대로 통과된 셈이라고 - 생각하였다."]],[["술상이 드러와서 술잔이 몇 차렌가 돌아가니, 이 때까지 긴장하였든 분위기가 겨우 완화되고, 술이 빨리 오르는 패들은 벌서 앞가슴을 풀어헤치고수심가를 올버므리 넘겼다.","경내와 군측과 사용은 셋이서 각처의 동지들과의 연락을 조용조용히 의논하고있고, 히저와 시창은 좌중에서 친한 사람들도 제일 많고 술도 제일 좋와하는 편이라, 여러 사람들 사이에 둘려싸여서그저 닷는대로 쭉쭉 다리키고 있었다."]],[["“평안도에서 누구누구 하고 칠만한 사람은 오늘 죄 ― 다 이 자리에 모인셈인데 어째 술맛이 안 나겠오? 자, 김진사도 한잔 하오.”"],["히저가 시창에서 한 잔 딸으며, 이렇게 권하니"],["“아무렴, 원래부터 서북에서 큰 인물이 많이 났지요. 을지문덕(乙支文德) 이니, 양만춘(楊萬春) 이니, 서산대사(西山大師) 니, 김경서(金景瑞) 니, 정봉수(鄭鳳壽) 니 ― 이것이 모다 서북에서 나지 않었오?"]],[["임진왜난(壬辰倭亂) 만하더래도 그렇지, 우리 평안도 빼놓고는 조선 팔도가 거의 다 왜놈들한테점령당하였든 것을, 우리 서북 사람들이 중국에서 나온 명(明) 나라 구원병과 협력하여 겨우 왜병을 물리치고, 나라를 회복해놓지 않었오?","그런데도불구하고 서북 사람이 그 후 어떠한 대우를 받고 있오? 제법 똑똑한 벼슬 하나 얻어하지 못하고, 큰 벼슬은 서울서 세도하는 양반놈들이 서로 꼭 짜고서 독차지하고있지 않소?","생각하면 복통을 할 노릇이지요.”"]],[["창시는 받은 술잔을 한거번에 쭉 다리키며, 말을 이었다."],["“이 때까지 서북 사람이 가만이 있었다는 것이 도리혀 이상하지요. 이번에 서울로 처올러가서 어데 세도하든 놈들이 얼마나 잘난 놈들인가 단단이 좀 따저보자지.”"],["“가서 따저보나 마나 하지. 김진사야 그까지 세도하는 서울 양반들에게대겠오. 이번에 이번에 우리 일이 성사만 하면 김진사야 영의정(領議政) 하나야 따놓은 거나 진배없지, 문장으로나 재능으로나, 김진사 덮을 사람이 누가 있드란 말이오?"]],[["영의정 되거든 우리 장사하는 사람들 돈 좀 잘 벌도록해주. 지금처럼 중국에 가는 사신(使臣) 뒤에 따라다니는 역관(譯官) 들을 통해서 물건을 넘겨 맡어서야, 어데 이가 박하고 자따라서 되오?","아주 중국과 좀 더 터놓고 거래를 하도록 하여야 할 것이요. 김진사야 술도 잘 먹고, 언변도 좋으니까 이런 교섭쯤은 문제없겠지. 머, 허허허!”"],["히저는 앞으로 쑥 나온 뱃다지를 뒤흔들며 웃어댄다."]],[["“하기사 장삿속도 그렇지, 서북 사람이 힘드려 벌어놓으면 평안감사니 무어니 하고 서울 양반이 나려와서는 별별 조건을 다 붙여 가지고 닥닥 글거가고 마니까 ─.”"],["“그러니까, 우리 장삿군들이 이번 일에 이처럼 이를 악물고 덤벼드는 게 아니요.”"],["히저와 창시를 둘러싸 이판이, 이야기가 제일 활발하다."]],[["홍총각과 제초는 좀 떨어저 앉어서 묵묵히 이들의 떠드는 소리만 들으면서술을 마시고 있다가, 술맛도 별로 나지 않어, 다른 사람들보다 먼저 일어나서 밖으로 빠저 나와서 다복동으로 향하였다."],["홍총각은 돌을 하나 주어서 냇다 팔매질을 하면서"],["“별슬하고 싶어 하는 놈들은 웨 그리 벼슬 욕심이 많고, 장삿군놈들은 또 웨 그리 돈 벌 욕심만 그렇게 많을가? 기막힐 노릇이로구먼 ─.”"]],[["하고, 제초를 돌아보았다."],["“우리 일이 성공한대도, 잘못하면 남의 좋은 일을 해주게 될가 보. 우리둘이야 또 참아 괄세 못하여 훈련대장(訓練大將) 이니 무어니 차지가 올른지모르지만, 우리가 거느리고 갈 저 농군들이야 무엇이 되겠오?","큰 벼슬을 바라겠오? 큰 부자가 되기를 바라겠오? 결국은 도로 땅파는 농군이 될 터인데, 그들에게 무슨 이익이 돌아가겠오?”"]],[["제초는 오늘 저녁에 이 때까지 생각하였든 것을 한탄하는 어조로 말 하였다."],["“그들은 삼년이나 가물이 나려드는 바람에, 먹고 살 수가 없어서 다복동으로 모여왔는데, 어떻게든지 그들이 먹고 살 도리를 생각해 주어야지. 싫건 부려만 먹고, 이익은 딴 놈이 앗는대서야 될 말이오.","그렇게 된다면, 나라를 뒤집어엎으나 마나 하지, 결국은 그 놈이 그 놈일 것이 아니요? 왜 글깨나 배웠다는 놈들하고, 돈푼이나 갖었다는 놈들은 모다 생각하는 것이 그지경일가?”"]],[["“겁은 지독하게 많으면서 입으로 둘러마추기는 용하게들 둘러마추거든"],["─.","실지로 싸흠이 버러저야, 그 자들도 좀 정신을 차리겠지.”"],["“그 자들 없이는 아무 일도 되지 않고, 같이 일을 하자니 일이 잘 되어나갈 것 같지 않고 ― 하여간 고질이어.”"],["“그 자들 없이야 당장 천여 명이 넘는 사람들을 어떻게 멕여나가겠오. 그자들이 모다 장삿속으로 덤벼든 줄을 번연히 알지만, 그것을 안 받어 가지고는 애당초에 일을 해나갈 수가 없는 것을 어찌겠오?”"]],[["“우리 일이 성공하는 날에는 어떻게든지 그 자들을 꾹 눌러 가지고, 농민들이 좀 잘 살아나갈 연구를 따로 해야지, 그대로 내버려두든 못할게요.” “그러니 우리의 책임이 여간하오?”"],["둘은 서로 믿고 일할 사람은 자기들 둘뿐이라는 것을 새삼스러이 느끼어, 고개를 들어 멀끄럼이 서로 쳐다보았다."],["六 [육].","十二月 十八日 [십이월 십팔일]"]],[["신도회의가 끝나자, 각처의 거두들은 모다 바로 제 근거로 돌아가고, 다복동의 군졸의 훈련도 더 한층 격렬해졌다."],["창시는 원래 정감녹(鄭鑑錄)을 절대로 신입하고 있었음으로, 내년에 기병할 것을 미리 일반에게 암시하기 위하여, 임신 기병(壬申起兵)의 넉짜를 열여덜짜로 파작(破作) 하여"],["일사횡관하니, 귀신탈의하고, 십필가일척하니, 소구유양족이라"]],[["(一士橫冠, 鬼神脫依, 十疋加一尺, 小丘有兩足)"],["─ 이러한 괴상한 문구를 만들어 민간에 유포시키었다.","그리고 또 칠월 달부터 건방(乾方)에 헤성(彗星)이 나타나, 민간에서는 무슨 큰 변고가 있을 것이라고 수군거리는 판이라, 창시는 이것을 이용하여, 건방은 서북방(西北方)을 가르치는 것이니까, 서북방에서 큰 난이 일어나겠다는데 그 난을 타서 서북 지방에서 일대 영웅이 출현하여 나라를 새로 세울 증조라고 해석해서 유포시켰다."]],[["그리고 연이어서 이것을 구체화(具體化) 한 이야기를 하나꿈여서 유포시켰다."],["선천군(宣川郡) 검산(劍山) 속 일월봉(日月峰) 밑에 군왕포(君王浦)라는 데가 있어, 그 물을 끼고 가야동(伽倻洞)이라는 깁숙한 골이 있고, 그 물속에 홍의도(紅衣島)라는 섬이 하나 있는데, 이 섬에서 삼십년 전에 이인이 하나 나왔다.","어머니 뱃속에서 나올 때에 벌서 이가 다 나고, 말을 하며, 아장아장 거러댕겼다."]],[["다섰 살 먹든 해에 이상스러운 중이 하나 찾어와서이 아이를 다려가 버렸다.","그리고서는 그 후에 일절 소식이 없었다.","그리다가 얼마 전에 비로소 그 아이가 그 동안 중국 곤윤산(崑崙山)에 들어가서도승(道僧) 한테서 도술을 배워 가지고 도로 조선으로 나와 강게(江界) 땅에 숨어서 있었든 것이 판명되었다.","그런데 어느결에 벌서 십만 대병을 모아가지고 때만 노리고있어, 북으로 만주 쪽을 디려처서 청(淸) 나라를, 무찌를 것은 물논이고, 남으로 평양, 한양을 디려처서 청나라에 복종하고 있는 이조(李朝)를 뒤집어 엎어버릴 것이다."]],[["건방에 나타난 헤성은, 곧 이인이 때를 만난 것을 하날이 지시한 것으로, 미구에 나라가 뒤집히는 큰 난리가 날것이라는 것이다."],["이것은 몇 해 전에 경내가 압녹강 상류 지방을 갔을 때에 만난, 만주의 마적단 두목 정시수(鄭始守)의 이야기를 신비화한 것이다."],["이 이외에도 별별 유언비어가 제조되어, 읍내 장터로, 시골 사랑방으로 순식간에 좍 ― 퍼저나갔다."]],[["한편 각지에서 군기와 군량이 더욱 활발하게 다복동으로 모여들었다.","선천(宣川) 사는 유문제(劉文濟)와 최봉관(崔鳳寬) 이는 총하고 칼하고 창을 소에 한 바리 잔득 실어보내고, 정주(定州)에 사는 정진교(鄭振喬)는 탄환과촛대를 실어보내고, 철산(鐵山)에 사는 정복일(鄭復一)은 여러 가지 깃발을만들어서 배에 실어 보내고, 용만(龍灣)에 사는 여러 동지들은 군졸의 옷과화려한 주단을 여러 바리 말에 실어보내고,","선천(宣川) 사는 계형대(桂亨大)는 군량 백여 석을 배로 실어보내고, 곽산(郭山) 사는 박성간(朴聖幹)은 돈 오백량과 쌀 열닷섬을 실어보내고, 영변(寧邊) 사는 남명강(南明剛) 과김우학(金遇鶴)은 돈 이천량과 말안장 열여섯을 실어보내고, 이 이외에도 여러 가지 물자가 다복동으로 모여 들었다."]],[["그리고 이들이 모다 각지에 흩어져 있는 내응동지(內應同志) 인 것은 부언할 것도 없다."],["이리하여 다복동에 사람이 들끓고 인마의 왕내가 더욱 빈번하게 되니, 자연 소문이 널리 퍼저서 관청에까지 차차 알리게 되었다.","처음에는 그전처럼금점을 한다고 속였으나, 그것이 거짓말이라는 것도 바로 알려져서, 뭐라고변명할 여지가 없이 되었다.","더구나 홍총각이니, 이장군이니 하는 ― 농민들 사이에 평판이 자자한 장수들이 다복동에 모였다는 소문은 그들에게 은근히 큰 기대를 갖게 하고 제 일인 것처럼 흥분케 하였다."]],[["이렇게 되고 보니 경내도 신도회의에서 결정한 ― 내년 정월에 기병하겠다는 게획을 변경하지 않을 수 없었다.","군측, 히저, 창시, 사용, 홍총각, 제초와 긴급회의를 여러서, 금년 십이월 이십 일에 기병하기로 결정하였다.","홍총각과 제초는 더 일즉이 기병하자고 주장하였으나, 각지에 있는 동지들과의 연락도 있고 해서 결국 십이월 이십 일에 낙착한 것이다."],["그리고 경내는 그 자리에서 부서(部署)와 작전 게획을 확정하였다."]],[["부서는─"],["홍경내 ― 평서대원수(平西大元帥)"],["우군측 ― 총참모(總參謀)"],["김창시 ― 참모(參謀)"],["홍총각 ― 선봉장(先鋒將)"],["이제초 ― 선봉장(先鋒將)"]],[["윤후험 ― 후군장(後軍將)"],["이히저 ― 도총(都總) (군량과 군수품을 관활하는 책임이다)"],["김사용 ― 부원수(副元帥)"],["이처럼 정하였다."],["이 부서에 있어, 모다 타당하여 별의견이 없었으나, 다만 홍총각이 선봉장인데 대하여, 군측, 창시, 히저가 모다 반대하였다."]],[["너머 경솔하게 나대기때문에 그러한 중요한 책임을 지우는 것은 위태롭다는 것이다.","그러나 경내는 절대로 홍총각을 신임하였고, 제초도 만약 홍총각의 부서를 갈면 자기도고만두겠다고 주장하여 결국 원안대로 결정되었다.","하지만 홍총각과 제초를 중심으로 하는 패와, 군측, 창시, 히저를 중심으로 하는 패와 완연히 두 패로 갈리어, 경내로서도 이 두 패 사이를 원만히 묻어나가기가 그리 쉽지 않으리라는 것이 예상되었다."]],[["작전은, 평양, 서울을 향하여 남진하는 남군(南軍)과 의주(義州)를 향하여 북행하는 북군(北軍)과 둘로 나누어, 남군의 근거지는 다목동으로 하고, 북군의 근거지는 곽산(郭山)으로 정하였다.","다복동은 벌서 몇 해 전부터 근거지로 되어있었으나, 곽산은 홍총각과 창시의 고향이고, 또 그 곳에 제일 가는 부자 박성간(朴聖幹)과 첨지(僉知) 박성신(朴星信)이 이 편이었음으로, 북군의 근거지로 된 것이다."]],[["물론 주력은 남군에 두고, 경내가 즉접 지휘하며, 군측, 창시, 홍총각, 제초, 후험, 히저가 모다 여기에 참가하여 돕게 하고, 북군은 사용이 지휘하는데, 김히련(金禧鍊), 김국범(金國範), 이성항(李成沆), 한처곤(韓處坤) 등의 제장을 거느리게 하였다.","그리고 안주(安州), 평양(平壤), 정주(定"],["州), 영변(寧邊) 등 ― 중요한 곳에는, 여러 장졸 중에서 아주 심복이 될 만한 자만 수십 명 뽑아서, 혹은 걸인 행색을 하고, 혹은 붓장사의 행색을하고, 몰래 각골에 숨어 들어가서, 거기서 내응동지들과 잘 연락하여, 이십 일에 일제히 봉기하도록 정하였다."]],[["그리고 동지들 사이에는 병부(兵符) 대신에 암호를 박은 은패(銀牌)와, 공(空) 짜, 배(背) 짜를 쓴 기를 주기로 하였다."],["그러나 십이월 이십 일에 기병하자는 이 결정도, 일에 착오가 생기어 또한 번 닥이는 수밖에 없었다."],["그것은 평양으로 보낸 십여 명의 장졸들이 그 곳 내응동지들과 연락하여 폭동을 일으키자는 게획이 실패에 돌아간 것이다."]],[["관변의, 다복동에 대한 관심을 돌리고, 그들이 갈피를 잡지 못하게 만들기 위하여, 십이월 십오 일 밤에 객사(客舍) 대동관(大同館)을 불지르고, 감사(監司)를 위시한 고관들을 닫는 대로 암살하여 버리자는 게획이었는데, 호사다마(好事多魔)라, 춥든 날이 갑자기 풀리는 바람에 대동관 밑에 묻었든 화약통과 그 끈에, 어름물이 녹어 적시어서, 그 날 밤중에 터지지 않고, 그 이튿날 점심때가 지나서 터졌다.","이러한 대낮에 터지고 보니, 아모리 대기하고있든 장졸들도 폭동을 이르킬 도리가 없고 신변이 위험하여저서, 각기 도망하여 다복동으로 돌아왔다."]],[["그런데 이 중의 한 사람이 관원에게 부뚤리어, 다복동의 일이 전부 탈로되고, 여기서 바로 가산(嘉山) 군수한테 통첩을 보내어, 십구 일에는 다복동을 습격하리라는 정보가 들어왔다."],["또 선천(宣川)에서 십칠 일에 피난 가는 사람들을 잡어다가 족치는 바람에, 내응동지로 있는 별장(別將) 최봉관(崔鳳寬) 이가 잡히어, 이 입에서 철산(鐵山)의 정복일(鄭復一), 곽산의 김창시(金昌始) 박성신(朴星信)의 일흠이 나왔다."]],[["선천부사 김익순(金益淳)은 이것을 곧 곽산군수한테 통지하며, 한편 포교(捕校)를 보내어 김창시와 박성신을 잡게 하였다.","이 때에 김창시는 없었음으로 그 아버지와 박성신이 잡히었고, 이 소식이 바로 다복동에전하여졌다."],["또 십칠 일 밤에 박천(博川)에서, 경내의 파견한 군졸이 하나 부뜰리어, 경내와 히저의 이흠이 나와, 십팔 일에는 벌서 가산군수는 이 통지를 받아서, 히저의 집을 몰래 둘러싸고 취조를 시작하였으며, 히저의 식구들은 용하게 여기서 빠저나와 다복동에 이 위급한 사태를 알리었다."]],[["이처럼 사방에서 속속 비밀이 탈로되고, 관원의 추급이 급하게 되어, 이 이상 더 지체할 수 없이 되었음으로, 경내는 이십 일 예정이든 것을 이틀닥어서, 십팔 일 밤에 즉시로 기병하기로 결정한 것이다."],["이 결정에는 홍총각, 제초 편이나, 군측, 창시, 히저 편이나, 쌍방이 모두 찬성하였다.","홍총각 편으로서는 예정보다 하루라도 빠르니 좋았고, 군측 편으로서도 모다 자기의 가족들, 친척들이 위태롭고, 집을 습격 당하여 가산이 탕진하게 되었기 때문에, 이제는 더 주저할 여지가 없었다."]],[["그저 다만 홍총각이나, 제초는 원래부터 가족도 없고, 가진 재물도 없고 해서, 오로지 눈 앞에 닥처올, 나라를 다투는 큰 승부에 피가 뛰고, 주먹이 부들부들 떨리는데 대하여, 군측, 창시, 히저는 전혀 예측하지 않은 바는 아니나, 막상딱 당하고 보니 가슴이 뜨금하며 일종의 불안을 느끼지 않을 수 없었다.","앞으로 고관대작을 한 히망도 허망이려니와, 그보다도 당장 가지고 있든 것을잃어버리는 것이 더욱 섭섭하고 무섭기 때문이다."]],[["이리하여 가진 사람도 안 가진 사람도 모다 합심하여, 그여히 난리는 터지게 되었다."],["七 [칠].","嘉山 [가산] 의 蓮紅 [연홍]"],["신미년(辛未年) 십이월 십팔 일 날이 저무러 어둑어둑할 무렵에, 경내는장병들에게 일제히 무장을 시키어 다복동 넓은 마당에 집결시키고, 스사로대원수의 복장을 하고 단 우에 올라 공순히 하날에 제사를 올리고, 참모 김 창시를 시켜서 격서(檄書)를 낭독케 하였다."]],[["격서의 문구는 물론 한문으로된 것이나, 그 내용은 대개 서북 사람의 억울한 사정을 누누히 말하여 도저히 그대로 참고 있지 못할 것을 강조한 것이다.","즉 서북은 기자(箕子) 때부터, 고구려(高句麗) 때부터 천하에 그 일흠을 휘날리든 구역(舊域)으로, 을지문덕(乙支文德), 양만춘(楊萬春), 서산대사(西山大師), 김경서(金景瑞), 정봉수(鄭鳳壽) 같은 영특한 인물들이 많이 나왔고, 임진왜난 때에는 평안도 사람 힘으로 나라를 회복하고,","사직을 지탕하였음에도 불구하고 조정에서는서북 사람을 극도로 천대하여 벼슬 하나 변변한 것 시켜주지 않고, 해마다연하는 천재(天災)로 인민이 굶어죽을 지경에 이르렀어도 이것을 구제할 방책은 조곰도 강구하야 주지 안는다."]],[["더구나 지금 김조순(金祖淳) 이니, 박종경(朴宗慶) 이니 하는 무리가 조정에서 정권을 농단하여 인민을 도탄에 빠지게 하고 있다."],["이 때에 선천군 검산 일월봉(劍山 日月峰) 밑에서 이인이 하나 나서, 일즉이 중국에 들어가 도술을 배워 가지고 다시 조선에 돌아왔는데, 지금 강게(江界)에서 십만 대병을 거느리고 북으로 청나라를 치고, 남으로 서울을 디려치려 하고 있다.","그러나 서북은 구익이라, 참아 병마(兵馬)를 함부로 움직이어 짓밟게 할 수 없어, 서북의 영웅호걸들을 시켜 제세구민(濟世救民)의 의군(義軍)을 일으키게 하시니, 모다 순종하여 거역하지 말라."]],[["이러한 격문을 낭독하고, 경내는 부하의 장졸들과 군법을 써서 행주(行酒) 하고 천여 명의 장졸들의 하래하는 고함 소리에 째이어, 강산을 삼킬 듯한기세로, 바로 가산(嘉山)을 향하여 행동을 개시하였다."],["이 때에 홍총각은 선봉장이 되어, 정병(精兵) 백여 명을 거느리고, 경내의대군에 앞서서 가산읍으로 처들어갔다.","홍총각으로서는 오래간만에 활약할때를 만나, 가산 이십 리를 단숨에 말을 달리어, 그대로 좍 ― 동현(東軒) 까지 밀고 들어갔다."]],[["당시의 가산군수는 정시(鄭蓍)라는 자로 전형적인 관료였다.","어떻게든지구실을 붙이어 연민의 돈을 박박 긁어디리어, 그야말로 관 쓴 도적놈이었다.","히저는 이 가산에서는 제일가는 부자로, 신분은 역속(驛屬)에 불과하였으나, 먼저 군수한테 돈을 바치어 향안(鄕案)에 들게 되었었는데, 정시는 히저가 돈이 많은 줄을 알고, 또 한번 빨아먹으려고 향안에서 히저의 일흠을 빼어버렸다.","히처가 또 돈을 갖다가 바치면 다시 향안에 자기의 일흠을올여줄 것은 빤 ― 한 일이었으나, 원이 갈리는 대로 돈을 바치기로 하면 한이 없겠고, 또 히저라는 위인이 워낙이 뱃장이 세어서, 한 번 제 비위에맞지 않으면 영영 틀어저버리는 성격이라, 홧김에 그대로 내버려두었다."]],[["그리하였드니 얼마 후에 불효(不孝)라는 얼토당토않은 죄명을 씨워서 잡어드리어 그여히 돈을 받어먹고서야 내놓아주었다."],["이뿐이 아니었다.","그 때 가산에서 제일 가는 미인은 관거 연홍(蓮紅) 이었는데 히저는 먼저 군수한테 천량이라는 대금을 바치고 기적(妓籍)에서 빼다가 자기의 첩을 삼없었다.","그런데 정시가 도임하여 오자마자 이것을 알아내어 가지고, 바로 연홍이를 잡어드려가 버렸다.","이것도 물논 히저의 돈을 빨아먹자는 수단이었으며, 몇일 후에는 비밀리에 아전을 보내어 돈 오백 양만바치면 다시 연홍을 내놓아주겠다고 일러보냈다."]],[["그러나 히저로서는 또 다시 돈을 빼았기기도 억울하였지만, 사람을 사이에 놓고 내탐하여 보니, 연홍이가 잡혀가서는 바로 정시와 정을 통하여 히히낙낙하고 있다는 것이라, 여기에 더욱 화가 나서, 연홍을 그대로 내던저 버렸다."],["히저가 경내의 당에 가입한 것은, 군측의 교묘한 수단도 있었지만, 사실은 그것보다도 히저의 정시에 대한 이러한 여러 가지 원한이 즉접으로 그 동기가 되었든 것이다."]],[["정시는 십팔 일 아침에 박천군수로부터 히저가 경내의 당에 가입하였다는정보를 받고, 너무나 의외고, 또 너무나 무서워서 부르를 떨리었으나, 한편으로는, 이것 참 잘 되었다는 고소한 마음도 들었다.","바로 관노 사령들을총동원하여 히저의 집을 둘러싸고, 가족들을 모조리 잡어드리라고 명령하였다.","관노 사령들은 명령대로 죽 ― 들 물러갔는데, 어쩐 일인지 아모리 기다려고 종무소식이다.","기다리다 못하여 다시 사람을 시켜야겠는데, 사람이라곤 구경할 수가 없다.","마침 연홍의 오래비되는, 순교(巡校) 최윤적(崔允迪) 이가 사환 갔다가 돌아왔다."]],[["바로 이 윤적이를 시켜 아러보니, 그들은 원의 명령에 마지못하며 히저의 집을 둘러싸기는 하였었으나, 그 집 식구들이 빠져나와 도망질 치는 것은 본체만체하고, 저의들끼리 수군수군하니, 라 각(鑼角), 기고(旗鼓), 군복(軍服), 기게(器械)를 물래 창고에서 훔처내"],["가, 제 맘대로 나누어 가지고 어데론지 뿔뿔이 헤어저갔다는 것이다."]],[["“에이, 겁쟁이 놈들! 남의 밑에서 종노릇을 하는 놈들은 천생 할 수가 없구나.”"],["정시는 그 때까지도 그저 그들이 겁을 집어먹고 도망간 것으로만 알었다.","“도망간 놈들은 추후로 처벌하기로 하고, 위선 먼저"],["히저의 일을 귀정을내어야지.","무어 여러시 떠들 것도 없이 네가 혼자 가서, 그 놈의 창고 문을 열고 어떻게든지 거기 두어둔 돈을 몇 만 양이 되든 이리로 나르도록 하여라."]],[["그런 대역무도한 놈은 삼족까지 멸할 판이니까, 재산 몰수야 당연한 일이다.","어서 가봐라!”"],["정시은 이처럼 다시 윤적에게 명령하였다.","이런 판에 아주 단단이 횡재를해보자는 것이다.","그러나 이 때 연홍이가 쫒아 나와서"],["“그것을 가지고 오는 것은 좋은데, 지금 관노 사령도 아무도 없고 인심이흉흉한데, 그런 대금을 관청으로 가지고 오는 것은 좀 위험한 것 같습니다.”"]],[["하고 조용히 의견을 말하였다."],["“그러면 어데다 옴겨놓을가? 이 틈에 옴겨는 놔야지 ─.”"],["“즈이 오래비의 집에다가 위선 옴겨두었다가, 좀 안정이 되는 것을 보아 가지고, 다시 이리로 가저오는 것이 좋을 것 같습니다. 급작이 지금 어데믿을만한 자리가 있겠읍니까?”"],["“그도 그래. 그럼 오래 지체할 수 없으니까, 그리로 옴겨다 놓아라!”"]],[["이리하여 히저의 창고에서 몇 만 양의 대금이 고시라니 윤적의 집으로 죄다 운반되었다."],["그러는 동안에 날이 저무러 어두어젔다.","윤적을 시켜서 동현이 환 ― 하게 불을 켜 놓았으나, 인적이 끊어지고 모진 바람에 창문 덜컹거리는 소리만 들리니, 정시는 새삼스러이 무서운 생각이 꽉 치밀었다."],["이 때 서리(胥吏)의 하나인 김응석(金應錫)이라는 자가 밖에서 쫓아 들어와서"]],[["“이거 큰일났읍니다. 다복동에서 홍경내라는 대장이 나서서 수천 명 군사를 거느리고 이리로 처들어온답니다. 그리고 이 고을에 사는 이히저도 그 중에 대장으로 뽑히어서 이번에 앞장을 서서 온답니다.","말을 타고 나팔을불고 굉장하게 차려 가지고 들어들 오는데, 명령을 거역하는 자는 용서 없이 죽여버린답니다. 그러니 사또께서는 어떻게 하시겠읍니까?”"],["이처럼 천연덕스럽게 정보를 알리며 물었다.","응석이는 내응동지의 한 사람으로 정시의 혼을 미리 빼놓자는 것이다."]],[["“이 놈! 네가 허무맹낭한 소리를 해서 나를 놀래키려 드느냐? 이히저 같은 놈이 대장이 되었다면 알쪼지, 그런 불한당 놈들은 그저 오는 대로 잡아서 삼족을 멸할 것이다. 너도 이 놈 요망한 말 작작 하고 빨리 물러가거라!”"],["정시는 속으로 켕기어 벌벌 떨며서도, 외양으로는 긔세가 등등하게 여전히 호령하였다."],["“호령하시는 것도 좋지만, 지금 형세가 대단히 급합니다. 그래도 목숨이아까우시다면 항서(降書) 라도 준비해 놓고, 관인(官印), 병부(兵符) 라도 다찾어놓았다가 두말 없이 바치는 것이 좋을 것 같습니다.”"]],[["“이 놈! 천하의 무도한 놈! 빨리 물러가지 못하느냐?”"],["“녜, 소인이야 곧 물러가겠으니, 준비해 놓을 것이나 착착 해놓으시오. 아마 마구에들 올 겝니다.”"],["응석이는 손은 툭툭 털고 이러서서 그대로 나가버렸다."],["응석이가 나가자, 연홍이가 당황하게 쫒아 들어와서 묻는다."]],[["“참말로 어떻게 하시겠읍니까? 그 놈들이 처들어오는 것은 사실인 것 같지 않습니까! 사또는 어떻게 하시겠서요?”"],["“그 놈들이 처들어오면 그 수대로 다 잡어서 나라에 바처야 하는데, 지금 사실은 위선 제 몸 하나 피할 도리가 없으니…….”"],["정시는 평생에 한 번도 격거 보지 못한 이 돌발지변을 당하여, 전혀 어떻게 하여야 좋을지 알지 못하여, 도리혀 연홍에게 무렀다."]],[["“모다 변복을 하고 미리 도망질합시다. 도적놈들이 오기 전에 ─.”"],["“그것이 안전은 하지만, 나라의 녹을 먹는 몸으로, 도적을 보기도 전에도망했대서야 어데 체면이 됐어야지.”"],["“그렇다고 여기 어물어물하고 있다가는 목숨이 달아날 터인데, 어떻게 하시겠서요?”"],["둘은 곰곰이 의논한 결과, 도적이 쳐들어올 때까지 여기서 버티고 있다가, 도적이 항복하라고 위협하면 바로는 굴복하지 말고 버틸 수 있는 데까지 버티다가, 나종에 도적의 두목 앞에 끌려가서 비로소 항복하자는 것이다."]],[["이렇게 하여야 후에 조정에 알려저도 다소나마 면목이 서고, 벌을 받어도 가벼울 것이기 때문이다."],["“이히저가 앞장을 서서 온다면, 제가 참아 사또를 어쩌지는 못하겠지요” “그야 그렇지. 그까지 이가 놈이 설마 나를 함부로 하지는 못하겠지.” 둘은 이렇게 말하고, 안팎 ㅇ 로 드나들며 치울 것은 치우고 감출 것은 감추며, 한참 분주하였다."]],[["밤이 꽤 깊어서 고함 소리와 함게 선봉장 홍총각이 거느리는 군사들이 와― 하고 관문을 깨치고 처들어오며"],["“원놈을 잡어라!”"],["“정가를 노치지 말어라!”"],["─ 이런 소리가 요란하다."],["이 때 정시는, 이미 때가 늦어서 전할 도리가 없을 것은 뻔 ― 하면서도책상 앞에 꿀어앉어서 안주 병영(安州兵營)에 이 변을 알리는 영보(營報)를 쓰고 있었다."]],[["“이 놈! 네가 원놈이지? 이 아래로 썩 나려오지 못하겠느냐!”"],["홍총각은 문 안으로 들어스며 재빨리 정시를 발견하고, 두 눈을 부루뜨고처다보며 호령하였다.","그의 손에는 시퍼런 칼이 번적이였다."],["“이 무도한 도적놈들아! 여기가 어데라고 함부로 들어오느냐?”"],["정시는 맨주먹을 불군 쥐어 가지고 책상을 치며 나려다보고 호령하였다."]],[["“썩 나려와서 항복하지 못하겠느냐? 평서대원수(平西大元帥)의 명령을 거역할 작정이냐?”"],["“도적놈들한테 누가 항복을 한단 말이냐? 이 배우지 못한 무지막지한 놈들!”"],["“우리를 보고 도적놈들이라고 ─ 이 놈! 우리는 맹자왈 공자왈 모른다마는, 느이 관 쓴 놈들처럼 멀정한 대낮에 살인 강도한 일은 없다. 바로 썩 항복하지 못하겠느냐?”"]],[["홍총각은 성큼 뛰어 울라서, 정시의 상투를 건째 잡어쥐고"],["“관인을 내놓아라!”호령하였다."],["“못 내놓겠다. 느의 대장을 불러라!”"],["“무엇이 어째여? 길게 떠들 것 없다. 당장 이 자리에서 항복할 테냐, 안할 테냐.”"]],[["“느의 대장을 불러라!”"],["정시의 이 말이 채 떨어지기 전에, 홍총각은 시퍼런 칼을 우로부터 나려처서, 한번에 죽여 어퍼버렸다.","시뻘건 피가 은저리에 좍 ― 퍼졌다."],["“이 무도한 놈들아!”"],["고함을 지르며 정시의 애비 정노(鄭魯)가 안으로부터 내다렀다."]],[["“네 놈은 웬 놈이냐?”"],["“대장을 불르라는데 죽이는 놈이 어데 있단 말이냐? 이 무지막지한 놈들아!”"],["“이 놈이 원의 애빈 모양이로구나?”"],["“그렇다! 도적놈들아!”"],["“네 놈도 당장 이 자리에서 항복하겠느냐, 못하겠느냐!”"]],[["“대장과 상면을 시켜라!”"],["“무엇이? 또 그 따위 아가리를!”"],["홍총각은 또 한 번 칼을 나러처서 죽여 어펐다."],["이 때 다른 군졸들도 이 방 저 방을 뒤어서 정시의 동생 정질(鄭耋)과, 연홍이도 잡어내왔는데, 정질는 벌서 창에 찔리어 까무러쳐 쓰러저 있었다.","“저 게집은 웬 년이냐?”"]],[["홍총각이 무르니까, 먼저 원을 혼을 내키고 나갔든 김응석이가"],["“그 년이 바로 연홍이라는 관기입니다.”"],["하고 일러바첬다.","그가 오늘밤에 안내역이였든 것이다."],["“네 년은 항복하겠느냐?”"],["홍총각이 피 묻은 칼을 들고 이렇게 얼러대일 때."]],[["이 때서야 히저는 겨우동현에 들어왔다.","그도 말은 탔었으나, 워낙이 몸집이 크고 무거워서 나스기는 같이 나서가지고 뒤떨어젔든 것이다."],["“네, 저는 항복하겠읍니다. 저는 처음부터 원의 편은 들지 않었읍니다.” 연홍은 공손히 꿀어앉어서 대답하였다.","그리곤 재빨리 히저가 나타난 것을 보고, 말을 이었다."],["“이것은 이장군한테 여쭈어보면 분명하겠읍니다.”"]],[["모두들 히저를 처다보았다."],["“네 이 년! 죽일 년 같으니 ─. 이제 와서 다급하니까, 정가 편이 아니라고? 저런 능청 마진 년의 아가리를 그대로 둘 수가 있나? 당장에 그년의 아가리를 찢어버려라.”"],["히저는 노기가 등등하여 호령하였다."],["“그것은 이장군이 모르시는 말슴입니다. 댁의 창고의 그 많은 돈을 원이겁탈해 온 것을, 제가 원을 속여서 지금 잘 보관하고 있읍니다.”"]],[["연홍이 돈 말을 하는데 귀가 번쩍 띠이어, 히저는"],["“어데다 보관하였단 말이냐?”"],["하고, 바로 족첬다."],["“제 오래비 되는 윤적의 집에 잘 보관해 있으니, 조사해 보시면 아실 것입니다.”"],["히저는 바로 부하를 시켜서 아러오라고 명령하였다."]],[["“이 게집 일은 이장군한테 맞기겠으니, 좋도록 하시오.”"],["홍총각은 연홍과 히저의 사이가 그렇게 단순하지 않은 것을 아러채고, 밖으로 힝하니 나가버렸다."],["윤적의 집에 가서 조사해온 부하의 보고에 의하면, 그 많은 돈을 다 착착시어서 놓고, 이것은 이히저씨 댁 소유니, 타일은 절대로 범하지 말라고 써붙이고, 문에는 잠울쇠를 꼭 잠궈놔서, 보관이 잘 되어있드라는 것이다."]],[["“분명히 네가 그렇게 한 것이냐?”"],["“네, 이 때까지도 소첩이 권세에 눌리어 할 수 없이 여기 머물러 있었지, 본심이야 변하였겠읍니까?”"],["“그러면 네 집에 나가서 기다려라!”"],["이렇게 하여 연홍은 목숨을 보전하고 히저의 대금을 보관하였을 뿐이 아니라, 그 날 밤에 히저를 농락해서, 죽은 사람이 무슨 죄가 있으며, 원의 동생이야 무슨 죄가 있느냐고 애소하여 정시와 그의 애비 정노의 시체를 걷우어 염을 하고 입관시켰으며, 창에 찔리어 다 죽게 된 정질도 간호하여 목숨을 건지게 하였다. 그리고"]],[["“항복하려고 대장을 불러달라는 사람을 죽이는 ─ 그런 무지막지한 법이 세상에 어데 있읍니까?”"],["하고, 홍총각에 대한 원한까지 토로하였다."],["“이장군이 선봉으로 오시었다면, 그 후하신 마음으로 조곰도 살생을 하지 않고, 다 항복 받었을 것을 유감 천만이었읍니다.”"],["이처럼 히저를 올려세우기도 하였다."]],[["(후의 일이지만 홍경내의 계획이 실패로 돌아가, 가산도 회복되고, 조정에서 그 전 원들의 공죄를 논정하였을 때에, 정시 부자는 순절(殉節) 하였다고하여, 정시는 병조판서를, 정조는 이조참판을 추증(追贈) 하고, 연홍은 이러한 돌발지변에도 몸을 피하지 않고 뒷수습을 잘 하였다고 하여, 표창을 받고, 임진왜난의 게월향(桂月香), 논개(論介)와 병층 되었으며,","평양의 의열사(義烈祠)는 원래 게월향을 제사지내었었는데, 후에 논개와 아울러 연홍이도 제사지내게 되었다."]],[["이리하여 정시와 연홍은 충신 열녀의 한 개의 표본이 된 것이다.)"],["八 [팔].","岐路 [기로]"],["경내가 가산읍에 도착하였을 때에는 밤도 너무나 깊었고, 또 선봉대가 벌서 점령할 것은 다 점령하여버렸음으로, 그대로 쉬고, 이튿날 일즉이 수뇌부만 모이어 긴급회의를 열었다."]],[["여기서 제일 먼저, 가산군수를 죽인 것이 옳으냐, 그르냐를 가지고 홍총각과 히저와 정면 충돌을 하고 말었다.","히저는 어제 밤에 연홍의 집에서 자면서, 홍총각의 행동은 정의를 위하여 이러슨 혁명군으로서는 절대로 용납되지 못한다는 것을 누누이 듣고 왔었음으로, 이것을 제 주장인 것처럼 내세웠다."],["“항복하려고 대장을 불러달라는 것을 죽이는 것은 항복한 것을 죽이는 것과 마찬가지가 아니오? 항복하는 자도 죽인대서야, 누가 항복을 하겠오? 우리는 사람을 죽이기 위해서 이러슨 것이 아니라는 것을 명심하여야 할 것이오.”"]],[["“그 말은 부당하오. 우리가 나라를 뒤집어엎자고 나선 이 마당에 긴 ―이야기가 무슨 소용이요. 항복하겠느냐, 못하겠느냐 무러서, 바로 항복하면살려주고, 그래도 군소리를 하면 죽이고 ─.","이밖에 무슨 도리가 있겠오? 지금은 전쟁이오, 전쟁 ─.”"],["하며, 홍총각은 두 눈을 부르떠서 히저를 보았다."],["“전쟁일수록 야만적 행동을 삼가고, 덕으로서 인민을 교화하여야지, 그렇게 사람을 함부로 죽여서야 되겠오? 인의예지를 지켜서 성현의도에 어그러지지 말어야지. 홍장군의 처사는 너무나 과격한 것 같소.”"]],[["히저 대신 이번에는 창시가 나섰다."],["“그렇소 과격하여서야 되겠오. 우리가 대사를 도모하느니 만치 행동을 삼 가서 중용의 덕을 지켜야지 ─.”"],["군측도 서슴지 않고 여기에 찬성하였다.","그러고 항상 홍총각의 편을 들든제초는 이러한 문제가 논의될 줄은 전혀 예기하지 못하였었음으로, 전적으로 홍총각 편을 들지 못하고, 겨우"]],[["“진심으로 항복만 한다면 죽일 것이 없겠지만, 그 놈들이 진심인지 아닌 지가 문제지요.”"],["하고, 그저 어리벙벙하게 반문하였을 뿐이다.","홍총각은 자기가 완전히 고립하여 있음을 새삼스러히 깨다렀다."],["“지금 원 노릇을 하고있는 놈 중에 진심으로 항복하는 놈이 어데 있겠단말이오. 그렇게 쉽게 맘을 고칠 놈들이, 그처럼 백성을 못 살게 들볶아서멀정한 강도질을 한단 말이오? 그런 놈들을 어떻게 믿겠오?"]],[["다른 이는 몰라도 나는 절대로 믿을 수 없오.”"],["홍총각이 끝까지 굽히지 않고 버티니"],["“아니 그러면 원이란 원은 죄다 잡어 죽여야 된단 말이오? 그런 무지막지한 놈의 일이 어데 있단 말이오?”"],["모다 제 편을 드는 바람에 히저는 신이 나서 비웃는 어조로 반문하였다.","“그야 물논 죄다 죽일 작정으로 덤벼야지. 더 말할 것 있오? 우리의 적이 누구요? 우리의 원수가 누구요? 원수를 살려라, 원수를 용서하라 하여 가지고 무슨 전쟁이 된단 말이오."]],[["그처럼 원 놈들의 편을 들 테면, 애당초 이런 일에 왜 참가하였오? 나는 그런 이들과 도저히 같이 일할 수 없으니, 맘대로들 해 보.”"],["홍총각은 좌중을 잔득 노리고 보다가, 그대로 휭하고 나가버렸다."],["이 동안 경내는 한 마디도 말을 하지 않었다.","홍총각의 불과 같은 혁명 정신에 근본적으로는 공명하면서도 자리를 박차고 나가는 그를 부뜰 수는 없었다."]],[["그처럼 대담하게, 그처럼 철저하게 덤벼들어야만 한다는 것을 느끼면서도, 바로 그의 편을 들 수는 없었다."],["“원수께서는 어떻게 하시겠읍니까.”"],["이윽고 군측이 여럿을 대표하여 물었을 때, 경내는 여전히 전체의 의견에 따라"],["“항복하는 자는 죽여서는 안될 것이오. 다만 항복하기를 끄려하는 자나, 혹은 다시 우리를 배반할 염녀가 있는 자는 용서 못할 것이오.”"]],[["하고, 한번 좌우를 돌아보고, 다시 말을 이었다."],["“그러나 홍장군은 이번에 선봉장으로서 공이 제일 컸었고, 정시라는 자가 바로 항복하지 않고 우물주물한 모양이니, 이번 일은 일절 불문에 붙이겠오. 앞으로도 물논 선봉장으로 내세울 것으로, 이것은 내게 일임하여 주.”","이리하여 이 문제는 낙착하고, 다음에는, 앞으로의 작전을 의논하였다. 홍총각과 제초로 북행하여 북군과 협력하여 정주(定州)를 치게 하고, 경내 자신은 대군을 거느리고 동행(東行) 하여 박천(博川) 읍을 치기로 하였다."]],[["“그렇게 되면 남쪽 안주(安州), 평양(平壤)을 치는 것이 너무나 늦어지지않겠읍니까?”"],["제초가 이처럼 반문하자 이 때까지 말석에 묵묵히 앉어있든 김대린(金大麟) 이가 썩 나서서"],["“정주는 북군에게 일임하고, 박천에는 일부대만 보내어 항복 받고, 대원수께서는 전력을 기우리어 여기서 바로 안주로 향하는 것이 상책일 것 같습니다”"]],[["하고, 주장하였다.","김대린은 안주에서 온 유력한 내응동지로, 신도회의 때부터 참가하였든 것이다."],["“안주병사도 이미 대개 연락이 되었고, 이인배(李仁配) 니, 이무경(李茂京) 형제니, 모다 안주에서 머물러서 공작 중이니까, 여기서 바로 디려치기만 하면 될 것입니다. 안주만 함낙하면 평양도 제절로 함낙할 것이고, 이렇게 되면 평안도는 순식간에 모다 우리의 손아귀 속에 들어올 것이 아닙니까?"]],[["그러니 대원수께서는 이 자리에서 바로 이렇게 결정하여 주시기 바랍니다.”"],["대린은 계속해서 자신만만하게 주장하였다."],["그러나 먼저 박천을 점령하고 북군이 의주까지 점령하는 것을 기다리어, 뒷근심이 없이 하여 가지고 당당하게 남쪽으로 나려밀자는 것이 원래부터의작전 게획이었다.","그리고 모두들 이 게획을 변경시킬 생각은 조곰도 없었음으로, 대린의 자신만만한 주장도 하등의 반응을 이르키지 못하고 그대로 묵살당하였다."]],[["다음의 군복제도(軍服制度)를 정하였다."],["1.","복색은 푸른 빛으로 하고, 붉은 천을 베어서 등과 가슴에다가 부치"],["어, 호의(號衣)를 구별할 것."],["2.","관은 장교는 전립(戰笠)과 호피관(虎皮冠)을 쓰고, 일반 병졸은 붉"]],[["은 수건을 쓸 것."],["이 군복제도는 주로 창시의 의견에 의한 것이다."],["다음에 가산의 주관장(主管將)을 윤원섭(尹元燮)으로 정하기로 하였다.","윤원섭은 가산서 히저의 다음가는 부자로, 한문도 유식하고, 신도회의 때부터 참가한 내응동지였다.","윤섭은 위선 급한 일로 병졸들이 규율(規律)을 엄격하게 지키도록 전령할 것을 제의하였다.","그리고 그의 보고에 의하면, 어제 밤중에 약탈당한 데가 세 군데나 있었고, 그 중에 한 군데서는 들켜서 도망가랴 하는 것을 잡어 바치었는데, 이것을 어떻게 처결하면 좋겠느냐는 것이다."]],[["“그런 놈들은 단번에 목을 베어서 극형에 처하여야지. 멀정한 살인강도가아니오? 그런 놈들을 그대로 내버려두어서야 돈푼이나 가진 사람이 마음을 놓을 수가 있겠오.”"],["히저는 서슴지 않고 이렇게 주장하였다.","가산이 자기가 살고있는 곳이니만큼, 이해 관게가 제일 즉접적이었다."],["“우리 혁명군은 추호도 범하지 않고 안민청경(安民淸境) 하자고 나스니 만큼, 그런 놈들은 목을 베어서 네 거리에다가 내거러서, 이후에 다시는 그런 일이 없도록 하여야 할 것이오. 백성을 범하게 되면, 차차로 질서가 물난하여 상하의 구별도 없어지고, 우리의 목도 언제 어떻게 달어날는지 알겠오?"]],[["참으로 중대한 문제니, 극행에 처해야 할 것이오. 그리고 이것은 북군에도전령하여 규율을 엄수하도록 합시다.”"],["창시가 더 한층 열렬하게 주장하였다.","창시로서는 질서가 물난하고 상하의 구별이 없어저서는 큰 일이라고 생각한 것이다.","그 자리에 앉은 다른 이들도 모다 그것이 좋다고 찬성하였다."],["그리고 또 창고문을 열어서 단 몇 되박식이라도 곡식을 백성들에게 분배해주기로 하였다."]],[["이리하여 회는 끝나고, 각자 제 부서로 돌아갔다.","다만 홍총각만은 다시불러디리도록, 경내가 명령하였다."],["“원수께서는 도대체 어떻게 하시렵니까? ─”"],["홍총각은 경내와 맛대 앉자마자, 먼저 족처 무렀다."],["“제가 먼저 말슴 디리겠읍니다. 도대체 대원수께서는, 돈푼이나 갖고, 벼슬 날이나 하고, 더 큰 것을 못해먹어서 게걸거리는 놈들의 편을 들 터입니까, 참으로 살래야 살 길이 없고, 올데갈데가 없어서 목숨 내걸고 덤벼드는백성의 편을 들 터입니까?"]],[["앞으로 어떻게 하실 예정입니까? 가진 놈들 편을 들 터입니까, 안 가진 놈들 편을 들 터입니까? 이대로 질질 끌려가다가는큰 벼슬 못하여 안달하는 그 놈들한테 이용만 당하고, 일반 백성들은 애무하게 죽기만 할 것이니, 원수께서 오늘은 좀 뚜렷이 귀정을 내주시요.","이도저도 못 믿는다면, 나는 차라리 다 집어치우고 고향에 돌아가서 또 머슴사리나 하겠읍니다.”"],["홍총각은 굳은 결의를 표명하였다."]],[["“잘 알겠오. 잘 알겠는데, 조곰만 더 참고있으란 말이오. 지금 만약 양편이 서로 충돌하면, 그야말로 죽도 밥도 안될 모양이니, 좀 더 참으란 말이오.”"],["경내는 가장 침착한 어조로 대답하고, 이어서 곧 복행하여 정주를 함낙시킬 것을 요청하였다."],["“나는 정주는 안 가겠읍니다. 다른 사람을 누구 골르십시요. 좀 더 백성들이 살기 좋은 세상을 만들어 볼가 하고 하는 일이, 조곰도 그렇게 되지 않고 그 놈이 또 그 놈으로, 그 장단이 또 그 장단일 모양이니, 무슨 신이 나서 정주까지 꺼버거리고 가겠읍니까?"]],[["백성의 껍데기까지 베껴먹겠다고 나대는 원 놈들을 하나 둘 죽였다고, 그처럼 의논이 분분한 위인들이, 어찌하여 우리 군졸 중에서 약탈하다가 부뚤린 것은, 단번에 목을 베어 네 거리에다가 내걸겠다고 서듭니까?","만일 약탈한 군졸을 목을 베어 거리에다가 내걸려면, 원 놈들은 항복하건 말건 모조리 목 베는 것은 고사하고, 죽은 송장이라도 끄내다가 매질하여야 할 것입니다. 군졸들의 억울한 처지를 원수께서도 못 알어주신다면, 그들은 총칼 다 집어던지고 헤어저버릴 것입니다.”"]],[["“그야 나도 모를 이 없지만, 요 얼마 동안만 더 참어야지, 그 이외에는 별도리가 없는 것 같소.”"],["“좀 더 참으라고 작구만 하시지만, 참으면 앞으로 어떠한 뾰족한 일이 있겠읍니까? 그리고 또 참으면 얼마나 참으란 말씀입니까?”"],["“적어도 안주, 평양이나 함낙시켜 놓아야지, 그 이전에는 서로 충돌하여서는 아무 일도 안될 터이니까 ─.”"]],[["“그러면 그것은 그렇다고 합시다. 그러나 내 생각 같어서는 정주니 박천이니, 이런 데서 주제주제할 것이 아니라, 바로 안주를 디리처야지 성공하지, 그렇지 못하면 그네들과 아모리 협력하여도 때를 노쳐서 틀려 돌아갈 것 같습니다.","그러니 이러니저러니 할 것이 없어, 나를 정주로 보내지 말고, 바로 안주를 디려치게만 해주십시요. 군사가 많이도 필요치 않습니다. 이번 가산 처들어올 때에 거느리고 온 백 명만 거느리면, 안주를 단숨에 아서바리겠읍니다.","만약 이것에 실패하면 제 목을 베어 바치겠읍니다.”"]],[["“안주를 먼저 치자는 것은 김대린이도 주장하였지만, 모두들 반대해서, 처음 계획 대로 북쪽을 다 평정한 뒤에 남군 북군이 협력하여 안주를 치기로 되었으니 ─ 하여간 모든 문제를 뒤로 미루고 위선은 여기서 결정된 대로 바로 정주로 가달란 말이오.”"],["“글세, 그것이 나로서는 대단히 난처합니다.”"],["“글세, 그거야. ─”"]],[["홍총각은 팔장을 끼고 바로는 대답을 잇지 못하였다.","경내도 더 어떻게 달 낼 말이 없어, 그대로 입을 다무리고 말었다.","둘 사이에는 서로 가슴이 답답해지는 무서운 침묵의 순간이었다."],["얼마 후에 홍총각은 그래도 매우 히망에 넘치는 얼골빛으로 물러왔다.","그리고 하루를 묵어서 이십 일 날 제초와 함께 군졸 백여 명을 거느리고 정주를 향하여 떠났다."]],[["九 [구].","北軍 [북군]"],["북군의 근거지는 곽산(郭山)으로, 부원수(副元帥) 김사용(金士用)은, 아장(亞將) 김히련(金禧鍊)과, 김국범(金國範), 이성항(李成沆), 한처건(韓處坤)을 거느리고 십팔 일 점심 나절에 곽산에 도착하였다.","모다 사람들의 눈을 피하기 위하여, 혹은 걸인의 행색을 하고, 혹은 붓 장사 행색을 하여 가지고, 하나 ㅅ 식 몰래 숨어 들어왔다."]],[["그러나 그들은 곽산에 도착하자마자, 숨 두를 사이도 없이 중대한 난문제에 봉착하였다.","그것은 선천부사(宣川府使) 김익순(金益淳)이 별장(別將) 최봉관(崔鳳寬)을 잡어 족치다가, 의외의 큰 사건이 탈로되어, 곽산의 김창시(金昌始), 박성신(朴星信)이 모다 여기 참가하였다는 것을 알자, 곧 포교(捕校)를 곽산으로 파송하여, 창시의 아버지와 (창시가 없었음으로), 성신을결박 지워 가지고, 막 떠나갔기 때문이다.","창시의 아버지야 즉접 관게가 없음으로 그렇게 큰 문제가 아니지만 성신은 곽산서 가장 유력한 내응동지고, 그의 형 박성간(朴聖幹)은 곽산서 제일가는 부자로, 곽산이 북군의 근거지가 된 것도 그의 재력에 기대하는 바가 컸었다."]],[["사용은 이 정보를 받자, 곧 부하들을 다리고, 곽산서 선천으로 가는, 도중에 있는 신현(薪峴)이라는 고개로 달려가서 길 옆에 가만이 숨어 있다가, 거기를 지나가는 포교의 일행을 습격하여, 포교들을 죄다 죽여버리고, 결박지었든 창시의 아버지와 성신을 구해냈다.","이것이 북군으로서는 최초의 행동인데, 무난이 성공하였다."],["사용은 부하들과, 구해낸 창시의 아버지와 성신을 다리고, 곽산 북쪽에 있는 연무장(演武場)에 이르러 몸을 감추고, 성신의 형, 성간을 읍으로부터불러내어, 장차 어떻게 할 것인가 ─ 게책을 세우기로 하였다."]],[["“원래는 이심 일이 기병하는 날이지만, 이처럼 우리의 일이 탈로되어, 내응동지들이 속속 체포된다면, 일 하나 해보지 못하고 자멸할 것이니, 그 이전에 일즉 서드러서, 관청 놈들이 미처 손을 대기 전에 이쪽에서 먼저 들고이러나는 것이 좋을 것 같은데, 어떻게들 생각하오?”"],["사용이 이처럼 묻자,"],["“우리도 긔일까지 기다리고 있을 수는 없을 것 같습니다. 다만 난처한 것은 대원수의 명령을 어기는 셈이 되겠으니, 그 일을 어떻게 하겠읍니까?” 하고, 성신은 사용을 처다보았다."]],[["“그것은 다 양해가 되어왔으니 염려 마오. 긔일은 이십 일이되, 사세가곱할 때에는 이 긔일에 구속되지 말고, 비상수단을 써도 무관하다는 ─ 그런 명령을 받고 왔으니까, 우리는 지금 비상수단을 쓰기로 합시다.","그러나 비상수단을 쓸래야 준비가 되어있지 않으면 쓸 도리가 없으니, 곽산의 형편이 지금 바로 들고 이러날 수가 있겠오, 없겠오? ─ 문제는 오로지 여기에 있는 것 같소.”"],["“그것은 문제없읍니다. 오늘밤에라도 곧 됩니다.”"]],[["성간이가 자신 있게 대답하였다.","그리고 사실은, 포교들이 왔을 때에도 곧 들고 이러날가 하다가, 이십 일이 긔일이라 꾹 참었었다고, 실정을 보고하였다."],["이리하여 그 날 밤으로 곧 기병하기로 결정하고, 하낫식, 둘식 헤저서 다시 곽산읍으로 숨어 들어갔다."],["이 때에 곽산군의 원은 이영식(李永植)이라는 자로, 제법 말도 달릴줄 알고, 활도 잘 쏘아서 그 시절의 양반으로는 드물게 보는 위인이었다."]],[["다만 술이 너무나 과하여, 하루도 술이 안 취하는 날이 없었고, 관청 송사도 대개는 어느 편이 술을 많이 멕이나, 그 분량에 따라 지고 이기는 것이 결정된다고 ─ 소문이 자자하였다."],["그 날 밤에도 영식은 술이 취해서 내아에서 정신 없이 자고 있었다.","징 치는 소리 북 치는 소리, 와 ― 하는 군중의 고함 소리에 벌덕 이러나서 동편으로 쪼차 나가기는 나갔으나, 그것을 막아낼 아무런 준비도 되어 있지 않었다."]],[["“거기 누가 없느냐?”"],["하고, 큰 소리로 불러보았으나,"],["“예 ─.”"],["하고, 긴 대답할 놈은, 한 놈도 남어있지 않었다."],["그 대신 문이 확 열리고, 홰 ㅅ 불을 내뚤르며 군중이 와 ― 몰려들었다."]],[["영식은"],["“이 놈들!”"],["하고, 한 번 호령을 하여 보았으나, 급작이 정신이 번적 들며, 술이 한번에깨었다.","그리고 제 편을 들어, 저를 후원할 사람이 하나도 없다는 것을 새삼스러히 깨닫고, 무서운 생각이 냇다 치미러서, 화닥닥 벽장 속으로 뛰어들어가 버렸다."],["군중은 거침없이 몰려 들어와서"]],[["“원놈을 잡어라!”"],["“주정뱅이를 놓지지 말어라!”"],["소리 소리 지르며, 사방으로 허터저서 찾기 시작하였다."],["그런데 영식의 아우가 마침 다니러 와서 옆의 방에 머물러 있다가, 군중의 고함 소리에 잠을 깨어 벌덕 이러나 분을 박차고 뛰어나오며"]],[["“이 놈들! 여기가 어데라고 소란하게 구느냐?”"],["하고, 큰 소리로 호령하였다.","사세 여하를 불문하고 호령한다는 것이 양반정신의 발로로, 영식의 아우는 이 양반 정신을 발휘한 것이다."],["“저 놈을 잡어라!”"],["“저 놈의 아가리를 째놔라!”"]],[["군중은 이리로 좍 쏠리어, 냇다 잡어 낚우니"],["“이 놈들이 어데를 함부로!”"],["하고, 영식의 아우는 여전히 호령이다."],["“저 놈을 죽여라!”"],["“죽여라!”"]],[["“죽여라!”"],["─ 소리와 함께, 어둑컴컴한 속에서 미처 자세히 알아볼 사이도 없이, 칼로 찌르고 몽둥이로 패서 죽여버렸다."],["벽장 속에서 숨어있든 영식은 너무나 일이 다급하여 화닥닥 다시 뛰어나오며"],["“그것은 애무한 사람이다!”"]],[["소리를 질렀다."],["금방 원을 죽였는데 난데없는 데서 또 원의 소리가 들리니, 군중은 모다의아하여 다시 동헌으로 몰려왔다.","몰려와서 횃불 밑에 자세히 보니, 진짜 원은 여기 살어있다.","군중은 좀 어리둥절하여 옆 방 문 앞에서 죽어 엎우러진 자를 끄러 다가보니, 웨인 낯선 사나히다."],["이렇게 하는 동안에 성신이 사용을 안내하여 들어왔다."]],[["영식은 잔득 결박을 지워서 앞마당에 꿀렸다."],["“저놈을 어떻게 할가요?”"],["성신이 눈짓으로 영식을 가르치며 무렀다."],["“항복을 하겠다는 것인지?”"],["사용은 꿀어앉은 원은 나려가보며, 성신에게 도로 무렀다."]],[["“이 놈! 우리 혁명군에게 항복을 하겠느냐, 못하겠느냐?”"],["성신은 바로 말을 받어서, 나려다보고 호령하였다."],["“예, 항복하겠읍니다. 무엇이든지 하라는 대로 하겠습니다.”"],["영식은 이 쪽이 놀랄만치 간단히 항복하였다.","항상 호령만 해버릇한 양반도, 의외로 간단하게 호령에 복종하고 항복할 수도 있는 모양이다."]],[["“항복한다니 위선 오늘밤은 가둬두고, 내일 밝은 날 다시 처결하기로 합시다. 밤도 너머 깊었고 하니 ─.”"],["사용이 이처럼 말하니"],["“아니, 저런 술타령만 하는 원은, 아주 이 자리에서 처단해버리는 것이 좋을 것 같습니다.”"],["“이 놈 마자 죽여버리는 것이 시원하겠읍니다. 그렇게 쉽게 항복할 놈이 아닙니다.”"]],[["여기저기서 의견이 나왔다."],["“내일로 미루자는 것은, 무슨 관대한 처분을 해주겠다는 것이 아니고, 다만 오늘은 이미 밤도 깊었고, 인심이 너머 동요되어도 재미없으니, 잘 가뒀다가 내일 처단하자는 말이오.”"],["사용은 이처럼 결논을 짓고, 영식을 끄러다가 가두게 하였다."]],[["그러나 이것은 사용의 실수였다.","무교(武校) 장재흥(張再興)이라는 자가 옥문을 지키고 있었는데, 이 자도 매우 술을 좋와하는 자였다.","영식은, 이추운 밤중에 수고한다고 재흥을 위로하며, 내아의 술 둔 곳을 가르쳐주어, 그것이라도 끄내다가 마시어, 몸을 좀 후끈후끈하게 하여 보라고 권하였다.","어리석은 재흥은 그도 그렇겠다고, 술을 끄내다가 먹기 시작을 하였다.","술이 어지간이 돌게 되자, 영식은 내아의 마루 속에 돈을 삼천양 감추게 둔 데가 있는데, 자기만 내놓아주면, 그것을 파다가 고시란이 주겠다고 달랬다."]],[["재흥은 술기에 그렇게 하라고 응낙하고, 옥문을 열고 묶은 것을 푸러주었드니, 영식은 닷자곳자로 옆에 있는 몽둥이로 후려쳐서, 단매에 재흥이를죽이고, 거름아 날 살려라 하고 ─ 도망해 버렸다."],["(이영식은 새이길로 숨어서 정주를 거쳐 남행하여, 이십이 일에 안주 병영에 다다랐다.","그는 월래는 주정뱅이나 이 통에 가족을 전부 잃고, 더구나 아우 하나는 마저 죽은 현장을 즉접 보니만치, 이후부터는 술도 딱 ― 끊고, 복수하겠다는 ― 오로지 이 한 마음으로, 관군(官軍)의 일 부대장이 되어, 가장 용감한 장수가 되었다."]],[["그 전부터 말 타고 활쏘기를 잘 하였었음으로, 한번 이처럼 굳게 결심하고 나스니, 제일 용감하고 씩씩하였다."],["쉽게 항복하는 자는 쉽게 배반하는 ― 한 개의 실례다.)"],["한편 가산과 곽산의 중간에 있는 정주는 양편에서 불의의 돌발지변이 터져서 모다 순식간에 함낙하여 버리니, 정주의 운명도 이미 결정된 셈이다."]],[["정주목사 이근주(李近 冑)는 십구 일 아침에 곽산의 변보(變報)를 듣고, 점심나절 연겊어 가산의 변보를 듣게, 되니, 당황하여 무엇을 어떻게 하여야 좋을 것인지, 전혀 생각이 돌지 않아 좌불안석으로 있었다.","이 때 마침 곽산군수 이영식이가 소를 타고 숨을 헐덕어리며 찾어 들어와서, 어떠한 대책을 세우고 있느냐고 무렀다.","근주가 아무 대책도 없노라고 솔직하게 고백하니, 그러면 위선 성문을 꼭꼭 닫고 수성(守城)의 준비라도 하라고 권고하였다.","그리곤 나는 앞 길이 바뻐서 곧 가노라고, 다시 소를 타고 가버렸다."]],[["근주는 영식의 말대로 수성의 준비를 하려고 좌수(座首) 김이대(金履大) 와중군(中軍) 이정환(李廷桓)을 불렀다가 무르니, 둘이 다 내응동지라, 수성이 불가능하다는 것을 누누이 주장하였다.","가산, 곽산이 모다 함낙한 이상 정주는 도저히 지탕할 수가 없고 빨리 항복할 준비를 하는 것이 좋다는 것이다.","항복을 주저하고, 그들의 명령을 거역하면, 가산군수 정시처럼 한 칼에 목이 다러날 것이니, 애당초 서뿔리 서들지 말자는 것이다."]],[["근주는 이 말을 듣고 더욱 겁이 나서 앉었다 젔다 하면서 정신을 못 차리는데, 밖은 더욱 요란하였다.","정주의 제일 유력한 내응동지 최이윤(崔爾崙)이 대낮에 수십 명의 부하를 거느리고 옥문을 깨트리어, 음모의 혐의로 몇일 전에 가친 동지들을 끄내가고, 가산에서 온 격서가 장터에 좍 - 퍼저서파란 가는 사람들로 읍안이 물 끓듯 야단들이다."],["그리고 관문이 열리며 수십 명의 무장한 군졸을 따라 수많은 군중이 와 -하고 동헌으로 밀려들어왔다."]],[["근주는 황겁하여 뒷문으로 튀어서 말 ㅅ 간의말을 끄내 타고, 안주를 향하여 그대로 도망하여 버렸다."],["이십이 일에 가산서 북행하든 홍총각, 이제초의 부대와, 곽산서 남행하든김사용의 북군이 정주에 한거번에 도착하였다.","동헌에 좌정하고, 홍총각은대본영(大本營)의 영을 전하여 최이윤으로 수성장(守成將)을 삼고 (후에 김 이대로 변하였다), 소를 잡고 술을 걸러 군졸을 위로하고, 창고를 열어 쌀과 필목을 일반 시민에게 분배하였다."]],[["물론 이러한 일은 골이 하나 함낙하면 어데서고 으례히 있는 일이었다.","이 일은 최이윤에게 맛겨버리고, 홍총각은 사용, 제초, 히련과 더부러 넷이서만 비밀회의를 열어서, 작전의 일부 변경을 이야기하였다."],["원래는 홍총각과 제초는 정주서 사용을 만나서 북군의 선봉으로 편입되어, 그대로 북행하기로 되어있는데, 홍총각의 강경한 주장으로 이 일부분을 수 정하여 제초만 북군의 선봉으로 되고, 홍총각은 백여 명의 정예부대를 거느리고 몰래 남행하여 단숨에 안주를 친다는 것이다."]],[["홍총각 생각으로는 가산서 바로 남행하여 안주를 치고 싶었으나, 그것은 군측, 창시, 히저 등이 절대로 용인하지 않을 것이라, 위선 정주까지라도 북행하여 그들의 눈을 속여놓고 비밀리에 정주서 곧 남행하여 안주를 처 성공한 후에, 비로소 일반에게 발표하자는 것이다."],["“이제 곧 출발해서 단숨에 안주를 아서버릴 터이니, 북쪽을 단단이 부탁합니다. 만약 이 일에 실패하면 나는 목을 베어 바치기로 대원수한테 맹세하였으니, 안주의 함낙은 나의 생명입니다."]],[["자 그러면 북군에서는 어떻게든지 해서 의주(義州) 까지 함낙시키어 주시오. 부탁합니다.” 하고, 홍총각은총총이 이러서서, 안주를 향하여 쏜살같이 말을 달리었다.","이미 홍총각의 백여 명의 정예부대는 가산서 정주로 향하는 도중에서 새이길로 몰래 남행하여, 청천강(淸川江)을 격하여 안주를 건너다보는 속림(松林)이라는 곳에서 홍총각의 오기를 일각이 여삼추(一刻 如三秋)로 기다리고 있는 것이다.","十 [십].","運命 의 瞬問 [운명의 순문 }"]],[["십구 일 저녁에 가산을 출발하여 동행한 경내의 대부대는, 이십 일 새벽에목적지 박천(博川) 읍을 정면으로 디리처서 단번에 함낙시켰다."],["박천군수 임성고(任聖皐)는 약졸(弱卒) 수십 명을 거느리고 도망하다가 중도에서 뿔뿔이 헤어저버리고, 성고는 서운사(棲雲寺)라는 절에 숨었다.","그러나 그의 노모(老母)가 경내의 군졸에게 잡히어 옥중에서 신음한다는 소식을 듣고, 성고는 할 수 없이 절에서 나려와서 경내의 진에 이르러, 나를 대신 죽여달라고 자원하였다."]],[["죽여주시오 하니, 이것은 항복 이상이다."],["군측, 창시는 성고의 효성이 지극한 것을 칭찬하며, 죽이기는커녕 특히 후 대하는 것이 좋겠다고 말하였다.","효는 백행지본(孝百行之本) 이니, 이보다 더 중대한 일은 없고, 이러한 효자를 학대하는 것은 우리 혁명군이 이번에 기병한 취지와도 어그러지는 것이라고 주장하였다.","그들은 평소에 예의만찾고 형식만 내세우는 썩은 선비들과 양반들을 욕하여왔지만, 사실은 그들 자신도 그러한 예의와 형식에 잔득 젖어있는 것이었다."]],[["성고는 효자의 가면을 쓰고 옥중에 가치어 있으면서, 문직이들이 안심하고 있는 것을 기화로 하여, 심복의 통인을 하나 연락하여, 박천읍이 불이의 변을 당하여 순식간에 함낙한 연유를 자세히 써서, 안주 병영으로 급히 전하도록 하였다.","이것이 태평의 꿈속에서 꾸벅꾸벅 졸고 있든 안주읍에 얼마나 큰 충격을 주었으며, 따라서 또 앞으로의 작전에 얼마나 불행한 조건을 이루었느냐 하는 것은 후에 차차 명백하여진다."]],[["그러나 이것이야 여하튼 이십 일 저녁나절 대변영에 큰 변이 폭발하였다.","경내가 동헌 상좌에 앉어, 한일항(韓日恒)을 주관장으로 정하고, 창고를 열어, 일반 시민들에게 쌀을 분배케 한 후, 동으로 영변(寧變)과 북으로 태천(泰川)을 어떻게 습격할 것인가 ─ 의논을 시작하랴할 때에, 김대린(金大麟)이"],["“지금 우리는 영변이니, 태천이니 하는 소읍을 가지고 논할 때가 아닙니다. 지금 안주를 치지 않고 언제 치려고 합니까?”"]],[["하고, 강격하게 안주 공격을 주장하였다.","가산에서도 이미 논의되었었으나, 대다수의 절대반로 완전히 묵살 당하였든 난문제다."],["“우리의 지령의 목표가 무엇입니까? 안주, 평양을 거처 서울로 처올러가서 썩어 문드러진 서울 양반 놈들을 죄다 무찌르고 새로운 나라를 세우자는 것이 아닙니까. 그런데 기병한 지 이미 수삼 일이 지났는데도 불구하고, 청북(淸北) (청천강 - 淸川江 - 이북) 산 ㅅ 골 속에서만 왔다 갔다 하며, 좋은 시기를 죄다 노처버리니, 이래 가지고서야 어떻게 대사를 성취하겠읍니까?"]],[["더구나 이십 일 기병 예정을 십팔 일로 닥인 것은, 각처에서 우리의 게획이 탈로되어, 저 편에서 공세로 나오기 전에 이쪽에서 먼저 공세를 취하자는것이 아니었읍니까? 적이 미처 칼을 갈고 신들메를 매기 전에 그의 목아지를 정통으로 찔러서 한번에 승부를 결정하자는 것이 아닙니까?","안주는 적의목아집니다. 이 목아지를 내버려두고 궁뎅이를 아모리 주먹으로 때려본대야무슨 소용이 있겠읍니까? 하루를 지체하면 그만치 적은 우리의 몇 수십 갑절 강하게 됩니다. 결전(決戰)을 하루하루 느추면 그만치 전국은 우리에게불리할 것이니, 우리는 지금 곧 결전을 하여야 합니다."]],[["그리고 그 결전의장소는 안주입니다. 지금 곧 안주를 공격하지 않고, 이 좋은 시기를 노치면서울은커녕, 평양도 못 가보고 패해버릴 것입니다. 대원수께서는 만사를 제페하고 즉시 안주를 공격하도록 결정하여 주시기 바랍니다.”"],["“그것은 안될 말이오….”"],["경내가 입을 열기 전에, 옆에 앉은 군측이 정면으로 반대하였다."]],[["“근본 이 작전은, 총참모와 참모가 대원수와 상의하여 결정한 것으로, 그렇게 중구난방으로 아무나 함부로 입을 벌리어 고집을 세울 문제가 아니오. 서울로 처올려가는 데 있어 안주가 얼마나 중요한 곳이 라는 것을 누가 모르겠오?","적인들 모르겠오? 그러기 때문에 안주는 병영 소재지(兵營所在地)로, 성곽이 견고하고, 출반군졸(出番軍卒)이 우물우물하지 않소? 더구나 바로 그 앞에는 청천강(淸川江)이라는 큰 강이 끼어있어, 공격하기는 어렵고, 막기는 쉬워서 평안도에서 제일가는 요지인 것이 아니오."]],[["이러한 요지가 당신의 말처럼 그렇게 유낙낙하게 함낙할 줄 아오? 경적(輕敵)은 병가의 소기(所忌)라 하오. 적을 업수히 여기다가는 후회막급이오. 당신은 적에게 준비할 여유를 주지 말자고 주장하지만, 적은 처음부터 상당한 준비가 이미 되어 있는 것이오.","안주는 더군다나 그렇소. 그러니까 결국은 우리는 조급하게 서들 것이 아니라, 남군이 영변, 태천, 개천 등을 함낙시키고, 북군이 정주, 곽산, 구성, 선천, 철산, 용천, 의주를 함낙시키어, 뒤에 아무 근심도 없이 만드러 가지고, 남군과 북군의 전 병력을 기우리어 정정당당하게안주를 치는 ─― 이 밖에 무슨 좋은 방법이 있단 말이오?"]],[["참모는 어떻게 생각하오?”"],["군측은 자신만만하게 대린의 소론을 하나하나 논박하고서, 동의를 청하는듯이 창사를 돌아보았다."],["“전혀 동감이오. 총참모와 대원수가 십여 년을 두고 연구하고 또 연구해서 꾸미어낸 작전인데, 범연하겠오? ─ ─ 그러니 그것은 그만두고 이제부터 영변 공격이나 상의하는 것이 좋을 것 같이 생각하오.”"]],[["평소에는 창시가 앞에 나서서 논쟁하고 군측은 뒤에서 관망하는 때가 많었는데, 오늘은 군측이 처음부터 흥분해서 서드는 바람에, 창시는 더 길게 느러놓을 말이 없었다."],["“다른 분들은 어떠십니까?”"],["군측은 다시 좌우를 돌아보았다."],["“총참모의 말슴이 지당하오.”"]],[["모두 찬의를 표하였다."],["가산 회의 때와 똑 같은 순서, 똑 같은 수단으로 대린의 주장은 완전히 묵살 당하고 말었다.","다만 가산 회의 때보다도 더 분명하게, 더 결정적으로, 다시는 더 어떻게 말을 내지 못하도록 면박 당한 것이다."],["그러나 대린은 굴복지 않고, 다시 더 열열하게 주장하였다."]],[["“백보를 양보하여 근본적 작전으로서 총참모 말슴이 옳다고 합시다. 그러나 그렇다면 안주병사(安州兵使) 이해우(李海愚)의 입장은 어떻게 됩니까? 신도 회의 때에 나를 보고 극력 노력하여 그를 우리편으로 끄러 넣으라고하지 않었읍니까?","그만 끄러 넣으면 안주는 단번에 함낙할 것이라고 하지 않었읍니까? 그리하여 그 동안 가진 수단을 다 써서 그를 우리편으로 끄러 넣어, 여기서 처들어자기만 하면 곧 내응하여 줄 것을 승낙하게까지 일을 만들어 놓은 것이 아닙니까?"]],[["그런 것을 이제 와서 여기서 우물쭈물하고 지체하게 된다면 그의 입장은 어떻게 됩니까? 우리는 신의를 지켜야 합니다. 비밀리에 결행하는 일일수록 신의를 지켜야 합니다. 신의 없이 무슨 일이되겠읍니까?”"],["“신의를 주장하지만 이해우라는 사람이 그렇게 신용할 수 있는 인물이란말이오? 만일에 그가 겉으로 내응하는 체하고, 실제에 있어서 이 쪽을 배반한다면, 한 번에 이 쪽은 전멸하고 말 것이 아니오?”"]],[["창시가 대린의 말을 중도에서 꺽으러 든다.","그러나 대린은 최후의 힘을 다하여 싸웠다."],["“그것은 염려할 것이 없읍니다. 내가 즉접 교섭한 일도 있고, 그 동안 안주서 연락하고 있든 내응동지 이인배(李仁培), 이무경(李茂京), 이무실(李茂實) 등이 어제 밤에 여기 왔는데, 안주서는 별별 유언비어가 돌어 인심이동요되고, 목사(牧使) 조종영(趙鍾永) 이는 어서 서들어서 방비하자고 야단을 침에도 불구하고, 병사는 그저 쓸데없는 풍설이라고 쓸어 묻어 넘기고, 모르는 체하고 있답니다."]],[["그리고 이인배를 보고 왜 빨리 처들어오지 안느냐고 무르며, 대본영에 연락할 수만 있거든, 곧 처들어 오도록 전해달라고 하더랍니다. 지금 그를 의심할 여지는 조곰도 없읍니다. 이제는 대원수의 일대용단(一大勇斷)을 바랄 뿐입니다.”"],["경내는 이 때까지 한 마디도 말을 하지 않었다.","대린과 군측이 서로 핏대를 세우며 격논을 하여도, 경내는 냉정한 태도로 묵묵히 앉어서 방관하였다.","경내는 원래 이런 회의에서 자청해서 부하들과 언쟁하는 일이 없으며, 먼저 부하들의 의견을 들어가지고, 결논만 딱 나리는 것이, 그의 습관이었다."]],[["그러나 오늘은 그것뿐만도 아니었다.","경내에게는 군측도, 대린도, 여기 있는 아무도 모르는 극비밀의 대책을 강구하고 있기 때문이다.","가산서 홍총각을 타이르다 못하여, 그여히 그의 말대로 아무에게도 알리지 않고, 홍총각 단독으로 백여 명의 정예부대를 거느리고 불일중에 안주를 공격할 것을용인하였기 때문이다.","그 때는 마지못하여 그저 묵허(黙 許) 하는 형식을 취하였으나, 이제 와서는 그때 그렇게 한 것이 참 잘 하였다고……","속으로 오히려 기뻐하였다."]],[["“너머 흥분을 말고 냉정히 합시다. 서로 토론하는 것도 좋지만, 세상일이란 토론만으로는 해결 안될 것이오. 그러니 그 문제는 모두들 내게다 일임해 주. 내게는 확고부동한 성산(成算)이 있으니, 나를 믿어주.","내가 전 책임을 지고 그 일에 당할 터이니, 너머 염려들 마오.”"],["그의 어조는 다시없이 침착하였으며, 듣는 사람들에게 무슨 신비한 기분까지 주었다."]],[["“그러면 결국 대원수께서도 안주 공격을 찬성 못하신다는 말슴입니까?” 대린은 이제는 최후의 유일한 히망까지도 허사로 돌아가는 것을 깨닫고, 비통한 소리로 반문하였다."],["“대원수께서 일임하라면 그만이지, 무슨 또 군소리요?”"],["군측은 서슴지 않고 이것마자 물리쳤다."],["대린이 동헌에서 나오자, 기다리고 있든 인배, 무경 형제가 일제히, 결과가 어떻게 되었느냐고 무렀다."]],[["대린은 머리를 옆으로 흔들어 다 틀렸다는것을 표시하며, 분을 못 참어서 주먹이 부르를 떨리었다."],["“혼자 이 때까지 고군분투해 보았으나, 완전히 거부당해 버렸오. 맹자왈공재왈만 찾는 놈들과는 이런 일이 처음부터 이야기가 되지 않소. 대원수까지도 그저 나에게 일임하라는 것뿐이오.”"],["“그러면 우리들은 장차 어떻게 하여야 하겠오? 결국 남은 길이라고는…….”"]],[["인배는 낙심천만한 어조로 이처럼 말을 끄내다가 딱 끊었다.","그리고 모두들 한데 몰리어 그들의 숙소로 돌아갔다."],["그날 밤중이다."],["경내는 별실에서 잠을 이루어, 은저리는 쥐 죽은듯이 고요하다.","그 문 밖에는 위병(衛兵) 둘이 모진 찬바람에 견데다 못하여 문간방에 들어앉어서 다꺼저가는 화로의 모닥불을 끼고있어, 사람의 그림자 하나 볼 수 없다."]],[["땅우의 만물이 모다 숨을 죽이고 깊이 잠들고, 하날의 별까지도 찬바람에 얼어붙은 듯이 꼼작 안는다."],["이 때에 담 모퉁이에서 별안간 사람 그림자가 넷이 나타나, 허리를 굽히고발자욱 소리 하나 내지 않고 살곰살곰 발을 미러 디디어, 쏜살같이 별실로들어갔다."],["네 그림자는 모다 손에 칼을 빼들고 어둠 속에서 경내를 노리고 몰려 들어갔다."]],[["“웬 놈이냐!”"],["경내가 이불을 박차고 이러스는 것과, 네 그림자의 칼이 나려지는 것이, 거의 동시였다.","경내는 잠결이었으나, 원래 체수가 적고 몸이 날래어, 일시에 머리 우에 나려지는 칼들을 손으로 막으며, 벽을 끼고 몸을 피해 가지고, 재빠르게 네 그림자의 틈을 타서 비호같이 도망하였다.","네 그림자도 발을 돌리어 바로 그 뒤를 쫒았다."]],[["그러나 이 때에는 문간방의 위병들이 뛰어나와"],["“도적이여!”"],["“반역자여!”"],["소리소리 지르며 달려오고, 그 근방 여기저기서 군졸들이 잠을 깨 가지고몰려들어 왔음으로, 경내는 요행히 모면하고, 네 그림자는 금시에 수십 명군졸들에게 포위 당하여 그 자리에서 모다 칼을 맞고 넘어졌다."]],[["다소 저항도 하였으나, 중과부적이었다.","위병이 갖다가 밝인 홰 ㅅ 불 밑에, 피투성이가 되어 죽어 넘어진 네 그림자의 정체가 비로소 분명하게 나타났다.","대린, 인배, 무경, 무실의 네 사람이다."],["경내는 위기일발에서 모면은 하였으나, 칼을 막은 손은 세 군데나 베어저서 피가 뚝뚝 듣고, 이마로부터 상투 있는 데로 걸쳐서 꽤 깊게 칼을 맞어, 피가 콸콸 쏟아저나와, 얼굴이 피투성이가 되어 있었다."]],[["군측, 창시, 히저 등의 수뇌부가 급보를 듣고 쫓아왔을 때에는, 경내는 너무나 출혈이 심하고 상처가 깊어서 완전히 혼수상태에 빠젔다.","생명에는 대개 이상이 없을 것 같었으나, 당분간 절대로 안정을 요할 것은 분명하였다.","“대린이라는 놈, 그 놈이 그렇게 안주 공격을 주장하드니 속으로는 전혀 딴 생각을 하고 있든 것이 완연하지 않소. 이런 음흉한 놈의 말대로 안주 공격을 하였든들, 큰일날 번하였오.","대원수께서 불이의 화를 당하시었으나, 위선 천만다행한 일이니, 우리는 이 자리에서 여기에 대하여 긴급하게 대책을 강구하는 것이 좋을 것 같소.”"]],[["군측은, 경내가 이러나지 못하는 동안의 제 자신의 지위를 자각하여, 무거운 침묵을 깨트리고 이처럼 제의하였다."],["“이번 일에는 총참모가 과연 선견지명(先見之明)이 있었다고 하지 않을 수 없오. 대린을 위시한 그 네 놈들이 우리한테는 내응동지의 탈을 쓰고 나타났으나, 사실은 안주병사 이해우의 심복이었든 것이 분명하오.","그러니 이해우야말로 이번 이 일의 괴수며, 북군과 합세하여 안주를 공격할 때에는 제일 먼저 이해우라는 놈의 목을 베어야 할 것이오. 그리고 위선 급한 문제로, 대원수께서 완쾌하시기까지는 임시로 총참모께서 만사를 대행하여 처리하는 것이 좋을 줄 생각하오.”"]],[["이처럼 창시가 먼저 군측 지지를 표명하였다.","그리자 모다 이에 호응하여찬의를 표하였다."],["그리고 그 자리에서, 사기(士氣) 에도 관게할 것이라, 경내의 부상은 일반에게는 절대로 비밀에 부칠 것, 경내가 이러나기까지는 되도록 작전은 기정방침대로 진행시킬 것 등을 결의하였다."],["十一 [십일].","安州 [안주]"]],[["안주(安州)는 평안도에서 제일 가는 요지다.","바로 북에 청천강(淸川江)을 끼고 있고, 의주로 통하는 대로의 길목이라, 사십이 주의 병마(兵馬)에 대하여 명령권을 가진 평안병사(平安兵使)의 본영(本營)이 있다.","따라서 성곽이 견고하고, 출반군졸이 늘 주둔하고 있어, 시골 보통 소읍과는 그 형편이 매우 다르다."],["안주가 이러한 요지니만큼, 경내도 여기를 함낙시키기가 그리 쉽지 않으리라는 것을 짐작하였었다."]],[["그리하여 관군(官軍)의 병력이 이리 집중되지 않도록 하기 위하여, 먼저 평양에서 대동관을 폭발시켜 폭동을 일으키게 하였든 것이다.","물논 이것은 실패로 돌아가고 도리혀 이 쪽의 비밀만 탈로시킨결과로 되었으나, 경내의 안주 공격의 용의가 상당히 신중하였든 것만은 사실이다."],["안주에 있는 내응동지로는, 김명의(金銘意), 김대린(金大麟), 이인배(李仁配), 이무경(李茂京) 형제 등이 있었는데, 이 중에서 김명의는 김진사라고하여 제일 유력하였으나, 시골 샌님이라 그 태도가 극히 소극적이고, 김대린 이하는 모다 안주 병영의 비장(裨將), 혹은 교속(校屬)으로, 적극적이고활동력은 있었으나, 믿음성이 부족하였다."]],[["그러므로 모다 신도회의 이래의동지들이나, 경내를 중심으로 한 수뇌부 측의 실뢰는 그다지 두텁지 못하였다."],["그러나 안주에는 이러한 내응동지 이외에 훨신 큰 존재로, 미모한 입장에서있는 안주병사 이해우(李海愚)가 있다.","그는 죽 - 무관으로 지내왔으나, 글도 제법 잘 하였고, 더구나 병서(兵書) 에는 깊은 연구를 쌓어서 지략이비범하였다.","다만 현제 조정에서 정권을 잡고 세도를 부리는 김조순(金祖淳)의 무리들과는 파가 달러서, 안주병사의 자리도 언제까지 게속될 것인지 매우 불안하였다."]],[["그러므로 무슨 기회만 있으면 김조순의 무리를 모라내고중앙에서 당당하게 입신양명할 기회를 엿보고 있었다.","다만 원래 위인이 극히 침착하고 지략이 과인하여, 조곰도 표면에 나타내지 않고, 묵묵히 맡은임무를 충실하게 해나갔을 뿐이다."],["그리다가 신도회의에 참가하기 위하여 내린 이하 네 명이 한번에 싹 없어젔을 때 해우는 비밀리에 무슨 엉뚱한 일이 진행되고 있다는 것을 재빠르게아러채고, 그들이 돌아온 후에 은근히 대린을 얼르고 어르만저서, 그 여히그 사실을 토로시키고 말었다."]],[["대린 편에서도, 될 수만 있으면 해우를 이 편으로 끄러 넣으라는 경내 등의 요청이 있었음으로, 그러한 사실을 토로하였을 뿐만이 아니라, 참가만 해주면 중요한 자리에 앉혀서 크게 써줄 것이 라는 말까지 전하였다.","해우는 여러 가지로 자세히 그 내용을 물어서 의외로 대규모인 데 탄복하여, 그 자리에서 바로 찬의를 표하고, 다만 자기 지위가 지위니 만큼 들어내 놓고는 할 수 없고, 비밀리에 측면에서 원조하고협력할 것을 말하였다."]],[["십이월을 접어들며, 심장치 않은 다복동의 소문이라든가, 거기서 퍼저나오는 여러 가지 유언비어로, 안주에서도 인심이 점차로 동요되며, 더구나 십팔 일에 이르러서는 내응동지들이 충동거리는 바람에, 수많은 시민들이 봇다리를 싸 질머지고 성 밖으로 피란하러 떼를 지어 몰려나갔다.","해우는 독한 감기가 걸려서 누어있는 체하고, 자기 집에서 둥굴둥굴하고 있었다.","십구 일에는 그 전날 밤 다복동에서 기별하여 가산을 습격하였다는 소문이 들려와서 안주읍 안이 물 끓듯 뒤끓어도 해우는 여전히 칭병하고 나지 않었다."]],[["안주목사(安州牧使) 조종영(趙鍾永)이 혼자 몸이 다러서, 해우의 집에쫓아와서, 이러한 대란이 터젔는데 병사로서 이처럼 아무 대책도 강구하지 안는 법이 어데 있느냐고 디려댔으나, 해우는 뜬소문이지 사실은 대단치 않으리라고 부인하여 버렸다.","종영은 크게 분개하여 병사는 도모지 믿지 못하겠다고 하면서, 제가 나서서 육방 아전과 군노 사령을 총 동원하여 북을 울리며 군졸을 소집하고, 피란 가는 시민들을 억지로 진정시키어 요동치 못하게 성문을 닫어버렸다."]],[["그러나 내응동지들이 작고만 충동거리어, 새로 병정모집에 응하는 자는 하나도 없고, 출번군졸들도 오지 않고, 별별 소문이 다떠돌았다."],["해우는 한편 대린을 시키어 기병하자마자 곧 안주를 공격할 것을 주장케하였다.","평소에 병서를 정독하였드니 만큼, 작전상 그것은 절대적인 방법이라고 생각하였기 때문이다.","가산 회의에서 대린이 안주 공격을 주장한 것도 사실은 해우의 지령이었으며, 박천 회의에서 안주 공격을 주장한 것도 역시마찬가지었다."]],[["즉시로 안주를 공격하지 않으면 반드시 실패하리라는 것이 해우의 신념이었다."],["그러나 가산 회의에서 대린의 주장이 완전히 묵살당하였다는 보고를 듣고, 해우는 경내와의 협력을 거의 단렴하였으나, 그래도 최후로 한 번 더 주장해보게 하였든 것이다.","이렇게 하여서도 듣지 안는 경우에는, 경내가 실패할 것은 결정적이니까 차라리 그의 목을 베어 조정에 바치어, 이것으로서공을 세우도록 하라고 - 인배, 무경 등을 시키어 대린과 협력하도록, 박천으로 보냈든 것이다."]],[["그뿐 아니라, 이십일 일에는 박천군수 임성고가 옥중에서 몰래 써보낸 자세한 보고가 들어와, 해우로서도 이 이상 더 칭병하고 우물주물하고 있을 수가 없이 되었다.","그리고 연이어서 내린 이하 네 명이 경내를 암살하랴다가 실패하고, 도리혀 모조리 그들의 칼에 죽어버렸다는 보고가 들어왔다.","그 다음 이십이 일에는 곽산군수 이영식이가 변복을하고 소를 타고 와서, 김사용 등의 북군의 행동을 자세히 보고하며, 안주 병영에서 후원만 하여준다면 제 개인의 원수를 갚기 위해서라도 죽자하고 싸워서 반다시 경내의 무리를 처 무찌를 것을 맹세하였다."]],[["그리고 뒤를 이어 정주군수 이근주가 말을 타고 달려와서 정주가 함낙한 연유를 보고하였다."],["해우는 이러한 보고를 듣고 경내와의 협력을 완전히 단렴하고, 화가 제 자신에게 미치지 않도록 하기 위하여 자기의 비밀을 아는 유일한 생존자 김명의를 암살하여 버리고, 안주의 방비에 대하여서도 태도를 일변하여 종영과힘을 합하여 군사를 모고, 병기를 정비케 하였다."]],[["결코 박천서 군측이 추측하듯이, 해우는 처음부터 경내를 배반하기 위하여, 대린 등의 무리를 이용한 것은 아니었다.","다만 위인이 워낙이 침착하고약어서, 어느 편으로 붓는 것이 유리할가를 저울에 다러, 조곰이라도 더 유리한 편으로 붓는 - 철저한 기회주의자에 불과하였을 뿐이다."],["한편 홍총각은 이십이 일 아침나절 정주에 입성하여 김사용과의 연락을 지은 후에, 바로 말을 달리어 송림(松林)으로 향하였다."]],[["송림은 안주에서 청천강을 끼고 서로 맞건너다 보는 곳으로, 가산서 비밀리에 행동한 홍총각의 백여 명의 정예부대가, 먼저 여기에 도착하여 한편으로 안주의 동정을 살피며, 한편으로 홍총각 오기를 고대고대하고 있었다.","이십이 일 저녁나절 홍총각이 여기 도착하였을 때에는 명령일하(命令一下) 언제든지 움직일 수 있게, 이미 만단의 준비가 다 되어 있었다.","그리고 안주의 동정도 그 날부터 다소 경비가 심해지고, 병정들도 꽤 많이 모이고 하였으나, 대부분은 어린 아이와 늙은이로 이 쪽에서 기습만 하면 단숨에 함낙시킬 수 있다는 것이완연하였다."]],[["홍총각은 더 지체할 것이 없이 그 날 밤에 야습을 하기로 결정하고, 군량을 있는 대로 내다가 모다 저녁을 배부르도록 멕이었다.","그리고 빙판이 진청천강의 어름의 조사라든가, 안주의 성을 넘는대 쓸 사닥다리라든가, 어둠 속에서 제 편을 구별하기 위하여 쓸 암호라든가 - 물샐 틈 하나 없이 준비는 다 되었다."],["초저녁이 지나 이윽고 밤이 깊어졌다.","홍총각은 전 부대를 한데 모아 최후의 훈시를 한 다음에, 막 출발의 명령을 나리려 할 때다."]],[["그 때 경내로부터밀사가 달려와서 급하게 경내의 진필의 밀서를 바치었다.","대린의 무리가 반역하여 자기가 중상을 입은 사실과, 안주병사 이해우가 대단히 수상하고 엉큼한 자라, 어떠한 음모를 하고있는지 전혀 예측할 수 없다는 사실과, 그러므로 안주 공격을 중지하고 곧 박천으로 오라는 내용이다.","그리고 이 명령은 절대적이니 어기지 말라고, 끝에 써있어, 그의 엄격한 태도가 표명되어있다."],["만사는 다 글렀다."]],[["홍총각의 이 때까지의 가진 고심도 이제는 완전히 허사가 되고 만 것이다.","이 명령이 작전상 부당한 것은 의심할 여지가 없으나, 이번 이 게획 자체가 거의 수뇌부 전부의 반대가 있음에도 불구하고, 경내의 특별한 묵허(黙 許) 밑에서 진행되었드니 만큼, 이제 경내마자 이것을 반대하게 되었으니, 안주 공격을 중지하는 이외에 아무 도리도 없는 것이다.","홍총각은 비통한 어조로 부하들에게 밀서의 내용을 말하고, 다시 또 말을 달리어 박천 대본영으로 향하였다."]],[["十二 [십이].","松林 [송림] 싸홈"],["이십 일 밤중에 불이의 습격을 받어 중상을 입어 혼수상태에 빠젓든 경내는, 그 이튿날 저녁에야 겨우 의식을 회복하였고, 이십이 일 점심 때부터 겨우 정신을 차리어 들어누은 채로 군측 등과 만나서 급한 일부터 처리하기시작하였다."],["그가 제일 먼저 명령한 것이, 송림에 있는 홍총각에게 밀서를 보내어, 안주 공격을 중지시키는 일이었다."]],[["자기들도 모르게 이러한 커다란 계획이 진행되었다는 사실을 알자, 군측은 펄펄 뛰며, 홍총각을 곧 불러다가 규율을위반한 책임을 추궁하자고 서둘렀다.","경내는 책임을 추궁할 의사는 없었으나, 대린 이하 네 명의 행동으로 미루어보아, 안주병사 이해우가 무슨 커다란 모략을 하고있다고 밖에는 생각할 수 없었음으로, 어쨋든 위선 홍총각을 박천으로 부르는 것이 상책일 것 같어서, 밀서 속에다가 그러한 명령을 나리었든 것이다."]],[["홍총각이 박천에 도착하여 대본영에 나타나자, 기다리고 있든 군측은 가장준열한 태도로 홍총각의 규율 위반을 문초하러 들었다.","군측편으로서는, 그전에 회의가 있을 때마다 안하무인의 불손한 태도로 자기들을 모욕하고, 고집을 세우든 홍총각을, 이번 기회에 단단이 혼을 내어, 버릇을 가르처보자는 것이었다."],["그러나 홍총각은 조금도 굴복지 않고, 도리혀 이 때까지의 어느 때보다도 더 맹렬하게 군측에게 덤벼들었다."]],[["─ 전쟁이라는 것은 원래 위험한 것으로, 위험한 것을 두려워하는 자는 처음부터 전쟁에 참가한 것이 잘못이다.","관 쓰고 강도질을 하는 원놈을 하나 둘 죽였다고 소리 소리 지르고, 선봉장에 임명된 사람이 조곰 대담한 기습작전(奇襲作戰)을 하려 한다고 벌벌 떨고 있으니, 이래가지고 무엇이 된단 말이냐?","이처럼 겁을 잔득 집어먹고 안전한 길만 찾다가는, 도리혀 우리의 목이 달어나고, 적에게 먼저 공격을 받을 것은 생각지도 못하면서, 그래도 내가 총참모네 내가 제갈량이네 하고 책상 앞에만 업대려 있대야, 일이 될 턱이 없다."]],[["그러한 총참모 밑에서는선봉장 노릇은 절대로 못하겠으니, 처벌하고 싶거던 처벌하고, 마음대로 하라!"],["홍총각은 이 이상 더 바랄 것도 없고, 또 상관이라고 끄릴 것도 없어서, 속에 있는 대로 울분을 한거번에 막 쏟아놓았다.","군측은 너무나 기가 막히어, 바로는 대항하여 감히 입을 열지 못하였다."],["이윽고 경내가 보다 못하여"]],[["“우리는 지금 지극히 위태로운 시기에 놓여있으니, 그처럼 우리 내부에서총참모와 선봉장이 서로 이러니 저러니 언쟁할 여유가 없는 것이오. 조고마한 과실은 서로 묻어주고 가려주어, 될 수 있는 데까지 서로 협력하여, 이 난국을 앞으로 어떻게 타개해 나갈 것인가 - 이것이나 상의하기로 합시다.”"],["하고, 둘을 뜯어말리어, 이야기의 방향을 들리었다."]],[["“지금이라도 늦지 않으니, 곧 제게 안주 공격의 명령만 나려주시요. 단번에 이해우라는 놈의 목을 베어, 이리 붙었다 저리 붙었다 하는 기회주의자, 반역자의 운명이 어떤 것인가를 만인의 눈앞에 보여주겠읍니다.”"],["총각은 기세가 등등하게 여전히 안주 공격을 주장하였다."],["“북군이 남하하는 것을 기다리어 우리의 전 병력을 기우려서 공격하여도함낙될지 어떨지가 의문인데, 선봉장이 혼자 백여 명의 군졸을 거느리고 안주를 공격한다는 것은, 선봉장 혼자는 아모리 용감하여도 위험하기 짝이 없읍니다."]],[["더구나 대원수께서 이처럼 누어게신데, 그러한 위험한 작전을 세우는 것은, 내가 총참모로 있는 한, 용인 못하겠읍니다.”"],["군측은 또 한사코 반대하였다.","홍총각으로서는 이 문제를 가지고 이 이상 군측의 무리들과 다투는 것은 지긋지긋하였고, 거의 피치 못할 운명인 것도같었다.","또 경내로서도 제 자신이 이러나도 못하고 누어있는 몸으로 무슨 새로운 대담한 작전을 운운할 여지가 없었다.","결국은 처음 작전대로 북군의 남하하는 것을 기다리어 안주 공격을 개시할 것을 - 다시 확인하고 말었다."]],[["그러나 이러는 동안에도 주위에 있는 소도시에 대한 작전은 착착 진행되었다.","더구나 김사용의 북군은 눈부신 진출을 게속하였다."],["사용은 이십이 일에 정주에 입성하였다가, 이십사 일에는 다시 북행하여 선천(宣川)으로 향하였다.","이 때 선천부사 김익순(金益淳)은, 김봉관(金鳳寬)의 진술로 철산(鐵山)에 있는 내응동지 정복일(鄭復一)을 잡아 족치다가, 의외로 대규모인데 겁이 덜컥 나서, 검산산성(劍山山城)의 방비를 검열하겠다고 핑계하고, 선천읍을 버리고 그리로 도망가버렸다."]],[["그리하여 이십사 일 당일로 사용은 단숨에 선천읍을 완전히 점령하고, 검산산성에서 벌벌떨고있는 익순을 잡어나리어 정식으로 항복을 받었다."],["사용은 내응동지 유문제(劉文濟)로 유영장(留營將)을 삼고, 자기는 다시 철산(鐵山)으로 향하였다.","철산에는 정경행(鄭敬行), 정복일(鄭復一) 같은 유력한 내응동지들이 그 전부터 여러 가지 유언비어를 유포시키어 읍내의인심을 동요시키었음으로, 철산부사 이장겸(李章謙)은 어리둥절하여 어쩔 줄을 모르다가, 이십오 일에 선천의 동정을 몰래 살피어보려고 선천 지경으로 향하였다."]],[["그 때 마침 선천읍 옥중에서 나와서 철산으로 향하든 복일에게 발각되어, 그 자리에서 사로잡히고, 이내 철산읍은 함낙되고 말었다."],["그 바로 북쪽에 있는 용천(龍川)도 이와 전후하여 함낙하였다.","용천 부사권수(權琇)는 읍의 북쪽에 있는 용골산성(龍骨山城)에 의거하여 반항하여싸우다가, 이태만에 성을 버리고 의주(義州)로 도망가 버렸다."]],[["북군은 이처럼 파죽지세(破竹之勢)로 올려 미렀는데, 한편 남군도 이십삼일에는 박천의 북쪽에 있는 태천(泰川)을 점령하였다.","태천현감 유정양(柳鼎養)은, 도저히 단독으로 막어내지 못할 것을 짐작하고, 영변(寧變)의 약산산성(藥山山城)으로 도망하여, 태천읍은 아주 간단하게 함낙하였다."],["그러나 아즉도 영변(寧變), 구성(龜城), 의주(義州)는, 내응동지들의 필사의 노력에도 불구하고 함낙되지 않고, 시일의 갈수록 방비가 견고하게 되었다."]],[["경내의 점령 지구에서 도망간 원과 그 주위에 있는 다른 골 원들이 위태로운 이 세 읍으로 모이어, 정보를 교환하고 군졸을 동원하여, 일치 협력하였음으로, 도리혀 이 쪽을 위협하게 되었다.","더구나 의주에는 허항(許"],["沆), 김견신(金見臣) 등의 의병대장(義兵大將)이 의병을 모집하여, 한편 방비를 엄중히 하고, 한편 공격태세를 위하여 기세를 울리었다.","그리하여 결국 가산, 박천, 정주, 태천, 곽산, 선천, 철산, 용천의 여덜 읍이 함낙되었으나, 청천강 이북을 완전히 평정하여 뒷근심 없이 만들어 가지고, 안주, 평양으로 향하겠다는 - 당초의 게획은, 여기에 이르러 단렴하지 않을 수 없게 되었다."]],[["형세가 이처럼 돌아가니, 만전지책(萬全之策)이라 하여, 소극적인 작전만일삼아오든 군측, 창시도 이미 때는 늦었으나마 남군만으로 안주 공격을 감행할 것을 결의하게 되었다.","그리하여 이십육 일 밤에 본진을 박천으로부터송림(松林)으로 옴기었다.","아즉도 기동이 부자유한 경내는 사인교를 타고 사람들의 눈을 피하여 맨뒤에 따라섰다.","일반 군졸들도 경내의 부상을 대개 짐작은 하였으나, 수뇌부 이외에는, 경내는 그 때까지도 절대로 만나지 않었든 것이다."]],[["십이월, 그러나 때는 이미 늦었었다.","이십일 일 밤에, 평양감사 이만수(李晩秀) 로부터 경내의 기병을 급보하는 밀게(密啓)가 서울 중앙 정부에 도착하였다.","이 변보(變報)를 듣고 서울 양반들은 모다 황겁하여 처자를 시골로보내느라고 대혼란을 이르켰다.","그리다가 그렇게 바로 서울로 처들어오는 것이 아니라는 것을 차차 알게되고, 또 이요헌(李堯憲)을 양서순무사(兩西巡撫使)를 삼고, 박기풍(朴基豊)으로 순무중군(巡撫中軍)을 삼아, 훈, 금, 어,(訓, 禁, 御) 삼영(三營)의 정병을 거느리고, 이십칠 일 오시에 서울을출발하게 하니, 서울 양반들도 그제야 저윽이 안심하였다."]],[["서울서 보낸 이 박기풍의 부대는 송림 싸흠에는 미처 참가하지 못하였으나, 안주 병영에서 관하 각군에 엄령을 나리어 중병을 독촉한 결과, 숙천부사(肅川府使) 이유수(李儒秀)를 위시하여, 중화(中和), 순천(順天), 함종(咸從), 덕천(德川), 영유(永柔), 증산(甑山), 순안(順安) 각 군의 수령이각기 군병(軍兵)을 거느리고 모여든 수효가 불과 오륙일 동안에 이천 명을 넘게 되었다.","물논 이 중에는 노약(老弱) 한 자가 많어서, 제일선에서 즉접활약할 수 있는 자는 약 천여 명이었으나, 서울을 위시하여 남쪽에서 속속후원병이 올 것이라, 위선 이것만으로 먼저 공격에 옴기기로 하였다."]],[["그리하여 이십구 일 아침에 천여 명의 관군이 세 길로 나누어 빙판이 진청천강을 건느기 시작하였다."],["“저것들이 강을 다 건네어 진을 정비하기 전에 이 쪽에서 먼저 공격하는것이 옳을 것 같으니, 어서 공격 명령을 나려주오.”"],["홍총각은 송림에서 이것을 바라보고, 군측에게 이처럼 재촉하였다.","군측이 임시로 총지휘를 담당하였다.","이 때에 경내는 진두에 나오지 못하였든 것이다."]],[["박천서 올 때에 사인교를 탔었으나, 너무나 무리였었음으로, 상처가 도 지고 열이 바쩍 심하여, 꼼작을 못하였다."],["군측은 홍총각의 재촉에 응하지 않었다.","적은 벌서 여러 날 대기하고 있든 것이요, 이 쪽은 여기 도착하여 이삼 일이 못되어 지리에 어두우니, 함부로맹동하다가는, 도리혀 적의 모략에 빠진다는 것이다.","그보다도 적이 모다건느면, 뒤가 바로 강이라, 퇴각이 부자유하게 될 것이고, 그 때에 그것을분산시키어 그 하나하나를 포위하여 섬멸하는 것이 상책이라 하였다."]],[["이윽고 관군은 강을 다 건네어 공격이 시작되었다.","이 때 관군의 진용은"],["주장, 평안병영 우후 이해승(主將) (平安兵營 虞侯 李海昇)"],["우익장, 순천군수 오치수(右翼將) (順天郡守 吳致壽)"],["좌익장, 함종부사 윤옥렬(左翼將) (咸從府使 尹郁烈)"]],[["이처럼 삼진으로 나누어 오치수는 동편에, 이욱렬은 서편에, 이해승은 중앙 후방에 진을 첬었다."],["경내의 진에서도 일천오백여의 군졸을 삼진으로 나누어, 홍총각, 윤후험(尹厚險), 변대언(邊大彦)이 각각 인솔하고 여기에 대적하였다.","군측의 포위 작전의 명령대로, 윤후험은 일지병(一枝兵)을 거느리고 이해승의 뒤로돌아나가고, 변대언은 일지병을 거느리고 적현(赤峴)을 쫒아 애워싸고, 홍총각은 일지병을 거느리고 이해승의 진을 향하여 정면에서 디리쳤다."]],[["홍총각으로서는, 너머나 늦게 오기는 하였으나, 기다리고 기다리었든 결전이다.","그가 과거 일년 이상을 두고 조련하여 제 손으로 길러낸 삼백여 명의 정예부대를 독촉하여, 칼을 빼들고 진두에 서서 자충우돌하며 돌격하여 밀고 들어갔다.","이 공격이 너무나 용감하고 맹렬하여, 이해승의 진이 차차로위태로워저, 좌익장 육욱렬과 합진하기를 청하지 않을 수 없이 되었다.","그러나 윤욱렬은, 적에게 약한 것을 보일 수 없다.","하며, 약간의 군졸을 분파(分派) 하였을 뿐으로, 이해승의 진세는 시시각각으로 골난하게 되었다."]],[["더구나 윤후험이 이해승의 진을 뒤로서 포위하였음으로, 이제는 이해승의 진은 중위(重圍)에 빠저, 홀난을 일으키며 한 거름, 두 거름 뒤로 퇴각하게되었다."],["이 때 평안병사 이해우(李海愚)는 백상루(百祥樓)에서 진세를 살피고 있다가, 이해승의 진이 대단히 위태로운 것을 보고, 그 전 곽산군수 이영식(李永植)을 시키어 성내에 남아있든 천여 명의 군졸을 일시에 출동시키어 윤후험의 진을 습격하게 하였다."]],[["경내의 진에서는, 관군이 의외로 수가 많은 데놀랬다.","관군의 후원장(後援將) 이영식은, 제 일가족을 전부 잃어서 불과 같은 복수심으로 진두에 서서 군졸을 독촉하였음으로, 맨 늙은이, 어린아이들인데도 불구하고, 크게 기세를 올리었다.","그리하여 단번에 형세는 역전(逆轉) 하여, 차차로 경내의 진이 밀리게 되었다.","더구나 관군에는 화총이많어, 탄환이 비 오 듯하여, 경내의 진의 기병(騎兵)이 연하여 꺼꾸러지니, 이 때문에 더욱 홀난이 이러나, 홍총각의 정예부대의 용맹으로도, 대세는 이미 어찌할 수 없이 되었다."]],[["결진(結陣)!","─ 아모리 외처보아야, 한번 밀리기 시작한 군졸은, 떼를 지어 우 - 도망질 첬다."],["이리하여 제갈량으로 자처하든 군측의 작전은 안주병사 이해우 앞에 완전히 패퇴하고 말았다.","위선 눈 앞에 적만을 보고, 뒤에 대비하고 있는 적을 못 보았든 것이, 군측의 오산의 제일 큰 원인이었다."],["날이 어둑어둑하게 저무러갈 무렵에, 경내는 사인교를 타고 패잔병 이 백여 명을 거느리고 정주(定州)를 향하여 도망하였다."]],[["경내가 정주를 택한 것은, 박천이나 가산은 성이 그다지 견고하지 못하였고, 또 적의 근거지에 너무나 가까웠기 때문이다.","다복동에 있든 수뇌부들의 가족들도 이 때 모다 정주로 끄러디렸다."],["경내는 사인교 속에서 복장을 치면서 탄식하였다.","십여년 동안 고심 참담하여 게획하여 이르킨 일이, 이루어지느냐 실패하느냐 결정되는 - 결전의마당에 즉접 나서서 지휘하지 못하고, 이처럼 패전하게 되었으니, 참으로억울하고 원통하기가 짝이 없었다."]],[["十三 [십삼].","反逆者 [반역자]"],["경내는 송림 싸흠에 패하기는 하였으나, 그렇게 아주 절망한 것은 아니었다.","성곽이 견고하여 지키는대 유리한 정주에 위선 임시로 입성하여, 여기를 지키면서, 북군의 남하하는 것을 기다리고 창성(昌城) 강게(江界) 등지의 구원병을 재촉하여, 다시 남진을 꾀하자는 것이, 경내의 생각이었다.","그리고 그러는 동안에 제 상처도 완전히 나어서, 즉접 진두에 나서서 지휘하게 되면, 사기(士氣)도 왕성해지겠고 전국을 다시 유리하게 이끄러갈 수도있으리라고 생각하였다."]],[["이 때에 창사와 송지염(宋之濂)이, 둘이 경내 앞에 나타나 난국의 타개책을 말하였다."],["송지염은 원래 강게(江界)의 향임(鄕任)으로, 만주에 있는 중국 상인들과어울리어 크게 장사를 시작하였다가, 수천량의 공금만 허비하고 이것을 갚을 길이 없어 고민하든 차에, 마침 다복동에서 경내가 기병하여 그 형제가 매우 우세하다는 소문을 듣고, 정부터 친교가 있는 창시를 찾어서 경내의 진에 참가하게 되었든 사람이다."]],[["외양이 퍽이나 늡늡하게 생기고, 언변이능난하여, 어데다 내노아도 단단이 한목 보는 사람이다.","능청맞게 협잡질을잘 하여, 처음 만나는 사람으로 속지 안는 이가 없었다."],["송림 싸홈에서 경내가 패하여 정주로 밀려들게 되자, 지염은 창시를 쏘사거리어 자기를 호병(胡兵)에게 후원을 청하러 가는 특사로 하여달라고 말하였다.","이것은, 자기가 그전에 장사 관게로 호인들과도 교제가 많어서, 자기가 가기만 하면 성공할 자신이 충분히 있다는 것이다."]],[["둘이 경내 앞에 나타나서 이것을 말하였을 때에, 경내는 시험 삼어, 근자에 만주 우모령(牛毛嶺)이라는 곳에 새로 이러나서, 그 지방 일대를 점령하였다는 마적단의 이야기라든가, 칠팔 년 전에 자기가 즉접 가서 만나본, 마적단의 두목 정시수(鄭始守)의 최근의 동향이라든가, 여러 가지를 무러보았는대, 지염은 청산유수처럼 한 마디 막히지 않고, 자세하게 대답하였다.","만추의 지리에도 능통하고, 말도 통하고, 그러한 마적단 두목들과도 이미 그 전부터 다소 친교가 있는 듯하였다."]],[["경내는 지염이 요구하는 대로 일만량이나 되는 대금을 주어, 되도록 속히그들을 안내하여 올 것을 부탁하였다.","지염은 소 여러 필에다가 돈을 나누어 실고, 그 날로 북쪽을 향하여 총총하게 떠나갔다."],["그리고 창시 자신은, 자기가 북군에 가서 남군의 골난한 사정을 전달하고, 또 북군의 작전을 되도록 빨리 끝 마추도록 독촉하여, 의주까지 함낙시키고서 바로 남하하도록 지도하겠다고 말하였다.","총참모로 있는 군측이 이번 작전에 실패하여 골난한 입장에 있는 이 때에, 참모의 자리에 앉은 자기로서, 하등의 적극적인 타개책을 강구하지 않을 수 없다는 것이다."]],[["경내는 창시의 이 말 대로, 그를 북군에 보내기로 하였다.","이 때까지 대체로 순조롭게 진출한 북군이 그 작전을 끝마추고 빨리 남하한다는 것은, 경내로서는 제일 기대하는 바이었다.","아니, 이제 와서는 이 난국을 타개하여, 다시 안주, 평양으로 내밀게 되고 안되는 것은 북군의 작전이 성공하느냐못하느냐에 달린 것이다."],["창시도 그 날로 출발하여, 부원수 김사용이 머물러있는 양책참(良策站)으로 향하였다."]],[["양책참은 선천서 의주로 통하는 대로 상에 있는 요지로, 사용은 제초와 함께 여기서 의주 공격의 작전을 의논 중이었다."],["창시는 남군이 송림 싸홈에 패하여 정주에 입성하여, 여기서 관군을 막고 있으며 북군이 의주를 함낙시키고 빨리 남하하기를 고대고대한다는 것을 전하였다.","그리고 덮어놓고 의주 공격을 독촉하였다.","그러나 북군의 입장도그리 용이하지 않었다.","각지에 소위 의병(義兵)이라는 것이 이러나, 이미 한번 점령한 지역도 새로운 위협을 받게 되었으며, 게다가 남쪽에서 수천 명의 관군이 밀고 올려온다면, 의병의 기세를 더욱 돋굴 것은 환 - 한 일이었다."]],[["사용은 제초와 창시와 곰곰이 생각다가, 위선 제초를 다시 선천으로 나려가, 남군과 북군과의 연락을 확보케 하고, 사용과 창시는 허항(許沆), 김견신(金見臣)을 중심으로 한 의주의 강력한 의병에 대항하기로 하였다.","이 이외에는 아무 방법도 엇었다."],["한편 관군에서는 이십구 일에 송림 싸홈에 이겨 가지고, 심십 일에는 단숨에 박천 가산을 회복하고, 경내의 근거지 다복동을 습격하여 민가도 병사도모두들 불 질러버렸다."]],[["그리고 연하여 태천을 회복하고, 정월 초삼일에는경내가 지키는 정주성 밖에 도착하여, 정주를 포위하는 태세를 가추었다.","처음에는 정주도 단숨에 회복하려고 세 차례나 군사를 재촉하여 돌격하여 보았으나, 성 밑까지 다다르자마자 성 우에서 큰 돌을 나려굴리고 뜨거운물을 나려부어, 죽어 넘어지는 자, 부상하는 자가 부지기수였다.","세 차례다 많은 히생만 내고 헛되히 물러섰다.","그리하여 당초의 방침을 변경하여, 정주성은 위선 포위한 채로 내버려두고, 정주 이북의 북군을 공격하여, 먼저 이것을 섬멸하여 버리기로 정하였디."]],[["이 작전에 의하여, 정주 바로 북쪽에 있는 곽산을, 초팔일에 후원장(後援將) 이영식(李永植)과, 우익장(右翼將) 오치수(吳致壽)가 이천여 명의 군사를 거느리고 공격하였다.","이영식은 송림 싸홈에도 큰 공을 세웠었으나, 곽산은 이번에 제가 원 노릇을 하다가 혼이 난 곳이라, 그 원한을 풀기 위하여, 제가 자원하여 출동한 것이다."],["이천 명의 대군이 불의에 처들어오니, 곽산을 시키든 소 ㅅ 수의 수비군으로는 도저히 대항할 방도가 없었다."]],[["더구나 공교럽게도, 유진장(留鎭將) 박성신(朴星信)이 소를 잡고 술을 빚어, 군졸들과 한참 즐기든 판이라, 제대로싸워보도 못하고 참패하여, 순식간에 곽산은 관군에게 점령당하고 말었다.","성신은 겨우 몸만 빠져나와, 선천으로 달려가서, 제초에게 이 소식을 전하고 후원을 정하였다.","제초는 이 날 막, 남군과 북군의 연락을 확보하기 위하여 양책참에서 나려온 판이었다.","몹시 피곤하고, 또 군졸도 그 수가 삼사백에 불과하였으나 제초는 주저하지 않고, 바로 곽산으로 향하여 말을 달리였다."]],[["곽산 싸홈에서 도망갔든 군졸들도, 제초의 후원군이 온다는 소식을 듣고 다시 모여들어, 그럭저럭 천여 명에 달하였다."],["그러나 곽산을 회복한 관군은, 구일에 좌익장(左翼將) 윤욱렬(尹郁烈) 이인솔한 칠백여 명의 군사가 새로 도착하였음으로, 도합 이천칠백명에 달하였다.","수로서 거의 삼배가 되니, 양군이 부닥칠 때에, 관군이 절대로 우세할 것은 처음부터 뻔 - 한 일이다."]],[["곽산읍 서편에 사송야(四松野)라는 들이 있어, 양군은 여기서 부닥쳤다.","이 싸홈은 송림 싸홈 이상의 대격전이며, 또 북군이 유지되느냐 못 되느냐가 결정되는 - 북군의 운명을 좌우하는 큰 싸홈이었다.","제초는 진두에 나서서 필사의 힘을 다하여 싸웠으나, 워낙 수가 부족하여, 한참 싸우다보니 제초의 군사는 판군에게 완전히 포위 당하고 말었다.","이러한 평야에서는 무기에 별차가 없는 이상, 결국 그 군사의 수효의 다과가 대세를 결정하는 것이였다."]],[["제초는 대홀난을 일으키어 이리 저리 닫는 군졸을 모아 이끌며 또 얼마 동안 싸워보았으나, 시각이 지날수록 더욱 홀난을 일으키어, 독력으로 어찌할 도리가 없었다.","제초는 싸홈을 단렴하며, 양책참에 가서 닥시 진용을 정비하여 나려옴만 같지 못하다 생각하였다.","그리하여 칼을 휘둘러 관군 오륙명을 한거번에 배어 넘기고, 그 포위망을 뚫고 북으로 도망하였다.","그러나 중도에서, 돌연 매복하고있든 관군의 일부대가 나타나 길을 딱 막었다.","제초는 필사의 힘을 다하여, 길 막는 자들을 베이며 몸을 날리다가, 말 등자가 끊어지며 말에서 뚝 떨어젔다."]],[["말에서 떨어저서도 한참 접전을 하였으나, 겹겹이 싸고 덥비는 수백 명의 군사를 혼자서 막어낼 길이 없어, 그여히 사로잡히고 말었다.","그리고 거짓 꾀여서 이영식의 진까지 끌고가, 거기서 칼로 베어 죽였다."],["사송야의 패전과 제초의 죽엄이 한번 전하여지자, 그 때까지 파죽지세로연전연승하던 북군은 모다 낙심천만하여, 어찌할 바를 몰랐다.","제초는 북군의 선봉장으로 가장 용감히 싸웠으며, 북군이 그처럼 기세를 올린 것도, 사실은 제초의 공로에 힘입은 바 많었다."]],[["창시는 사용을 보고"],["“이제는 새로운 무슨 방도를 강구하여야지, 그대로는 중과부적이라, 접전하는 대로 패할 것이니, 애매한 장수와 군졸만 죽이지 맙시다. 창성(昌城)에 신도회의에도 참가한 내응동지가 하나 있어, 산간의 선방포수(善防砲手) 들을 영솔하고 있는데, 이제는 내가 가서 그 선방포수들을 다리고 오는 수밖에 없겠오.","이것은 대원수께서도 전부터 계획했든 것으로, 지금 다시 대원수께 여쭈어 볼 것도 없을 것이오. 또 사세가 위급하여 그럴 겨를도 없겠오.”"]],[["하고, 사용의 동의를 얻어, 군졸을 둘을 거느리고 창성으로 향하여 떠나갔다."],["창시가 선방포수를 동원하기 위하여 창성에 가겠다는 것은, 물논 전연 거짓말은 아니었으나, 창시의 심정은 그리 단순한 것이 아니었다.","정주서 송지염(宋之濂)과 상의하여 떠나올 때에, 이미 둘 사이에는 은연중에 한 개의약속이 있었다.","그것은 송림 싸홈에 패한 것으로 보아, 다시 형세를 회복하기는 어려울 것 같으니, 둘이 각각 떠나가서 되는 대로 해보다가, 요행히전국이 바로 잡히면 경내의 편에 다시 가담하고, 그렇게 안되면 그 막대한 돈을 가지고, 산 속에 숨어버리든지, 시침이 딱 떼고 관군의 편을 들든지하자는 것이다."]],[["어느 편이 이기든지, 어느 편이 지든지, 형세를 잘 살피어우세한 편에 가담하자는 것이다.","글께나 배워서 약어빠진 자들이란, 결정적단게에 이르면 이처럼 동요하고, 반역 행위도 사양치 안는 것이다."],["창시는 구성(龜城) 지경에 이르러, 길에서 행동이 수상한 자를 하나 만났다.","군졸을 시켜 잡어다가 족치니, 그는 철산 사는 조문형(趙文亨)이라는 자로 사용의 진에 있다가 도망하여 이리 피해온 것이 판명되었다."]],[["창시는군법위반이라고 바로 베이랴다가, 그 자가 하도 애걸복걸하고, 또 제 자신의 심정이 심정인만치, 그대로 다리고 창성으로 동행하게 되었다."],["몇일 후에 날이 저무러 산 속에 막을 치고 잠을 자게 되었는데, 창시의 호 주머니에 은패(銀牌)가 번적거리는 것을 보고, 문형은 그것이 무엇이냐고물었다."],["“이 은패는 내응동지들 사이에 미리 다 배부되어 있어, 무슨 연락할 일이 있어, 서로 만날 때에는, 이것을 내가지고 맞후어 보아, 부합하면 서로 의심하지 않기로 되어있는 것이다. 그러므로 함부로 남 앞에 내 놓지 않는 법이다.”"]],[["창시는 은패를 들고서 이처럼 반 자랑 삼어 설명을 하고, 다시 깁숙하게감추고, 들어누어서 잠이 들었다."],["그러나 이것이 액운이었다.","문형은 이 은패를 보고, 이런 것을 가졌으니필시 상당한 간부일 것이라, 이 목만 베어 가지고 관군에 갖다가 바치면, 많은 상을 탈 것이라고 생각하였다.","그리하여 자는 체하고 누어 있다가 몰래 창시 칼을 빼어, 한 칼에 창시의 목을 베어들고 발굼치를 돌리어 서쪽으로 도망질하였다."]],[["문형이 선천에 이르러, 창시의 목을 장차 관군에게 바치랴 할 때에, 마침 선천부사 김익순(金益淳)을 만나, 일천량을 받고 그에게 팔었다.","익순은 이 창시의 목을 들고 정주의 관군에 나타나, 이것은 자기가 고심참담하여 베인것이니, 이것으로 전일에 사용에게 항복한 죄를 용서하여 달라고 애걸하였다.","그러나 그여히 그것이 거짓말이라는 것이 탈로되어, 익순도, 문형도 모다 관군에게 사형을 받고 말었다."]],[["이리하여 반역하려다가 미처 반역하지 못하고 죽은 창사의 목을 중심으로하여 양편 사이를 왔다 갔다 하든 두 사람의 목까지 떨어지고 말었다."],["한편 호병의 후원을 청하러 만주를 향하여 간 송지염(宋之濂)은, 일만량의대금을 가지고 위선 고향인 강게(江界)에 들리어, 집어쓴 공금 삼천량을 싹다 갚어버리었다.","그리고서는 양진의 형세만 관망하고 있다가, 경내 편이불리하여, 북군도 멸망하고 외로히 정주성에 농성하게 되었다는 소문을 듣고 백팔십도로 전환하여 남어지 돈으로 대대적으로 의병을 모집하여 스사로의병대장이 되어 가지고, 관군에 가담하여 정주성 공약에 단단히 한몫 보게되었다."]],[["이리하여 호병을 초청해올 중대사명을 띈 경내의 전권대사는, 하로밤 사이에 이를 배반하고, 도리어 경내의 혁명군을 애워싸고 총칼을 겨누었든 것이다.","이러한 반역 행위를 감행함으로서, 지염은 이 전쟁을 통하여 돈버리도제일 잘하고, 공도 크게 세운 최대의 선공자가 되었다."],["(후에 어떤 사람이, 지염의 이러한 파렴치한 반역 행위를 비난하니, 일대의 반역자 지염은 천연스럽게 대답하였다."]],[["“내가 처음에 경내의 혁명군에 가담한 것은, 어떻게 해서 이 혁명군을 때려부실가, 그 기밀을 탐지하기 위하여 가담한 것이다. 그러므로 나는 처음부터 관군 편이지, 절대로 경내의 편이 아니었다.","만약 내가 그 때 일만량이라는 대금을 끄내오지 않었드라면, 경내는 그 돈의 힘으로 훨신 더 오래버티었을른 지도 모른다. 범의 굴에 가야 범을 잡듯이, 경내의 혁명군을 때려부실랴면 그 진중에 가야만 하였든 것이다.”"]],[["반역 행위는 언제든지 합리화할 수 있으며, 또 합리화할 구실도 있는 것이다.”)"],["十四 [십사].","定州 籠城 [정주 농성]"],["송림의 패전으로 남군은 정주로 몰리고, 사송야의 패전으로 북군은 그 중심을 잃게 되어, 이미 대세는 어떻게 할 수 없는 파국에 이르렀다.","허황, 김견신을 대장으로 하는 의주의 의병은, 정월 십일 일에 사용이 지키는 양책참을 처 회복하고 더욱 기세를 높이며 남하하고, 사송야 싸홈에 이긴 관군은, 이와 전후하여 선천을 처 회복하고, 의기 충천하여, 북쪽으로 처 올러왔다."]],[["남하하는 의병과 북행하는 관군 틈에 끼이여, 잔병을 걷우어 사이 길로 숨어서 정주성으로 뛰어들어가 버렸다."],["이렇게 되고 보니, 한 때는 청천강 이북의 팔읍을 점령하여 평안도 전부를집어 삼킬 듯한 기세를 보이든 경내의 혁명군도, 기병한지 이십여 일에 작전의 실패와 반역자의 속출로 도처에서 패퇴하여, 정월 이십 일 경에는 정주성 단 하나를 보존하게 되었다.","이거나마 각처에서 관군과 의병이 칠팔천이나 모여들어 겹겹이 둘러쌌음으로, 정주성의 운명도 이미 결정되어있든것이다."]],[["그러나 이 정주성이 함락함에는 전후 사개월이나 걸리었다.","신미년(辛未年) 십이월 십팔일 기병한 이래, 임신년(壬申年) 사월 십구일 북장대(北將台)가 폭발하여 정주성이 완전히 함락한 날까지 통산하면, 실로 다섯 달에걸치는 것이다."],["정주성 공방전(攻防戰)에 있어서의 양군의 가지가지의 고심, 교묘한 작전의 안출, 새로운 무기의 발명 등, 이야기거리가 많으나, 여기서는 일일히그것을 기록할 여유가 없다."]],[["다만 불과 이삼천밖에 되지 안는 경내의 혁명군이, 고립무원한 외로운 성을 지키어 사개월이나 싸워나갔다는 것은 그들이 죽어도 가치 죽고, 살어도 가치 산다는 운명의 공통됨을 자각하여, 참으로 일치 협력하여 가장 대담하게, 가장 용감하게 싸운 때문이었다는 것을 말하여 둔다.","그리고 여기서도 홍총각이 제일 용감하게 초인적인 활약을 하였다는 것을 말하여 둔다."],["정주성의 함락과 함게 경내 군측, 홍총각, 히저, 사용 등은 어찌 되었나?"]],[["― 이 중에서 사용은 제이회 공격전에 전사하고, 그 이외는 정주성이 함락할 때에, 혹은 성과 운명을 가치하고, 혹은 관군에게 사로잡히어 서울로 호송되어 참혹한 사형을 받었다."],["경내는 정주성과 운명을 같이 하여, 장열한 전사를 하였는데, 그의 죽엄을원통하게 생각하는 이 중에는, 혹은 그 때 죽은 것은 가짜 경내고, 진짜 경내는 거기서 빠져서 도망하여 산 속에 들어가서 중이 되었다고 말하는 이도있다."]],[["그러나 경내가 죽었던 살었던, 용이 되려다가 용이 못된 것만은 사실이며, 용강(龍岡) 이시미는 그여히 이시미에 그치었다는 것만은 사실이다."],["(一九四七 [일구사칠], 一 [일].","七 [칠].)","主要人物 [주요인물]"],["洪景來 [홍경래] = 平西大元搜 [평서대원수], 龍岡出身 [용강출신], 三十二歲[32 세](或 [혹] 은 二十九歲)[29 세], 最高 [최고] 의 指導者 [지도자], 定州 [정주] 陷落時 [함락시] 에 戰死 [전사]."]],[["禹君則 [우군칙] = 總參謀 [총참모], 泰川出身 [태천출신], 賤孼子 [천얼자], 三十八歲?[38 세?]","定州陷落時 [정주함락시] 에 生擒 [생금]."],["金昌始 [김창시] = 副參謀 [부참모], 郭山 [곽산] 의 金進士 [김진사] 로 士林 [사림] 에 名望 [명망] 이 있었다.","昌城 [창성] 가는 途中 [도중] 에서 횡사 [橫死].","李禧著 [이희저] = 兵站長 [병참장], 嘉山驛屬 [가산역속] 으로, 大富豪, 定州陷落時 [정주함락시] 에 生擒 [생금]."]],[["洪總角 [홍총각] = 先鋒將 [선봉장], 郭山出身 [곽산출신], 定州陷落時 [정주함락시] 에 生擒 [생금]."],["李濟初 [이제초] = 先鋒將 [선봉장], 价川出身 [개천출신], 郭山 四松野 [사송야] 싸홈에서 戰死 [전사]."],["金士用 [김사용] = 副元帥 [부원수], 泰川出身 [태천출신], 北軍 [북군] 의 最高指導者 [최고지도자], 定州籠城時 [정주농성시] 에 第二回 [제이회] 攻擊戰 [공격전] 에 戰死 [전사]"]]],"8":[[["죄(罪)와 벌(罰)"],["1"],["경관이 쏜 피스톨에 범인인 교회지기가 쓰러지자 관중석에서는 벌써 의자젖혀지는 소리가 요란했다.","그러나 화면은 아직도 계속되고 있다.","신부로 분장한 몽고메리 크리프트가 천천히 걸어가서 쓰러진 범인을 받쳐들고 관중의 시야 속으로 부쩍부쩍 다가올 때는 관중석에서는 어시장 그대로의 혼잡이 벌어지고 있다.","아직 이회 관중들이 반도 빠져나가지 못했는데 삼회권가진 사람들이 출입구를 막은 것이다."]],[["빨리 나가라는 듯이 벨이 요란스럽게울어대고 있다.","십분간이라는 휴식시간도 있고 하니 길을 텄으면 순조로우련만 출입구를 막고는 서로 입심만 세우고들 있다."],["“나갈 사람이 다 나가거든 들어오너라!”"],["“길을 틔워라! 바보 같은 자식들아!”"],["“내밀어라, 내밀어!”"]],[["「 나는 고백한다 」 라는 영화가 끝날 무렵의 S 극장 이층의 광경이었다.","특별 요금까지 받는 영화를 감상하러 온 서울의 지성인들이 연출하고 있는 장면이었다.","뚫고 들어온 사람은 제자리를 찾느라고 또 법석이다."],["이 마치 됫박 속의 메뚜기들처럼 쑤알거리는 이층 한복판에 흡사 입상이기나 한 것처럼 움직일 줄 모르는 한 검은 그림자는 먼데서 보아도 분명 신부다.","신부로 분장한 성격배우 몽고메리의 그 처절한 표정에서 아직 완전히해방이 되지 못한 관중의 눈에도 아직도 「 나는 고백한다 」 가 계속되고 있는 것 같은 착각을 일으키게 했다."]],[["사실 화면과 실제의 구별이 안 갔다."],["가까이서만 보았다면 이층 신부 복장의 사나이의 표정도 몽고메리 못지않게 심각한 것이었을지도 모른다."],["이윽고 신부는 움직였다.","이 동작이 또 보는 사람으로 하여금 착각을 일으키게 한다.","정말 영화 속의 신부인지 관객석의 실재한 신부인지 분간키가어렵다.","몽고메리가 무죄 언도를 받고 석방이 되어 재판소 문 밖을 나왔을 때의 군중의 흥분하던 그 장면과도 비슷했던 것이다."]],[["“으으음!” 인지 “으으응” 인지 분간키는 어려웠으나 정녕 이와 비슷한 신음 소리가 몽고메리가 아닌 실재의 신부 복장의 사나이 입에서 흘러나오고 있다.","신부는 늘씬한 키에 나이도 사십 가까이는 되어보인다.","입구가 풀리자 신부 복장의 사나이도 군중 틈에 끼여서 문께로 밀려나가고 있었다.","아직도 화면에 미련이나 있는 듯 두어 번이나 스크린 쪽을 돌아보기도 한다."],["이윽고 신부 복장의 사나이도 밖에까지 나왔다."]],[["밖에 나오면 대개가 옆도안 돌아보고 휭하니 자기 갈 길을 가는 법이건만 신부복의 사나이는 그렇지가 않았다.","선전판에 붙은 사진들을 어린아이들처럼 바라다보기도 하고, 높다랗게 붙은 간판 그림을 올려다보기도 한다.","선전 간판에 그려져 있는 그림은 신부로 분장한 몽고메리 크리프트가 우람스러운 벽과 벽 사이를 처적처적 걸어가고 있는 뒷모습이었다.","범죄자가 교회지기라는 것을 알고 있으면서도 성직에 있는 신부의 몸으로서 ‘살인 강도’ 라는 어마어마한, 아니추잡한 죄명을 써야만 하는 몽고메리였다."]],[["그럴 것이 그는 천주의 대변인인고해신부로서 신도의 고명을 들은 것이었다.","그는 범하지 않은 죄를 스스로져야만 했고 성덕을 닦았다는 몸으로서 교수대에 서야만 했다.","그러나 몽고메리가 자기의 살인죄를 부정 못하는 것은 교회지기가 살인에 사용했던 피 묻은 신부복이 자기 의장 속에서 나왔대서만은 아니다.","오직 그 자신이 고해신부였기 때문이었다.","신도로부터 고해를 받는다는 것은 인간 대 인간의한 접촉이 아니라 천주를 대신하여서였다.","고해성사는 천주의 정하신 바인것이다."]],[["천주의 이름으로써, 천주의 성총으로써 죄를 사해주는 것이다.","천주께서는 한 번 사하신 바 있는 불행한 인간의 죄를 두 번 묻지 않으신다.","고해신부가 고해받은 신도의 죄를 입밖에 낸다는 것은 천주께서 사하신 바 있는 죄를 두 번 벌하게 되는 것이요, 이러한 고해신부의 파계는 곧 천주전능을 범하는 대죄이기 때문이다.","신부 역인 이 몽고메리와 함께 신과 인간의 틈서리에 끼여 몸부림쳐온 신부 복장의 사나이한테는 몽고메리의 뒷모습에서 그의 초인간적인 그 처절한 고뇌의 표정을 샅샅이 읽을 수 있던 것이다."]],[["“으흠!”"],["신음 소리가 신부복의 사나이 입에서 또 한번 흘러나오고 있다.","겨우 그는 간판 앞을 떠나서 큰 거리로 발을 옮기는 것이었다.","거리는 이미 어둡기 시작하고 있었다.","덜 익은 밀감 빛깔의 가로등이 어둠 속에 풍선처럼 떠 있다.","늦가을을 지나 초겨울에 접어든 날씨치고는 푹한 편이었지만 앙상해진가로수에서 오는 시각은 역시 찼다.","이따금 제법 찬 바람이 한 차례씩 분수를 떨고 지나간다.","그럴 때마다 신부복의 사나이는 그 껑충한 목을 움츠리고 양쪽 어깨를 추썩인다."]],[["흡사 오한이 오는 사람 같아 보인다.","혹 한기가드는지도 몰랐다."],["사나이는 네거리를 바른쪽으로 꺾어 퇴계로 침침한 거리로 접어든다.","서울의 심장부라면서 숫제 어둡다.","거기에 검정 복색이라 하지만 칼라만 아니면존재조차도 선명치 않을 그런 어둠의 거리였다.","거기에 걸음새가 또한 어두운 거리에는 제격이었다.","고개를 비어꽂은 기다란 몸체가 뒤에서 보면 사뭇능청댄다.","거기에 또 긴 옷자락이 너펄대어 히질대는 인상까지 준다."]],[["가끔 자동차의 불빛이 그의 전신을 어둠 위에 부각시켜준다.","영화 「 나는 고백한다 」 를 본 사람이면 누구나 이때의 장면을 스크린의 화면과 착각을 했을 것이다."],["“으으응!”"],["또 한번 검은 그림자 상부에서 이런 신음 소리가 들린다.","그리고 잇대어이런 기구 소리가 들렸었다."]],[["“주여! 이 몸을 구하소서!”"],["2"],["그렇다.","이 검은 옷의 사나이는 역시 신부였다.","뒤늦게 교문을 두드린 수도자도 아니다.","어엿한 태중교우로 신학교를 거친 신부였다.","원명은 박진태였지만 진태란 이름은 어려서 불러보았을 뿐 사십을 바라보는 오늘까지"],["‘요셉’ 으로 통해 오고 있다."]],[["지금은 본당을 떠나서 변두리의 자그마한 성당의 주임신부였지만 강론은 말할 것도 없거니와 교리에도 밝았고, 자기의소신을 문자로 표현하는 특재가 있어 교우들의 신망도 컸다.","주교님까지가특히 한 점을 더 놓고 있는 터다.","박 신부의 손에 세례를 받은 사람만 해도수천으로 헤아릴 수 있고, 그 앞에서 혼배를 한 사람들은 거짓말처럼 모두가 행복하다 하여 교우들간에는 우상처럼 받들어지는 존재였다.","어려서 한학을 많이 닦기도 했으려니와 특히 역사에 밝았다.","노인 교우들 틈에 가면노인들과 이야기가 어울렸고, 철학은 신학 수업에서 필수과목처럼 되어 있다지만 문학에도 조예가 깊었고, 그 자신 시작도 취미삼아 하는 터라 젊은 사람들 앞에 나가서는 또 젊은 사람들과도 호흡이 맞던 것이다."]],[["평생을 불교도로서 자처한 저 유명한 한학자인 구봉 선생을 천주교로 개종시킨 공로자도 이 박 신부였던 것이다."],["“박 신부님은 정통하신 어른이셔. 한번 척 보시기만 해두 성찰을 잘했는지 통회를 했는지, 통회까지만 하구 정개를 않았는지 그냥 꿰뚫으시거든!” 이것이 교우들간의 박 신부 평이었다."],["사실 박 신부는 고명을 받기 전 고해자의 얼굴만 보아도 이 세 절차를 밟은 고해자인지 아닌지를 정확하게 판단을 했던 것이다."]],[["연평도에 가서였다.","고해소가 마련되어 있지 않은 자그마한 성당이었던지라 어린 교우들의 고명을 성당 앞 커다란 느티나무 밑에서 받은 적이 있다.","그때 한 소년이 고명을 하러 왔었다.","소년의 고해 사실은 대수롭지는 않은 것이었다.","제 동무인 어떤 소년과 싸우다가 매를 맞은 감정으로 그 아이의 집 그물을 밤에 몰래 가서 한 뼘은 찢었다는 것이었다.","이 고명을 듣고 박 신부는 머리에 손을 얹어 죄를 사하기 전에,"]],[["“너는 신부님이 보기엔 통회를 않았다. 통횔 하지 않은 사람한테 정개가 섰을 리 없고 정개 않은 사람이 어떻게 고해를 하러 나왔는가?”"],["이렇게 꾸짖자 소년은 그 자리에 엎드려 흑흑 느끼어 울었다는 것이다."],["이 소문이 교우들간에 쫙 퍼지고 말았다."],["“박 신부님은 고해자의 음성만 들으시고도 그것이 참된 고핸지 모고해인지 딱 판단을 하신다!”"]],[["이쯤 되면 섣불리 박 신부한테 고해를 하러 나갔다가는 큰일이다."],["“박 신부님은 관상두 보시나 보죠!”"],["하고 여학생 교우들이 한번 놀린 일이 있었다."],["“저런 잡소리.”"],["“관상은 미신과 달라서 과학이라던데요?”"]],[["“관상으루 판단하는 게 아니라 성덕을 잘 닦고 나면 모든 사리가 판단이되는 법이지. 성덕은 모든 불투명체를 투명케 한다. 그러기에 천주님의 뜻과 가르치심과 판단은 성덕을 닦음으로써만 이루어지는 것이다.","조금도 이상한 일도 아니요 신기한 일도 아니야. 너희들두 믿음이 크면 다 알게 돼요. 이 믿음이란 교리를 잘 이해하는 데 있지. 고해성사 한 가지만 놓고 본대도 고명이 얼마나 필요한 것이고 신앙생활에 있어서 얼마나 소중하다는것을 모르게 되면 자연 큰죄는 숨기고 하잘것없는 과실만 들어서 모고해로모령성체를 영하게 된단 말야."]],[["그렇지만 모고해가 얼마나 무서운 대죄라는걸 깊이깊이 깨닫게 되면 하라고 해도 모고해를 못하게 되는 거야. 모고해를 했어도 깊이 뉘우치고 총고해를 하기만 하면 천주께서는 또 웃으시면서아무리 대죄라도 사하신다는 거룩한 뜻을 가지셨느니라.”"],["하나하나, 그것도 지극히 알기 쉬운 말로 교리를 풀어주는 박 신부 주변에는 남녀노소의 구별이 없이 언제나 교우들이 둘레를 싸고 있었다."]],[["이렇듯 경앙의 적이 되어 있기도 하려니와 그 자신도 이만하면 천주의 뜻에 거슬리는 일은 없으리라고 어느 정도 자부하기도 하였던 박 신부한테 무서운 고뇌가 찾아온 것이었다."],["어제까지도 교우들의 고명을 받던 박 신부였다.","그리고 천주의 이름을 대신하여 그들의 죄를 사해주는 위치에 있던 사람이었다.","신부가 고해소에 선다는 자체가 벌써 천주의 이름과 몸을 대신한다는 뜻인 것이다.","신부는 천주의 대변인이요, 대리 행사자이기 때문에 사람들은 신부의 발 앞에 꿇어앉아서 부부간, 형제간, 친부모한테도 토설하지 못한 모든 죄를 고백하는 것이다."]],[["이 고해신부에 대한 믿음은 곧 천주께 대한 믿음이요, 천주의 성소를받음으로써만 신부가 될 수 있고 또 고명도 받을 수 있다는 것을 믿는 데서였다."],["이 믿음을, 아니 천주께서 마련하시고 예수께서 교시하신 이 거룩한 성사를 저버리는 것보다도 대죄는 없던 것이다.","이 교리를 알기 때문에만, 믿기때문에만 그들은 신부 앞에 모든 죄를 고명하는 것이었다.","이것을 그 누구보다도 잘 아는 사람이 신부였고 고명을 받은 박 신부 자신이던 것이다."]],[["이 고해신부인 박 신부가 교우로부터 고명받은 사실을 누설하지 않으면 안될 함정에 빠지고 만 것이다.","그럴 수는 없었다.","그러면서도 그러지 않을 수도 없는 처지였다."],["3"],["사건이 벌어진 것은 아직 늦더위가 채 걷히기 전인 어느 날 아침이었다.","새벽 미사를 올리고 돌아와서 그날 할일을 메모하고 있는데 문을 두드리는사람이 있었다.","박 신부는 노크 소리만으로 외래 손님이라는 것을 알았기때문에,"]],[["“들어오십시오.”"],["대답을 하면서 손이 들어오기를 기다리지 않고 방문을 열어주었던 것이다.","“박 신부님이십니까?”"],["“네, 그렇습니다만, 누구시던가?”"],["아는 교우가 아니다.","낯은 선 사람이었지만 교우라고 다 아는 도리도 없는지라 우선 이렇게 교우 대접을 하려니까,"]],[["“신부님께 좀 여쭈어 볼 것이 있어서요. 여기 좀 앉으시지요.”"],["하고 도리어 의자를 권한다.","그때까지도 박 신부는 어느 구의 교우겠거니만싶어 원탁자 위에 어수선히 흩어져 있는 신문 잡지 등속을 큰 테이블로 옮기고 자리를 잡으며,"],["“아침 소제도 채 못했습니다. 과히 흉보지 마십시오.”"]],[["이렇게 웃으며 하는 말에도 찾아온 청년 신사는 굳어진 얼굴로,"],["“박찬재 씨와 신부님관 어떻게 되시던가요?”"],["“박찬재?”"],["박찬재라는 소리에 신부는 벌써 가슴이 철렁해졌다.","웬일인지 찬재라는 소리를 듣는 순간 이 청년이 경찰관계 사람이니라 하는 것이 동시에 깨달아진것이다."]],[["“박찬재, 내 동생인데요? 누구신데, 왜 그러시나요?”"],["“아, 그러십니까. 역시 그렇군.”"],["하고 혼잣말처럼 하더니만,"],["“나 이런 사람요. 서에서 잠깐 박찬재 씨에 대해서 여쭈어볼 것이 있어서요. 너무 일찍 이렇게 찾아와 뵈어 죄송합니다.”"]],[["“원 천만에.”"],["말은 이렇게 했지만 유쾌한 기분은 절대로 아니었다.","시간이 이르대서는아니다.","이 불의의 방문객이 가진 임무에 대해서였다."],["그대로 자기를 찾아왔단대도 유쾌한 일은 아닐지 모르는데 동생인 찬재와의 관련이 된다면 결코 유쾌한 일은 아니니라 싶었기 때문이다."]],[["찬재와 경찰과는 그런 인연도 있을 수 있느니라 싶었다.","그렇지 않아도 늘불안한 중에 있던 터라 박 신부는 즉각적으로 찬재의 그 무슨 범죄에 대한것이니라 깨달아졌다."],["“무슨 말씀인지? 뭐 걔한테 무슨 잘못이라두 있었던가요!”"],["“뭘요! 대단친 않은 일이니까 안심하십시오. 뭐 좀 누구하고 박치길 해서요.”"]],[["“아, 그렇습니까.”"],["우선 죄명이 박치기 정도라는 데서 마음이 후련해진다.","박 신부는 찬재와경찰과라면 좀더 큰 죄명이 아닌가 했던 것이다.","찬재는 그럴 만한 소질을다분히 가진 청년이었던 것이다."],["주소, 이름, 나이, 학력 — 이렇게 평범한 것을 묻고 난 형사가,"],["“평소의 언행은?”"]],[["하는 데서는 박 신부로서도 난처했다.","좌익도 아니요 그렇다고 우익도 아닌 어떤 회색 정치단체에 가담하고 있다는 것도 알고 있었고, 여 ․ 야 할 것 없이지도자들에게 대한 불만으로 ‘죽일 놈, 살릴 놈’ 하는 것도 알고 있었지만 그런 말을 할 수도 없거니와 신부의 몸으로서 거짓말을 할 수도 없는 난처한 처지다.","그래서,"],["“평소라야 집안 일로밖에는 별로 이야기하는 일이 없습니다만, 무엇을 물으시는지 요점을 말씀하시면…”"]],[["“평소에 정치라든가 정부라든가, 기타 사상적인 언행은 어땠는지요?”"],["“그런 얘긴 통 못 들었습니다. 내가 만나기만 하면 성당에 나오라고 야단을 치니까 잘 오지도 않지만.”"],["이것은 사실이기도 했다."],["“그럼 뭐 어디 정치라든가 무슨 단체 같은 덴?”"]],[["“그런 것도 없을 겝니다. 그저 아이가 좀 성격이 괄해서 웬만 일엔 참질못하는 단점이 어려서부터 있긴 해요. 그래서 나하고도 많이 싸웠습니다.” 이밖에도 최근 만난 시일과 장소, 그때의 대화, 교우 관계 — 이런 것을 꼬치꼬치 캐어물었지만 실상 박 신부도 동생을 만난 지 십여 일이나 되었었고, 그때도 병중에 계신 아버지,","역시 몸이 가볍지 못하신 어머니에 출가전인 누이 찬숙이, 저희 내외에 어린것 해서 여섯 식구나 되는 집살림 이야기밖에는 다른 얘기란 야당 지도자와 여당의 지도자 몇 사람의 이름을 들어때려죽이느니 어쩌느니 했지만 그까짓 소리는 늘 하던 소리였고 보니 들추어 말할 이야깃거리도 못 된다."]],[["“그렇습니까. 아침부터 실례했습니다.”"],["형사는 이렇게 작별 인사를 하고는 구체적인 사건의 내용도, 어느 서라는것도 밝히지 않고는 ‘다시 알려주마’ 하고 돌아가버렸다.","없었더니보다야못하다 해도 그만 정도의 사건인 데 오히려 다행하다 싶다."],["‘정신 좀 차려야지, 저도…’ 이렇게 마음을 늦추고 방안 정돈을 하는데찬숙이가 달려왔다.","간밤 오빠는 들어오지도 않고 새벽처럼 형사 셋이 달려들어서 온 집안을 발칵 뒤집고 수색을 했다는 것이다."]],[["책상은 물론 백여 권이나 되는 책갈피며, 천장, 다락, 심지어 마루청까지 뜯어젖혔고 웬만한 데는 파보기까지 했다는 것이다."],["“아니, 내겐 와서 누구하구 박치길 했다구 그러던데?”"],["“박치기가 뭐야요?”"],["“들이받았다는 말이지 뭐냐? 쌈을 한 말투던데? 그래, 뭐라고들 그러던?”"]],[["“사람을 죽였단 말만 불쑥 하곤 물어야 대답두 않아요. 집에 드나든 사람의 이름두 싹 적어가구 철 씨 이름은 안 대두 좋은데 어머니가 불쑥 대지 않아요!”"],["철이란 찬숙과 상애 관계에 있는 젊은 의사였다.","박 신부도 한두 번 만난 적이 있어 성당에도 나오겠다 했고, 착실해 보이기도 하여 저희들만 좋다면쯤 생각하고 있던 터지만 이런 판에도,"]],[["“철 씨가 뭐 오빠 친군가, 날 찾아온 사람이지.”"],["하고 되뇌는 것을 듣고 있으려니 인간이란 이렇게도 모든 사고가 자기 본위인가 싶어진다."],["“그래, 뭐 가져간 건 없구?”"],["“서랍 속을 그대로 폭삭 쏟아 갔으니 그 안에 뭐가 들었는지 알 수 있어요. 책두 대여섯 권 갖구 갔구, 자꾸만 무기를 어디다 감추었는지 대라잖아요? 하두 으르딱딱대기에 우리 집안엔 무기가 이것밖에 없다구 방바닥에 굴러 있는 송곳을 집어주었죠."]],[["그랬더니 냉큼 받았다가 홱 팽갤 치겠지.”"],["누이의 이런 이야기를 듣고서야 박 신부도 단순한 박치기가 아니니라 싶어졌다.","박치기로 살인이 될 수도 있겠지만 단순한 박치기였다면 가택수색까지는 않았을 것이요, 더욱이 무기 운운할 리가 만무다 싶다."],["그제서야 사건의 중대성을 깨닫고 박 신부는 분관으로 뛰어가서 신문사에전화를 걸어보았다."]],[["아는 사람 이름을 대니 없다는 것이다.","그래서 여기는한 독자인데 새벽에 어디 살인사건이 발생했느냐 물었더니,"],["“지금 호외가 나갔습니다.”"],["하고 탁 끊어버린다."],["딴 신문사에다 또 걸었더니 그 사에서는 아직 호외를 내는 중인지 두 군데서 전화 받는 소리가 다 들려오고 있다."]],[["“여보시오, 여기는 독잔데요”"],["하기가 무섭게,"],["“지금 바쁘니 좀 이따가 걸어주시오.”"],["하고 탁 끊어버린다."],["중대한 사건임에 틀림이 없다.","이 중대한 사건의 주인공이 아우 찬재라고단정하고 나니 오금이 착 접쳐진다."]],[["자세한 내용은 알 수 없었지만 이 사건은 다분히 정치적이란 것, 찬재가 직접 관계자라는 것이며 상대방은 절명이되었는지도 모른다는 데 귀결이 되자 더 알아볼 용기도 나지 않는다.","수화기를 든 채 그는 그저 우두커니 서서 있기만 했었다."],["이 박 신부의 추측은 불행하게도 사실에 접근한 것이었다.","전날 밤 통금직전인 열시 사십분경, 여당의 중요 간부일 뿐만 아니라 재정 운영에 큰 뒷받침을 해주고 있던 삼일제당, 삼일방직, 삼일상사 등 삼일재벌의 주인공인한규덕 씨의 침실에 복면을 한 괴한 한 명이 침입, 문소리에 깬 한씨에게불문곡직하고 피스톨 두 방을 쏘았다."]],[["한씨가 비명과 함께 쓰러지는 것을 보고는 행방을 감추었다는 것이다.","마침 그날은 한씨의 생일날로 열시 지나기까지 댄스파티가 있었다 하며, 한씨가 침실에 들어간 지 불과 십분도 못되어 이런 변괴가 생겼다고도 한다.","문 여닫는 소리를 식모도 들었지만 주인이 변소에 가는 줄로만 알았다는 것이다.","한씨는 생명이 위독하다."],["물품에 일체 손을 대지 않은 것으로 보아 순전한 강도 행위가 아니라는 것이 유력시 되고, 여당의 간부인만큼 정치적인 배후가 있으리라는 것도 단정할 수 있다고도 했다."]],[["범인은 범행 전 내객을 가장하고 미리 어디에 잠복했다가 기회를 본 것이 분명했다."],["사건 발생의 급보를 받고 달려간 경찰대는 유력한 용의자 한 명을 체포하였으나 수사상 기밀을 보유하기 위하여 성명, 나이, 직업 일체의 발표를 보류하고 있다."],["─ 이런 내용이었다."],["용의자의 이름이 밝혀진 것은 그날 오후였다."]],[["용의자가 박찬재로 박모 신부의 실제라는 것도 발표되었으나 범인은 일체 사실을 부인하고 있어 준엄한 문초를 계속하는 한편 방증을 얻기에 수사진은 혈안이 되어 있다는 것이다."],["그리고 박이 유력한 용의자로서 등장하게 된 중요한 이유는 동 용의자가 한씨 집에서 약 천오백 미터 지점인 덕성여중 정문 앞에서 골목으로 숨다가체포된 것이었다."]],[["거기에다 가택을 수색한 결과 불온 문구가 수없이 나열된 일기장이 나타났고 불온 서적도 발견이 되었다는 것이다.","구체적인 것은 하나도 발표를 보지 못한 채 사건은 다시 오리무중으로 들어갔다.","본인의 극력 부인은 있을 수 있는 일이라 해도 방증이 될 만한 무엇 하나 발견된 것이 없던 것이다.","상당한 지능 범행으로 피스톨을 방안에 버리고 갔으나 문에도 피스톨에도지문 하나 자국이 없을뿐더러 구두에도 헝겊 커버를 신었던지 신발 자국 하나를 발견할 수 없다.","이 범행 동기나 방법으로 보아 확실히 배후에 그 무슨 커다란 움직임이 있다는 단정이 내려졌다."]],[["그러니만큼 수사진은 더 초조해졌다."],["오직 하나 다행한 것은 한씨는 생명을 건질 수 있다는 것이 확인되었을 뿐 한씨가 의식 회복이 되면 범인의 인상 윤곽이 나타나리라 했던 것이나 막 잠이 들다가 문 여는 소리에 놀라 눈뜬 순간에 총탄을 맞은 터라 전혀 기억에도 없다는 것이다."],["이러고 보면 용의자를 달구치는 도리밖에 없다."]],[["용의자한테 또 한 가지 불리한 것은 용의자는 군대 복무시에 사격대회에서항상 등내에 들었다는 것, 거기에 또 체포된 지점에서 피신한 이유로서 갑자기 경관 사이드카가 달려오고 경찰 지프차가 내닫고 하니까 필시 사건이생겼을 게고 이런 때 붙들리면 죄는 없지만 도시 성이 가시니까 어두운 골목으로 잠시 피하자던 것이라 한다.","있을 수 있는 심경이었지만 그것으로 죄가 벗어지는 것은 아니었다.","거기에 직업도 없었다.","이름도 없는 출판사에 다니다 말다 한다는 것이다."]],[["용의자에게 한 가지 유력한 것이란 오직 그의 집이 삼청동 막바지라는 것뿐이다.","체포된 지점에서라면 용의자의 집까지 통금 시간에도 충분히 갈 수 있는 상거였던 것이다."],["사건 발생 전 약 두어 시간의 알리바이를 증명할 만한 재료도 용의자는 갖고 있지 못한 것이 또한 혐의를 농후케 하고 있다.","여덟시나 되어 집을 나 와서는 다방에 한 번 들렀을 뿐 줄곧 거리를 헤맸다는 것이다.","불행히 다방도 늘 가는 다방이 아니었던지 레지도 마담도 전혀 본 기억이 없다는 증언을 했다."]],[["사건은 날로 오리무중에 들어갈 뿐이었다.","이제 기다릴 것은 용의자의 자백뿐이던 것이다."],["4"],["용의자가 드디어 자백을 했다.","사건 발생 후 만 삼 주일 만이었다.","그러나 박 신부는 조금도 놀라지 않았었다.","그는 이 사건의 진범이 자기 동생임을벌써 단정하고 있었던 것이다."],["평시의 언행으로 보아서도 그러했다."]],[["성격도 그럴 수 있는 소질이 많았었다.","고향인 안악에서였다.","찬재가 여덟인가 아홉 살인가다.","찬재는 열두 살이나 먹은 아이와 싸우다가 넉장이 되게 맞고는 그날 밤 그 아이의 집에 불을 퍼질렀었다.","가난한 집이었고 다행히 지붕만 반 가량 타서 변상만 하고무사했지만 형과도 싸울 때는 돌이고 칼이고 마구 던지던 아이다.","군대에서도 그랬다.","중위로서 중령을 넉장이 되게 패주고 영창생활도 했었다.","어려서부터 제분에 못이기면 제 손가락을 아지끈아지끈 깨물던 아이다."]],[["박 신부는 어느 날 하루 동생한테 성총이 내리기를 기구하지 않은 날이 없었다.","그러나 찬재는 더 엇나가기만 하던 것이다.","그대로 잠자코 있기나 했으면 오히려 좋았다.","그는 성직자인 형 앞에서,"],["“종교는 아편이어요!”"],["했었고,"],["“형은 가장 신성한 직책이나 다하고 있는 성싶을지도 모르지만 신부가 마술사와 뭣이 다르지요? 사기꾼과? 사기꾼은 한 사람만 속이지. 형은 천주의 이름을 팔아서 만인을 사기하고 있는 거야.”"]],[["이런 찬재였다.","이런 아우였었다.","형은 아우를 버린 지 오랬었다.","아우는마귀 이외의 아무것도 아니었었다.","그러나 그러면서도 형은 아우를 못잊어해 왔다.","신부였지만 그는 역시 형일 수밖에 없는 인간이었던 것이다.","형은 슬펐다.","슬프면서도 동생의 살인을 인정치 않을 수 없었던 것이다."],["아우가 자백을 했다는 신문 보도를 본 순간 형은 슬프기는커녕 기뻤다.","당국의 알선으로 형은 두 번이나 아우한테 자백하기를 권했던 것이다."]],[["두 번 다 아우는 완강히 부인하고 있었다."],["“형은 놈들과 부동이 돼서 단지 하나밖에 없는 동생을 살인범으로 몰고 마음이 편하리다. 편할 게요. 내가 이만큼 사실이 아니란다면 형만은 믿어주어야 하지 않겠소. 형만은! 형은 천주의 대변자라니까.","난 교우는 아니지만 형이 믿는 천주 앞에 맹세를 합니다. 절대로 난 범인이 아니예요. 여덟시에 집을 나왔어요. 울적해서, 울분에 가슴이 터지는 것 같아서… 돈도 없었소. 형이 언제 한번 집안에 보태 쓰라고 목돈 집어준 일이 있던가요?"]],[["신부는 제 부모 형제를 돌보아선 안 되오? 굉장한 법규로군. 성스런 규율이라구요? 오 년간이나 전쟁을 하구 왔으니 직업을 주오? 집엔 돈 한푼 없었소. 내가 어째서 울적지 않겠어요?","그날도 실은 형이라도 찾아가리라 나섰다가형을 보면 골통을 깨고 싶어질까봐 참고 돌아오던 길이었어요. 그런 날 죄인을 만들어?”"],["두번째 갔을 때는 만나주지조차 않으려 들었었다.","겨우 만나더니 그대로감정을 폭발시키어 물어뜯으려 들던 것이다."]],[["몸이 몹시 약해져 있었다.","그때문이니라 싶어 그날은 단념을 하고 돌아왔던 것이다."],["그렇게 완강히 자백을 거부하던 아우가 드디어 자백을 한 것이다."],["이로써 아우는 천주님의 사하심을 받았느니라 했다.","성덕을 입고 성총이베풀어지느니라 했다.","형은 성당으로 달려갔다.","무릎을 꿇었다.","오늘처럼천주와 감정이 통한 기구는 일찍이 없던 것 같다."]],[["“지극히 자애로우신 천주시여. 주님의 거룩하오신 계시로 악마의 자식이던 아우 깨친 바 있사와 주의 품에 돌아오게 해주시오니 그 은총 무한 감사하오이다. 제 아우 비록 아직 주의 품에 들지는 못했사오나 성총을 입사와통회할 날이 있을 것이옵고 임종할 그 순간까지에는 반드시 천주님을 받들때 있으리라 믿사옵니다.","아우 찬재 비록 마귀에 사로잡혔사와 대죄를 범하였사오나 이제 천주께서 계시하오신 십계 중 일계만이라도 깨우치고 성총의 도움을 받아지자 몸부림치고 있사옵니다. 저의 아우 사심판정에 서옵거든성총으로 어루만지시고 강복해주시와 성 분도 기록에 있는 성 요안 네뽈지에노도 되게 하옵소서.”"]],[["형의 기구에는 눈물이 섞여 있었다.","외어도 외어도 미진했다.","미운 아우였었다.","죽이고 싶은 아우이기도 했었다.","차라리 죽기나 했으면 영혼의 구원을 받느니라 한 아우였었다.","사교 사상에 물든 아우, 무신자보다도 더 밉던이단자인 아우!","그러나 그는 신부였지만 역시 아우의 형이었었다.","이단자요, 사교자요, 마귀의 아들이었지만 역시 사랑하는 아우였다.","형은 오늘 지금서야 자기가 얼마나 아우를 미워했던가도 알겠지만 또 얼마나 사랑했었는가도 깨달아지는 것이었다.","그는 자기가 신부일 뿐만 아니라 인간이었다는것도 깨달았고, 신부이지만 역시 인간인 아우의 형이라는 것도 뼈저리게 깨우쳤었다."]],[["“아우여! 동생아, 형을 용서해다오! 나는 천주의 아들인 동시에 너의 형이었어야 했다. 그러나 형은 오직 천주님의 아들이었을 따름이었다.”"],["자기 방에 돌아온 형은 문을 잠그고 목을 놓아 울었다.","울어도 울어도 시원치 않았다.","아우에 관한 속보는 거의 매일처럼 신문에 나고 있었다.","이제는 배후 관계의 추궁만이 남았었다.","배후 관계가 밝혀진다면 불똥이 어디로튈는지 모른다는 것이다.","어떤 신문은 배후 관계 여하로는 정부 고위층에바람이 불지도 모른다 했고, 여당계 신문은 또 야당계 거물급의 선이 닿지 않았나 하는 무시무시한 추측 기사를 내기도 했었다."]],[["“— 한씨 저격 사건, 정계 거물급에 비화? —”"],["가로 일단 반의 어마어마한 타이틀은 국민들을 불안에 사로잡히게 했다.","그러나 다 읽고 나면 아무런 근거도 없었다.","그저 그럴지도 모른다고 추측 일 뿐이었다.","근거있는 소스의 기사는 못 되었었다."],["“장난들 몹시는 한다. 아니, 신문이란 이런 수단으로밖에 팔아먹을 길이없더람!”"]],[["이렇게 분개하는 축들도 있었다."],["누구보다도 형이 그랬다.","신문에 대한 증오감까지도 드는 것이다."],["그러나 형 신부는 체념을 했다.","배후 관계가 없기를 바라는 마음에는 틀림이 없지만 그것도 아우의 죄를 덜어주기 위해서이지 형벌을 덜어주자는 데서는 아니었다.","배후 관계가 있든 단독 범행이든, 살인 기수가 아니고 미수이든 아우의 생명은 이미 없는 거나 진배없는 일이었다."]],[["아니, 생명이 없어져야만 아우는 영혼의 구원을 받느니라 한 형이었었다.","이 기구 또한 아우에 대한 형의 극진한 애정의 표현이었다.","죄로 더럽혀진 아우의 생명이 이 세상에 남아서 더 욕되게 하고 싶지 않은 심정이기도 했던 것이었다.","형의혼란된 머리에는 형에 대한 판단도 서지 않았고, 아니 그런 것은 생각하고싶지도 않았다.","지금 형이 알고 싶은 것은 아우가 언제 천주께로 돌아와주겠느냐 하는 것이었다.","언제 고요한 마음으로 교리를 배워 영세를 하고 총고해를 하게 되느냐는 것만이 지금 형의 머릿속을 채우고 있는 생각이었다."]],[["희망이었었다.","외인이 볼 때는 한낱 잠꼬대 같은 이야기일지도 모르지만 천주의 아들이요 성직자인 형으로서는 이것이 아우에 대한 최대의 애정이었고사랑이었었다.","지금의 형은 이밖에는 애정을 표현할 줄 모르는 사람이기도했다.","그 이외의 어떤 사랑의 방법도 형을 만족 시켜주지는 못했던 것이다.","“아우여! 하루바삐, 아니 한시라도 빨리 주의 품으로 돌아오라…”"],["5"]],[["다시 열흘이 지났다.","또 열흘이 헛되이 갔다."],["그러나 배후 관계는 실마리도 집어낼 수가 없었다.","범인이 일체 부인했던것이다."],["다시 며칠이 지나서다.","비로소 단서를 얻었다는 신문 보도가 났다.","모 무소속의 거물급인 정치인이라는 것이었다.","정계는 물론 전국민의 신경은 다시 날카로워졌다.","그렇다면 이북 괴뢰 간첩과도 접선이 되지 않았을까 하는공포에서였다."]],[["그렇지 않아도 거의 매일처럼 간첩이 잡히고 있었다.","상당한 거물급의 간첩도 벌써 이 달 들어서 두 명이나 체포가 되었던 것이다.","월북하려던 집단 간첩 일곱 명 일당이 서해안에서 체포가 되자 간첩단의 세포가속속 드러나고 있었다."],["그러나 조사 결과 그것은 범인의 전혀 허위 진술이었음이 판명되었다.","몇몇 거물급 인물한테서는 범인의 진술을 인정할 만한 아무런 방증도 찾아내지 못했던 것이다.","며칟날 어디서 만나서 피스톨을 받았다는 진술을 기초로조사를 진행하다 보면 당자는 그 당시 고향에 가 있었다는 알리바이가 명백하게 성립이 되던 것이다."]],[["이렇게 질질 끌던 어느 날 밤이었다.","범인의 형 박 신부는 피이넛을 사다 놓고 진을 마시고 있었다.","책상 위에는 현금 백만환 뭉치가 놓여 있다.","부실한 취직이나마 아우를 잃은 집안 살림이 말이 아니었던 것이다.","아버지는아들의 그꼴을 본 후로 병이 부쩍 더해져서 가래가 식도를 막는 형편이었다.","며칠 전 찾아간 큰아들을 붙들고 병든 아버지는 약을 좀 사다 달라고애걸을 하던 것이었다.","그 약이 수면제였다."]],[["“넌 너의 교리로써 그런 것을 죄루 알지 모르겠다만 아픈 사람을 더 아프게 하는 것도 죄니라. 아비두 더 살구 싶구 교리두 안다. 하지만 그건 아파 보지 못한 사람의 일이다. 날 고이 잠재워다우.","빨리 천주께 보내다우. 첫째 저것들 굶는 꼴 볼 수 없어 더 견딜 수가 없다.”"],["굵은 주름살 골을 타고 눈물이 천천히 흐르고 있었다.","어머니도 울고 누이도 울었었다.","신부도 울었다.","신앙도 신앙이지만 우선 가족을 살려놓고 보아야 했다."]],[["신부가 된 순간부터 그는 가정을 떠났고 혈족과 절연을 했다.","신부는 천주의 아들일 뿐 한 아들에 두 아버지가 있을 수는 없었다.","신부는 일체의 수입을 자기 일신의 필수품 외에 쓰지 않기로 했었다.","수녀는 더 말할 것도 없었지만 신부 또한 원칙적으로는 자기의 수입을 자기 가족 생활비에 쓴다는 것은 금지되어 있던 것이다.","오직 성당의 유지와 확장을 위해서만 쓸 수 있는 돈이었었다."],["그러나 신부도 인간이었다."]],[["오늘 백만환을 월부로 갚기로 하고 빌린 것이다.","마침 집에 붙은 판잣집 구멍가게를 집째 팔겠다던 것이다.","이것만 마련해주면 그냥저냥 찬재 댁이 꾸려가겠다는 것이다.","하느님의 아들은 또 한 아버지를 모시기로 결심했던 것이다."],["형 신부는 동료 신부와도 만나는 기회를 되도록이면 피했다.","윤 신부가 고해를 하러 와서 부득이 한 번 만났을 뿐 이 사날째 성당에도 되도록 혼자 나갔다.","교우들한테도 실로 면목이 없다."]],[["“살인범의 아우를 가진 신부.”"],["자기 자신이 범한 죄나 진배없었다.","제 아우 하나 교도 못하는 형이 어떻게 많은 교우의 시범이 될 수 있느냐 하는 가책이 무서운 고통을 가져다주는 것이다."],["박 신부는 또 술을 따랐다.","오십도가 넘는다는 독주 진이었다.","취하고 싶은 심정이었다.","석 잔째 잔을 비우고 넉 잔째를 따라 입으로 가지고 가려는데 누가 노크를 한다."]],[["윤 신부였으면 했다."],["“누구시오?”"],["문을 열자니까 뜻밖에도 교우였다.","시간을 보니 열시다.","이 바오로라는, 깡패 소리는 들으면서도 성실하게 미사에 참여하는 독신자다.","기실 지금 마시고 있는 이 진도 바오로가 십여 일 전에 선사한 것이었다."],["“바오로! 고맙소, 이렇게 찾아와주어서. 자, 앉으시오. 바오로가 준 술, 오늘 처음 마갤 떼구 한 잔 하는 길이오. 바오로 술이지만 자, 한 잔.”"]],[["신부는 차라리 이런 속인과 세상 이야기나 하며 취하고 싶었다.","교리에 관한 이야기를 떠난 명동 이야기나 들으리라 했다."],["“자, 한 잔.”"],["“그만두겠습니다, 신부님.”"],["바오로는 기구할 때처럼 손을 모으는 것이다."]],[["“왜 그래, 바오로? 난 오늘 바오로와 한 잔 하구 싶은데. 한 잔 하면서 이야기도 좀 듣구! 세상 얘기가 좀 듣구 싶어졌어.”"],["“아닙니다, 신부님. 오늘은 조용한 시간을 타서 신부님께 고해성살 받으러 왔습니다.”"],["앉지도 않고 나무처럼 꼿꼿한 채 손을 모은다."],["신부도 얼른 잔을 놓고 성직자의 자기 자세로 돌아갔다."]],[["“신부님, 방에서 받아주실 수 없을까요?”"],["“성찰, 통회, 정개에 조금도 유감됨이 없으시오?”"],["“네.”"],["“그럼 고명하시오. 천주님의 정하신 바요, 예수님의 가르치심을 받아 바오로의 고해를…”"],["하는데 바오로가 말을 탁 가로막는다."]],[["“신부님, 시간은 아니지만 성당 역시 고해소에서 받고 싶습니다.”"],["“그래도 좋고.”"],["했다가 신부는 의심이 났다."],["“이유가 따로 있소?”"],["“네.”"]],[["“뭘까.”"],["“여긴 너무 밝습니다.”"],["“성찰은?”"],["“네…”"],["“통회도?”"],["“네.”"],["“그럼 정개가 부족했소. 천주께 고해성사를 올리는데 밝고 어두움이 어디있겠소. 그럴 리 없지 않소?”"]],[["“그러면 여기서 받겠습니다, 신부님!”"],["신부는 속으로는 의아스러웠지만 그런 내색은 할 수도 없어 천천히 몸을일으켜 제의장 앞으로 가는 것이었다.","제의장 문 손잡이를 잡고서도 한참 무슨 생각에 잠긴다.","장 문을 열었다.","영대를 꺼내어 몸과 팔에 걸고 고해소에 자리를 잡으며 성호를 긋고 있다."],["이러한 신부의 동작을 지켜보고 있던 바오로는 신부가 성호를 긋고도 한참이나 되어서야 신부 앞에 무릎을 세우고 십자를 그으며 고죄경을 외기 시작한다."]],[["“오 주 전능하신 천주와 평생 동정이신 성 마리아와 성 미가엘 대천신과 성 요안 세자와 종도 성 베드루, 성 바오로와 성인 성녀와 신부께 고하오니나 과연 생각과 행함에 죄를 심히 많이 얻었나이다.","나 오늘 신부님께 고해하옴은…”"],["바오로의 고해가 갑자기 뚝 그친다.","신부는 눈을 딱 감은 채 계속을 기다리고 있었다.","그러나 아무리 기다려도 바오로는 입을 딱 봉한 채 열지를 않는다.","신부는 눈을 떴다."]],[["바오로는 처음 고해를 시작할 때의 그 자세였다.","“바오로! 계속하오.”"],["신부의 재촉을 받자 바오로는 벌떡 일어나며,"],["“신부님, 저 다음 기회로 미루겠습니다 신부님 말씀대루 정개가 미진한것 같습니다. 죄송합니다.”"],["“바오로! 그게 무슨 소리야! 죄를 지었으면 빨리 고해를 해야지. 죄란 병균과 같은 거야, 죌 짓구!”"]],[["“아닙니다, 담에 오겠습니다.”"],["하기가 무섭게 바오로는 인사도 변변히 않고 뛰어나가버린다.","신부는 어이가 없었다.","한참이나 멍하니 섰다가 뛰어나가서,"],["“바오로오, 바오로오!”"],["몇 번이나 불러야 바오로는 대답도 않고 뛰어가버리는 것이다.","발소리까지들리고 보니 신부의 부르는 소리가 안 들렸을 리 만무였다."]],[["‘웬일일까? 무슨 일을 저질렀을까?’"],["신부는 영대를 벗어 의장 안에 넣고도 한동안이나 방 한가운데 멍하니 서 있었다."],["‘바오로가 무슨 잘못을 저지른 것일까?’"],["이상할 만큼 바오로의 행동이 마음에 걸린다."]],[["보통일이 아닌 성싶게만 생각이 든다.","웬만한 일이란다면 이렇게 밤에 찾아오기까지 했다가 달아날 리가 없었던 것이다."],["‘또, 오겠지, 바오로는 진실한 교우니까 이렇게 죄를 짓고 괴로워한다는자체가 그만큼 성실한 때문이다.’"],["신부는 이렇게 생각했다.","그는 다시

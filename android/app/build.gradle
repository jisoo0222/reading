plugins { id 'com.android.application' }

android {
    namespace 'app.dokdok.reader'
    compileSdk 34
    defaultConfig {
        applicationId 'app.dokdok.reader'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }
    buildFeatures { buildConfig true }
    buildTypes {
        // 디버그(Android Studio에서 Run ▶): 컴퓨터의 개발 서버(node dev-server.js)를 먼저 불러와요.
        // 서버가 꺼져 있으면 앱 안에 들어 있는 화면을 대신 띄워요.
        debug { buildConfigField 'String', 'DEV_URL', '"http://10.0.2.2:5173/"' }
        // 배포용: 항상 앱 안에 들어 있는 화면만 써요.
        release {
            minifyEnabled false
            buildConfigField 'String', 'DEV_URL', '""'
        }
    }
    // Pretendard 글꼴(앱 전용). 웹 파일에는 넣지 않고 앱 안에서만 써요.
    sourceSets { main { assets.srcDirs += 'src/main/webfont' } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 저장소 루트의 Reading_app.html 을 빌드할 때마다 앱 안(assets/index.html)으로 복사해요.
// 웹 프로토타입 파일 하나만 고치면 앱에도 그대로 반영돼요.
def copyWebApp = tasks.register('copyWebApp', Copy) {
    from(rootProject.file('../Reading_app.html'))
    into(layout.projectDirectory.dir('src/main/assets'))
    rename { 'index.html' }
}
tasks.named('preBuild') { dependsOn copyWebApp }
